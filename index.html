ehavior clues (items 4-8) and situation clues (items 9-12), the three clue types ACES scores separately, with near-miss choices. The real-life log records the days she names her own feeling, in any language. In the baseline week, run one goal check and the dinner check-in without teaching, and log the days; compare week 4 with it. When the parts point to different rubric levels, record the lower one. The check is criterion-referenced (mastered or not yet on these items), not a comparison with other children and not a diagnosis. Your notes on real moments count most.","rubric":["Beginning: names 3 or fewer of the eight feelings from clues (about 4 or fewer of 10 on the goal check), and names her own feeling on 0-1 days a week, even when asked.","Developing: names 4-6 of the eight feelings (5-7 of 10 on the goal check), and names her own feeling at the check-in on 2-3 days a week, often with choices offered.","Secure: names 7-8 feelings and the clue she used (8 of 10, or 9 of 10 on one day only), and names her own feeling on 4 days a week.","Mastered: at least 9 of 10 on the goal check on two different days, and her own feeling named, in any language, on at least 5 of the 7 days of lesson week 4; confirmed by a keep-it check 2-4 weeks later."],"refs":["aces","emt","casel-sel-assessment-guide","bond-1996-nrt-crt"]},"mastery":{"pct":90,"days":2,"text":"Mastered when she scores at least 9 of 10 on the goal check on two different days and the real-life log shows her naming her own feeling, in any language, on at least 5 of the 7 days of lesson week 4. A keep-it check 2-4 weeks after mastery (one goal check of at least 9 of 10, and the check-in on most days of that week) confirms it."},"evidence":{"episodes":["name-feeling","feelings-choices","calm-tools"]},"checks":[{"q":"Look at Kiko's face. Her mouth turns down and a tear rolls down her cheek. How does she feel?","opts":[["sad","😢"],["angry","😠"],["surprised","😮"]]},{"q":"Look at Juno's face. Her eyebrows pull down, her face is red, and her teeth are tight. How does she feel?","opts":[["angry","😠"],["sad","😢"],["scared","😨"]]},{"q":"Look at Wren's face. A balloon pops out of a box. Her eyes go wide, her mouth makes an O, and then she smiles. How does she feel?","opts":[["surprised","😮"],["scared","😨"],["angry","😠"]]},{"q":"Benny smiles and stands tall as he shows everyone the picture he worked on all week. How does he feel?","opts":[["proud","🏆"],["nervous","😬"],["sad","😢"]]},{"q":"Kiko's body shakes and she hides under a blanket when the thunder booms. How does she feel?","opts":[["scared","😨"],["surprised","😮"],["angry","😠"]]},{"q":"Benny tries and tries, but the puzzle piece will not fit. He says, ugh, it won't work! How does he feel?","opts":[["frustrated","😤"],["nervous","😬"],["proud","🏆"]]},{"q":"Wren's tummy feels fluttery and her hands are shaky just before she sings in the school show. How does she feel?","opts":[["nervous","😬"],["frustrated","😤"],["proud","🏆"]]},{"q":"Juno laughs, claps her hands and jumps up and down at her birthday party. How does she feel?","opts":[["happy","😊"],["nervous","😬"],["frustrated","😤"]]},{"q":"Kiko's best friend moves away to another town. How might Kiko feel?","opts":[["sad","😢"],["proud","🏆"],["surprised","😮"]]},{"q":"A kid knocks down Benny's block tower on purpose and laughs. How might Benny feel?","opts":[["angry","😠"],["surprised","😮"],["nervous","😬"]]},{"q":"Tomorrow is Wren's first day at a new school, and she doesn't know anyone yet. How might she feel?","opts":[["nervous","😬"],["frustrated","😤"],["proud","🏆"]]},{"q":"Juno practiced riding her bike for many days. Today she rides all the way by herself! How might she feel?","opts":[["proud","🏆"],["nervous","😬"],["sad","😢"]]}],"tools":[{"label":"Wisconsin DPI's free 'Assessing Wisconsin SEL Competencies' PDF, which has a Grade 1-3 column of assessment ideas. Skip its Mood Meter, a paid RULER tool.","ref":"wi-sel-competencies"},{"label":"UNESCO MGIEP's free SEL for Schools course: self-paced, about 25 hours, written for teachers, with free certificates; reportedly includes child-friendly classroom resources. Reuse terms are unknown.","ref":"unesco-mgiep-sel-2020"}],"standards":[{"ref":"il-sel-standards","code":"Illinois SEL 1A.1.1 and 1A.1.2 (Early Elementary, K-2)","text":"Identify emotions to support personal well-being, and describe situations that may cause different emotions (revised standards, in force from SY 2026-27)."},{"ref":"oh-sel-standards","code":"Ohio SEL A1.1.a (K-2)","text":"Identify basic personal emotions. The Grades 3-5 indicator (A1.1.b) moves on to a range of emotions."},{"ref":"wi-sel-competencies","code":"Wisconsin SEL Grades 1-3: Emotional Development","text":"Recognize and label a variety of her own basic emotions, use words and gestures for increasingly complex emotions, and, with adult guidance, tell how others feel from verbal and nonverbal cues (wording from DPI-hosted and third-party alignment copies)."},{"ref":"uk-dfe-rshe-guidance","code":"England RSHE statutory guidance, primary Physical health and mental wellbeing: Mental wellbeing","text":"By the end of primary (age 11, so above Year 2): know the normal range of emotions (e.g. happiness, sadness, anger, fear, surprise, nervousness) and use a varied vocabulary for her own and others' feelings. This is the 2019/2021 wording; check it against the July 2025 text now in force."},{"ref":"who-life-skills-1997","code":"WHO core life skills: self-awareness, empathy, coping with emotions","text":"Self-awareness and empathy are core life skills for psychosocial competence and should be adapted to local culture (the skill names come from the researchers' own recall; check them in the PDF)."},{"ref":"matatag-gmrc","code":"MATATAG GMRC Grade 1 (competency code not confirmed)","text":"DepEd's Grade 1 values subject (written in Filipino) is the Philippine anchor to check. No Grade 1 competency on recognizing feelings was seen, so no alignment is claimed yet."}],"log":{"label":"She named her own feeling (any language), at the check-in or in a real moment","kidLabel":"I named my feeling!","per":"day","target":5,"windowDays":7},"adultNotes":[{"title":"Feelings words in any language","text":"Her strongest feelings words may be Filipino or another home language, and they all count, in the check-in and in the rubric: masaya (happy), malungkot (sad), galit (angry), takot (scared), gulat (surprised), kinakabahan (nervous), naiinis (annoyed or frustrated). Use the words your family uses.","ref":""},{"title":"Naming a feeling is not talking back","text":"Some families teach children not to show anger or sadness to elders. Tell her plainly that saying 'Malungkot po ako' or 'I feel mad' in a calm voice is respectful, not disrespectful. Grown-ups, including lola or tita, can name their own feelings first.","ref":""},{"title":"Face, body and situation clues","text":"The check mixes the three clue types that ACES scores separately: faces (items 1-3), behaviors (items 4-8) and situations (items 9-12). Proud is read mostly from the situation and posture. Notice which clue type she misses and practice that one. ACES itself has only modest reliability (alpha .46-.70), so treat the check as one piece of evidence.","ref":"aces"},{"title":"A measuring stick, not a label","text":"The goal check is criterion-referenced: it shows whether she has mastered these items, not how she compares with other 7-year-olds. No measure here is normed for Filipino children, and a score is not a diagnosis.","ref":"bond-1996-nrt-crt"}],"statementRefs":["il-sel-standards","oh-sel-standards","wi-sel-competencies","uk-dfe-rshe-guidance"]},{"id":"F2","domain":"feelings","title":"Calming my body","icon":"🌸","ican":"I can use a calm tool when I have a big feeling.","kidWhy":"Big feelings are OK. Calm tools help your body settle.","weeks":5,"statement":"Within five weeks (one baseline week, then four weeks of lessons), [Name] will use a calm-down tool she has practiced (such as slow breathing, squeeze and let go, counting slowly to ten, a calm spot near a grown-up, or asking for help) when she is upset, after no more than one reminder, in at least three real upsets, measured by a real-life log of each upset with the tool and help level, and at least 90% on the 10-item goal check on two different days.","smart":{"s":"When upset, use a calm-down tool she has practiced (one of the five on the calm-tools card, or another safe tool she practiced, such as hugging a teddy), after no more than one reminder from a grown-up.","m":"Main measure: a real-life log of real upsets, each with the tool used and the help level (did it together, one reminder, on her own). Target: at least 3 upsets at 'one reminder' or 'on her own' in the four lesson weeks, compared with a baseline-week tally of upsets and tool use. Supporting measure: at least 9 of 10 on the goal check, which checks that she knows the tools, on two different days.","a":"Tools are practiced while calm first, and in real upsets a grown-up gives one reminder, which matches the Grade 1-3 benchmark 'with adult guidance' (Wisconsin). Using a tool with no reminder is above that benchmark and is the stretch.","r":"Studies using the Head-Toes-Knees-Shoulders task link young children's self-regulation with early literacy and math; the links are correlational and come mostly from ages 3-7. Calm tools are one way to practice managing strong feelings, which WHO lists as a core life skill (coping with emotions and with stress).","t":"Five weeks: a baseline week (tally upsets and any tool use, with no teaching), then four lesson weeks. A keep-it check 2-4 weeks after mastery.","rRefs":["htks-meta","htks-four-societies","who-life-skills-1997"]},"lesson":{"minutes":10,"materials":["a pillow or soft toy","a calm-tools card with a picture of each tool","a cozy calm spot near where grown-ups are","this app"],"steps":[{"phase":"Warm-up","text":"While everyone is calm, practice flower and candle breathing three times: smell the flower slowly, then blow out the candle slowly (hinga nang malalim).","refs":[]},{"phase":"I do","text":"Model a tool out loud during a small real frustration: I feel frustrated. My shoulders are tight. I'm going to take three slow breaths.","refs":["nsw-grr","rosenshine-2012"]},{"phase":"We do","text":"Make the calm-tools card together: slow breaths, squeeze and let go, count slowly to ten, a calm spot near a grown-up, and ask for help. Try each once; she picks her two favorites.","refs":["nsw-grr"]},{"phase":"You do","text":"In a calm pretend game (the tower fell down), she shows her two favorite tools on her own while you watch. Then she watches My Calm-Down Toolbox and Mad Is OK, Hurting Is Not, and does the goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"When she is upset, give one reminder with two choices: Breathe or squeeze? Afterward, praise the trying (You took three slow breaths) and log the upset with the tool and the help level.","refs":["aap-hc-self-esteem"]}],"support":"Offer one tool and do it with her (help level: together).","stretch":"She notices early body clues, such as a hot face or tight hands, and chooses a tool with no reminder, which is above the Grade 1-3 benchmark."},"assessment":{"method":"Your log of real upsets counts most: note each upset, the tool, and the help level (together, one reminder, on her own). Only 'one reminder' and 'on her own' count toward the target. Start with a one-week baseline tally before teaching. The goal check (10 items from a 12-item bank, with near-miss choices) checks that she knows the tools, not that she uses them. When the parts point to different rubric levels, record the lower one. It is criterion-referenced, not a comparison with other children and not a diagnosis.","rubric":["Beginning: in real upsets, does not yet use a tool, even when a grown-up does it with her; 4 or fewer of 10 on the goal check.","Developing: uses a tool when a grown-up does it with her (help level: together), but not yet after one reminder; 5-7 of 10 on the goal check.","Secure: uses a tool after one reminder in 1-2 logged real upsets, which meets the Grade 1-3 'with adult guidance' benchmark, and scores at least 8 of 10 on the goal check (or 9 of 10 on one day only).","Mastered: at least 3 logged real upsets in the four lesson weeks where she used a tool after one reminder or on her own, and at least 9 of 10 on the goal check on two different days; confirmed by a keep-it check 2-4 weeks later."],"refs":["casel-sel-assessment-guide","cpprg-scs-parent","isela","bond-1996-nrt-crt"]},"mastery":{"pct":90,"days":2,"text":"Mastered when the log shows at least 3 real upsets in the four lesson weeks where she used a calm tool after one reminder or on her own, and she scores at least 9 of 10 on the goal check on two different days. Using a tool with no reminder is a bonus, not a requirement. A keep-it check 2-4 weeks after mastery (one goal check of at least 9 of 10, and at least one more logged upset at the same help level) confirms it."},"evidence":{"episodes":["calm-tools","feelings-choices"]},"checks":[{"q":"Your puzzle piece won't fit, and you feel frustrated. Which calm tool could help first?","opts":[["take three slow breaths","🌸"],["push the piece in harder","🧩"],["try faster and faster","💨"]]},{"q":"What is flower and candle breathing?","opts":[["smell slowly, then blow out slowly","🌸"],["breathe in and out very fast","💨"],["hold my breath","😶"]]},{"q":"What is the squeeze and let go tool?","opts":[["squeeze my fists, then let them go floppy","✊"],["squeeze a friend's arm hard","😣"],["keep my fists squeezed tight","💪"]]},{"q":"You feel very mad at your cousin. Which choice is safe and calming?","opts":[["squeeze a pillow","✊"],["throw the pillow at him","💥"],["squeeze his arm","😣"]]},{"q":"Which way of counting helps you calm down?","opts":[["count slowly to ten","🔢"],["count as fast as I can","⏩"],["shout each number","📢"]]},{"q":"You need a break to calm down. Where is a good calm spot?","opts":[["a cozy spot near a grown-up","🛋️"],["a hiding place where no one can find me","🙈"],["outside the gate by myself","🚪"]]},{"q":"Your homework is too hard, and you feel upset. Which calm tool fits best?","opts":[["ask a grown-up for help","🙋"],["hide the page under my bed","🛏️"],["scribble all over it","🖍️"]]},{"q":"Your face feels hot and your hands feel tight. What could your body be telling you?","opts":[["a big feeling is starting, so I can use a calm tool","🌡️"],["I feel calm and relaxed","😌"],["I am getting sleepy","😴"]]},{"q":"Benny took slow breaths, and he still feels a little mad. What can he do next?","opts":[["try another calm tool or ask for help","🙋"],["pretend he isn't mad","🙂"],["yell, because breathing didn't work","😠"]]},{"q":"Is it OK to feel mad?","opts":[["yes, feelings are OK, but hurting is not","❤️"],["no, mad is a bad feeling","👎"],["yes, so hitting is OK when I'm mad","👊"]]},{"q":"When is the best time to practice calm tools?","opts":[["when I feel calm, so I'm ready","😌"],["only when I'm very upset","😣"],["only at school","🏫"]]},{"q":"Kiko feels frustrated with her drawing. Which words could she use to ask for help?","opts":[["Can you help me, please?","🙋"],["Do it for me now!","😤"],["Go away!","🚫"]]}],"tools":[{"label":"Harvard Center on the Developing Child's free executive-function activity guide. Use the age 5-7 and 7-12 chapters for stop-and-go games (the specific activities were not confirmed).","ref":"harvard-ef-guide"},{"label":"Greater Good in Education's elementary stress practices, e.g. Loving-Kindness Buddy Wishes as a calm routine (free; link only)","ref":"ggie-berkeley"},{"label":"Fast Track's free 12-item parent Social Competence form (reuse permission not confirmed). Rate her at the start and end, and compare her Emotional Regulation subscale only with her own earlier score; it has no norms or cut scores.","ref":"cpprg-scs-parent"},{"label":"UNESCO MGIEP's free SEL for Schools course for grown-ups (self-paced, about 25 hours, written for teachers), including mindfulness and reportedly child-friendly resources","ref":"unesco-mgiep-sel-2020"}],"standards":[{"ref":"il-sel-standards","code":"Illinois SEL 2A.1.2 (Early Elementary, K-2; per search snippet)","text":"Use a variety of strategies to manage strong emotions (the snippet's example is a calm-down plan). The wording has not been checked against the ISBE PDF."},{"ref":"wi-sel-competencies","code":"Wisconsin SEL Grades 1-3: Emotional Development (Self-Management)","text":"With adult guidance, demonstrate a variety of strategies to manage strong emotions."},{"ref":"casel-framework","code":"CASEL: Self-management","text":"CASEL's examples include managing one's emotions and identifying and using stress-management strategies (paraphrase)."},{"ref":"who-life-skills-1997","code":"WHO core life skills: coping with emotions, coping with stress","text":"Coping with emotions and with stress are core psychosocial life skills, taught through active, participatory methods such as role-play."},{"ref":"unicef-transferable-skills","code":"UNICEF Global Framework on Transferable Skills: individual dimension (learning to be)","text":"Self-management and resilience are individual skills in UNICEF's 12-skill framework, which supports SDG 4 (grouping as given in the UNICEF LAC summary)."},{"ref":"matatag-gmrc","code":"MATATAG GMRC Grade 1 (competency code not confirmed)","text":"This is the Philippine anchor to check. No Grade 1 competency on managing emotions was seen, so no alignment is claimed yet."}],"log":{"label":"Real upset where she used a calm tool after one reminder or on her own (note the tool and the help level)","kidLabel":"I used a calm tool!","per":"time","target":3,"windowDays":28},"adultNotes":[{"title":"A calm spot is not a time-out","text":"A break means a cozy place she chooses, near a grown-up, for a few minutes. It is never being sent away alone, and never a punishment. Come back together and talk once she is calm.","ref":""},{"title":"One card for every caregiver","text":"Share the calm-tools card with everyone who cares for her (parents, lola, lolo, tita, yaya), so everyone uses the same words and the same one reminder. Tool words can be Filipino or her home language: Hinga nang malalim (take a deep breath), Bilang tayo hanggang sampu (let's count to ten), Pisil, tapos bitaw (squeeze, then let go), Patulong po (please help me).","ref":""},{"title":"Help levels: the app's own coaching model","text":"Log each upset as together (you did the tool with her), one reminder (you offered two tools and she chose one), or on her own. Only one reminder and on her own count toward mastery. Adult-observed records fit this age better than self-report: a secondary write-up of CASEL's guide says most self-report tools in it do not cover children under 7.","ref":"casel-sel-assessment-guide"},{"title":"What the evidence does and does not say","text":"Self-regulation measured by the HTKS game predicts early literacy and math, but that is a correlation, mostly in ages 3-7. It does not show that calm tools raise school scores, friendships or wellbeing. Treat calm tools as a life skill worth practicing for its own sake.","ref":"htks-meta"}],"statementRefs":["wi-sel-competencies","il-sel-standards"]},{"id":"F3","domain":"feelings","title":"Kind self-talk","icon":"🌱","ican":"When something is hard, I say kind words and keep trying.","kidWhy":"Kind words to yourself can help you try again.","weeks":5,"statement":"Within five weeks (one baseline week, then four weeks of lessons), [Name] will, when a task feels hard, say a helper line aloud (such as \"I can't do it yet\", \"I can try a new way\", \"I can ask for help\" or \"Kaya ko 'to\") and then try again, try a new way or ask for help, with no more than one reminder, measured by at least three logged hard-task moments and at least 90% on the 10-item goal check on two different days.","smart":{"s":"In a hard task, say a helper line aloud, then take a next step: try again, try a new way, or ask for help.","m":"Main measure: a real-life log of hard-task moments where she said a helper line and then tried again, tried a new way or asked for help, with one reminder or less. Target: at least 3 in the four lesson weeks, compared with a baseline week logged the same way before teaching. Supporting measure: at least 9 of 10 on the goal check, a knowledge check of helpful self-talk, on two different days.","a":"A grown-up models the words first, one line at a time, and the practice stays spoken and short. Wisconsin Grades 1-3 expects her to name what she does well and what she needs help with, and explicit growth-mindset use comes in Grades 4-5, so 'yet' is language the adult models and the log scores what she does next.","r":"Adults' process praise (you tried a new way) at ages 1-3 predicted children's belief that abilities can grow at ages 7-8 (Gunderson; correlational, small sample). Growth-mindset programs show small average effects (Sisk: d about 0.08, re-analysis about 0.05; Burnette: d = 0.14 in focal, high-fidelity samples), mostly with older students. This goal may help her keep trying; do not expect a measurable reading gain.","t":"Five weeks: a baseline week, then four lesson weeks. A keep-it check 2-4 weeks after mastery.","rRefs":["gunderson-2013-praise","burnette-2023-meta","sisk-2018-meta","yeager-2019-nature","aap-hc-self-esteem"]},"lesson":{"minutes":10,"materials":["a sticky note with 'I can't do it yet' or 'Kaya ko 'to'","a slightly hard puzzle or task","this app"],"steps":[{"phase":"Warm-up","text":"Share something you couldn't do yet as a child and what helped: practice, a new way, or someone's help.","refs":["aap-hc-self-esteem"]},{"phase":"I do","text":"Think aloud during a hard task: This is hard. I can't do it yet. I'll try a new way. Say it in Filipino too: Hindi pa, pero matututo ako.","refs":["nsw-grr","aap-hc-self-esteem"]},{"phase":"We do","text":"Turn stuck sentences into helper lines together, out loud, in two or three minutes: I'm bad at this becomes I'm still learning; I'll never get it becomes I can ask for help.","refs":["ggie-self-compassion","nsw-grr"]},{"phase":"You do","text":"Give her a slightly hard task. While you watch, she says a helper line and chooses her next step on her own. Then she watches My Kind Inside Voice and does the goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"Praise her process on purpose: You tried a new way. You asked for help. Put the sticky note where she does homework, and log each hard-task moment where she kept going.","refs":[]}],"support":"Practice just one line: I can't do it yet.","stretch":"She names what she does well and what she needs help with in a task, and picks a new strategy herself."},"assessment":{"method":"Your log of real hard-task moments counts most: note what was hard, the line she said (any language), what she did next, and whether you reminded her. Log a baseline week the same way before teaching. The goal check is a knowledge check only (10 items from a 12-item bank): several wrong choices sound calm but give up or repeat the same way, so she has to pick the line that leads to a next step, not just the kindest tone. Perseverance is hard to measure (ISELA's validation could not confirm a perseverance factor), so do not read the check as a measure of grit. When the parts point to different rubric levels, record the lower one. Mistakes and labels go in I2's log, not here. The check is criterion-referenced, not a diagnosis.","rubric":["Beginning: in hard tasks, not yet saying a helper line or taking a next step, even with a reminder; no logged moments yet; 4 or fewer of 10 on the goal check.","Developing: repeats a helper line after you say it first and keeps going with your help; logged moments need more than one reminder; 5-7 of 10 on the goal check.","Secure: says a helper line and then tries again, tries a new way or asks for help after one reminder, in 1-2 logged moments; at least 8 of 10 on the goal check.","Mastered: at least 3 logged hard-task moments in the four lesson weeks with a helper line and a next step (one reminder or less), and at least 9 of 10 on the goal check on two different days; confirmed by a keep-it check 2-4 weeks later."],"refs":["casel-sel-assessment-guide","isela","bond-1996-nrt-crt"]},"mastery":{"pct":90,"days":2,"text":"Mastered when the log shows at least 3 hard-task moments in the four lesson weeks where she said a helper line aloud and then tried again, tried a new way or asked for help, with one reminder or less, and she scores at least 9 of 10 on the goal check on two different days. A keep-it check 2-4 weeks after mastery (one goal check of at least 9 of 10, and one more logged moment) confirms it."},"evidence":{"episodes":["kind-inside-voice"]},"checks":[{"q":"Which words leave room to learn?","opts":[["I can't do it yet.","🌱"],["I can't do it.","🚫"],["I don't need to try.","😎"]]},{"q":"What does yet mean in: I can't read this word yet?","opts":[["I am still learning it","🌱"],["I will never read it","🚫"],["I already read it","✅"]]},{"q":"Juno's scooter keeps tipping over. Which words help her keep learning?","opts":[["I can try going slower.","🐢"],["I'll just stop for good.","🛑"],["Scooters are not for me.","🙅"]]},{"q":"Your math page is hard, and you tried two ways. What can you do next?","opts":[["ask for help","🙋"],["do it the same way again and again","🔁"],["put it away and say it's done","🙈"]]},{"q":"Benny says, I'm bad at puzzles. What could his kind inside voice say instead?","opts":[["I can try the corners first.","🧩"],["I'm the worst at puzzles.","😞"],["Puzzles are boring anyway.","🥱"]]},{"q":"Kiko's shoelace keeps coming undone. What helps most?","opts":[["ask someone to show her a new way","🙋"],["pull harder the same way","💪"],["never wear laces again","🚫"]]},{"q":"Who hears an unkind inside voice sometimes?","opts":[["everybody, even grown-ups","🌍"],["only some kids","🧒"],["nobody","🚫"]]},{"q":"What helps your brain learn something hard?","opts":[["practice, new ways and help","🧠"],["only trying harder the same way","🔁"],["waiting until it gets easy by itself","⏳"]]},{"q":"Juno falls off her scooter. She is not hurt, but she feels upset. What can she do first?","opts":[["take a calm breath, then try again","🌸"],["pretend she isn't upset","🙂"],["say mean words to herself","😠"]]},{"q":"Is it OK to ask for help when something is hard?","opts":[["yes, asking is a smart way to learn","🙋"],["no, I should do it all alone","🚫"],["only if I am very little","👶"]]},{"q":"Your inside voice can be like a good friend. What does a good-friend voice say when you are stuck?","opts":[["Let's try a new way.","🤝"],["Let's just skip it.","⏭️"],["You always get stuck.","😞"]]},{"q":"Wren's horse drawing looks wobbly, and she wants to make it better. What can she say?","opts":[["I can look at a picture and try again.","🖍️"],["I can't draw at all.","😞"],["Horses are too hard for anyone.","🐴"]]}],"tools":[{"label":"GGIE self-compassion handout (hard moments and kinder replies). It is written for older students, so do it aloud in 2-3 minutes for age 7; paraphrase it rather than copying.","ref":"ggie-self-compassion"},{"label":"AAP HealthyChildren parent page on the building blocks of self-esteem, including accepting mistakes","ref":"aap-hc-self-esteem"},{"label":"University of Chicago summary of the praise study; use process praise such as 'you tried two ways'","ref":"gunderson-2013-praise"},{"label":"Greater Good in Education self-compassion and gratitude practices; pick the elementary-level ones","ref":"ggie-berkeley"}],"standards":[{"ref":"casel-framework","code":"CASEL: Self-awareness","text":"CASEL lists having a growth mindset as a self-awareness example; self-awareness means understanding how one's emotions, thoughts and values influence behaviour (paraphrase)."},{"ref":"il-sel-standards","code":"Illinois SEL 2A.1.1 (Early Elementary, K-2; per search snippet)","text":"Describe connections between feelings, thoughts and actions."},{"ref":"wi-sel-competencies","code":"Wisconsin SEL Grades 1-3: Self-Concept","text":"Identify and describe skills and activities she does well and those she needs help with; using a growth mindset starts in Grades 4-5 (wording from a DPI-hosted alignment document)."},{"ref":"unicef-transferable-skills","code":"UNICEF Global Framework on Transferable Skills: individual dimension (learning to be)","text":"Self-management and resilience are individual skills (grouping as given in the UNICEF LAC summary)."},{"ref":"matatag-gmrc","code":"MATATAG GMRC Grade 1 (competency code not confirmed)","text":"This is the Philippine anchor to check. No Grade 1 competency on self-talk or perseverance was seen, so no alignment is claimed yet."}],"log":{"label":"Hard-task moment: she said a helper line aloud, then tried again, tried a new way or asked for help (one reminder or less)","kidLabel":"I kept trying!","per":"time","target":3,"windowDays":28},"adultNotes":[{"title":"Praise the process, on purpose","text":"The app's own coaching model, based on Gunderson's study: name what she did (You tried two ways and kept going; You asked for help), not a label (You're so smart). In that study girls received less process praise than boys (about 10% vs 24% of praise), so make a point of it.","ref":"gunderson-2013-praise"},{"title":"Keep expectations modest","text":"Growth-mindset effects are small and contested, and mostly found in older students. Treat 'yet' as everyday encouragement, not a reading intervention.","ref":"sisk-2018-meta"},{"title":"Helper lines in Filipino","text":"Any language counts: Kaya ko 'to (I can do this), Hindi pa, pero matututo ako (Not yet, but I will learn), Patulong po (Please help me). Keep the practice spoken and short; the self-compassion handouts are written for older students.","ref":"ggie-self-compassion"},{"title":"One moment, one log","text":"A hard task where she keeps going goes in this log. A mistake, or a label such as 'I'm bad', goes in I2's log. If a moment is both, log it once, where it fits best.","ref":""},{"title":"When to ask for more help","text":"Persistent harsh self-talk, such as 'I hate myself', is beyond this goal; raise it with her pediatrician. If she ever says she wishes she were dead or wants to hurt herself, take it seriously and get help the same day: her doctor, or in an emergency 911, the national emergency hotline (DILG: https://calabarzon.dilg.gov.ph/one-number-for-all-emergencies-unified-911-to-launch-nationwide/). The AAP page 'Signs of Low Self-Esteem' is an adult watch-list, not a diagnostic tool.","ref":"aap-hc-self-esteem"}],"statementRefs":["casel-framework","il-sel-standards"]},{"id":"I1","domain":"identity","title":"Knowing myself","icon":"⭐","ican":"I can share my likes, my strengths and what I'm learning.","kidWhy":"There is only one you, and you keep growing!","weeks":4,"statement":"Within four weeks, [Name] will tell a grown-up about herself, naming three things she likes, two strengths each with something she did that shows it, one thing she is still learning, and one group she belongs to (such as her family, a language she speaks or her town), measured by two observed All About Me shares on different days and at least 90% on the 10-item goal check on two different days.","smart":{"s":"Tell a grown-up about herself: three likes, two strengths each tied to an action, one thing she is still learning, and one group she belongs to.","m":"Main measure: two All About Me shares on different days (to two different grown-ups if possible), each ticked against the share checklist: 3 likes, 2 strengths with an action, 1 thing still learning, 1 group. A first share before making the poster is the baseline. Supporting measure: at least 9 of 10 on the goal check on two different days; it asks about ideas with one clear answer, because there is no single right like.","a":"Uses drawings and talking, not writing. Any true answer about herself counts. Character strengths such as kindness are offered as prompts, not required, and a strength that someone else names and she agrees with counts.","r":"Knowing and liking who she is and naming her family and groups is a K-2 identity outcome (Learning for Justice ID.K-2.1), and early-grade SEL standards pair what she does well with what she needs help with (Wisconsin Grades 1-3; Ohio K-2 A2.1.a, strengths and challenges). AAP describes healthy self-esteem as important for motivation, friendships and bouncing back, and UNCRC Article 8 treats her name, nationality and family as part of her identity.","t":"Four weeks: a baseline share at the start, the poster in weeks 1-2, two shares by the end of week 4. A keep-it check 2-4 weeks after mastery.","rRefs":["aap-hc-self-esteem","uncrc-text"]},"lesson":{"minutes":15,"materials":["paper and crayons","family photos (optional)","this app"],"steps":[{"phase":"Warm-up","text":"Share one thing you like, one thing you are good at with an example, and one thing you are still learning.","refs":[]},{"phase":"I do","text":"Show that strengths include how we treat people, tied to an action: I'm good at listening. Yesterday I listened to Lola's whole story.","refs":["nsw-grr"]},{"phase":"We do","text":"Make an All About Me poster: drawings of three likes, two strengths with a picture of her doing each, one thing she is still learning, and her groups (ate or bunso, a language she speaks, her town, her faith, or any group that matters to her). She can ask a family member, What am I good at? and keep the answers she agrees with.","refs":["nsw-grr"]},{"phase":"You do","text":"She tells you about herself using her poster, on her own, while you tick the share checklist. Then she watches All About Me and does the goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"Each day, name one strength you saw, tied to what she did: You helped your cousin find his slipper. That was kind. On another day, she shares her poster with a different grown-up, such as lola or a parent on a video call.","refs":["gunderson-2013-praise","aap-hc-self-esteem"]}],"support":"Give choices: Are you good at drawing, running or helping? Ask how she helps her family and friends.","stretch":"Ask how her friends are the same as and different from her, and how her family does things the same as or differently from other families."},"assessment":{"method":"Your observation of the All About Me share counts most. Use the share checklist (3 likes, 2 strengths each tied to an action, 1 thing still learning, 1 group) and write down what she says in her own words; a strength someone else names and she agrees with counts. The goal check (10 items from an 11-item bank) asks about ideas with one clear answer: people have different likes and strengths, strengths show in actions, and she can feel proud without putting others down. When the parts point to different rubric levels, record the lower one. It is criterion-referenced, not a comparison with other children. An optional Harter-Pike snapshot is described in the adult notes.","rubric":["Beginning: in a share, names fewer than two likes and no strength yet, even when choices are offered; 4 or fewer of 10 on the goal check.","Developing: names likes, and a strength when given choices, but not yet an action that shows it or a thing she is still learning; 5-7 of 10 on the goal check.","Secure: in one share, names 3 likes, at least 1 strength with an action and 1 thing she is still learning; at least 8 of 10 on the goal check.","Mastered: two shares on different days, each with 3 likes, 2 strengths tied to actions, 1 thing still learning and 1 group, and at least 9 of 10 on the goal check on two different days; confirmed by a keep-it check 2-4 weeks later (one more share and one goal check)."],"refs":["harter-pike-pspcsayc","isela","casel-sel-assessment-guide","bond-1996-nrt-crt"]},"mastery":{"pct":90,"days":2,"text":"Mastered when a grown-up has observed two All About Me shares on different days, each with three likes, two strengths each tied to something she did, one thing she is still learning and one group she belongs to, and she scores at least 9 of 10 on the goal check on two different days. A keep-it check 2-4 weeks after mastery (one more share, which can add what has changed, and one goal check of at least 9 of 10) confirms it."},"evidence":{"episodes":["all-about-me"]},"checks":[{"q":"Which one is a strength in how you treat people?","opts":[["helping a friend who is sad","🤝"],["having new shoes","👟"],["being the tallest","📏"]]},{"q":"Wren is quiet, and Juno is loud. What is true?","opts":[["both are OK ways to be","👍"],["Wren should be loud like Juno","📢"],["Juno should be quiet like Wren","🤫"]]},{"q":"Your friend likes bugs, and you like music. What is true?","opts":[["we can like different things","🤝"],["one of us is wrong","👎"],["friends must like the same things","👯"]]},{"q":"Who gets to say what you like?","opts":[["I do","⭐"],["my friends","👥"],["the ads on TV","📺"]]},{"q":"Can you be good at more than one thing?","opts":[["yes, at many things","👍"],["no, only one thing","☝️"],["only grown-ups can","🧑"]]},{"q":"Kiko says, I'm good at drawing. What could she add to show it?","opts":[["I drew a cat for Lola's birthday.","🎨"],["I'm the best in the whole world.","🏆"],["Nobody draws better than me.","🙅"]]},{"q":"Juno is still learning to swim. What is true?","opts":[["everyone is still learning something","🌱"],["she should only do things she's good at","🚫"],["she should keep it a secret","🤐"]]},{"q":"Lola says, you helped me set the table. What strength did you show?","opts":[["being helpful","🤝"],["being fast","⚡"],["being loud","📢"]]},{"q":"Benny is good at running. Wren is good at listening. What is true?","opts":[["everyone has different strengths","🌈"],["running is the only real strength","🏃"],["listening is not a strength","🙉"]]},{"q":"Kiko speaks Bisaya at home and English at school. What is true?","opts":[["both languages are part of her","🗣️"],["only English counts","🔤"],["she should stop speaking Bisaya","🤐"]]},{"q":"How can you feel proud of yourself and still be kind?","opts":[["share what I'm good at without putting others down","😊"],["say I'm better than everyone","🏆"],["hide everything I'm good at","🙈"]]}],"tools":[{"label":"Learning for Justice's free Social Justice Standards PDF, with K-2 identity outcomes and scenarios (cite it; do not adapt its text)","ref":"lfj-sjs"},{"label":"AAP HealthyChildren parent page: 12 building blocks of healthy self-esteem, with everyday ideas","ref":"aap-hc-self-esteem"},{"label":"UNICEF children's version of the CRC: read Article 8 (your name, nationality and family are part of who you are) aloud, then she draws herself with her name and family","ref":"unicef-crc-children"},{"label":"UNESCO's free GCED guide (CC BY-SA 3.0 IGO) with age 5-9 learning objectives on identity, belonging and worth","ref":"unesco-gced-tlo-2015"}],"standards":[{"ref":"lfj-sjs","code":"LFJ ID.K-2.1","text":"Know and like who she is, talk about her family and herself, and name some of her group identities."},{"ref":"lfj-sjs","code":"LFJ ID.K-2.4","text":"Feel good about herself without being mean or making others feel bad."},{"ref":"oh-sel-standards","code":"Ohio SEL A2.1.a (K-2)","text":"Identify personal interests and qualities, under A2, awareness of personal interests and qualities, including strengths and challenges. The code and wording come from WebSearch of secondary copies of the 2019 standards; they are not yet in the pool entry."},{"ref":"wi-sel-competencies","code":"Wisconsin SEL Grades 1-3: Self-Concept","text":"Identify and describe skills and activities she does well and those she needs help with (wording from a DPI-hosted alignment document)."},{"ref":"unesco-gced-tlo-2015","code":"UNESCO GCED ages 5-9: B.4 Different levels of identity","text":"See how she fits with family, friends, school and community, and value her own worth and the worth of others."},{"ref":"matatag-gmrc","code":"MATATAG GMRC Grade 1 (competency code not confirmed)","text":"DepEd's Grade 1 values subject centres on kindness, respect and family, which supports counting kindness as a strength. No specific competency was seen."}],"log":{"label":"All About Me share observed: 3 likes, 2 strengths each with an action, 1 thing still learning, 1 group","kidLabel":"I shared about me!","per":"day","target":2,"windowDays":28},"adultNotes":[{"title":"Modesty is welcome","text":"Many families, in the Philippines and elsewhere, teach children not to brag, so she may hesitate to say what she is good at. Ask how she helps her family and friends, and accept strengths others name if she agrees. Saying what you do well, kindly, is not showing off: Learning for Justice ID.K-2.4 is feeling good about yourself without making others feel bad.","ref":"lfj-sjs"},{"title":"Tie strengths to actions","text":"The app's own coaching model, based on Gunderson: name the action behind a strength (You listened to Lola's whole story) rather than only a trait (You're so kind). Process praise predicted growth beliefs at ages 7-8; person praise did not significantly predict fixed beliefs, so this is a good habit, not a warning.","ref":"gunderson-2013-praise"},{"title":"Her groups, in her words","text":"Groups can include ate, kuya or bunso, a home language such as Tagalog, Bisaya or Ilocano, her town or province, her faith, an Indigenous Peoples community, or a family with a parent working abroad. She chooses what to include; no group is required.","ref":"unesco-gced-tlo-2015"},{"title":"Optional snapshot","text":"If you can obtain it (cost and permission are not confirmed), the Harter-Pike Pictorial Scale has a First-Second Grade form. Compare her only with her own earlier score: it has no Philippine norms, and a parent giving it to her own child invites answers meant to please.","ref":"harter-pike-pspcsayc"}],"statementRefs":["lfj-sjs","wi-sel-competencies","oh-sel-standards"]},{"id":"I2","domain":"identity","title":"Mistakes and labels","icon":"🪞","ican":"A mistake or an unkind word doesn't decide who I am.","kidWhy":"You made a mistake. You are not a mistake.","weeks":5,"statement":"Within five weeks (one baseline week, then four weeks of lessons), [Name] will, after a mistake or a label such as 'I'm bad', say a kind, true sentence about herself (such as 'Oops, I can fix it' or 'I made a mistake, I'm still me') with no more than one reminder, measured by at least three logged moments and at least 90% on the 10-item goal check (which includes telling words about actions from labels) on two different days.","smart":{"s":"After a mistake or a label, say a kind, true sentence about herself instead of a label.","m":"Main measure: a real-life log of her own mistakes, or labels said about her, after which she said a kind, true sentence about herself (one reminder or less), noting what she said. Target: at least 3 in the four lesson weeks, compared with a baseline week logged the same way. Supporting measure: at least 9 of 10 on the goal check on two different days; it uses made-up cartoon scenarios to check that she can tell words about actions from labels and knows that helpful correction is worth listening to.","a":"Taught first with cartoon picture pairs, then with everyday examples. The check never asks about her own hurtful experiences. Grown-ups model their own mistakes and saying sorry, and she stays respectful with elders.","r":"Learning for Justice's K-2 identity outcomes say all her identities are part of her but she is always all herself, and that she can feel good about herself without being mean (ID.K-2.3, ID.K-2.4); applying ID.K-2.3 to labels is the app's own step. AAP lists accepting mistakes as a building block of self-esteem. This may help her bounce back after mistakes and get help when words hurt. It depends on adults describing actions rather than labels; Gunderson's process-praise finding behind that habit is correlational.","t":"Five weeks: a baseline week, then four lesson weeks. A keep-it check 2-4 weeks after mastery.","rRefs":["aap-hc-self-esteem","gunderson-2013-praise","uncrc-text"]},"lesson":{"minutes":15,"materials":["a mirror","picture pairs from the cartoons (draw or screenshot)","this app"],"steps":[{"phase":"Warm-up","text":"In the mirror, say one true, kind thing about yourself, then she says one too.","refs":["ggie-self-compassion"]},{"phase":"I do","text":"Share a mistake aloud: I spilled my coffee. Oops, I can fix it. I'm still me. Then wipe it up.","refs":["aap-hc-self-esteem","nsw-grr"]},{"phase":"We do","text":"Start with picture pairs from the cartoons: Kiko with 'Please play more quietly' and with 'You are a bad cat'; Kiko's spill with 'Oops, I can fix it' and with 'I always mess up'. Sort them together into 'about what someone did' and 'a label'. Move to spoken everyday examples only when she sorts the pictures easily.","refs":["nsw-grr"]},{"phase":"You do","text":"She sorts four new picture pairs on her own while you watch, then says a kind, true sentence for a pretend mistake (a toy spills its tea). Then she watches Oops! I Am Still Me and Unkind Words Do Not Decide Me, and does the goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"When you correct her, describe the action, not her: Please put the cup down gently. If you speak sharply, say sorry and name it. Log her real mistakes or labels and what she said.","refs":["deped-cpp-do40-2012"]}],"support":"Use only the cartoon picture pairs at first.","stretch":"She says a kind, true sentence to a friend or cousin after their mistake."},"assessment":{"method":"Your log of real mistakes and labels counts most: note what happened, what she said about herself (any language) and whether you reminded her. Log a baseline week the same way before teaching. The goal check (10 items from a 12-item bank) uses made-up cartoon scenarios only and never asks about her own experiences. One item repeats B2's rule to tell another trusted grown-up when words keep hurting, but help-seeking is measured in B2, not here. When the parts point to different rubric levels, record the lower one. Hard tasks go in F3's log. The check is criterion-referenced, not a diagnosis.","rubric":["Beginning: after mistakes, uses a label about herself (such as 'I'm bad') and does not yet say a kind, true sentence, even with a reminder; 4 or fewer of 10 on the goal check.","Developing: repeats 'Oops, I can fix it' after you say it first, and sorts the cartoon picture pairs with help; 5-7 of 10 on the goal check.","Secure: says a kind, true sentence after one reminder in 1-2 logged moments; at least 8 of 10 on the goal check.","Mastered: at least 3 logged mistakes or labels in the four lesson weeks after which she said a kind, true sentence (one reminder or less), and at least 9 of 10 on the goal check on two different days; confirmed by a keep-it check 2-4 weeks later."],"refs":["casel-sel-assessment-guide","bond-1996-nrt-crt"]},"mastery":{"pct":90,"days":2,"text":"Mastered when the log shows at least 3 mistakes or labels in the four lesson weeks after which she said a kind, true sentence about herself, with one reminder or less, and she scores at least 9 of 10 on the goal check on two different days. A keep-it check 2-4 weeks after mastery (one goal check of at least 9 of 10, and one more logged moment) confirms it."},"evidence":{"episodes":["mistake-not-me","words-dont-decide"]},"checks":[{"q":"Kiko spills paint on the floor. What is true?","opts":[["she made one mistake and can fix it","🧹"],["she always messes everything up","😞"],["she should hide the spill","🙈"]]},{"q":"Which words are about what someone did?","opts":[["Please play more quietly.","🤫"],["You are a noisy cat.","🐱"],["You are always too loud.","📢"]]},{"q":"Which words are a label about who someone is?","opts":[["You are a bad cat.","👎"],["Please carry the paint with two hands.","🙌"],["Please close the door softly.","🚪"]]},{"q":"Mr. Bruno is tired and calls Kiko a bad cat. What is true?","opts":[["his tired words don't decide who she is","⭐"],["it must be true because a grown-up said it","👎"],["she should yell back at him","😠"]]},{"q":"Mr. Bruno asks, please play more softly near my window. What can Kiko do?","opts":[["listen and play more softly","🤫"],["decide she is a bad cat","😞"],["sing even louder","📢"]]},{"q":"After a mistake, what can you say?","opts":[["Oops, I can fix it.","🧹"],["I mess everything up.","😞"],["It wasn't me.","🙅"]]},{"q":"You knock over your cup of water at lunch. What is a kind, true thing to tell yourself?","opts":[["Oops. I can wipe it up. I'm still me.","🧻"],["I'm so clumsy. I always spill.","😞"],["Nobody saw, so I'll leave it.","🙈"]]},{"q":"Benny forgets his library book. What is true?","opts":[["he forgot one thing and can make a reminder","📕"],["he is a forgetful bunny forever","😞"],["he is the worst in the class","👎"]]},{"q":"Ms. Rosa spills her coffee and wipes it up. What does that show?","opts":[["everyone makes mistakes, even grown-ups","🌍"],["only kids make mistakes","🧒"],["grown-ups should hide their mistakes","🙈"]]},{"q":"Juno reads a word wrong and says, I'm a bad reader. What could her kind inside voice say?","opts":[["I read one word wrong. I can try it again.","📖"],["I'm the worst reader.","😞"],["Reading is dumb.","🙄"]]},{"q":"Mr. Bruno says sorry for his unkind words. What can Kiko say?","opts":[["Thank you po for saying sorry.","🙏"],["You are a bad bear.","🐻"],["I'll never talk to you again.","🚫"]]},{"q":"A grown-up's unkind words keep making Kiko feel hurt and scared. What can she do?","opts":[["tell another grown-up she trusts","🗣️"],["keep it a secret","🤐"],["argue with the grown-up by herself","😠"]]}],"tools":[{"label":"GGIE self-compassion practice, done aloud: what would you tell a friend? Now tell yourself","ref":"ggie-self-compassion"},{"label":"UNICEF children's CRC: rights cannot be taken away; Article 19 is about being kept safe","ref":"unicef-crc-children"},{"label":"AAP HealthyChildren self-esteem page: model accepting mistakes aloud, one of its building blocks","ref":"aap-hc-self-esteem"},{"label":"DepEd Child Protection Policy (free): what schools must do about bullying and positive discipline","ref":"deped-cpp-do40-2012"}],"standards":[{"ref":"lfj-sjs","code":"LFJ ID.K-2.3","text":"All her group identities are part of her, but she is always all of herself. Applying this to labels like 'bad' is the app's own application of the outcome."},{"ref":"lfj-sjs","code":"LFJ ID.K-2.4","text":"Feel good about herself without being mean or making others feel bad (here: a kind, true statement about herself after a mistake)."},{"ref":"casel-framework","code":"CASEL: Self-awareness","text":"CASEL lists integrating personal and social identities as a self-awareness example; self-awareness means understanding how one's emotions, thoughts and values influence behaviour (paraphrase)."},{"ref":"uncrc-text","code":"UNCRC Art. 19","text":"Children are protected from all forms of physical or mental violence while in the care of parents or others, with procedures for reporting it. This is the rights basis for the stretch goal of telling a trusted adult, not a learning standard (paraphrase; check the treaty text)."},{"ref":"unesco-gced-tlo-2015","code":"UNESCO GCED ages 5-9: B.4 Different levels of identity","text":"Recognize her own worth and the worth of others as part of self-identity and belonging."},{"ref":"deped-cpp-do40-2012","code":"DepEd DO 40, s. 2012: Child Protection Policy","text":"Positive, non-violent discipline, and zero tolerance for abuse, violence, discrimination and bullying. That it supports correcting actions without labelling the child is the app's inference."}],"log":{"label":"After a mistake or a label, she said a kind, true sentence about herself (one reminder or less); note what she said","kidLabel":"I'm still me!","per":"time","target":3,"windowDays":28},"adultNotes":[{"title":"Respectful, and still me","text":"She can listen to a correction with po and opo and still know that a label is not who she is. She never has to argue with an elder. If anyone's words keep hurting or scare her, she tells another trusted grown-up, such as lola, tita or her teacher, and keeps telling until someone helps. Telling a trusted grown-up is not disrespect.","ref":"uncrc-text"},{"title":"Describe the action, not the child","text":"The app's own coaching model: say what to do (Please put the cup down gently), not what she is (You're so careless). This fits DepEd's positive, non-violent discipline policy. If you speak sharply, say sorry and name it, as Mr. Bruno does.","ref":"deped-cpp-do40-2012"},{"title":"If she tells you something","text":"Stay calm, listen, and believe her. Thank her for telling, and tell her she is not in trouble and it is not her fault. Do not question her at length or promise to keep it secret. Contact the school's Child Protection Committee or local child-protection services. The government's MAKABATA Helpline 1383, run by the Council for the Welfare of Children, takes reports of child abuse (DSWD press release on the CWC site: https://cwc.gov.ph/?p=4841). In an emergency, call 911, the national emergency hotline (DILG: https://calabarzon.dilg.gov.ph/one-number-for-all-emergencies-unified-911-to-launch-nationwide/).","ref":"aap-healthychildren-csa"},{"title":"What this goal measures","text":"This goal measures what she says about herself after mistakes and labels. Who to tell is taught and measured in B2 (Telling a trusted grown-up). Hard tasks go in F3's log and mistakes and labels go here, so each moment is logged once.","ref":""}],"statementRefs":["lfj-sjs","casel-framework"]},{"id":"I3","domain":"identity","title":"I am still growing","icon":"🌻","ican":"I can try new things and learn about me.","kidWhy":"Like a seed, you keep growing and finding new things.","weeks":4,"statement":"Within four weeks, [Name] will try at least two new things she chooses with a grown-up (such as a fruit like lanzones, a game like piko, a book, or a song in her home language) and, after each, say one thing she learned about herself, measured by two logged tries and at least 90% on the 10-item goal check on two different days.","smart":{"s":"Try two new things she chooses and, after each, say one thing she learned about herself in her own words (not liking it counts).","m":"Main measure: a real-life log of two new things she tried in the four weeks, each with what she said she learned about herself. Supporting measure: at least 9 of 10 on the goal check on two different days (three-option items about growing and changing). Her I1 All About Me poster is the starting point; add each new thing to it.","a":"New things are small, chosen with her from real choices, done with a grown-up, and safe (allergies, choking risks and seeds checked first). Not liking something is also learning about herself.","r":"Trying new things and saying what she learned is meant to support her willingness to try. Praising the trying (You tasted something new) fits Gunderson's finding that early process praise predicted the belief that abilities can grow at ages 7-8 (correlational). UNCRC Article 29(1) asks education to respect her own cultural identity and language, so new things include Filipino foods, games and songs.","t":"Four weeks, after I1. A keep-it check 2-4 weeks after mastery.","rRefs":["gunderson-2013-praise","aap-hc-self-esteem"]},"lesson":{"minutes":10,"materials":["her All About Me poster from I1","a seed and a cup of soil (optional)","this app"],"steps":[{"phase":"Warm-up","text":"Share something you used to dislike and now enjoy, or a game you learned as a child, such as piko or patintero.","refs":[]},{"phase":"I do","text":"Try something small and new yourself while she watches, and say what you learned: I tried one bite of a new fruit. I learned I like sour things. Then plant a seed and look at her All About Me poster: we will add new things as you grow.","refs":["nsw-grr"]},{"phase":"We do","text":"Make a Growing Me list of four or five small new things she chooses: a fruit like lanzones or atis, a game like piko or patintero, a new book, a song in her lola's language. Check foods for allergies and seeds first.","refs":["nsw-grr","aap-hc-self-esteem"]},{"phase":"You do","text":"She tries one new thing from the list while you watch, then tells you one thing she learned about herself (I like sour fruit; I don't like piko yet, but I like hopping). Then she watches I Am Still Growing and does the goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"Try a second new thing this week. Praise the trying (You tasted something new), log it with what she said, and add it to her poster.","refs":[]}],"support":"Keep new things very small: one bite, one turn of a game, one verse of a song.","stretch":"She talks about something she wants to learn when she is older and one first step she could try now."},"assessment":{"method":"Your log of the two tries counts most: what she tried and what she said she learned about herself, in her own words. The goal check (10 items from a 12-item bank) uses three-option items about growing and changing, and two on trying foods safely. When the parts point to different rubric levels, record the lower one. It is criterion-referenced and is not a measure of temperament: a cautious, slow-to-warm child can master this goal with very small tries.","rubric":["Beginning: not yet trying a new thing in this unit; may name one she would like to try; 4 or fewer of 10 on the goal check.","Developing: tries a new thing with a grown-up beside her and lots of encouragement, and says what she learned when given choices; 5-7 of 10 on the goal check.","Secure: one logged new thing, followed by one thing she learned about herself in her own words; at least 8 of 10 on the goal check.","Mastered: two logged new things in the four weeks, each followed by one thing she learned about herself in her own words (not liking it counts), and at least 9 of 10 on the goal check on two different days; confirmed by a keep-it check 2-4 weeks later."],"refs":["casel-sel-assessment-guide","bond-1996-nrt-crt"]},"mastery":{"pct":90,"days":2,"text":"Mastered when the log shows two new things she tried in the four weeks, each followed by one thing she said, in her own words, that she learned about herself (not liking it counts), and she scores at least 9 of 10 on the goal check on two different days. A keep-it check 2-4 weeks after mastery (one more new thing added to her poster, and one goal check of at least 9 of 10) confirms it."},"evidence":{"episodes":["still-growing"]},"checks":[{"q":"Juno was scared of swimming. She practiced, and now she loves it. What does that show?","opts":[["we can change as we grow","🌱"],["she was only pretending before","🎭"],["feelings never change","🪨"]]},{"q":"You try a new food and don't like it. What did you learn?","opts":[["something about what I like","⭐"],["that trying is a waste","🗑️"],["that I should never try again","🚫"]]},{"q":"Grown-ups call Wren the shy one. What is true?","opts":[["shy is one part of her, not all of her","🦔"],["she will always be only shy","🔒"],["shy means she can't have friends","🚫"]]},{"q":"What can help you find out what you like?","opts":[["trying new things, a little at a time","🎲"],["doing only what I already know","🔁"],["waiting until I'm a grown-up","⏳"]]},{"q":"Is it OK not to know what you love yet?","opts":[["yes, I'm still finding out","🌻"],["no, I should know by now","👎"],["only if my friends don't know","👥"]]},{"q":"Before you try a new food, who should say it is OK?","opts":[["a grown-up who cares for me","🧑"],["a friend at recess","🧒"],["nobody, I just eat it","🙅"]]},{"q":"Kiko tastes atis for the first time. What should she do with the black seeds?","opts":[["spit them out onto a plate","🍽️"],["chew them up","😬"],["swallow them","😮"]]},{"q":"What does growing on the inside mean?","opts":[["learning new things about me","🧠"],["getting taller","📏"],["eating more food","🍚"]]},{"q":"Benny used to like only red. Now he likes green too. What is true?","opts":[["likes can change as we grow","🌈"],["he must be copying someone","👀"],["red is better than green","🔴"]]},{"q":"Juno learns a song in her lola's language. What could she say she learned?","opts":[["I like singing in Lola's language.","🎵"],["Songs can only be in English.","🔤"],["I can't learn new songs.","🚫"]]},{"q":"Your friend tries patintero and doesn't like it. What can you say?","opts":[["That's OK. Now you know something about you.","🤝"],["You have to like it.","👎"],["You did it wrong.","🙅"]]},{"q":"Wren tries piko and keeps hopping on the line. What can she say?","opts":[["I'm still learning piko. I'll try again.","🌱"],["I'm bad at all games.","😞"],["Piko is a silly game.","🙄"]]}],"tools":[{"label":"AAP HealthyChildren self-esteem page: use its 'making real choices' block to pick new things together","ref":"aap-hc-self-esteem"},{"label":"University of Chicago summary of the praise study: praise her trying ('you tasted something new'), not her traits","ref":"gunderson-2013-praise"},{"label":"Learning for Justice K-2 identity outcomes (ID.K-2.3), for talking about labels like 'the shy one'","ref":"lfj-sjs"}],"standards":[{"ref":"lfj-sjs","code":"LFJ ID.K-2.3","text":"Her many group identities are all part of her, yet she is always all herself. Applying this to a label like 'shy' is the app's own application of the outcome."},{"ref":"unesco-gced-tlo-2015","code":"UNESCO GCED ages 5-9: B.4 Different levels of identity","text":"Build self-identity and intrapersonal skills by seeing how she fits with family, friends, school and community."},{"ref":"wi-sel-competencies","code":"Wisconsin SEL Grades 1-3: Self-Concept","text":"Identify and describe skills and activities she does well and those she needs help with (wording from a DPI-hosted alignment document)."},{"ref":"oh-sel-standards","code":"Ohio SEL K-2, A2: personal interests, qualities, strengths and challenges","text":"A K-2 indicator on exploring opportunities to develop skills and talents (seen by WebSearch in secondary copies of the 2019 standards; check the code, reported as A2.2.a, against the PDF)."},{"ref":"uncrc-text","code":"UNCRC Art. 29(1)","text":"Education should develop the child's personality and abilities and respect her own cultural identity, language and values (paraphrase)."},{"ref":"matatag-gmrc","code":"MATATAG GMRC Grade 1 (competency code not confirmed)","text":"This is the Philippine anchor to check. No Grade 1 competency on identity or self-concept was seen, so no alignment is claimed yet."}],"log":{"label":"Tried a new thing she chose and said one thing she learned about herself (note both)","kidLabel":"I tried something new!","per":"time","target":2,"windowDays":28},"adultNotes":[{"title":"Food safety first","text":"Before a new food, check for allergies and choking risks, and cut round or firm foods small. With atis or lanzones, show her how to spit the seeds out onto a plate; she should not chew or swallow them.","ref":""},{"title":"Her own culture counts","text":"New things can come from her own culture: a fruit like lanzones or atis, a game like piko or patintero, a song in her lola's language. UNCRC Article 29(1) asks education to respect a child's own cultural identity and language.","ref":"uncrc-text"},{"title":"Steps, not temperament","text":"Some children warm up slowly. The rubric describes steps in this unit, not who she is: shy is one part of her, not all of her. Keep tries tiny and her choice, and praise the trying.","ref":"lfj-sjs"},{"title":"Run I1 first","text":"Start from her All About Me poster and add each new thing to it, so she can see what has changed. This keeps I1 (who I am now), I3 (how I grow) and F3 (keep trying) from repeating each other.","ref":""}],"statementRefs":["lfj-sjs","unesco-gced-tlo-2015"]},{"id":"I4","domain":"identity","title":"My brave voice","icon":"✋","ican":"I can use my brave voice and ask for help.","kidWhy":"Your voice matters, and trusted grown-ups want to help.","weeks":5,"statement":"Within five weeks (one baseline week, then four weeks of lessons), [Name] will use her brave voice: in three adult-run what-if role-plays on at least two different days she will say 'Please stop, I don't like that' in a calm, strong voice, move away and name who she would tell, and in real life she will ask for help herself at least twice, measured by the role-play record, the real-life log, and at least 90% on the 10-item goal check about when to tell on two different days.","smart":{"s":"Speak up with a brave voice: say stop, move away and tell in what-if role-plays with a pretend same-age kid, and ask for help herself in real life.","m":"Three parts, scored separately. Role-plays: 3 adult-run what-ifs with a toy or puppet playing a same-age kid, on at least 2 different days, each with the stop words in a calm, strong voice, moving away, and naming who she would tell; one is the harder case where the first grown-up is busy. Real-life log: at least 2 times she asked for help herself at home or school in the four lesson weeks, compared with the baseline week. Goal check about when to tell: at least 9 of 10 on two different days.","a":"Practiced in calm role-play at home before real use. With other children she uses her brave voice; with adults she uses respectful words (Ayoko po) and tells another trusted grown-up. She never has to face a bigger kid or an adult alone.","r":"Children have the right to express their views and be heard (UNCRC Art. 12) and to be protected, with ways to report harm (Art. 19). School abuse-prevention programs raise children's protective knowledge and skills without raising anxiety (Cochrane review), and puppets, games and quizzes go with larger knowledge gains (Gubbels meta-analysis). There is not yet evidence that they reduce abuse, and they target body safety, so their fit to this goal is indirect. This goal helps her get help and be heard.","t":"Five weeks: a baseline week (log help requests and run one calm what-if before teaching), then four lesson weeks. A keep-it check 2-4 weeks after mastery.","rRefs":["uncrc-text","unesco-itgse-2018","walsh-cochrane-2015","gubbels-2021-meta"]},"lesson":{"minutes":10,"materials":["a toy or puppet to play a same-age kid","a list of her helpers at home and at school","this app"],"steps":[{"phase":"Warm-up","text":"Try the same words three ways: a tiny whisper, a scream, and a calm, strong voice. Stand tall and pick the calm, strong one for Please stop. Add: if you are ever scared or hurt, shouting loudly for help is always OK.","refs":[]},{"phase":"I do","text":"With the puppet, model the three steps: Please stop, I don't like that. Then move away and tell a grown-up. Add: If a kid is bigger, or it feels unsafe, skip the words. Just move away and tell.","refs":["nsw-grr","rosenshine-2012"]},{"phase":"We do","text":"Run what-if role-plays where the puppet plays a same-age kid (it grabs her crayon; it keeps calling a name after she says stop). She uses the three steps, then you switch roles. Add the harder one: the first grown-up is busy, so she says, This is important po, or tells another grown-up. With adults, practice is talk only: Ayoko po, then name who she would tell.","refs":["gubbels-2021-meta","who-life-skills-1997","nsw-grr"]},{"phase":"You do","text":"She runs one what-if with the puppet on her own while you watch and record the stop words, moving away and who she tells. Then she watches My Brave Voice and does the goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"After school, ask: Did you need help today? Who did you ask? Log each time she asked for help herself. Name her school helpers together: her adviser and the guidance teacher.","refs":[]}],"support":"Practice only 'Please stop' and pointing to who she would tell.","stretch":"She asks a new grown-up for help, such as the librarian, and explains the tell rule in her own words: hurt, unsafe or won't stop? Tell. Not sure? Tell anyway."},"assessment":{"method":"Your role-play record counts most, then the real-life help log. The goal check (10 items from a 12-item bank, with near-miss choices and the harder busy-grown-up case) checks when to tell. Role-plays are calm what-ifs with a puppet as a same-age kid: never set up a real conflict or a bigger 'bully'. When the parts point to different rubric levels, record the lower one. Touch boundaries are taught and measured in B1 and B2, not here; the WIST and CKAQ-R are touch-safety measures, used only as models for the what-if format. The check is criterion-referenced, not a diagnosis.","rubric":["Beginning: in what-if role-plays, does not yet say stop or move away (stays silent or pushes back); no real help requests logged; 4 or fewer of 10 on the goal check.","Developing: says 'Please stop' in role-play after you prompt her; asks for help in real life when you suggest it; 5-7 of 10 on the goal check.","Secure: says stop, moves away and names who she would tell in 1-2 role-plays on her own; 1 real help request logged; at least 8 of 10 on the goal check.","Mastered: 3 role-plays on at least 2 different days (including the busy-grown-up one) with stop words, moving away and telling; 2 logged real help requests in the four lesson weeks; at least 9 of 10 on the goal check on two different days; confirmed by a keep-it check 2-4 weeks later."],"refs":["wist-psq","ckaq-r","casel-sel-assessment-guide"]},"mastery":{"pct":90,"days":2,"text":"Mastered when you have recorded 3 what-if role-plays on at least 2 different days, including the one where the first grown-up is busy, in which she said 'Please stop, I don't like that' in a calm, strong voice, moved away and named who she would tell; the log shows at least 2 times she asked for help herself in the four lesson weeks; and she scores at least 9 of 10 on the goal check on two different days. A keep-it check 2-4 weeks after mastery (one role-play and one goal check of at least 9 of 10) confirms it. The app can't see every part of this rule, so once the goal check and log are met it shows Secure with 'Waiting for your check'. When every part is met, record an observation and choose Mastered (put any card or role-play score in the note).","obs":true},"evidence":{"episodes":["brave-voice"]},"checks":[{"q":"A kid grabs your crayon and won't give it back. What can you do first?","opts":[["say, Please stop. Give it back.","✋"],["grab it back hard","😤"],["call them a mean name","😠"]]},{"q":"A friend falls and hurts her knee at recess. What do you do?","opts":[["tell a grown-up right away","🩹"],["wait until tomorrow","⏰"],["tell only if she asks me to","🤷"]]},{"q":"Someone is hurt, unsafe, or won't stop. What do you do?","opts":[["tell a grown-up","🗣️"],["keep it to myself","🤐"],["try to fix it all alone","🙅"]]},{"q":"You are not sure if you should tell a grown-up. What do you do?","opts":[["tell anyway","🗣️"],["wait and see","⏳"],["ask a friend to keep it secret","🤫"]]},{"q":"You don't understand your work. What can you do?","opts":[["raise my hand and ask","✋"],["copy a friend's page","👀"],["guess and hope","🎲"]]},{"q":"You told your teacher, but she was busy and didn't hear. What now?","opts":[["tell her again, or tell another grown-up","🗣️"],["give up","😞"],["decide it wasn't important","🤷"]]},{"q":"A bigger kid is being rough, and it feels unsafe. What should you do?","opts":[["move away and tell a grown-up","🏃"],["stand close and argue","😠"],["push him back","👊"]]},{"q":"A kid keeps taking your pencil. Which voice is best for saying, Please stop?","opts":[["a calm, strong voice","💪"],["a scream","📢"],["a tiny whisper","🤫"]]},{"q":"A grown-up wants you to do something that doesn't feel OK. What can you do?","opts":[["say Ayoko po, move away, and tell","🗣️"],["do it and keep it a secret","🤐"],["argue with the grown-up by myself","😠"]]},{"q":"A classmate keeps calling Wren a mean name, even after she says stop. What can Wren do?","opts":[["tell a grown-up","🗣️"],["call him a mean name back","😠"],["keep it to herself","🤐"]]},{"q":"Benny tells Ms. Rosa that a kid took his snack and won't give it back. Is that OK?","opts":[["yes, someone won't stop, so he tells","👍"],["no, he should keep quiet","🤐"],["no, he should chase the kid","🏃"]]},{"q":"Who can you ask for help at school?","opts":[["my teacher, adviser or guidance teacher","🏫"],["nobody at school","🚫"],["only other kids","🧒"]]}],"tools":[{"label":"UNICEF children's CRC: read Article 12 aloud, then she names a trusted adult who helps","ref":"unicef-crc-children"},{"label":"NSPCC's free Talk PANTS parent guide; its 'Speak up, someone can help' rule fits the brave voice (the Pantosaurus storybook is sold separately)","ref":"nspcc-pants"},{"label":"Learning for Justice K-2 Action outcome AC.K-2.17, with school scenarios on speaking up","ref":"lfj-sjs"},{"label":"AAP HealthyChildren parent page: tell her she will not be in trouble for telling, and that you will listen and believe her","ref":"aap-healthychildren-csa"}],"standards":[{"ref":"lfj-sjs","code":"LFJ AC.K-2.17","text":"She can and will do something when she sees unfairness, and this includes telling an adult."},{"ref":"nses-2","code":"NSES 2nd ed., by end of Grade 2: CHR.2.IC.1 and IV.2.AI.2 (codes from secondary alignment documents; check them in the 2020 PDF)","text":"Demonstrate how to communicate personal boundaries and respect someone else's, and identify trusted adults, including parents and caregivers, to talk to about uncomfortable or dangerous situations."},{"ref":"casel-framework","code":"CASEL: Relationship skills","text":"CASEL's examples include seeking or offering support and help when needed, and resolving conflicts constructively (paraphrase)."},{"ref":"unesco-itgse-2018","code":"UNESCO ITGSE 2018, ages 5-8: 4.2 Consent, privacy and bodily integrity","text":"Everyone has the right to decide who can touch their body, where and in what way (key idea quoted by secondary sources). The 'say no, move away, tell a trusted adult' objectives are the researchers' recall, not confirmed."},{"ref":"uncrc-text","code":"UNCRC Art. 12 and Art. 19","text":"A child can express her views freely on matters affecting her, given due weight for her age (Art. 12), and is protected from violence and abuse, with ways to report it (Art. 19) (paraphrase)."},{"ref":"deped-cpp-do40-2012","code":"DepEd DO 40, s. 2012: Child Protection Policy","text":"Schools have procedures to prevent and respond to abuse, violence and bullying, with zero tolerance and a Child Protection Committee."}],"log":{"label":"She asked for help herself at home or school (note where and who)","kidLabel":"I asked for help!","per":"time","target":2,"windowDays":28},"adultNotes":[{"title":"The tell rule","text":"Is someone hurt, unsafe, or won't stop? Tell. Not sure? Tell anyway. This replaces 'telling vs tattling', which can make a child hold back. It matches NSPCC's 'Speak up, someone can help' and AAP's advice to tell her she won't be in trouble for telling. If she tells about something small, thank her first, then coach.","ref":"nspcc-pants"},{"title":"Brave voice with kids, respectful words with adults","text":"She practices 'Please stop' with other children. With an adult she can say 'Ayoko po' or 'Hindi po' and then tell another trusted grown-up. Telling a trusted grown-up is not disrespect. She never has to face a bigger kid or an adult alone: moving away and telling is always enough. The calm, strong voice is for Please stop; if she is ever scared or hurt, shouting for help is always OK.","ref":"uncrc-text"},{"title":"School helpers","text":"Name her helpers together: her adviser, the guidance teacher, and the school's Child Protection Committee, which DepEd's Child Protection Policy requires schools to form.","ref":"deped-cpp-do40-2012"},{"title":"If she tells you something","text":"Stay calm, listen, and believe her. Thank her for telling, and tell her she is not in trouble and it is not her fault. Do not question her at length or promise to keep it secret. Contact the school's Child Protection Committee or local child-protection services. The government's MAKABATA Helpline 1383, run by the Council for the Welfare of Children, takes reports of child abuse (DSWD press release on the CWC site: https://cwc.gov.ph/?p=4841). In an emergency, call 911, the national emergency hotline (DILG: https://calabarzon.dilg.gov.ph/one-number-for-all-emergencies-unified-911-to-launch-nationwide/).","ref":"aap-healthychildren-csa"},{"title":"Two sides of one rule","text":"'Please stop' here and B1's 'stop right away when someone says stop' are the same rule seen from both sides; teach them together. Touch boundaries are taught in B1 and B2.","ref":""}],"statementRefs":["lfj-sjs","nses-2","casel-framework"]},{"id":"S1","domain":"respect","title":"Kind words","icon":"🙏","ican":"I can say please, thank you, excuse me and hello.","kidWhy":"Kind words, in English or Filipino, help people feel cared for.","weeks":4,"statement":"Within four weeks, [Name] will use a polite word or greeting without a reminder (please, thank you, you're welcome, excuse me, or a greeting such as hello po, mano po or a wave) in at least 4 of the first 5 chances a grown-up notices in a day, on at least 5 days within any 7, measured by a grown-up's daily tally against her week-1 baseline and by at least 90% on the goal check on two different days.","smart":{"s":"Use a polite word or greeting, without a reminder, when a chance comes up: please when asking, thank you and you're welcome, excuse me to get past or to interrupt, and a greeting (spoken, mano po or a wave). English, Filipino and po/opo forms all count.","m":"Baseline: tally the first 5 chances on 3 days in week 1, before coaching, and use the middle score. Target: at least 4 of the first 5 chances without a reminder on at least 5 days within any 7 (logged by a grown-up), plus at least 90% on the 10-item goal check on two different days. A day with fewer than 5 chances isn't tallied and doesn't count against her. If her baseline is already 4 of 5, tally only the harder chances (interrupting, answering a no, greeting an elder). The tally counts most; the check is practice and a knowledge check.","a":"DepEd's earlier Grade 1 English list (the MELCs, now replaced by MATATAG) included polite expressions, so the target fits her grade. Grown-ups model the words and name them when she uses them.","r":"Grade 1 GMRC in the Philippines covers good manners and respect toward family and others, and DepEd's earlier Grade 1 English list (MELCs) included greetings, thanks and asking permission. Linking everyday courtesy to UNICEF's 'learning to live together' skills and WHO's interpersonal skills is the app's own mapping.","t":"Four weeks: baseline in week 1, tally each day you can from week 2, goal check at least weekly; keep-it check 2-4 weeks after mastery.","rRefs":["matatag-gmrc","unicef-transferable-skills","who-life-skills-1997"]},"lesson":{"minutes":10,"materials":["a few snacks or toys for a pretend sari-sari store","paper for a tally","this app"],"steps":[{"phase":"Warm-up","text":"Play 'What do we say?': hand her a cup, stand in a doorway, say good morning. She answers each with a kind word. Salamat po, makikiraan po and good morning po count too.","refs":[]},{"phase":"I do","text":"Use please, thank you, you're welcome and excuse me with her all day, and say why out loud: I said excuse me because I needed to get past.","refs":["nsw-grr","rosenshine-2012"]},{"phase":"We do","text":"Play sari-sari store: she greets the store owner, asks for a snack with please and says thank you po. Then swap roles: as the owner, she greets you and answers your thank you with you're welcome.","refs":["nsw-grr","who-life-skills-1997"]},{"phase":"You do","text":"She watches Kind Words Everywhere and does the goal check. Then at snack time she a
