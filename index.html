sks for and thanks you for something on her own while you watch without prompting.","refs":["nsw-grr"]},{"phase":"Real life","text":"Week 1: tally the first 5 chances on 3 days before you coach; that is her baseline. From week 2, tally the first 5 chances each day you can and log each day she reaches 4 of 5 without a reminder.","refs":["casel-sel-assessment-guide","ncii-goals-pm"]}],"support":"Start with please and thank you only. Give a reminder if she needs it (that chance just isn't counted), and praise each kind word you hear.","stretch":"Ask how someone is, and say a polite goodbye when leaving (bye po, paalam po)."},"assessment":{"method":"Two parts. Your daily tally of real chances counts most: count the first 5 chances you notice (being given something, asking for something, getting past or interrupting someone, being greeted) and mark each one done without a reminder; a day with fewer than 5 chances isn't tallied. The goal check gives 10 everyday scenarios and is practice plus a knowledge check. Compare her with her own week-1 baseline, not with other children.","rubric":["Uses a polite word or greeting without a reminder in 0-1 of the first 5 chances on most tallied days.","Uses one without a reminder in 2-3 of the first 5 chances on most tallied days, or mainly after a reminder.","Reaches 4 of the first 5 chances without a reminder on 3-4 days within any 7, or the goal check is at 80-89% or reached 90% on only one day.","Reaches at least 4 of the first 5 chances without a reminder on at least 5 days within any 7 (English or Filipino forms count), and scores at least 90% on the goal check on two different days."],"refs":["casel-sel-assessment-guide","ncii-goals-pm","cdc-smart-brief3b","cpprg-scs-parent"]},"mastery":{"pct":90,"days":2,"text":"Mastered when both are true: she scores at least 90% (9 of 10) on the goal check on two different days, and your log shows at least 5 kind-words days within any 7 days (on each, she used a polite word or greeting without a reminder in at least 4 of the first 5 chances you noticed). A keep-it check 2-4 weeks later, one goal check plus one tallied day, confirms it."},"evidence":{"episodes":["magic-words"]},"checks":[{"q":"You would like a cookie from Tita's plate. What do you say?","opts":[["May I have one, please?","🙏"],["I want a cookie.","🍪"],["Tita, give me one.","👉"]]},{"q":"Lola gives you a new pencil. What do you say?","opts":[["Thank you, Lola!","😊"],["I already have one.","✏️"],["Is that all?","🤔"]]},{"q":"Your friend says, Thank you for sharing! What can you say?","opts":[["You're welcome!","😊"],["I know.","🤷"],["Now give it back.","✋"]]},{"q":"Someone is standing in the doorway. How do you get past?","opts":[["Say excuse me, please.","🙋"],["Squeeze past without a word.","🚪"],["Say: Move!","😠"]]},{"q":"Mama is talking with Tita. You want to show her your drawing. What do you do?","opts":[["Say excuse me, then wait for her to look.","🙋"],["Pull her arm and talk right away.","👉"],["Keep saying Mama, Mama, Mama!","📢"]]},{"q":"Lolo comes to visit. What is a kind way to greet him?","opts":[["Say hello po, with mano po or a wave.","👋"],["Say hi but keep looking at my game.","🎮"],["Run to my room.","🏃"]]},{"q":"At the sari-sari store, the store owner says good morning. What can you say?","opts":[["Good morning po!","☀️"],["Nothing, and point at the candy.","🍬"],["Give me that one.","👉"]]},{"q":"You ask for another cookie, and Tita says no. What can you say?","opts":[["OK po, thank you.","🙂"],["But I want one!","😤"],["You never share.","😒"]]},{"q":"You want to play outside. How do you ask Papa?","opts":[["May I play outside, please?","🙏"],["I'm going outside.","🚪"],["Outside now!","😤"]]},{"q":"You need a pencil from a classmate. How do you ask?","opts":[["Can I borrow a pencil, please?","✏️"],["Pencil.","👉"],["I'm taking your pencil.","✋"]]},{"q":"Your teacher helps you zip your bag. What do you say?","opts":[["Thank you, Teacher!","😊"],["Now do my shoes.","👟"],["Nothing, and run off.","🏃"]]}],"tools":[{"label":"DepEd MATATAG GMRC and Values Education guide for Grades 1, 4 and 7 (free PDF, in Filipino, written for teachers): what Philippine Grade 1 classes teach about manners, respect and right conduct","ref":"matatag-gmrc"},{"label":"NSW Department of Education page on gradual release (I do, we do, you do), free to read: the routine this lesson follows","ref":"nsw-grr"},{"label":"Fast Track Project Social Competence Scale, parent version: 12 items posted on the project's website (no fee seen; reuse terms not confirmed; US research samples, no norms). Use it to compare her with her own earlier ratings, not to rank her.","ref":"cpprg-scs-parent"},{"label":"Greater Good in Education (UC Berkeley): free gratitude and kindness practices written for classrooms that a family can adapt (the site calls them research-based); pick ones tagged lower elementary","ref":"ggie-berkeley"}],"standards":[{"ref":"melc-english-g1","code":"DepEd Grade 1 English MELCs, Quarter 3: polite expressions (official code not confirmed)","text":"Use and respond appropriately to polite expressions: greetings, leave-takings, gratitude and apology, asking permission and offering help. The wording comes from a TeacherPH repost, and teacher copies show the code EN1OL-IIIa-e-1.5. MATATAG has replaced the MELCs and has no Grade 1 English subject (English starts in Grade 2), so treat this as a supplementary benchmark."},{"ref":"matatag-gmrc","code":"MATATAG GMRC Grade 1 (competency code not confirmed)","text":"Good Manners and Right Conduct is one of the five MATATAG Grade 1 subjects (RA 11476). Its guide, written in Filipino, is the official Philippine anchor for manners and respect toward family and others. No specific courtesy competency was confirmed."},{"ref":"uk-dfe-rshe-guidance","code":"England Relationships Education (primary): Respectful relationships","text":"By the end of primary, pupils know the conventions of courtesy and manners. From the beginning of primary, they are taught to treat each other with kindness, consideration and respect. This is the 2019 text as reproduced by schools; check it against the 2025 guidance, which applies from September 2026."},{"ref":"casel-framework","code":"CASEL: Social awareness","text":"CASEL's examples include understanding and expressing gratitude and understanding social norms for behaviour in different settings. CASEL does not name manners; everyday courtesy words are the app's age-7 application of this competency."},{"ref":"unicef-transferable-skills","code":"UNICEF Global Framework on Transferable Skills (2019): social dimension (learning to live together)","text":"The social dimension includes respect for diversity, empathy and participation. Linking it to everyday courtesy is the app's own mapping, and the framework has no age-7 descriptors."}],"log":{"label":"Kind-words day: she used a polite word or greeting without a reminder in at least 4 of the first 5 chances you noticed (English, Filipino and po/opo forms count)","kidLabel":"I used kind words!","per":"day","target":5,"windowDays":7},"adultNotes":[{"title":"Filipino courtesy counts","text":"Count po and opo, salamat po, makikiraan po (excuse me, may I pass) and pasensya na po the same as the English words. A greeting can be spoken, mano po or a wave, and she chooses which (see My space, your space). Courtesy toward family and others is part of Grade 1 GMRC.","ref":"matatag-gmrc"},{"title":"Counting chances fairly","text":"Some days bring more chances than others, so count only the first 5 you notice each day, and skip a day with fewer than 5. A reminder or hand signal means that chance doesn't count, but still give it so she succeeds. Her week-1 middle score is her starting point; compare her with herself.","ref":"ncii-goals-pm"},{"title":"Model it to her too","text":"Say please, thank you and excuse me to her, not only to other grown-ups, and use po with elders where she can hear. Name it when she does it: You said salamat po to Lola without a reminder!","ref":""}],"statementRefs":["melc-english-g1","uk-dfe-rshe-guidance"]},{"id":"S2","domain":"respect","title":"Taking turns","icon":"🔄","ican":"I can wait for my turn and pass it on.","kidWhy":"Taking turns means everyone gets to play!","weeks":4,"statement":"Within four weeks, [Name] will take turns fairly in play, waiting for her turn without grabbing or pushing in and passing the turn on when it ends, with no reminder, in at least 4 observed play situations within 14 days (at least 2 with other children, not only a grown-up), measured by a grown-up's play log against a week-1 baseline and by at least 90% on the goal check on two different days.","smart":{"s":"Take turns in play: ask or wait for a turn without grabbing or pushing in, and pass the turn on when it ends, with no reminder.","m":"Baseline: watch 2-3 play times in week 1 and note which parts she already does (asks, waits, passes on). A play situation counts when she waits without grabbing and passes the turn on with no reminder. Target: 4 counted situations within 14 days, at least 2 with other children (seen by you or reported by a teacher or play-date grown-up), plus at least 90% on the goal check on two different days. If she already did both parts with no reminder in at least 2 baseline play times, count only harder situations (group games with three or more children, a turn cut short, a younger child who can't wait).","a":"Start with short turns and a visible timer, and with a grown-up partner (easier), then siblings, cousins or classmates.","r":"Taking turns and sharing fairly are early cooperation skills: CASEL's relationship skills include cooperating and resolving conflicts constructively, UNICEF's Middle East and North Africa life-skills framework lists cooperation and negotiation among its 12 core skills, and England's guidance teaches turn-taking from the start of primary.","t":"Four weeks: baseline in week 1, log play times from week 2, goal check at least weekly; keep-it check 2-4 weeks after mastery.","rRefs":["casel-framework","unicef-mena-lsce-2017","uk-dfe-rshe-guidance","who-life-skills-1997"]},"lesson":{"minutes":10,"materials":["a turn game she knows (sungka, chalk for piko, cards or a board game)","a kitchen timer, or counting","this app"],"steps":[{"phase":"Warm-up","text":"Play a quick turn game such as sungka, piko or cards, with a sibling or cousin if one is around. Decide who goes first with jack-en-poy.","refs":[]},{"phase":"I do","text":"Model with a toy: Can I have a turn when you're done? Then wait out loud: I'm waiting, I'll cheer for you. Then pass it on: Your turn!","refs":["nsw-grr","rosenshine-2012"]},{"phase":"We do","text":"Share one toy with a timer or ten counts. Practise the hard parts together: the timer rings before you're ready, someone cuts in line, a younger cousin can't wait.","refs":["nsw-grr","rosenshine-2012"]},{"phase":"You do","text":"She watches Taking Turns at the Park and does the goal check. Then she plays a short turn game with another child while you watch without reminding, and you note waiting and passing on.","refs":["nsw-grr"]},{"phase":"Real life","text":"Week 1: watch 2-3 play times and note what she already does. From week 2, log each play time where she waits without grabbing and passes the turn on with no reminder, and note who she played with.","refs":["casel-sel-assessment-guide"]}],"support":"Use very short turns (ten counts) and a visible timer, and start with a grown-up partner before other children.","stretch":"She suggests a fair rule herself when a sharing problem starts: jack-en-poy, taking turns going first, or a timer."},"assessment":{"method":"Your play log counts most: one play situation counts when she waits for her turn without grabbing or pushing in and passes the turn on when it ends, with no reminder. Note which parts happened (asked, waited, passed on) to place her on the rubric. A teacher's or play-date grown-up's report counts as seen. The goal check gives 10 sharing scenarios, including harder ones, and is practice plus a knowledge check.","rubric":["Grabs, pushes in or won't pass the turn on in most play situations, even with reminders.","Waits and passes the turn on only with reminders; 1 counted situation in 14 days, or only with a grown-up partner.","2-3 counted situations in 14 days, or 4 but fewer than 2 with other children; or the goal check is at 80-89% or reached 90% on only one day.","At least 4 counted situations within 14 days, at least 2 with other children (waits without grabbing and passes the turn on, no reminder), and at least 90% on the goal check on two different days."],"refs":["casel-sel-assessment-guide","ncii-goals-pm","cpprg-scs-parent","isela"]},"mastery":{"pct":90,"days":2,"text":"Mastered when both are true: your log shows at least 4 counted play situations within 14 days, at least 2 of them with other children (she waited without grabbing and passed the turn on, with no reminder), and she scores at least 90% (9 of 10) on the goal check on two different days. A keep-it check 2-4 weeks later, one goal check plus one observed play time, confirms it. The app can't see every part of this rule, so once the goal check and log are met it shows Secure with 'Waiting for your check'. When every part is met, record an observation and choose Mastered (put any card or role-play score in the note).","obs":true},"evidence":{"episodes":["taking-turns"]},"checks":[{"q":"There is one swing and three friends. What is fair?","opts":[["Take turns, ten swings each.","🔄"],["Whoever got there first keeps it.","🥇"],["The biggest kid decides.","💪"]]},{"q":"Your cousin has the ball you want. What is the best way to ask?","opts":[["Can I have a turn when you're done?","🙋"],["Can I have it right now?","⏰"],["Give it to me, please.","👉"]]},{"q":"You asked for a turn. Your friend says, In a minute. What do you do?","opts":[["Wait and find something to do.","⏳"],["Ask again and again.","🔁"],["Grab it after a little while.","✊"]]},{"q":"You are playing piko with friends. It isn't your turn yet. What do you do?","opts":[["Wait in line and cheer.","📣"],["Hop in front so it's faster.","🏃"],["Tell them to hurry up.","😤"]]},{"q":"Your turn on the swing is over. What do you do?","opts":[["Get off and say: Your turn!","😊"],["Swing just a little longer.","⏰"],["Say: No, I was here first.","🙅"]]},{"q":"Someone cuts in front of you in line for the slide. What can you do?","opts":[["Calmly say: I was next, please.","🗣️"],["Push them out of the line.","😠"],["Cut in front of someone else.","🔀"]]},{"q":"Recess ends before your turn is done. What helps?","opts":[["Feel a bit sad, then ask to go first next time.","🙂"],["Keep playing after the bell.","🔔"],["Say: I'm never playing again!","😠"]]},{"q":"Your little cousin cries because waiting is hard. What could you do?","opts":[["Help him wait: count or play together.","🧸"],["Give him every turn so he stops.","🎁"],["Tell him to stop being a baby.","😒"]]},{"q":"Two friends both want the one ball. What is a fair idea?","opts":[["Play catch together.","⚽"],["One keeps it, and the other watches.","👀"],["Whoever yells loudest gets it.","📢"]]},{"q":"Who goes first in sungka? What is a fair way to decide?","opts":[["Play jack-en-poy, or take turns going first.","✌️"],["I always go first.","👆"],["Whoever grabs the board first.","🤲"]]},{"q":"You lose a turn in a board game. What do you do?","opts":[["Say oh well, and wait for my next turn.","🙂"],["Roll again when no one is looking.","🎲"],["Quit the game.","🚪"]]}],"tools":[{"label":"NSW Department of Education page on gradual release (I do, we do, you do), free to read: the routine this lesson follows","ref":"nsw-grr"},{"label":"Harvard Center on the Developing Child activity guide (free PDF) with chapters for ages 5-7 and 7-12: games that practise self-control and working memory. Use it as an optional extra; the pool did not confirm which games each chapter contains.","ref":"harvard-ef-guide"},{"label":"England's statutory Relationships Education guidance (free on GOV.UK, written for schools): what primary pupils are taught about turn-taking, kindness and boundaries in play","ref":"uk-dfe-rshe-guidance"},{"label":"Fast Track Project Social Competence Scale, parent version: 12 items posted on the project's website (no fee seen; reuse terms not confirmed; US research samples, no norms). Use it to compare her with her own earlier ratings, not to rank her.","ref":"cpprg-scs-parent"}],"standards":[{"ref":"uk-dfe-rshe-guidance","code":"England Relationships Education (primary): from the beginning of primary","text":"From the beginning of primary, building on early education, pupils are taught how to take turns. Respect for others is taught as understanding their own and others' boundaries in play and in negotiations about space, toys, books and resources. This is the 2019 text as quoted by schools (confirmed by web search; the pool records only topic areas); check it against the 2025 guidance."},{"ref":"casel-framework","code":"CASEL: Relationship skills","text":"This competency includes cooperating, working together to solve problems and resolving conflicts constructively. CASEL does not name turn-taking; taking turns and sharing are the app's age-7 form of these skills."},{"ref":"unicef-mena-lsce-2017","code":"UNICEF MENA Life Skills and Citizenship Education framework (2017): cooperation and negotiation","text":"Cooperation and negotiation are two of the framework's 12 core life skills. It was written for the Middle East and North Africa and has no age-7 descriptors, so the app writes its own."},{"ref":"matatag-gmrc","code":"MATATAG GMRC Grade 1 (no sharing or turn-taking competency confirmed)","text":"This is the Grade 1 values subject on good manners and right conduct toward family and others. Third-party Grade 1 lesson logs (not official) link GMRC lessons to generosity and cooperation. Check the guide for a sharing competency before citing one."}],"log":{"label":"Fair-turn play time: she waited without grabbing and passed the turn on, with no reminder (note who she played with; a teacher's or play-date grown-up's report counts)","kidLabel":"I took turns!","per":"time","target":4,"windowDays":14},"adultNotes":[{"title":"Filipino turn games","text":"Sungka, piko, patintero and card games with cousins or neighbours are natural practice. Jack-en-poy is a quick, fair way to choose who goes first, and a rule she can learn to suggest herself.","ref":""},{"title":"What counts as one situation","text":"One play time with at least one other person where she waits without grabbing or pushing in AND passes the turn on when it ends, with no reminder. Note which parts happened so you can use the rubric. Play with a grown-up is easier than with children, so at least 2 counted times should be with children.","ref":"casel-sel-assessment-guide"},{"title":"If she already does this","text":"England's guidance teaches turn-taking from the start of primary, so a 7-year-old may already manage familiar toys. If she did both parts with no reminder in at least 2 baseline play times, count only harder times: group games with three or more children, a turn cut short, or waiting with a younger cousin.","ref":"uk-dfe-rshe-guidance"}],"statementRefs":["uk-dfe-rshe-guidance","casel-framework"]},{"id":"S3","domain":"respect","title":"Being a good friend","icon":"🤝","ican":"I can invite others to play and really listen.","kidWhy":"Good friends notice, invite, and listen to each other.","weeks":4,"statement":"Within four weeks, [Name] will, without a prompt, invite someone who is on their own or watching to join her play at least 3 times, taking a no thanks calmly, and show listening without a reminder by turning toward the speaker and asking a question about what they said on 2 different days, measured by a grown-up's log (a teacher's or play-date grown-up's report counts as seen) and by at least 90% on the goal check on two different days.","smart":{"s":"Include others: notice someone on their own or watching, invite them to join, and take a no thanks calmly. Show listening by turning toward the speaker and asking a question about what they said.","m":"Two counts, kept separately. Invitations: at least 3 within 4 weeks, made without a prompt, seen by you or reported by a teacher or play-date grown-up (her own reports are noted as 'she told me' and don't count); an invitation still counts if the answer is no thanks and she takes it calmly. Listening: on 2 different days, in a short talk at home, she turns toward the speaker and asks a question about what they said, without a reminder. Plus at least 90% on the goal check on two different days.","a":"Listening can be shown in flexible ways (turning toward, nodding, asking), not forced eye contact. Teacher and play-date reports cover school play you can't see.","r":"England's primary guidance teaches how people make friends and the qualities of good friendships, and Wisconsin's Grade 1-3 SEL band asks children, with adult guidance, to read others' cues and respond with compassion. CASEL's relationship skills and WHO's interpersonal skills are the wider frame; inviting and listening are the app's age-7 form of them.","t":"Four weeks; goal check at least weekly; keep-it check 2-4 weeks after mastery.","rRefs":["casel-framework","who-life-skills-1997","unicef-transferable-skills"]},"lesson":{"minutes":10,"materials":["toys or puppets for role-play","this app"],"steps":[{"phase":"Warm-up","text":"Ask each other one question, listen, and tell back one thing you heard. Show listening with your body: turn toward, nod, ask. Eye contact is not required.","refs":[]},{"phase":"I do","text":"Model noticing and inviting: That girl is watching. I'll ask, Do you want to play with us? or Laro tayo! Then model taking a no: OK, maybe next time.","refs":["nsw-grr","rosenshine-2012"]},{"phase":"We do","text":"Role-play with toys: a new classmate from another province, a classmate who speaks another home language, a classmate who uses a wheelchair. She practises the invitation and one follow-up question.","refs":["nsw-grr","who-life-skills-1997"]},{"phase":"You do","text":"She watches How to Be a Good Friend and does the goal check, then invites a sibling, cousin or neighbour to join her game while you watch without prompting.","refs":["nsw-grr"]},{"phase":"Real life","text":"Log invitations you see, or that a teacher or play-date grown-up tells you about; write her own stories down as 'she told me'. At dinner, notice whether she turns toward the speaker and asks about what they said.","refs":["lfj-sjs","casel-sel-assessment-guide"]}],"support":"Practise one invitation sentence (Do you want to play with us?) and one question (What do you like to play?).","stretch":"Learn one new thing about a classmate and tell you about it, or include someone in a group game, not just one-to-one."},"assessment":{"method":"Two counts plus the goal check. Your log of invitations counts most; a teacher's or play-date grown-up's report counts as seen, and her own reports are noted but not counted. Listening is observed at home in a short talk. The goal check gives 10 friendship scenarios set in Philippine schools and is practice plus a knowledge check.","rubric":["No invitations seen or reported in two weeks; often talks over others or turns away while they speak.","Invites or asks a listening question only when prompted; 1 counted invitation, or listening seen on 1 day.","2 counted invitations, or 3 but listening seen on only 1 day; or the goal check is at 80-89% or reached 90% on only one day.","At least 3 counted invitations within 4 weeks (a no thanks taken calmly still counts), listening with a question on 2 different days, and at least 90% on the goal check on two different days."],"refs":["isela","casel-sel-assessment-guide","cpprg-scs-parent"]},"mastery":{"pct":90,"days":2,"text":"Mastered when all three are true: your log shows at least 3 invitations within 4 weeks, made without a prompt (seen by you or reported by a teacher or play-date grown-up; a no thanks taken calmly still counts), you saw her listen and ask a question about what someone said, without a reminder, on 2 different days, and she scores at least 90% (9 of 10) on the goal check on two different days. A keep-it check 2-4 weeks later, one goal check plus one invitation or listening moment, confirms it. The app can't see every part of this rule, so once the goal check and log are met it shows Secure with 'Waiting for your check'. When every part is met, record an observation and choose Mastered (put any card or role-play score in the note).","obs":true},"evidence":{"episodes":["good-friend"]},"checks":[{"q":"A classmate is sitting alone at recess with her head down. What could you do?","opts":[["Ask if she is OK, or wants to play.","🤝"],["Walk past and keep playing.","🚶"],["Ask loudly why she has no friends.","📢"]]},{"q":"A new classmate just moved from another province. What could you say?","opts":[["Hi! Do you want to play with us?","👋"],["Hi, and then walk away.","🚶"],["You can watch us play.","👀"]]},{"q":"A classmate speaks a different language at home. How can you include him?","opts":[["Invite him, and show the game with your hands.","🤝"],["Wait for him to ask first.","⏳"],["Only play with kids who talk like me.","🙅"]]},{"q":"A classmate uses a wheelchair. You are starting a game. What could you do?","opts":[["Invite her and pick a game everyone can play.","🤝"],["Don't ask, she can't play.","🙅"],["Push her chair without asking.","🦽"]]},{"q":"Another kid is standing nearby, watching your game. What could you do?","opts":[["Ask: Do you want to join us?","🙋"],["Tell her the game is full.","✋"],["Keep playing and don't look.","🙈"]]},{"q":"You invite someone, and they say, No thanks. What do you do?","opts":[["Say OK, maybe next time!","😊"],["Keep asking until they say yes.","🔁"],["Tell everyone they're mean.","😠"]]},{"q":"Your friend is telling you about her new puppy. Which shows you are listening?","opts":[["Turn toward her and ask the puppy's name.","👂"],["Look at her but think about my game.","💭"],["Start telling about my cat.","🐱"]]},{"q":"A friend likes bugs. What could you ask?","opts":[["What is your favorite bug?","🐞"],["Do you like dolls? I do.","🧸"],["Bugs are yucky.","😖"]]},{"q":"Your friend is talking, and you remember something exciting. What do you do?","opts":[["Wait until she finishes, then share.","⏳"],["Say it right away so I don't forget.","🗣️"],["Walk away to tell someone else.","🚶"]]},{"q":"A classmate fell and is crying and holding her knee. What should you do first?","opts":[["Tell a teacher right away.","🧑‍🏫"],["Invite her to play tag.","🏃"],["Wait to see if she stops crying.","⏳"]]},{"q":"Which is a kind thing to say after playing together?","opts":[["I'm glad you played with us!","😊"],["You weren't very good at it.","😒"],["Next time, play my way.","👉"]]}],"tools":[{"label":"Learning for Justice Social Justice Standards (free PDF): K-2 outcomes and school scenarios on identity, fairness and exclusion. They were written for US classrooms, and LFJ's terms do not allow adapting its text.","ref":"lfj-sjs"},{"label":"NSW Department of Education page on gradual release (I do, we do, you do), free to read: the routine this lesson follows","ref":"nsw-grr"},{"label":"Greater Good in Education (UC Berkeley): free kindness practices written for classrooms that a family can adapt (the site calls them research-based); pick ones tagged lower elementary","ref":"ggie-berkeley"},{"label":"Fast Track Project Social Competence Scale, parent version: 12 items posted on the project's website (no fee seen; reuse terms not confirmed; US research samples, no norms). Use it to compare her with her own earlier ratings, not to rank her.","ref":"cpprg-scs-parent"}],"standards":[{"ref":"lfj-sjs","code":"LFJ Social Justice Standards AC.K-2.16 (Action, anchor 16)","text":"'I care about those who are treated unfairly.' Anchor 16 asks students to express empathy when people are excluded or mistreated because of their identities. S3's general invitation to play fits only in part: it supports the caring, but LFJ is about exclusion based on identity."},{"ref":"wi-sel-competencies","code":"Wisconsin SEL Competencies, Grade 1-3 band: empathy (reading others' cues)","text":"With adult guidance, tell how others feel from what they say and from body cues, and respond with compassion. This wording comes from a school district's Grade 1 page that transcribes the competencies; the state text was not checked."},{"ref":"uk-dfe-rshe-guidance","code":"England Relationships Education (primary): Caring friendships","text":"By the end of primary: why friendships matter, how people choose and make friends, and the qualities of good friendships, such as kindness, trust, sharing interests and support. This is from a 2021 school copy; check it against the 2025 text."},{"ref":"unesco-gced-tlo-2015","code":"UNESCO GCED Topic B.4 Different levels of identity, ages 5-9 (pre-primary and lower primary)","text":"Recognise how you fit into the people and places around you (family, friends, school, community) and build intrapersonal and interpersonal skills. Its themes include belonging, relationships, and your own worth and the worth of others."},{"ref":"matatag-gmrc","code":"MATATAG GMRC Grade 1 (competency code not confirmed)","text":"A Grade 1 core subject that teaches respect and kindness toward family and others, framed in Filipino values. No specific inclusion competency was confirmed."}],"log":{"label":"Invitation: she invited someone on their own or watching to join her play, no prompt (seen by you, or reported by a teacher or play-date grown-up; her own reports don't count)","kidLabel":"I asked someone to play!","per":"time","target":3,"windowDays":28},"adultNotes":[{"title":"Invitations in any language","text":"Count invitations in Filipino or her home language (Laro tayo! Sali ka sa amin?) the same as English ones. Practise with scenarios she may meet: a new classmate from another province, one who speaks a different home language, one with a disability.","ref":""},{"title":"Quiet is OK too","text":"Someone sitting alone may want quiet time, or may be sad. Asking 'Are you OK? Do you want to play?' respects both, and a no thanks is fine. If someone seems hurt, she tells a teacher.","ref":""},{"title":"Seen or told","text":"Most of her play with other children happens at school. A teacher's or play-date grown-up's report counts as seen. When she tells you herself, praise it and note it as 'she told me', but don't count it toward the target.","ref":"casel-sel-assessment-guide"}],"statementRefs":["lfj-sjs","wi-sel-competencies","uk-dfe-rshe-guidance"]},{"id":"S4","domain":"respect","title":"Saying sorry","icon":"💛","ican":"I can say a real sorry and help fix it.","kidWhy":"A real sorry says what I did and helps make it right.","weeks":8,"statement":"Within eight weeks, [Name] will give a real apology after a real everyday slip, once she is calm, saying what she did and offering to help fix it with no more than one open prompt, in at least 2 real moments, and will answer someone else's real sorry calmly at least once, measured by a grown-up's log of real moments and by at least 90% on the goal check on two different days.","smart":{"s":"After a real slip, once calm, give a real apology that says what she did and offers to help fix it (the app's own coaching model; the next-time part is a bonus), and answer others' apologies calmly: thank you for saying sorry, or I need a little time.","m":"Real apologies with both parts, given with at most one open prompt (What could you do now?): at least 2. Calm answers to someone else's real sorry: at least 1. Both are counted over up to eight weeks because real moments can't be planned; coached role-plays are recorded as 'with support' and don't count. Plus at least 90% on the goal check on two different days.","a":"Coached in private after she is calm, never by staging a conflict. Grown-ups apologising to her for their own slips gives her real chances to answer a sorry.","r":"CASEL's relationship skills include resolving conflicts constructively, England's guidance teaches that friendships have ups and downs that can often be repaired, and DepEd's earlier Grade 1 English list (MELCs) included expressing apology. The three-part sorry is the app's own coaching model, not a published standard.","t":"Teach for four weeks and keep logging real moments up to week eight; goal check at least weekly; keep-it check 2-4 weeks after mastery.","rRefs":["casel-framework","who-life-skills-1997","uk-dfe-rshe-guidance"]},"lesson":{"minutes":10,"materials":["toys or blocks for role-play","this app"],"steps":[{"phase":"Warm-up","text":"Count the app's three parts of a real sorry on three fingers: say what I did, make it right, next time I'll... At her age the first two are the goal; the third is a bonus.","refs":[]},{"phase":"I do","text":"Model a real sorry to her for a small slip of your own: Sorry, anak, I raised my voice because I was tired. Let me listen now. Next time I'll take a breath first.","refs":["nsw-grr","aap-hc-self-esteem"]},{"phase":"We do","text":"Role-play with toys: one toy knocks over another's tower; practise saying what happened and offering a fix. Swap so she also practises answering: Thank you for saying sorry, or I need a little time.","refs":["nsw-grr","who-life-skills-1997"]},{"phase":"You do","text":"She watches Saying Sorry and Making It Right and does the goal check, then acts out a real sorry with toys while you watch without giving her the words.","refs":["nsw-grr"]},{"phase":"Real life","text":"When a real slip happens, wait until she is calm and coach in private with one open prompt: What could you do now? Log real apologies only; never set up a conflict to test her. Apologise to her when you slip, too.","refs":["deped-cpp-do40-2012"]}],"support":"Practise just 'I'm sorry I ___.' and offer two fix ideas to choose from.","stretch":"Add the next-time part (Next time I'll...), and talk about how the other person feels."},"assessment":{"method":"Your log of real moments counts most. A real apology counts when, once calm, she says what she did and offers to help fix it, with at most one open prompt; telling her the words, or a role-play, is recorded as 'with support'. Also note one time she answers someone else's sorry calmly. The goal check gives 10 apology scenarios and is practice plus a knowledge check.","rubric":["Refuses, blames someone else, or says only a quick 'sorry', even once calm.","Gives a real sorry only in role-play or when told the words; no real apology with both parts yet.","1 real apology with both parts, or real apologies that need more than one prompt; or the goal check is at 80-89% or reached 90% on only one day.","At least 2 real apologies (counted over up to eight weeks) that say what she did and offer to help fix it with at most one open prompt, at least 1 calm answer to someone else's sorry, and at least 90% on the goal check on two different days."],"refs":["isela","casel-sel-assessment-guide","cpprg-scs-parent"]},"mastery":{"pct":90,"days":2,"text":"Mastered when all three are true: your log shows at least 2 real apologies where, once calm, she said what she did and offered to help fix it with at most one open prompt; at least once she answered someone else's real sorry calmly; and she scores at least 90% (9 of 10) on the goal check on two different days. Real moments are counted for up to eight weeks, and role-plays don't count toward this. A keep-it check 2-4 weeks later, one goal check plus the next real moment, confirms it. The app can't see every part of this rule, so once the goal check and log are met it shows Secure with 'Waiting for your check'. When every part is met, record an observation and choose Mastered (put any card or role-play score in the note).","obs":true},"evidence":{"episodes":["saying-sorry","feelings-choices"]},"checks":[{"q":"You ripped your friend's picture by accident. What should you do?","opts":[["Say what I did and help fix it.","💛"],["Just say sorry fast and go.","🏃"],["Say it was an accident, so it's OK.","🤷"]]},{"q":"Which one is a real sorry?","opts":[["I'm sorry I knocked your tower. Can I help build it?","🧱"],["Sorry, but you put it in my way.","👉"],["Sorry, sorry, sorry!","😬"]]},{"q":"You spilled your brother's juice. How can you make it right?","opts":[["Help wipe it up and get him more.","🧻"],["Say the cup was slippery.","🥤"],["Hide the cup.","🙈"]]},{"q":"You bumped Lola's arm and her tea spilled. What can you say?","opts":[["Sorry po, Lola, I bumped you. Can I help clean?","🙏"],["Lola, you were in my way.","👉"],["Say oops, then run outside.","🏃"]]},{"q":"You called your friend a mean name when you were mad. Now you are calm. What is a real sorry?","opts":[["I'm sorry I called you that name. How can I make it better?","💛"],["You started it.","😠"],["Sorry, but you're still mean.","😒"]]},{"q":"When is a good time to say a real sorry?","opts":[["When I am calm enough to mean it.","😌"],["Only when a grown-up is watching.","👀"],["Never, if it was an accident.","🚫"]]},{"q":"What could you say for the next-time part of a sorry?","opts":[["Next time I'll hold it gently.","🤲"],["Next time, you should move.","👉"],["Next time, don't make me mad.","😠"]]},{"q":"Your friend says sorry to you. What can you say?","opts":[["Thank you for saying sorry.","🤝"],["Say it louder!","📢"],["I'll never play with you again!","😠"]]},{"q":"Someone says sorry, but you still feel sad. What can you do?","opts":[["Say thank you, and take time to feel better.","🌈"],["Pretend I'm fine right away.","🙂"],["Be mean back.","😠"]]},{"q":"A kid says sorry, then hits you again and again. What should you do?","opts":[["Move away and tell a grown-up I trust.","🗣️"],["Keep playing, because he said sorry.","🔁"],["Hit him back.","😠"]]},{"q":"A grown-up says sorry to you for being grumpy. What does that show?","opts":[["Anyone can make it right, even grown-ups.","🤝"],["Only kids need to say sorry.","🧒"],["Saying sorry means you are bad.","👎"]]}],"tools":[{"label":"NSW Department of Education page on gradual release (I do, we do, you do), free to read: the routine this lesson follows","ref":"nsw-grr"},{"label":"AAP HealthyChildren page on the building blocks of self-esteem (free): it lists accepting mistakes among 12 building blocks. Modelling your own sorry aloud is the app's idea built on it.","ref":"aap-hc-self-esteem"},{"label":"DepEd MATATAG GMRC and Values Education guide for Grades 1, 4 and 7 (free PDF, in Filipino, written for teachers): what Philippine Grade 1 classes teach about manners, respect and right conduct","ref":"matatag-gmrc"},{"label":"Fast Track Project Social Competence Scale, parent version: 12 items posted on the project's website (no fee seen; reuse terms not confirmed; US research samples, no norms). Use it to compare her with her own earlier ratings, not to rank her. Its emotional regulation items touch on calming down.","ref":"cpprg-scs-parent"}],"standards":[{"ref":"casel-framework","code":"CASEL: Relationship skills; Responsible decision-making","text":"Relationship skills include resolving conflicts constructively, and responsible decision-making includes anticipating and evaluating the consequences of your own actions. CASEL does not name apologising; the three-part sorry is the app's age-7 model of repair."},{"ref":"uk-dfe-rshe-guidance","code":"England Relationships Education (primary): Caring friendships","text":"By the end of primary, pupils know that most friendships have ups and downs, and that these can often be worked through so the friendship is repaired or even strengthened. This is the 2019 text as reproduced by schools; the pool also records how to handle disagreements. Check it against the 2025 text."},{"ref":"melc-english-g1","code":"DepEd Grade 1 English MELCs, Quarter 3: polite expressions (official code not confirmed)","text":"The polite-expressions competency includes expressing gratitude and apology. The wording comes from a TeacherPH repost, and MATATAG has replaced this list. It covers saying sorry, not the three-part repair."},{"ref":"who-life-skills-1997","code":"WHO core life skills: empathy and interpersonal relationship skills","text":"Empathy and interpersonal relationship skills are core life skills, which WHO says should be adapted to local cultures. The ten-skill list was recalled by the researcher; check it against the PDF."},{"ref":"matatag-gmrc","code":"MATATAG GMRC Grade 1 (competency code not confirmed)","text":"A Grade 1 core subject on right conduct toward family and others, written in Filipino with Filipino values. No specific apology competency was confirmed."}],"log":{"label":"Real apology: after a real slip, once calm, she said what she did and offered to help fix it (one open prompt like 'What could you do now?' is OK; role-plays don't count)","kidLabel":"I made it right!","per":"time","target":2,"windowDays":56},"adultNotes":[{"title":"The app's coaching model","text":"The three-part sorry (say what I did, make it right, next time I'll...) is this app's own coaching model, not a published standard. At age 7, saying what she did and helping fix it count for mastery; the next-time part is a bonus.","ref":""},{"title":"Accepting a sorry is not staying quiet","text":"She can say thank you for saying sorry and still take time to feel better. Accepting a sorry never means she must keep playing with someone who keeps hurting her, or stay quiet about it. She can always tell a grown-up she trusts (see Telling a trusted grown-up).","ref":""},{"title":"Sorry po, in private","text":"Sorry po and pasensya na po count as her sorry words; she still names what she did, in any language. Coach in private once she is calm instead of asking for a quick sorry in front of others, and apologise to her when you slip. DepEd's Child Protection Policy promotes positive, non-violent discipline (a school policy, used here as a guide).","ref":"deped-cpp-do40-2012"}],"statementRefs":["casel-framework","uk-dfe-rshe-guidance"]},{"id":"B1","domain":"safety","title":"My space, your space","icon":"🙌","ican":"I ask before hugs, and I stop when someone says stop.","kidWhy":"Your body belongs to you. Everyone gets to choose about hugs.","weeks":4,"statement":"Within four weeks, [Name] will respect other people's body choices in play, asking before a hug or tickle and stopping right away when someone says no or stop, with no reminder, in at least 3 observed play moments within 14 days (at least one where she asks first and one where she stops right away), measured by a grown-up's log and by getting every item right on the body-space check on two different days.","smart":{"s":"Respect others' body choices in play: ask before a hug or tickle, accept no (offering a wave or high five instead), and stop right away at stop. The check also covers her own rights: her body belongs to her, and greetings such as mano po, a wave or a high five are her choice.","m":"A play moment counts when touch comes up (a hug, tickling, chasing, wrestling) and, with no reminder, she asks first or stops right away at no or stop; a grown-up saying stop during a fun tickle game counts. Target: 3 moments within 14 days in the log, including at least one ask-first moment and one stop-right-away moment, plus every item right on the 10-item body-space check on two different days. Her own 'no' to unwanted touch is practised only in calm, grown-up-run what-if role-plays (see Telling a trusted grown-up), never tested with real unwanted touch.","a":"Taught calmly with everyday examples (hugs, tickles, high fives); fun tickle and chase games give safe chances to practise stopping, and hellos and goodbyes give natural chances to ask first.","r":"Everyone has the right to decide who touches their body (ITGSE ages 5-8 key idea). England's primary guidance teaches asking and giving permission and that each person's body belongs to them, and AAP advises never forcing or guilting children into hugs or kisses, even with grandparents, and offering another way, such as a high five.","t":"Four weeks; keep-it check 2-4 weeks after mastery, then revisit every few months.","rRefs":["aap-healthychildren-csa","walsh-cochrane-2015","gubbels-2021-meta","deped-cpp-do40-2012"]},"lesson":{"minutes":10,"materials":["a picture card of hello choices: mano po, a wave, a high five","this app"],"steps":[{"phase":"Warm-up","text":"Make a space bubble with arms stretched out. Play a quick hello game with pretend visitors: for Lola or Tito she chooses mano po or a wave; for a classmate, a wave or a high five.","refs":[]},{"phase":"I do","text":"Model asking: Can I have a hug? Accept No, thank you with a smile and offer a wave instead. Then, in a tickle game, stop right away when she says stop.","refs":["aap-healthychildren-csa","nsw-grr"]},{"phase":"We do","text":"Practise saying No, thank you and Stop in a strong voice, and practise listening when someone else says it: take turns being the one who says stop in a tickle or chase game.","refs":["nspcc-pants","nsw-grr","gubbels-2021-meta"]},{"phase":"You do","text":"She watches My Space, Your Space and does the goal check. Then, in a short tickle or chase game, you say stop once and watch whether she stops right away without a reminder.","refs":["nsw-grr"]},{"phase":"Real life","text":"Respect her no to hugs, kisses and tickles at home, and tell relatives before visits that she may choose mano po, a wave or a high five. Log play moments where she asks first or stops right away.","refs":["aap-healthychildren-csa"]}],"support":"Practise only asking first, using the hello-choices card as a reminder.","stretch":"Read faces and bodies: if someone pulls away or frowns, she stops or asks, even before they say stop."},"assessment":{"method":"Your log of real play moments counts most: a moment counts when she asks before a hug or tickle, or stops right away at no or stop, with no reminder; note which one it was, since the target needs at least one of each. The body-space check has 10 core safety items, and she needs every one right on two different days. Her own 'no' to unwanted touch is never tested with real touch; it is practised in calm what-if role-plays under Telling a trusted grown-up.","rubric":["Hugs or tickles without asking, or keeps going after no or stop, in most moments; misses several check items.","Asks first or stops only when reminded; 1 counted moment in 14 days; some core check items still wrong.","2 counted moments in 14 days, or 3 that are all asking or all stopping; or every check item right on only one day.","At least 3 counted moments within 14 days, including at least one where she asks before a hug or tickle and one where she stops right away at no or stop (no reminder), and every item right on the body-space check on two different days."],"refs":["wist-psq","ckaq-r","casel-sel-assessment-guide","fuller-fienup-2018"]},"mastery":{"pct":100,"days":2,"text":"Mastered when both are true: she gets every item right on the body-space check on two different days, and your log shows at least 3 counted play moments within 14 days, including at least one where she asked before a hug or tickle and one where she stopped right away at no or stop, with no reminder. A keep-it check 2-4 weeks later, the full check once more plus one observed play moment, confirms it; then revisit every few months. The app can't see every part of this rule, so once the goal check and log are met it shows Secure with 'Waiting for your check'. When every part is met, record an observation and choose Mastered (put any card or role-play score in the note).","obs":true},"evidence":{"episodes":["my-space"]},"checks":[{"q":"You want to hug a friend. What should you do first?","opts":[["Ask: Can I have a hug?","🙋"],["Hug fast, as a surprise.","🤗"],["Hug, then ask.","🔄"]]},{"q":"Your friend says no to a hug. What do you do?","opts":[["Say OK, and offer a wave or high five.","🙌"],["Ask again and again.","🔁"],["Hug a little bit anyway.","🤗"]]},{"q":"You are playing tickle tag, and your cousin says stop. What do you do?","opts":[["Stop right away.","✋"],["Stop after one more tickle.","😆"],["Keep going, he's laughing.","😂"]]},{"q":"A friend pulls away and frowns when you hug her. What should you do?","opts":[["Let go and give her space.","✋"],["Hug tighter so she feels loved.","🤗"],["Laugh, it's just a game.","😆"]]},{"q":"Who does your body belong to?","opts":[["Me!","⭐"],["Whoever loves me most.","❤️"],["Grown-ups, until I am big.","🧑"]]},{"q":"Tito asks for a kiss on the cheek, but you don't feel like it. What can you do?","opts":[["Say no thank you po, and wave or do mano po.","👋"],["Kiss him anyway so he isn't sad.","😘"],["Hide and say nothing.","🙈"]]},{"q":"You give Lola mano po instead of a hug. Is that OK?","opts":[["Yes, that is still respectful.","👍"],["No, I must always hug.","👎"],["Only if no one sees.","🙈"]]},{"q":"Is it OK to ask a grown-up to stop tickling you?","opts":[["Yes, stop means stop for everyone.","✋"],["No, grown-ups can keep going.","👎"],["Only if it hurts.","🤕"]]},{"q":"Someone keeps tickling after you say stop. What can you do?","opts":[["Move away and tell a grown-up I trust.","🗣️"],["Stay quiet so I don't spoil the game.","🤐"],["Laugh so they think it's OK.","😂"]]},{"q":"How can you say hello to a friend without a hug?","opts":[["Wave, high five or smile.","👋"],["You have to hug to say hello.","🤗"],["Don't say hello at all.","🙈"]]}],"tools":[{"label":"NSPCC Talk PANTS parents guide and free school lessons for ages 5-7 (free downloads; the Pantosaurus storybook is sold): simple body-safety rules, including that her body belongs to her and that no means no","ref":"nspcc-pants"},{"label":"AAP HealthyChildren parent page on body-safety talks; AAP's 2023 '10 tips' release adds offering a high five or wave instead of forced hugs or kisses","ref":"aap-healthychildren-csa"},{"label":"UN technical guidance (ITGSE; UNESCO with UNAIDS, UNFPA, UNICEF, UN Women and WHO; free PDF). Read only the ages 5-8 objectives in topic 4.2. It is for adults, and the 5-8 band has no sexual content.","ref":"unesco-itgse-2018"},{"label":"DepEd K to 12 Health curriculum guide (free PDF): check the Grade 1 Injury Prevention and Safety competencies, including good and bad touch","ref":"deped-health-cg"}],"standards":[{"ref":"unesco-itgse-2018","code":"ITGSE (2018) Key Concept 4 Violence and Staying Safe, Topic 4.2 Consent, privacy and bodily integrity, ages 5-8","text":"Key idea: everyone has the right to decide who can touch their body, where and in what way (confirmed through secondary sources). The pool's other ages 5-8 objectives here, such as explaining 'body rights' and saying no, moving away and telling a trusted adult, were recalled by the researcher and need checking against the PDF."},{"ref":"nses-2","code":"NSES by end of Grade 2: Consent and Healthy Relationships (indicator code not confirmed)","text":"Define bodily autonomy and personal boundaries, and show how to communicate your own boundaries and respect someone else's. This wording comes from a secondary alignment document, and the codes differ between sources; check the 2020 PDF."},{"ref":"uk-dfe-rshe-guidance","code":"England Relationships Education (primary): from the beginning of primary; Being safe","text":"From the beginning of primary, pupils are taught permission seeking and giving and the concept of personal privacy; personal space and boundaries are the forerunners of consent teaching at secondary. By the end of primary, they learn that each person's body belongs to them. This is the 2019 text as reproduced by schools; check it against the 2025 guidance."},{"ref":"deped-health-cg","code":"DepEd K to 12 Health Grade 1, Quarter 4 Injury Prevention and Safety (competency code not confirmed)","text":"A teacher-site MELC copy lists 'distinguishes between good and bad touch' (shown there as H1IS-IVi-10), and a 2014 news report quotes DepEd saying this starts in Grade 1. The pool entry records only the strand. MATATAG moves Grade 1 health into Makabansa, so check whether the competency carried over."}],"log":{"label":"Body-space moment: she asked before a hug or tickle, or stopped right away at no or stop, with no reminder (note which; a grown-up saying stop in a fun tickle game counts)","kidLabel":"I asked first or stopped!","per":"time","target":3,"windowDays":14},"adultNotes":[{"title":"Greetings are her choice","text":"Many Filipino families expect mano po or a beso (cheek kiss) with elders. Let her choose mano po, a wave or a high five, tell relatives before a visit, and call her choice respectful (magalang). Never scold or tease her for saying no to a hug or kiss. AAP's 2023 tips say not to force or guilt children into hugs or kisses, even with grandparents, and to offer another way, such as a high five or a thumbs up.","ref":"aap-healthychildren-csa"},{"title":"Safe ways to practise","text":"Use tickle, chase or pillow games where you or a sibling say stop. Never create real unwanted touch to test her. Her own 'no' is practised only in calm, grown-up-run what-if stories (see Telling a trusted grown-up).","ref":"wist-psq"},{"title":"A feelings rule plus a clear rule","text":"A touch that breaks the rules may not feel bad; it can feel confusing. So pair 'tell if a touch feels wrong or confusing' with clear rules: her body belongs to her, private parts are private, and there are no secrets about touching.","ref":"nspcc-pants"},{"title":"Call it body safety","text":"Present this to family and school as body safety. One UN guide on this topic is titled sexuality education, but its ages 5-8 band has no sexual content; keep that link for your own reading.","ref":"unesco-itgse-2018"}],"statementRefs":["unesco-itgse-2018","nses-2","aap-healthychildren-csa"]},{"id":"B2","domain":"safety","title":"Telling a trusted grown-up","icon":"🗣️","ican":"I can tell a trusted grown-up, and keep telling until someone helps.","kidWhy":"Trusted grown-ups listen and help you feel safe. It's never your fault.","weeks":4,"statement":"Within four weeks, [Name] will name at least three trusted grown-ups, including one at school, and say in her own words that she would move away and tell one of them about anything that makes her feel scared, hurt, unsafe or confused, or about any touching secret, and tell another if the first one doesn't help, measured by a helping-hand talk, three calm grown-up-run what-if role-plays, and every item right on the safety check on two different days.","smart":{"s":"Move away if she can, then tell a trusted grown-up, and keep telling until someone helps, about anything that makes her feel scared, hurt, unsafe or confused, or any touching secret. Trusted grown-ups are defined by how they act: they listen and help her feel safe. She names at least three, including one at school.","m":"Scored separately: (1) helping-hand talk: she names at least three trusted grown-ups, including one at school, and says how each one listens or helps her feel safe; (2) three calm what-if role-plays run by a grown-up: in all three she says in her own words that she would move away and tell, and tell another grown-up if the first doesn't help; (3) every item right on the 10-item safety check on two different days. No real-life log: real disclosures are never a target.","a":"A calm, matter-of-fact talk, repeated over time. What-ifs are pretend stories, never real tests, and she never has to confront anyone: moving away and telling is always enough.","r":"AAP advises teaching children to tell a parent or other trusted adult if anyone touches their private parts or makes them uncomfortable, with no secrets about touching. School-based body-safety programmes raised children's knowledge and protective skills (Walsh et al. 2015; Gubbels et al. 2021, with larger knowledge gains when self-blame was addressed); this home version borrows their parts but has not itself been tested. The UN Convention on the Rights of the Child protects children from abuse.","t":"Four weeks; keep-it check 2-4 weeks after mastery, then revisit every few months (in Walsh et al., knowledge gains had not faded significantly 1-6 months later).","rRefs":["unesco-itgse-2018","walsh-cochrane-2015","gubbels-2021-meta","uncrc-text"]},"lesson":{"minutes":10,"materials":["paper and crayons for a helping hand","toys for what-if stories","this app"],"steps":[{"phase":"Warm-up","text":"Trace her hand and draw a trusted grown-up on each finger: people who listen and help her feel safe. Include one at home, one at school (adviser, teacher or guidance counselor) and others she chooses, such as a lola, tita or yaya.","refs":["nspcc-pants"]},{"phase":"I do","text":"Say calmly: You can tell me anything. You won't be in trouble for telling, even about someone in our family; telling is not disrespect. If anyone breaks a body safety rule, it is never your fault. Surprises are happy and get told soon; secrets that make you worried get told. If a grown-up you know asks you to keep a touching secret, tell another trusted grown-up.","refs":["aap-healthychildren-csa","gubbels-2021-meta"]},{"phase":"We do","text":"Run three calm what-if stories with toys: a big kid takes a toy child's snack and says don't tell; a grown-up the toy child knows asks for a secret about touching; the first grown-up the toy child tells is too busy. Ask: What could she do? What would you do? She answers (say no or stop if she can, move away, tell, tell again). Note each answer; if one is unclear, say the safe answer together and praise her. Never use a real situation.","refs":["wist-psq","nsw-grr"]},{"phase":"You do","text":"She watches My Space, Your Space, My Brave Voice and Unkind Words Do Not Decide Me and does the safety check, then tells you in her own words who she would tell and what she would do if they didn't help.","refs":["nsw-grr"]},{"phase":"Real life","text":"At bath time, use correct names for all body parts, including the private parts (the parts a swimsuit covers, plus the mouth). Explain that a doctor, nurse or family member may sometimes need to help or check, and they should explain why and ask first. Put the helping hand on the fridge and revisit it every few months.","refs":["aap-healthychildren-csa","nspcc-pants","walsh-cochrane-2015"]}],"support":"Name two trusted grown-ups first, one at home and one at school, using the helping hand as a picture prompt.","stretch":"Practise the words to start: I need to tell you something important. Talk about who she could tell at a relative's house, on a trip or at an activity."},"assessment":{"method":"Three parts, scored separately. The helping-hand talk records the grown-ups she names and how each one helps her feel safe. Three calm what-if role-plays, run by you with toys, record whether she says she would move away, tell, and tell again (saying no or stop is a bonus when it feels safe). The 10-item safety check covers core facts and needs every item right on two different days. Never use the check or the role-plays to ask what has happened to her.","rubric":["Names 0-1 trusted grown-ups, or doesn't yet know to tell; misses several check items.","Names 2, or 3 with none at school, or picks them only by role (not by how they act); says she would tell only with prompts in the what-ifs; some core check items still wrong.","Names three including one at school and says why; tells in the what-ifs but forgets to tell again if the first grown-up doesn't help; or every check item right on only one day.","Names at least three trusted grown-ups, including one at school, and says how each helps her feel safe; in all 3 what-if role-plays says in her own words she would move away, tell, and tell another if the first doesn't help; every item right on the safety check on two different days."],"refs":["ckaq-r","wist-psq","fuller-fienup-2018"]},"mastery":{"pct":100,"days":2,"text":"Mastered when all three are true: she gets every item right on the safety check on two different days; in the helping-hand talk she names at least three trusted grown-ups, including one at school, and says how each one listens or helps her feel safe; and in all 3 calm what-if role-plays she says in her own words that she would move away, tell, and tell another grown-up if the first one doesn't help. There is no real-life log. A keep-it check 2-4 weeks later, the full check plus one what-if story, confirms it; then revisit the helping hand and the check every few months. The app can't see every part of this rule, so once the goal check and log are met it shows Secure with 'Waiting for your check'. When every part is met, record an observation and choose Mastered (put any card or role-play score in the note).","obs":true},"evidence":{"episodes":["my-space","brave-voice","words-dont-decide"]},"checks":[{"q":"What makes a grown-up a trusted grown-up?","opts":[["They listen and help me feel safe.","👂"],["They give me sweets and toys.","🍬"],["They are older than me.","🧓"]]},{"q":"Who could be a trusted grown-up at school?","opts":[["A teacher or counselor who listens to me.","🧑‍🏫"],["A big kid in Grade 6.","🧒"],["My best friend.","👧"]]},{"q":"Something makes you feel scared, hurt or confused, even once. What do you do?","opts":[["Tell a grown-up I trust.","🗣️"],["Wait to see if it happens again.","⏳"],["Keep it to myself.","🤐"]]},{"q":"You told a grown-up, but they were busy and didn't help. What now?","opts":[["Tell another trusted grown-up.","🗣️"],["Stop telling, I tried once.","🚫"],["Wait until I'm bigger.","⏳"]]},{"q":"A grown-up you know asks you to keep a secret about touching. What do you do?","opts":[["Don't keep it. Tell a grown-up I trust.","🗣️"],["Keep it, because I know them.","🤐"],["Keep it, if they give me a treat.","🍬"]]},{"q":"Which one is a happy surprise that is OK to keep for a little while?","opts":[["A birthday present for Mama.","🎁"],["A secret that makes me feel worried.","😟"],["A secret I must keep forever.","🔒"]]},{"q":"A secret makes you feel worried or yucky inside. What do you do?","opts":[["Tell a grown-up I trust.","🗣️"],["Keep it. A promise is a promise.","🤐"],["Only tell my teddy bear.","🧸"]]},{"q":"Someone breaks a body safety rule. Is it your fault?","opts":[["No, it is never my fault.","💛"],["Yes, if I didn't say no.","👎"],["Yes, if I kept it a secret.","🤐"]]},{"q":"Will you be in trouble for telling, even about someone in your family?","opts":[["No, telling is the right thing.","👍"],["Yes, it is disrespectful.","🙇"],["Yes, if they are older than me.","🧓"]]},{"q":"Someone does something that makes you feel unsafe. What can you do?","opts":[["Move away and tell a grown-up I trust.","🏃"],["Stay and wait for it to stop.","😶"],["Tell no one, so no one is upset.","🤐"]]}],"tools":[{"label":"NSPCC Talk PANTS parents guide (free) and free school lessons for ages 5-7: 'Talk about secrets that upset you' and 'Speak up, someone can help'","ref":"nspcc-pants"},{"label":"AAP HealthyChildren parent page: correct names for body parts, no secrets about touching, and promising to listen and believe","ref":"aap-healthychildren-csa"},{"label":"UNICEF's children's version of the Convention on the Rights of the Child (free): read the line on Article 19 aloud together; a Filipino version was not confirmed","ref":"unicef-crc-children"},{"label":"DepEd Child Protection Policy (DO 40, s. 2012; free): ask her school about its Child Protection Committee","ref":"deped-cpp-do40-2012"},{"label":"Stop It Now tip sheet (free PDF, all rights reserved): everyday actions parents can take to keep young children safe. Its helpline is for the US only.","ref":"stopitnow-dontwait"}],"standards":[{"ref":"unesco-itgse-2018","code":"ITGSE (2018) Key Concept 5 Skills for Health and Well-being, Topic 5.5 Finding help and support, ages 5-8","text":"Recognise that family, teachers and community members can help, and go to trusted adults when something is wrong, even if asked to keep it secret. The researcher recalled this and search did not confirm it; check the PDF. Topic 4.2's key idea on body rights is confirmed."},{"ref":"nses-2","code":"NSES by end of Grade 2: Interpersonal Violence (indicator code not confirmed)","text":"Identify trusted adults, including parents and caregivers, to talk to about uncomfortable or dangerous situations. This wording comes from a secondary alignment document; check the 2020 PDF."},{"ref":"uk-dfe-rshe-guidance","code":"England Relationships Education (primary): Being safe","text":"By the end of primary: ask for advice or help for themselves or others and keep trying until they are heard; know that it is not always right to keep secrets if they relate to being safe; and recognise and report feeling unsafe or bad about any adult. This is the 2019 wording, confirmed through school reproductions; the pool records only the topic area. Check it against the 2025 text."},{"ref":"deped-health-cg","code":"DepEd K to 12 Health Grade 1, Quarter 4 Injury Prevention and Safety (competency codes not confirmed)","text":"A teacher-site MELC copy lists identifying appropriate persons to ask for help and demonstrating ways to ask for help (shown there as H1IS-IVc-3 and H1IS-IVc-4). DepEd says 'appropriate persons', not 'trusted'. The pool entry records only the strand, and MATATAG moves Grade 1 health into Makabansa."}],"adultNotes":[{"title":"If she tells you something","text":"Stay calm and listen. Believe her and thank her for telling: You did the right thing, and it is not your fault. Don't question her at length or ask leading questions, and don't promise to keep it secret; say you will get help to keep her safe. Keep her away from the person while you get help. Afterwards, write down her words and the date. Contact her school's Child Protection Committee (DepEd DO 40, s. 2012), your barangay's Council for the Protection of Children, or your city or municipal social welfare and development office. The government's Makabata Helpline 1383 (Council for the Welfare of Children) takes reports of child abuse: https://cwc.gov.ph/?p=4841. If she is in danger now, call 911, the national emergency number (https://calabarzon.dilg.gov.ph/911-becomes-filipinos-lifeline-as-emergency-calls-top-5-2-million-in-early-2026/). Never use the goal check to ask what has happened to her.","ref":"deped-cpp-do40-2012"},{"title":"Telling is not disrespect","text":"Respect for elders (paggalang, po and opo) can make telling about an older relative, a yaya or a family friend feel disrespectful. Say plainly: telling a trusted grown-up is not disrespect, and she will never be in trouble for telling, even about family. With elders, a polite no (Ayoko po, or No thank you po) is still respectful, and moving away and telling is always enough. Include a school adult (adviser, teacher or guidance counselor) among her three.","ref":""},{"title":"Secrets and surprises","text":"Surprises are happy and get told soon, like a birthday present. Secrets that make her feel worried, scared or confused get told to a trusted grown-up. No one should ask her to keep a secret about touching; if a grown-up she knows does, she tells another trusted grown-up.","ref":"nspcc-pants"},{"title":"Bath-time names talk","text":"Use correct names for all body parts, including the private parts; AAP notes that made-up names can suggest those parts are bad or secret. Private parts are the parts a swimsuit covers, and AAP's 2023 tips add the mouth. NSPCC's PANTS guidance adds that a doctor, nurse or family member may sometimes need to help or check, but they should explain why and ask first. This talk stays out of the in-app check.","ref":"aap-healthychildren-csa"},{"title":"Not about strangers","text":"People a child knows can also break body-safety rules, and people who harm children often tell them not to tell. So define trusted grown-ups by how they act (they listen and help her feel safe), not by who they are, and keep the rule simple: no secrets about touching.","ref":"aap-healthychildren-csa"}],"statementRefs":["unesco-itgse-2018","nses-2","aap-healthychildren-csa","uk-dfe-rshe-guidance"]},{"id":"C1","domain":"clean","title":"Clean hands","icon":"🧼","ican":"I can wash my hands the right way at the right times.","kidWhy":"Soap and water wash germs away. Scrub for at least twenty seconds!","weeks":4,"statement":"Within four weeks, [Name] will wash her hands with all five steps (wet, soap, scrub for at least twenty seconds, rinse, dry) before eating and after using the toilet, measured by a grown-up's week-4 log (at least 5 of 7 days with a seen wash that scores 5 of 5 steps, lasts at least twenty seconds and needs no reminder) and at least 90% on the 10-item goal check on two different days.","smart":{"s":"Wash hands with the app's five steps, based on CDC's: wet with clean running water, soap, scrub for at least twenty seconds (palms, backs, between the fingers, under the nails), rinse, dry. Two key times are measured: before eating (meals, snacks or merienda) and after using the toilet. CDC's other key times (after eating, after touching animals or garbage, after coughing, sneezing or blowing her nose) are taught as extras and not scored.","m":"Week 4 only. For each key-time wash a grown-up sees, score steps done out of 5, whether scrubbing lasted at least twenty seconds, and whether a reminder was given. Log a day when at least one seen wash before eating or after the toilet was 5 of 5, at least twenty seconds, with no reminder; target at least 5 of 7 days. Also keep a tally of 5-of-5 washes out of key times seen, to show progress. Plus at least 90% on the 10-item goal check on two different days.","a":"Reminders are given in weeks 1-2, as CDC's family page advises at first, faded in week 3, and only week 4 is scored without them. A picture of the five steps by the sink and the app's twenty-second timer make it doable, and her school may already practise daily group handwashing under DepEd WinS.","r":"CDC guidance sets out handwashing with soap and clean running water at key times, including before eating and after using the toilet. In the Philippines, DepEd's WinS programme uses daily group handwashing with soap as a school routine (Fit for School session guide), and the UNICEF/GIZ Three Star Approach starts with a daily supervised group handwashing session with soap. The home habit mirrors that school routine.","t":"Four weeks: weeks 1-2 learn with reminders, week 3 fade reminders, week 4 is the scored week. The goal check can be taken from week 2. A keep-it check follows 2-4 weeks after mastery.","rRefs":["cdc-handwashing","deped-wins-do10-2016","unicef-giz-three-star-2013"]},"lesson":{"minutes":10,"materials":["soap","a clean towel","a picture of the five steps by the sink","a tabo or dipper and clean water if there is no tap","the app's twenty-second timer","this app"],"steps":[{"phase":"Warm-up","text":"Run the app's twenty-second timer while you both hum 'Happy Birthday' twice, CDC's timing tip, to feel how long at least twenty seconds is. If she prefers the alphabet song, time it once to check that it lasts the full twenty seconds.","refs":["cdc-handwashing"]},{"phase":"I do","text":"Wash your own hands slowly, saying each step: wet with clean running water, soap, scrub palms, backs, between the fingers and under the nails for at least twenty seconds, rinse, dry. With no tap, pour clean water from a tabo or dipper over your hands instead of dipping them into a basin, and stop pouring while you soap and scrub.","refs":["nsw-grr","rosenshine-2012","cdc-handwashing"]},{"phase":"We do","text":"Wash together side by side, following the five-step picture. She says each step as you both do it, and you both keep scrubbing until the timer ends.","refs":["nsw-grr","cdc-handwashing"]},{"phase":"You do","text":"She washes on her own while you watch and score: steps done out of 5, and whether she scrubbed at least twenty seconds. Give no hints until she is done. Then she watches Super Clean Hands and does the goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"Weeks 1-2: remind her before every meal, snack or merienda and after the toilet. Week 3: wait a moment, then point to the sink picture instead of speaking. Week 4: no reminders; log each day you see a 5-of-5 wash. If her school does WinS group handwashing, ask her teacher which steps and song they use so home and school match.","refs":["cdc-handwashing","deped-wins-do10-2016","unicef-giz-three-star-2013"]}],"support":"Stand beside her and say each step as she does it, and hold the timer where she can see it.","stretch":"She adds CDC's other key times (after eating, after touching pets or garbage, after coughing, sneezing or blowing her nose), or teaches the five steps to a younger cousin."},"assessment":{"method":"This is a criterion-referenced standard set by the app, not a normed or validated test; the Rutter review found no established, validated handwashing checklist for children. The five steps are the app's wording of CDC's steps (CDC puts wetting and soap in step 1, then lather, scrub, rinse and dry). For each key-time wash you see, score steps done out of 5, whether she scrubbed at least twenty seconds, and whether you reminded her. 'Scrub' counts only if she rubs her palms, the backs, between the fingers and under the nails. A reminder is any spoken or pointing prompt to wash after she comes to eat or leaves the toilet; calling her to eat and the picture by the sink do not count. Score only washes you actually see. The goal check gives 10 questions on when and how to wash. If two grown-ups score the same washes, compare them with Cohen's kappa, not just percent agreement.","rubric":["0-1 days in a week with a seen 5-of-5 wash of at least twenty seconds; most seen key-time washes score 0-2 of 5 steps, or she washes only when walked to the sink.","2-4 days in a week with a seen 5-of-5 wash of at least twenty seconds; other seen washes score 3-4 of 5 steps or stop before twenty seconds, and she often washes only after a reminder.","At least 5 of 7 days with a seen 5-of-5 wash of at least twenty seconds, but fewer than 5 of those days with no reminder; or the week-4 log is met but the goal check is not yet at 90% on two different days.","In week 4, at least 5 of 7 days with a seen wash before eating or after the toilet that scores 5 of 5 steps, lasts at least twenty seconds and needs no reminder, and at least 90% on the 10-item goal check on two different days."],"refs":["rutter-handwashing-review","cdc-handwashing","bond-1996-nrt-crt","fuller-fienup-2018"]},"mastery":{"pct":90,"days":2,"text":"Mastered when both are true: (1) she scores at least 90% (9 of 10) on the goal check on two different days, and (2) in week 4 a grown-up logs at least 5 of 7 days with a seen wash before eating or after the toilet that scored 5 of 5 steps, lasted at least twenty seconds and needed no reminder. A keep-it check 2-4 weeks after mastery (one goal check and a few seen washes) confirms it."},"evidence":{"episodes":["clean-hands"]},"checks":[{"q":"Which is a key time to wash your hands?","opts":[["right before I eat","🍎"],["right after I read a book","📖"],["right after a cartoon","📺"]]},{"q":"You just used the toilet. What do you do next?","opts":[["flush, then wash my hands","🧼"],["flush, then wipe hands on my shorts","🩳"],["wash only if my hands look dirty","👀"]]},{"q":"What is the first step of handwashing?","opts":[["wet my hands with clean water","💧"],["put soap on dry hands","🧼"],["dry my hands","🧻"]]},{"q":"You wet your hands and added soap. What comes next?","opts":[["scrub","🫧"],["rinse","💦"],["dry","🧻"]]},{"q":"How long should you scrub?","opts":[["at least twenty seconds","⏰"],["about five seconds","⚡"],["just until I see bubbles","🫧"]]},{"q":"Which song is long enough to time your scrub?","opts":[["Happy Birthday, two times","🎂"],["Happy Birthday, one time","🎵"],["counting to five","5️⃣"]]},{"q":"Which parts of your hands should you scrub?","opts":[["palms, backs, between fingers, nails","🖐️"],["just my palms","🤲"],["just my fingertips","☝️"]]},{"q":"There is no tap. How should you wet and rinse your hands?","opts":[["pour clean water from a tabo","💧"],["dip them in a shared basin","🪣"],["wipe them with a towel","🧻"]]},{"q":"What is the last step of handwashing?","opts":[["dry my hands","🧻"],["rinse my hands","💦"],["scrub my hands","🫧"]]},{"q":"It is snack time and your hands look clean. Should you wash?","opts":[["yes, germs are too tiny to see","🔍"],["no, they look clean","👀"],["only if I played outside","🌳"]]},{"q":"You just patted a dog. When should you wash your hands?","opts":[["right after I pat it","🐶"],["only if the dog licked me","👅"],["only at bath time","🛁"]]},{"q":"You touched the trash bin. What should you do?","opts":[["wash my hands with soap","🧼"],["rinse them with water only","💧"],["nothing, it was quick","⚡"]]}],"tools":[{"label":"CDC Health Promotion Materials: free printable handwashing posters and handouts to put by the sink (US government material; do not imply CDC endorsement)","ref":"cdc-handwashing"},{"label":"CDC 'About Hand Hygiene as a Family Activity' page: model the habit yourself, give frequent reminders at first, and make it fun with a song","ref":"cdc-handwashing"},{"label":"WHO 'How to Handwash?' poster: a reference for the adult on the rubbing motions; link to it, do not reproduce it (it was written for health workers)","ref":"who-hand-hygiene-2009"},{"label":"DepEd WinS 'Fit Hygiene Behaviour' session PDF: a free training guide for school staff that shows the daily group handwashing routine, so home and school can use the same steps","ref":"deped-wins-do10-2016"}],"standards":[{"ref":"deped-health-cg","code":"DepEd K to 12 Health Grade 1 (2016 guide, pre-MATATAG), Quarter 2 performance standard: practices good health habits and hygiene daily","text":"Grade 1 Personal Health includes a 'demonstrates proper handwashing' competency and learning why handwashing matters. The competency code appears only on a teacher-site MELC copy, so no code is quoted here. For Grades 1-2 this guide has been replaced by MATATAG."},{"ref":"matatag-cg-page","code":"MATATAG Makabansa Grade 1 (health and hygiene competency not confirmed)","text":"Under MATATAG (Grade 1 from SY 2024-2025, Grade 2 from SY 2025-2026), Grade 1 health sits in Makabansa, which merges Araling Panlipunan and MAPEH. No handwashing competency was confirmed there, so this entry shows where to check. It is not a confirmed match."},{"ref":"cdc-handwashing","code":"CDC Clean Hands, About Handwashing: five steps and key times","text":"Wet hands with clean running water and apply soap; lather the backs, between the fingers and under the nails; scrub for at least 20 seconds (CDC tip: hum 'Happy Birthday' twice); rinse; dry. Key times include after using the toilet (pool) and before and after eating food (seen through web search in a 2023 copy of CDC's 'When and How to Wash Your Hands' page)."},{"ref":"who-hand-hygiene-2009","code":"WHO Hand Hygiene: Why, How and When? brochure and How to Handwash? poster (2009)","text":"Wash with soap and water when hands look dirty and after using the toilet, using a fixed sequence of rubbing steps (about 11 steps; the whole wash takes about 40-60 seconds). It was written for health workers, and the app simplifies it to CDC's five steps."},{"ref":"nhes-2024","code":"NHES (2024) Standard 1, PreK-2 indicator 1.2.3","text":"Identify ways to prevent or reduce risks for illnesses and injuries (wording from search snippets of the SHAPE America and Red Cross pages). Handwashing at key times as one such way is our own mapping. This is a knowledge indicator, so it fits the goal check better than the observed habit."},{"ref":"deped-wins-do10-2016","code":"DepEd WinS (DO 10, s. 2016) and its Fit for School routine: daily group handwashing with soap","text":"Philippine schoo
