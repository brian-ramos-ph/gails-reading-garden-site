<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Reading Garden">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
</head>
<body>
<title>Gail's Reading Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one centered play column, like a picture book page; big tap targets, one task per screen. */
:root{
  --sky:#E4F2FB; --paper:#FFFFFF; --ink:#1E2A47; --soft:#5A6A8A; --line:#CFE1EE;
  --leaf:#2F9E5E; --leaf-d:#22784A; --sun:#FFC93C; --sun-d:#E0A400; --berry:#E2477A; --blue:#3B7FD6; --mist:#F3F9FD;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--read);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--soft)}
.small{font-size:.9rem}
.card{background:var(--paper);border-radius:22px;padding:20px;box-shadow:0 3px 0 var(--line)}
.btn{font-family:var(--display);font-weight:700;font-size:1.25rem;padding:14px 26px;border-radius:999px;background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leaf-d)}
.btn.big{font-size:1.6rem;padding:18px 34px}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.berry{background:var(--berry);box-shadow:0 5px 0 #A92D57}
.btn.sm{font-size:1rem;padding:9px 18px}
.link{font-family:var(--display);font-weight:700;color:var(--blue);text-decoration:underline;text-underline-offset:3px;padding:6px 2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stars{font-family:var(--display);font-weight:800;font-size:1.3rem;background:var(--paper);border-radius:999px;padding:4px 16px;box-shadow:0 3px 0 var(--line);display:inline-flex;gap:6px;align-items:center}
.stars .s{color:var(--sun-d)}
.hello{display:flex;align-items:center;gap:14px}
.bubble{background:var(--paper);border-radius:20px;padding:12px 18px;position:relative;font-size:1.15rem;box-shadow:0 3px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-10px;top:22px;border:10px solid transparent;border-right-color:var(--paper);border-left:0}
/* garden */
.garden{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;background:linear-gradient(to bottom,var(--mist),var(--mist) 78%,#BFE3C6 78%);border-radius:22px;padding:14px 10px 10px}
.flower{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.flower svg{width:100%;max-width:70px;height:auto}
.flower b{font-family:var(--display);font-size:.85rem;text-align:center;line-height:1.1}
.flower span{font-size:.72rem;color:var(--soft);text-align:center;line-height:1.1}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.tile{background:var(--paper);border-radius:22px;padding:18px 14px;text-align:left;box-shadow:0 4px 0 var(--line);display:flex;gap:12px;align-items:center;min-width:0}
.tile .ic{font-size:2.2rem;line-height:1}
.tile b{font-family:var(--display);font-size:1.2rem;display:block}
.tile small{color:var(--soft);font-size:.85rem;display:block;line-height:1.2}
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px 18px}
/* play */
.progress{display:flex;gap:6px;flex:1}
.progress i{flex:1;height:12px;border-radius:6px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line)}
.progress i.done{background:var(--sun)}
.progress i.now{background:var(--blue)}
.task{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.prompt{font-family:var(--display);font-size:1.35rem;font-weight:700}
.hear{display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:#fff;font-family:var(--display);font-weight:700;font-size:1.2rem;padding:12px 24px;border-radius:999px;box-shadow:0 5px 0 #285FA8}
.pic{font-size:5.5rem;line-height:1.1}
.bigword{font-size:3.6rem;font-weight:700;letter-spacing:.02em;background:var(--paper);border-radius:22px;padding:10px 34px;box-shadow:0 4px 0 var(--line)}
.passage{background:var(--paper);border-radius:22px;padding:20px 22px;font-size:1.65rem;line-height:1.7;text-align:left;box-shadow:0 4px 0 var(--line);max-width:100%}
.w{border-radius:8px;padding:0 2px;cursor:pointer}
.w:hover{background:var(--mist)}
.w.lit{background:var(--sun)}
.sent.lit{background:#FFF1C2;border-radius:8px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%}
.opts.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.opt{background:var(--paper);border-radius:22px;min-height:96px;padding:12px;font-size:2.3rem;font-weight:700;box-shadow:0 5px 0 var(--line);display:flex;align-items:center;justify-content:center;transition:transform .08s;min-width:0;overflow-wrap:anywhere}
.opt.txt{font-size:1.5rem;font-weight:700;line-height:1.25}
.opt.pic2{font-size:3.6rem}
.opt:active{transform:translateY(3px)}
.opt.right{background:#D9F4E2;box-shadow:0 5px 0 var(--leaf),inset 0 0 0 4px var(--leaf)}
.opt.wrong{background:#FDE3EB;box-shadow:0 5px 0 var(--berry);animation:shake .4s}
.opt.dim{opacity:.45}
.opts.locked .opt{opacity:.55;cursor:default}
.pause{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:28px 18px}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.cheer{font-family:var(--display);font-weight:800;font-size:1.6rem;min-height:2.2rem}
.cheer.good{color:var(--leaf-d)}
.cheer.try{color:var(--berry)}
.burst{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.burst span{position:absolute;font-size:2rem;animation:fly 1s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
.owl-bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
/* tiles for sounding out */
.chunks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;transition:gap .5s}
.chunks.blend{gap:0}
.chunk{font-size:3.4rem;font-weight:700;background:var(--paper);min-width:76px;padding:6px 14px;border-radius:18px;box-shadow:0 5px 0 var(--line)}
.chunk.vow{color:var(--berry)}
.chunk.quiet{color:#A9B6CC}
.chunk.lit{background:var(--sun)}
.chunks.blend .chunk{border-radius:0;box-shadow:0 5px 0 var(--sun-d);background:var(--sun)}
.chunks.blend .chunk:first-child{border-radius:18px 0 0 18px}
.chunks.blend .chunk:last-child{border-radius:0 18px 18px 0}
/* stickers */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px}
.slot{aspect-ratio:1;max-width:100%;background:var(--paper);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;box-shadow:0 3px 0 var(--line)}
.slot.empty{background:var(--mist);color:#B8C7DA;font-family:var(--display);font-size:1.6rem;box-shadow:none;border:3px dashed var(--line)}
/* forms */
input[type=text],input[type=number]{font:inherit;font-size:1.4rem;padding:12px 16px;border-radius:16px;border:3px solid var(--line);background:var(--paper);color:var(--ink);width:100%;max-width:340px}
.list{display:flex;flex-direction:column;gap:10px}
.kid{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:20px;padding:14px 18px;box-shadow:0 4px 0 var(--line);font-family:var(--display);font-size:1.4rem;font-weight:700;text-align:left;width:100%}
.av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;flex:none}
/* grown-up */
.gu{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
.gu h2,.gu h3{font-family:var(--display)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border-radius:16px;padding:12px 14px;box-shadow:0 3px 0 var(--line)}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--soft)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding:6px 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.bar{height:10px;border-radius:5px;background:var(--mist);box-shadow:inset 0 0 0 1px var(--line);min-width:80px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:5px}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--mist);color:var(--soft)}
.pill.up{background:#D9F4E2;color:var(--leaf-d)}
.pill.down{background:#FDE3EB;color:#A92D57}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#FDE3EB;color:#7A1F3D;border-radius:999px;padding:4px 12px;font-family:var(--read);font-size:1rem;font-weight:700}
.chip em{font-style:normal;font-weight:400;font-size:.8rem;opacity:.8}
.note{background:#FFF6D8;border-radius:16px;padding:12px 16px;font-size:.92rem}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:.95rem;z-index:30;max-width:calc(100% - 32px)}
.chart text{fill:var(--soft);font-size:11px;font-family:system-ui,sans-serif}
/* voice and speed */
button,.w{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.speedchip{font-family:var(--display);font-weight:700;font-size:1rem;background:var(--paper);border-radius:999px;padding:5px 14px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.sheetwrap{position:fixed;inset:0;background:rgba(20,28,50,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);border-radius:24px;padding:20px;max-width:560px;width:100%;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 40px rgba(20,28,50,.25)}
.slabel{font-family:var(--display);font-weight:700;margin:0 0 8px;display:block}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.spd{font-family:var(--display);font-weight:700;padding:8px 16px;border-radius:999px;background:var(--mist);box-shadow:inset 0 0 0 2px var(--line)}
.spd.on{background:var(--blue);color:#fff;box-shadow:none}
select{font:inherit;font-size:1rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%;min-width:0;flex:1}
/* cartoon club on home */
.toonclub{display:flex;flex-direction:column;gap:10px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.catcard{display:flex;align-items:center;gap:12px;background:var(--mist);border-radius:18px;padding:12px;text-align:left;box-shadow:0 3px 0 var(--line);min-width:0}
.catcard b{font-family:var(--display);font-size:1.05rem;display:block;line-height:1.15}
.catcard small{color:var(--soft);font-size:.82rem}
.cic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex:none}
.cattabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.cattab{white-space:nowrap;font-family:var(--display);font-weight:700;padding:8px 14px;border-radius:999px;background:var(--paper);box-shadow:0 3px 0 var(--line)}
.cattab.on{background:var(--ink);color:#fff;box-shadow:none}
.eplist{display:flex;flex-direction:column;gap:10px}
.epcard{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:20px;padding:12px 16px;box-shadow:0 4px 0 var(--line);text-align:left;width:100%}
.epic{font-size:2.1rem;width:58px;height:58px;border-radius:16px;background:var(--mist);display:flex;align-items:center;justify-content:center;flex:none}
.epbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.epbody b{font-family:var(--display);font-size:1.2rem;line-height:1.15}
.epbody small{color:var(--soft)}
.epbody small.new{color:var(--berry);font-weight:700}
.play{font-size:1.3rem;color:#fff;background:var(--leaf);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
/* cartoon player */
.toontop{flex-wrap:wrap}
.turns{display:flex;gap:6px;flex:1;justify-content:center;min-width:0}
.turn{font-family:var(--display);font-weight:700;font-size:.9rem;padding:5px 12px;border-radius:999px;background:var(--paper);opacity:.5;transition:opacity .25s,transform .25s,box-shadow .25s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.turn.on{opacity:1;box-shadow:0 0 0 3px var(--sun);transform:scale(1.06)}
.av.sm{width:22px;height:22px;font-size:.8rem}
.stagebox{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 4px 0 var(--line);background:#CFE6F5;width:100%;margin-inline:auto;max-width:max(280px, calc((100vh - 430px) * 16 / 9))}
@supports (height:100dvh){ .stagebox{max-width:max(280px, calc((100dvh - 430px) * 16 / 9))} }
.stage{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%}
.yt{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--sun);font-family:var(--display);font-weight:800;font-size:1.4rem;padding:6px 22px;border-radius:999px;box-shadow:0 4px 0 var(--sun-d);animation:popin .4s ease-out}
.cap{background:var(--paper);border-radius:18px;padding:12px 16px;min-height:3.6em;box-shadow:0 3px 0 var(--line);font-size:1.45rem;line-height:1.5;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.capwho{font-family:var(--display);font-weight:800;font-size:1rem;color:var(--c,var(--blue));white-space:nowrap}
.capwho.talking{display:inline-block;animation:bob .4s ease-in-out infinite}
.ctext{flex:1;min-width:0}
.w.say{background:#FFE58A}
.tpanel{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.tpanel:empty{display:none}
.toonopts .opt{flex-direction:column;gap:4px;min-height:92px}
.toonopts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.oe{font-size:2rem;line-height:1}
.opt:disabled{cursor:default}
.yourturn{display:flex;flex-direction:column;align-items:center;gap:14px}
.ytlabel{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--berry)}
.ytline{font-size:2.4rem;font-weight:700;background:var(--paper);border-radius:22px;padding:14px 26px;box-shadow:0 4px 0 var(--line);line-height:1.35;max-width:100%}
.btn:disabled{opacity:.5;cursor:default}
.tctl{justify-content:center}
.btn.glow{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--sun-d)}
.act{display:flex;flex-direction:column;align-items:center;gap:14px}
.acttext{font-family:var(--display);font-weight:700;font-size:1.3rem;max-width:34ch}
.breath{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center}
.bcircle{position:absolute;inset:55px;border-radius:50%;background:radial-gradient(circle,#FFE0EA,#F48FB1);transition:transform 4s ease-in-out}
.bcircle.in{transform:scale(1.9)}
.blabel{position:relative;font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.2}
.countstars{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cstar{font-size:2.4rem;background:var(--paper);border-radius:18px;width:70px;height:70px;box-shadow:0 4px 0 var(--line)}
.cstar.lit{background:var(--sun);box-shadow:0 4px 0 var(--sun-d)}
.mission{display:flex;gap:14px;align-items:center;background:#FFF3C9;border-radius:22px;padding:16px 20px;max-width:560px;text-align:left;box-shadow:0 4px 0 #EED37A}
.mission p{margin-top:4px}
.mic{font-size:3rem;line-height:1}
/* characters */
.ch{transition:transform .9s cubic-bezier(.4,.1,.3,1)}
.ch-in{transform-box:fill-box;transform-origin:50% 100%;animation:idle 3s ease-in-out infinite}
.ch.talking .ch-in{animation:talkbob .32s ease-in-out infinite}
.mo{display:none}
.mopen .mo{display:inline}
.mopen .mc{display:none}
/* entrance fades the outer group (opacity only, so it never fights the position transform or restarts after talking) */
.ch.enter{animation:fadein .45s ease-out}
/* one-shot moves: same specificity as the talking bob and declared after it, so they win while a character speaks */
.ch .ch-in.a-jump{animation:jump .6s ease-out}
.ch .ch-in.a-shake{animation:shakex .5s}
.ch .ch-in.a-droop{animation:droop 1.2s ease-in-out}
.ch .ch-in.a-wave{animation:wave 1s ease-in-out}
.ch .ch-in.a-spin{animation:spinx .8s ease-in-out}
.ch .ch-in.a-nod{animation:nod .8s}
.ch .ch-in.a-tremble{animation:tremble .12s linear 8}
.prop{transform-box:fill-box;transform-origin:center;animation:popin .4s ease-out}
@keyframes idle{50%{transform:scaleY(1.015)}}
@keyframes talkbob{50%{transform:translateY(-3px)}}
@keyframes jump{30%{transform:translateY(-40px)}60%{transform:translateY(0)}75%{transform:translateY(-10px)}}
@keyframes shakex{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes droop{40%,70%{transform:translateY(6px) scaleY(.94)}}
@keyframes wave{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes spinx{50%{transform:scaleX(-1)}}
@keyframes nod{30%{transform:rotate(4deg) translateY(3px)}60%{transform:rotate(-2deg)}}
@keyframes tremble{50%{transform:translateX(2px)}}
@keyframes popin{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* grown-up lessons */
details.talk{border-top:1px solid var(--line);padding:10px 0}
details.talk summary{cursor:pointer;font-weight:700}
details.talk ul{margin:6px 0 0;padding-left:20px}
.mrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.mrow .mic{font-size:1.8rem}
.mrow div{flex:1;min-width:0}
.catstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.catstats .stat b{font-size:1.3rem}
@media (max-width:560px){
  .turns{order:5;flex-basis:100%}
  .turn{font-size:.8rem}
  .cap{font-size:1.2rem}
  .ytline{font-size:1.8rem}
  .toonopts.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .catstats{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* Me vs Pip */
.vscard{display:flex;align-items:center;gap:14px;text-align:left;width:100%;background:linear-gradient(100deg,#FFF3C9,#E9F4FF);padding:14px 18px}
.vscard-pip svg{width:64px;height:auto;display:block}
.vscard-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.vscard-body b{font-family:var(--display);font-size:1.45rem;line-height:1.1}

}

async function initStore(){

// Field-level merge of goal data from another device's copy (r) into L: checks, observations and scores are combined;
// log days and taps keep the newer change; mastery and reopenings are reconciled by time; focus keeps the newer choice.
function mergeGoals(L, r){
  if(!r || r===L) return false;
  const before = JSON.stringify([L.goals, L.bench, L.focus]);
  const byT = (a, b, cap) => { const m = new Map(); [...(a||[]), ...(b||[])].forEach(x=>m.set(x.t, x)); return [...m.values()].sort((x,y)=>x.t-y.t).slice(-cap) };
  const byDay = (a, b) => { const m = new Map(); [...(a||[]), ...(b||[])].forEach(x=>{ const c = m.get(x.d); if(!c || (x.u||0) > (c.u||0)) m.set(x.d, x) }); return [...m.values()].sort((x,y)=>x.d<y.d?-1:1).slice(-90) };

    const a = L.goals[id] || {cp:[], obs:[]}, b = rg[id]; if(!b){ L.goals[id] = a; return }
    a.cp = byT(a.cp, b.cp, 30); a.obs = byT(a.obs, b.obs, 30); a.log = byDay(a.log, b.log); a.kidlog = byDay(a.kidlog, b.kidlog);
    a.starred = [...new Set([...(a.starred||[]), ...(b.starred||[])])].sort().slice(-60);
    const st = [a.start, b.start].filter(Boolean); if(st.length) a.start = Math.min(...st);
    const reopened = Math.max(a.reopenedAt||0, b.reopenedAt||0); if(reopened) a.reopenedAt = reopened;

    const ms = [[a.masteredAt, a.masteredBy], [b.masteredAt, b.masteredBy]].filter(x=>x[0] && x[0] > reopened && !voided.includes(x[0])).sort((x,y)=>x[0]-y[0]);
    if(ms.length){ a.masteredAt = ms[0][0]; a.masteredBy = ms[0][1] } else if(a.masteredAt && a.masteredAt <= reopened && b.masteredAt){ a.masteredAt = Math.max(a.masteredAt, b.masteredAt) }
    L.goals[id] = a;
  });
  const rb = r.bench || {}; L.bench = L.bench || {};
  Object.keys(rb).forEach(id=>{ L.bench[id] = byT(L.bench[id], rb[id], 20) });

}

function newKid(name){

/* ---------------- Learning engine ---------------- */
function nLevels(s){ return SKILLS[s].levels.length }
function itemWeight(key){
  const it = K.items[key]; if(!it || !it.s) return 1.5;
  const acc = it.c/it.s; return 0.6 + (1-acc)*3 + (it.l===0?2:0);
}
function weightedPick(keys, used){
  let pool = keys.filter(k=>!used.has(k)); if(!pool.length) pool = keys;
  const ws = pool.map(itemWeight); let r = Math.random()*sum(ws);
  for(let i=0;i<pool.length;i++){ r-=ws[i]; if(r<=0) return pool[i] } return pool[pool.length-1];
}
function buildItem(skill, level, used){
  used = used || new Set();
  if(skill==="letters"){
    let ans, opts;
    if(level===0){ const k = weightedPick(ABC.map(c=>"L0:"+c), used); ans = k.slice(3); opts = shuffle([ans, ...sample(ABC,3,[ans])]);
      return {skill,level,key:k,kind:"listen",say:`Find the letter ${ans}.`,prompt:"Tap the letter you hear",opts:opts.map(v=>({v,html:esc(v)})),ans,reveal:`This is the letter ${ans}.`} }
    if(level===1){ const low = ABC.map(c=>c.toLowerCase()); const k = weightedPick(low.map(c=>"L1:"+c), used); ans = k.slice(3); opts = shuffle([ans, ...sample(low,3,[ans])]);
      return {skill,level,key:k,kind:"listen",say:`Find the small letter ${ans.toUpperCase()}.`,prompt:"Tap the small letter you hear",opts:opts.map(v=>({v,html:esc(v)})),ans,reveal:`This is small ${ans.toUpperCase()}.`} }
    const all = LOOKALIKE.flatMap((g,gi)=>g.map(c=>"L2:"+gi+":"+c)); const k = weightedPick(all, used); const [,gi,c] = k.split(":"); ans=c; opts = shuffle(LOOKALIKE[+gi]);
    return {skill,level,key:k,kind:"listen",say:`Find the small letter ${ans.toUpperCase()}.`,prompt:"Careful! Tap the letter you hear",opts:opts.map(v=>({v,html:esc(v)})),ans,reveal:`This is small ${ans.toUpperCase()}.`};
  }
  if(skill==="sounds"){
    const P = level===0 ? FIRST.map(x=>[x[0],x[1],x[0][0]]) : [null,LAST,MID,TEAMS][level];
    const k = weightedPick(P.map(x=>"P"+level+":"+x[0]), used); const row = P.find(x=>"P"+level+":"+x[0]===k); const [w,emo,ans] = row;
    let opts;
    if(level===2) opts = ["a","e","i","o","u"];
    else if(level===3) opts = shuffle(["sh","ch","th","wh"]);
    else { const ex=[ans]; if(ans==="c"||ans==="k") ex.push("c","k"); if(ans==="x") ex.push("s"); opts = shuffle([ans, ...sample(CONS,3,ex)]) }
    const says = [`What is the first sound in ${w}?`,`What is the last sound in ${w}?`,`What sound is in the middle of ${w}?`,`Which letters make the first sound in ${w}?`][level];
    const prompts = ["First sound?","Last sound?","Middle sound?","First sound?"];
    return {skill,level,key:k,kind:"listen",say:says,pic:emo,prompt:prompts[level],opts:opts.map(v=>({v,html:esc(v)})),ans,five:level===2,reveal:`${w}. ${w} has the ${ans.length>1?ans.split("").join(" "):ans.toUpperCase()} sound.`};
  }
  if(skill==="sight"){
    const L = DOLCH[level]; const k = weightedPick(L.map(w=>"S:"+w), used); const ans = k.slice(2);
    const same = L.filter(w=>w!==ans && w[0].toLowerCase()===ans[0].toLowerCase());
    const d = shuffle(same).slice(0,1); const rest = sample(L,3-d.length,[ans,...d]);
    return {skill,level,key:k,kind:"listen",say:`Find the word, ${ans}.`,prompt:"Tap the word you hear",opts:shuffle([ans,...d,...rest]).map(v=>({v,html:esc(v),txt:true})),ans,reveal:`This word says ${ans}.`};
  }
  if(skill==="decode"){
    if(Math.random()<0.5){
      const P = DPICS[level]; const k = weightedPick(P.map(x=>"DP:"+x[0]), used); const row = P.find(x=>"DP:"+x[0]===k);
      const others = shuffle(P.filter(x=>x[0]!==row[0])).slice(0,3);
      return {skill,level,key:k,kind:"read",word:row[0],prompt:"Read the word. Tap its picture.",opts:shuffle([row,...others]).map(x=>({v:x[0],html:x[1],pic:true})),ans:row[0],reveal:`This word says ${row[0]}.`};
    }
    const sets = DSETS[level]; const all = [...new Set(sets.flat())]; const k = weightedPick(all.map(w=>"D:"+w), used); const ans = k.slice(2);
    const set = sets.find(s=>s.includes(ans));
    return {skill,level,key:k,kind:"listen",say:`Find the word, ${ans}.`,prompt:"Tap the word you hear",opts:shuffle(set).map(v=>({v,html:esc(v),txt:true})),ans,reveal:`This word says ${ans}.`};
  }
  // comprehension
  const L = COMP[level]; const k = weightedPick(L.map((x,i)=>"C"+level+":"+i), used); const it = L[+k.split(":")[1]];
  return {skill,level,key:k,kind:"comp",text:[it.t],q:it.q,prompt:it.q,opts:shuffle(it.o).map(v=>({v,html:esc(v),txt:true})),ans:it.o[0],reveal:`The answer is: ${it.o[0]}`};
}
function dayRec(){ const d=today(); K.days[d] = K.days[d] || {q:0,c:0,ms:0,g:0}; return K.days[d] }
function knownCount(skill, level){ return Object.values(K.items).filter(v=>v.sk===skill && v.lv===level && v.d && v.d.length>=2).length }
function record(item, correct, opt){
  opt = opt || {};
  if(opt.gc){ const d = dayRec(); d.q++; if(correct) d.c++; if(opt.fast) d.g = (d.g||0)+1; save(); return null }
  const it = K.items[item.key] || {s:0,c:0,l:1};
  it.s++; if(correct) it.c++; it.l = correct?1:0; it.t = Date.now(); it.sk = item.skill; it.lv = item.level;
  if(correct && !opt.fast){ const td = today(); it.d = it.d || []; if(!it.d.includes(td)){ it.d.push(td); if(it.d.length>2) it.d.shift() } }
  K.items[item.key] = it;
  const d = dayRec(); d.q++; if(correct) d.c++; if(opt.fast) d.g = (d.g||0)+1;
  const ds = Object.keys(K.days).sort(); while(ds.length>120){ delete K.days[ds.shift()] }
  if(correct && !opt.fast) K.stars++;
  let change = null;
  if(!opt.assess && !opt.review && !opt.fast){
    const w = K.win[item.skill] = K.win[item.skill] || []; w.push(correct?1:0); while(w.length>12) w.shift();
    change = checkLevel(item.skill);
  }
  save();
  return change;
}
function checkLevel(skill){
  const w = K.win[skill], lv = K.levels[skill], max = nLevels(skill)-1;
  let to = null, why = "";
  if(w.length>=8 && sum(w.slice(-8))>=7 && lv<max && knownCount(skill, lv)>=KNOWN_NEED){ to = lv+1; why = "7+ of last 8 right, 4+ items right on 2 days" }
  else if(w.length>=6 && sum(w.slice(-6))<=2 && lv>0){ to = lv-1; why = "4+ of last 6 missed" }
  if(to===null) return null;
  K.levels[skill] = to; K.win[skill] = [];
  K.log.unshift({t:Date.now(), skill, from:lv, to, why}); K.log = K.log.slice(0,40);
  return {skill, from:lv, to};
}
function recentAcc(skill){ const w = K.win[skill]||[]; return w.length ? sum(w)/w.length : null }
function skillWeight(s){
  const max = nLevels(s)-1, acc = recentAcc(s);
  if(K.levels[s]===max && acc!==null && acc>=0.9 && (K.win[s]||[]).length>=6) return 0.25;
  if(s==="letters" && K.levels.sight>=2 && K.levels.letters===max) return 0.25;
  return 1 + (acc===null ? 0.5 : (1-acc)*2) + (max-K.levels[s])*0.15;
}
function planAdventure(n){
  const ws = ORDER.map(skillWeight), plan = [];
  for(let i=0;i<n;i++){
    let r = Math.random()*sum(ws), s = ORDER[0];
    for(let j=0;j<ORDER.length;j++){ r-=ws[j]; if(r<=0){ s=ORDER[j]; break } }
    if(plan.length>=2 && plan[plan.length-1]===s && plan[plan.length-2]===s){ i--; continue }
    plan.push(s);
  }
  return plan;
}
function awardStickers(){
  const earned = Math.min(STICKERS.length, Math.floor(K.stars/STARS_PER_STICKER)), got = [];
  while(K.stickers.length < earned){ const left = STICKERS.filter(s=>!K.stickers.includes(s)); const s = pick(left); K.stickers.push(s); got.push(s) }
  return got;
}

/* ---------------- Rounds ---------------- */
let R = null; // active round
const START_LEVEL = {letters:1, sounds:1, sight:1, decode:1, comp:0};
function startAdventure(focus){
  inRound = true;
  R = {mode:"adventure", plan:focus ? goalAdventurePlan(focus) : planAdventure(10), i:0, stars:0, ups:[], used:new Set(), t0:Date.now()};
  nextQ();
}
function startAssess(){
  inRound = true;
  R = {mode:"assess", si:0, lvl:START_LEVEL[ORDER[0]], cur:{n:0,r:0}, probes:0, tried:{}, placed:{}, i:0, stars:0, ups:[], used:new Set(), t0:Date.now()};
  nextQ();
}
function startStoryQs(st){
  inRound = true;
  R = {mode:"story", story:st, i:0, stars:0, ups:[], used:new Set(), t0:Date.now(), plan:st.qs.map(()=>"comp")};
  nextQ();
}
function assessNext(){
  while(true){
    const sk = ORDER[R.si]; if(!sk) return null;
    if(R.cur.n===3 && R.cur.r===2 && !R.cur.ext) R.cur.ext = true; // borderline: ask 2 more before deciding
    if(R.cur.n < (R.cur.ext?5:3)) return buildItem(sk, R.lvl, R.used);
    const r = R.cur.r, res = R.cur.ext ? (r>=4?"pass":r===3?"mid":"low") : (r===3?"pass":"low");
    const t = R.tried[sk] = R.tried[sk] || {}; t[R.lvl] = res; R.probes++;
    const max = nLevels(sk)-1; let next = null;
    if(res==="pass" && R.lvl<max && t[R.lvl+1]===undefined) next = R.lvl+1;
    else if(res==="low" && R.lvl>0 && t[R.lvl-1]===undefined) next = R.lvl-1;
    if(next!==null && R.probes<3){ R.lvl = next; R.cur = {n:0,r:0}; continue }
    const lvls = Object.keys(t).map(Number), failed = lvls.filter(l=>t[l]!=="pass");
    R.placed[sk] = failed.length ? Math.min(...failed) : Math.min(max, Math.max(...lvls)+1);
    R.si++; R.probes = 0; R.cur = {n:0,r:0};
    if(ORDER[R.si]) R.lvl = START_LEVEL[ORDER[R.si]];
  }
}
function nextQ(){
  let item = null;
  if(R.mode==="assess") item = assessNext();
  else if(R.mode==="story"){ if(R.i < R.story.qs.length){ const q = R.story.qs[R.i]; item = {skill:"comp",level:R.story.level,key:"ST:"+R.story.id+":"+R.i,kind:"comp",q:q.q,prompt:q.q,opts:shuffle(q.o).map(v=>({v,html:esc(v),txt:true})),ans:q.o[0],reveal:`The answer is: ${q.o[0]}`} } }
  else if(R.i < R.plan.length){
    const s = R.plan[R.i], lv = K.levels[s], review = lv>0 && Math.random()<0.2;
    item = buildItem(s, review?lv-1:lv, R.used); item.review = review;
  }
  if(!item) return endRound();
  R.used.add(item.key); R.item = item; R.locked = false; R.open = false;
  renderQ();
  const unlock = () => { if(R && R.item===item && !R.open){ R.open = true; R.openAt = Date.now(); const o = document.querySelector(".opts"); if(o) o.classList.remove("locked") } };
  if(item.kind==="listen"){ R.minMs = 600; setTimeout(()=>say(item.say).then(()=>setTimeout(unlock,150)), 350) }
  else if(item.kind==="read"){ R.minMs = 900; setTimeout(unlock, 1500) }
  else { const wc = ((item.text||[]).join(" ")+" "+item.q).split(/\s+/).length; R.minMs = 1000; setTimeout(unlock, Math.min(6000, 1200+wc*120)) }
}
function proceed(){
  if(!R || screen!=="play") return;
  if(R.fastRun>=3){ R.fastRun = 0; showPause() } else nextQ();
}
function showPause(){
  app().innerHTML = `<div class="card pause">${owl(110)}<h2>Whoa, speedy!</h2><p class="bubble" style="margin-left:10px">Let's slow down. Listen to the whole word or read the whole sentence, then pick.</p><button class="btn big" data-act="resume" id="resumeBtn" disabled style="opacity:.5">I'm ready</button></div>`;
  say("Whoa, speedy! Let's slow down. Listen first, then pick.");
  setTimeout(()=>{ const b = document.querySelector("#resumeBtn"); if(b){ b.disabled = false; b.style.opacity = 1 } }, 3000);
}
function answer(v, el){
  if(!R || R.locked || !R.open) return;
  R.locked = true;
  const item = R.item, ok = v===item.ans, fast = Date.now()-R.openAt < R.minMs;
  R.answered = (R.answered||0)+1; if(fast) R.fastN = (R.fastN||0)+1;
  R.fastRun = fast ? (R.fastRun||0)+1 : 0;
  const opts = [...document.querySelectorAll(".opt")];
  if(R.mode==="assess"){
    R.cur.n++; if(ok && !fast) R.cur.r++; // very fast answers don't count toward placement
    record(item, ok, {assess:true, fast});
    if(!ok && !fast) K.stars++; // effort star during the warm-up
    el.classList.add("right"); if(!fast) R.stars++;
    $("#cheer").textContent = fast ? "Listen first, then tap!" : ok ? pick(CHEERS) : "Good try!"; $("#cheer").className = "cheer good";
    chime(true); R.i++;
    const r0 = R; setTimeout(()=>{ if(R===r0) proceed() }, 900); return;
  }
  const change = record(item, ok, {review:item.review, fast});
  if(change) R.ups.push(change);
  R.i++;
  if(ok){
    el.classList.add("right"); opts.forEach(o=>{ if(o!==el) o.classList.add("dim") });
    let msg = pick(CHEERS);
    if(fast){ R.careful = 0; msg = "Got it! Next time, listen all the way first." }
    else { R.stars++; R.careful = (R.careful||0)+1; if(R.careful%3===0){ K.stars++; R.stars++; save(); msg = "Careful reader bonus! +1 ★" } }
    $("#cheer").textContent = msg; $("#cheer").className = "cheer good";
    chime(true); if(!fast) burst();
    const r1 = R; setTimeout(()=>{ if(R===r1) proceed() }, fast?1500:1100);
  } else {
    R.careful = 0;
    el.classList.add("wrong");
    opts.forEach(o=>{ if(o.dataset.arg===item.ans) o.classList.add("right"); else if(o!==el) o.classList.add("dim") });
    $("#cheer").textContent = "Almost! Here's the right one."; $("#cheer").className = "cheer try";
    chime(false);
    const r2 = R; say(item.reveal).then(()=>setTimeout(()=>{ if(R===r2) proceed() }, 700));
  }
}
function endRound(){
  inRound = false;
  const d = dayRec(); d.ms += Date.now()-R.t0;
  let placedMsg = "";
  if(R.mode==="assess"){
    ORDER.forEach(s=>{ K.levels[s] = R.placed[s] ?? 0; K.win[s] = [] });
    K.assessed = true; K.start = {t:Date.now(), levels:clone(K.levels), tried:R.tried, fastPct: R.answered ? Math.round((R.fastN||0)/R.answered*100) : 0};
    K.start.guessy = K.start.fastPct >= 30;
    K.log.unshift({t:Date.now(), skill:"all", from:null, to:null, why:"Warm-up game finished"}); K.log = K.log.slice(0,40);
    placedMsg = "yes";
  }
  const got = awardStickers(); save();
  R.got = got; R.placedMsg = placedMsg;
  go("end");
}

function chunkWord(w){
  const out = []; let i = 0;
  const magic = /[aeiou][^aeiou]e$/.test(w) && w.length>=4;
  while(i<w.length){
    const t = TEAMSET.find(x=>w.startsWith(x,i));
    if(t){ out.push({c:t, vow:/^[aeiou]/.test(t)}); i+=t.length; continue }
    const c = w[i];
    if(magic && i===w.length-1){ out.push({c, quiet:true}); i++; continue }
    out.push({c, vow:"aeiou".includes(c), long: magic && i===w.length-3}); i++;
  }
  return out;
}

    <p class="muted small" style="margin-top:10px">How levels change: she moves up after 7 or more right out of her last 8 careful answers, plus at least ${KNOWN_NEED} items answered right on 2 different days, so a lucky streak can't move her up. 4 or more missed out of the last 6 moves down a level so she can rebuild confidence. Answer buttons stay locked until the word has been heard or the text has had time to be read. Very fast answers count as likely guesses and don't change her levels or earn stars. Sight-word levels follow the Dolch word lists.</p></div>
    <div class="card"><h3>Daily accuracy, last 14 days</h3><p class="muted small">Bar height is percent correct; the number above is how many questions. Green 80%+, yellow 60–79%, pink under 60%.</p>
      <div class="scroll chart"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Daily accuracy chart">${grid}${bars}</svg></div></div>
    <div class="card"><h3>Tricky words</h3><p class="muted small">Words she has missed more than 30% of the time. The games show these more often.</p>
      ${tricky.length?`<div class="chips" style="margin-top:8px">${tricky.map(([k,v])=>`<span class="chip">${esc(k.split(":").pop())} <em>${v.c}/${v.s}</em></span>`).join("")}</div>`:'<p class="muted" style="margin-top:8px">None yet. Words show up here after she has seen them at least twice.</p>'}</div>
    ${goalsDashCard()}
    ${lessonsCard()}
    ${vsDashCard()}
    ${questDashCard()}
    <div class="card"><h3>Recent changes</h3>${K.log.length?`<table class="tbl"><tbody>${K.log.slice(0,8).map(l=>`<tr><td class="muted">${fmt(l.t)}</td><td>${l.skill==="all"?esc(l.why):`${SKILLS[l.skill].name}: ${SKILLS[l.skill].levels[l.from]} → <b>${SKILLS[l.skill].levels[l.to]}</b> <span class="pill ${l.to>l.from?"up":"down"}">${l.to>l.from?"up":"down"}</span> <span class="muted small">${esc(l.why)}</span>`}</td></tr>`).join("")}</tbody></table>`:'<p class="muted">Nothing yet.</p>'}</div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>Tools</h3>
      <div class="row"><button class="btn" data-act="go" data-arg="check">Start read-aloud check</button><span class="muted small">You listen while she reads 12 words aloud, and you mark each one.</span></div>
      <div class="row"><button class="btn ghost" data-act="reassess">Retake warm-up game</button><span class="muted small">Re-runs the starting check and resets her levels.</span></div>
      <div class="row"><button class="btn" data-act="saveBackup">Save a backup</button><button class="btn ghost" data-act="loadBackup">Load a backup</button><span class="muted small">${Store.mode==="local"?"Progress is saved on this device only. Save a backup every week or so, so a full or reset device can't lose it. ":""}${backupLine()}</span></div>
      <div class="row" id="delrow"><button class="btn ghost" data-act="askDel">Remove this reader</button></div>
    </div></div>`;
}

/* ---------------- Cartoon Club: content ---------------- */
const EPISODES = /*EPISODES-START*/[{"id":"letter-hunt","cat":"reading","title":"Juno's Letter Sound Hunt","ic":"🔍","summary":"Juno follows her map and the child helps by hearing the first sound of each word and picking its letter.","grownup":{"goal":"Practices hearing the first sound in a spoken word and matching it to a letter, plus a middle-sound and a last-sound challenge and reading a whole short word. Hearing sounds in words is the base for sounding out and spelling.","talk":["What other words start with the same sound as sun?","What sound does your name start with?","Can you hear the last sound in the word cat?"],"tip":"Play I Spy with sounds this week: say, I spy something that starts with the sound of b, and take turns guessing."},"steps":[{"t":"scene","bg":"garden","cast":[{"who":"juno","pos":"center","mood":"happy"}],"props":[{"p":"🌻","x":14,"y":70},{"p":"🔍","x":84,"y":82}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Juno is going on a letter sound hunt today. Will you help her?"},{"t":"say","who":"juno","text":"Hi! My map says to find things by their very first sound. Can you be my sound helper?","mood":"happy","anim":"wave"},{"t":"ask","who":"juno","text":"I see the sun! Sun. Which letter makes the first sound in sun?","opts":[{"text":"s"},{"text":"m"},{"text":"t"}],"ans":0,"right":"Yes! Sun starts with s, like snake and sock. Thank you, helper!","wrong":"Good try! Listen again. Sun. Your mouth makes a quiet hiss, like a snake."},{"t":"say","who":"juno","text":"One letter found! My map says the next one is near the flowers.","mood":"happy","anim":"jump"},{"t":"say","who":"pip","text":"Juno, look down by the flowers. Something is buzzing there. We can look, but we do not touch."},{"t":"ask","who":"juno","text":"A bee! Bee. Which letter makes the first sound in bee?","opts":[{"text":"b"},{"text":"d"},{"text":"p"}],"ans":0,"right":"That's it! Bee starts with b. Your lips pop together to say it.","wrong":"Close! Say bee. Your lips pop and your voice buzzes, like a bee. Try again."},{"t":"yourturn","text":"I see a bee.","reply":"Great reading! You read the word bee."},{"t":"say","who":"juno","text":"Let's go to the park. My map shows a kite there!","mood":"happy"},{"t":"scene","bg":"park","cast":[{"who":"juno","pos":"left","mood":"happy"},{"who":"pip","pos":"right","mood":"happy"}],"props":[{"p":"🪁","x":50,"y":22},{"p":"⚽","x":44,"y":86}]},{"t":"say","who":"pip","text":"Welcome to the park! I flew here to watch the hunt.","anim":"wave"},{"t":"ask","who":"juno","text":"Look up! A kite. Kite. Which letter makes the first sound in kite?","opts":[{"text":"k"},{"text":"g"},{"text":"h"}],"ans":0,"right":"Yes! Kite starts with k. That sound comes from the back of your mouth.","wrong":"Nice try! Kite starts at the back of your mouth with a quiet puff, not a hum. Try again."},{"t":"say","who":"juno","text":"My map says to find something round that you can kick.","mood":"thinking"},{"t":"ask","who":"pip","text":"Can you find it? Tap the thing that starts with the same sound as bee.","opts":[{"text":"ball","emoji":"⚽"},{"text":"kite","emoji":"🪁"},{"text":"sun","emoji":"☀️"}],"ans":0,"right":"Ball! Ball and bee both start with b. You remembered!","wrong":"Hmm, that one starts with a different sound. Listen. Bee, ball. Try again."},{"t":"say","who":"juno","text":"Now a tricky one. My map wants the last sound, not the first!","mood":"surprised"},{"t":"say","who":"pip","text":"The last sound is at the very end of the word. Listen all the way to the end."},{"t":"ask","who":"juno","text":"Map. Listen to the end. Which letter makes the last sound in map?","opts":[{"text":"p"},{"text":"m"},{"text":"t"}],"ans":0,"right":"Wow! Map ends with p. You listened all the way to the end!","wrong":"Good try! Say map slowly. At the very end, your lips pop with a little puff. Try again."},{"t":"ask","who":"juno","text":"Map again! Now listen to the middle. Which letter makes the middle sound in map?","opts":[{"text":"a"},{"text":"i"},{"text":"o"}],"ans":0,"right":"Yes! Map has the same middle sound as cat and hat. You listened to the middle!","wrong":"Good try! Map has the same middle sound as cat. Say map, then say cat. Try again."},{"t":"act","kind":"count","n":6,"text":"We found six sounds today. Count them with Juno. Tap each star!"},{"t":"yourturn","text":"Juno can see a kite and a bee.","reply":"Wonderful reading, sound helper!"},{"t":"say","who":"juno","text":"We did it! I found every sound on my map. Thank you so much!","mood":"proud","anim":"jump"},{"t":"ask","who":"juno","text":"My map has one last word. Can you find the word map? Look at every letter!","opts":[{"text":"map"},{"text":"mop"},{"text":"cap"}],"ans":0,"right":"Yes! You looked at every letter, just like a real reader!","wrong":"Good try! Map starts with m and has the letter a in the middle. Look at each letter."},{"t":"say","who":"pip","text":"Great hunting! Today you heard first, middle and last sounds, and read a whole word. That helps you read and spell new words."},{"t":"mission","ic":"🔍","text":"Find three things at home that start with the same sound as your name. Tell a grown-up what you found!"},{"t":"say","who":"juno","text":"Bye, sound helper! See you on the next hunt!","mood":"happy","anim":"wave"}]},{"id":"rhyme-picnic","cat":"reading","title":"Benny's Rhyme Picnic","ic":"🧺","summary":"At a park picnic, Benny mixes up rhymes and the child helps him hear words that sound the same at the end.","grownup":{"goal":"Practices hearing rhymes, words that end with the same sounds. Rhyming helps children notice word families like cat, hat and bat, which makes reading new words easier.","talk":["What words rhyme with cat?","Can you make up a silly rhyme about your dinner?","Why was Benny's bee and banana not a rhyme?"],"tip":"Read a rhyming picture book together and pause before the rhyming word so she can guess it."},"steps":[{"t":"scene","bg":"park","cast":[{"who":"benny","pos":"left","mood":"happy"},{"who":"kiko","pos":"right","mood":"happy"}],"props":[{"p":"🧺","x":50,"y":84},{"p":"🍎","x":43,"y":87},{"p":"🍪","x":57,"y":87}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! It's picnic day! Benny and Kiko are playing a rhyming game. Rhyming words sound the same at the end."},{"t":"say","who":"pip","text":"Cat and hat rhyme. Cat, hat. They both end with at."},{"t":"say","who":"benny","text":"I love rhymes! Bug and rug! Bee and banana!","mood":"happy","anim":"jump"},{"t":"say","who":"kiko","text":"Hmm, Benny. Bee and banana do not sound the same at the end.","mood":"thinking"},{"t":"ask","who":"kiko","text":"Can you help Benny? Which word rhymes with bee?","opts":[{"text":"tree","emoji":"🌳"},{"text":"ball","emoji":"⚽"},{"text":"cup","emoji":"🥤"}],"ans":0,"right":"Yes! Bee and tree rhyme. They end with the same sound.","wrong":"Hmm, say bee. Now say each word. Which one ends like bee? Try again."},{"t":"say","who":"benny","text":"Bee, tree! I hear it now. My bunny ears are getting better!","mood":"proud"},{"t":"say","who":"benny","text":"Here's another one. Sock and sandwich!","mood":"happy","anim":"spin"},{"t":"ask","who":"kiko","text":"Sock and sandwich start the same. But rhymes match at the end. Which word rhymes with sock?","opts":[{"text":"rock","emoji":"🪨"},{"text":"shoe","emoji":"👟"},{"text":"sun","emoji":"☀️"}],"ans":0,"right":"Sock and rock! They end the same way. You listened all the way to the end!","wrong":"Listen to the end of sock. Which word ends just like sock? Try again."},{"t":"say","who":"pip","text":"Rhymes are fun to hear, and fun to read too. Let's read one!"},{"t":"yourturn","text":"The cat has a hat.","reply":"Great reading! Cat and hat rhyme."},{"t":"say","who":"kiko","text":"My turn to make a rhyme. Cake and lake!","mood":"happy"},{"t":"ask","who":"benny","text":"Did Kiko make a rhyme? Do cake and lake rhyme?","opts":[{"text":"yes","emoji":"👍"},{"text":"no","emoji":"👎"}],"ans":0,"right":"Yes! Cake and lake rhyme, just like bake. Good listening!","wrong":"Say them slowly. Cake. Lake. They end the same way, so they do rhyme!"},{"t":"say","who":"benny","text":"Let's do a rhyme dance!","mood":"happy","anim":"jump"},{"t":"act","kind":"move","secs":10,"text":"Stand up and hop like Benny while you say: hop, top, mop, pop!"},{"t":"say","who":"kiko","text":"That was fun! Now I'm hungry. Let's eat our picnic.","mood":"happy"},{"t":"ask","who":"pip","text":"Benny brought a bun. Which word rhymes with bun?","opts":[{"text":"sun","emoji":"☀️"},{"text":"apple","emoji":"🍎"},{"text":"cup","emoji":"🥤"}],"ans":0,"right":"Bun and sun! They end the same way. What a sunny rhyme!","wrong":"Listen. Bun. Which word ends just like bun? Try again."},{"t":"yourturn","text":"A bug on a rug.","reply":"You read a rhyme! Bug and rug sound alike at the end."},{"t":"say","who":"benny","text":"I learned that rhymes sound the same at the end, not at the start!","mood":"proud"},{"t":"ask","who":"kiko","text":"What rhyme should we make next time?","opts":[{"text":"dog and log","emoji":"🐶"},{"text":"pig and wig","emoji":"🐷"},{"text":"star and car","emoji":"⭐"}],"ans":-1,"right":"Great pick! You can make up rhymes anytime, anywhere."},{"t":"say","who":"pip","text":"You were a super rhyme helper! Today you heard rhymes like bee and tree, and cat and hat. Rhymes help you read new words."},{"t":"mission","ic":"🎵","text":"At dinner tonight, make up a silly rhyme with a grown-up. Try a word like cat, sun, or bed."},{"t":"say","who":"benny","text":"Bye! Try, fly, my! Ha ha!","mood":"happy","anim":"wave"}]},{"id":"sight-word-map","cat":"reading","title":"Kiko's Sight Word Treasure","ic":"🗺️","summary":"Kiko and Wren follow a treasure map by reading sight words, and the treasure turns out to be a book.","grownup":{"goal":"Practices recognizing common sight words such as look, said, come, where and they. These words show up often in books for young readers, so knowing them by sight makes reading smoother.","talk":["Which clue word was the trickiest?","Can you find the word said in one of your books?","Why do you think the treasure was a book?"],"tip":"Write five sight words on sticky notes around the house and go on your own word treasure hunt."},"steps":[{"t":"scene","bg":"town","cast":[{"who":"kiko","pos":"left","mood":"happy"},{"who":"wren","pos":"right","mood":"calm"}],"props":[{"p":"🗺️","x":50,"y":82}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Ms. Rosa and Mr. Bruno made a treasure map for Kiko and Wren. Will you help them read it?"},{"t":"say","who":"kiko","text":"A treasure map! I want to find the treasure right now!","mood":"happy","anim":"jump"},{"t":"say","who":"wren","text":"The map has clues. We need to read the words to follow them.","mood":"calm"},{"t":"say","who":"pip","text":"These are sight words. We see them a lot. We sound out what we can, and learn the tricky part by heart."},{"t":"ask","who":"kiko","text":"The first clue word is look. Can you find the word look?","opts":[{"text":"look"},{"text":"like"},{"text":"book"}],"ans":0,"right":"Yes! That says look. The map says to look by the shop!","wrong":"Close! Look starts with l, and has two round letters, like two eyes. Try again."},{"t":"say","who":"wren","text":"Look by the shop. I see something by the door.","mood":"thinking"},{"t":"prop","add":[{"p":"✉️","x":30,"y":82}]},{"t":"say","who":"kiko","text":"A note! It has more clue words.","mood":"surprised"},{"t":"ask","who":"wren","text":"This word is said. Can you find the word said?","opts":[{"text":"said"},{"text":"sad"},{"text":"sat"}],"ans":0,"right":"Great job! Said is tricky. It rhymes with red, but it looks different.","wrong":"So close! Said has four letters. Sad and sat have only three. Try again."},{"t":"yourturn","text":"Look here, said Kiko.","reply":"Wonderful! You read two sight words, look and said."},{"t":"say","who":"wren","text":"The note says, come to the garden. They hid the treasure there.","mood":"happy"},{"t":"ask","who":"kiko","text":"Help me find the word come. Which one says come?","opts":[{"text":"come"},{"text":"came"},{"text":"some"}],"ans":0,"right":"Yes! Come. Let's come to the garden!","wrong":"Almost! Look at the letter after the c. Come has an o. Try again."},{"t":"scene","bg":"garden","cast":[{"who":"kiko","pos":"left","mood":"thinking"},{"who":"wren","pos":"center","mood":"calm"}],"props":[{"p":"🌻","x":92,"y":70},{"p":"📦","x":80,"y":85}]},{"t":"say","who":"kiko","text":"Where is the treasure? I can't see it anywhere!","mood":"thinking"},{"t":"ask","who":"wren","text":"The next word is where. Can you find where?","opts":[{"text":"where"},{"text":"were"},{"text":"when"}],"ans":0,"right":"You found it! Where. Where is the treasure? Let's look by the box.","wrong":"Good try! Where has an h right after the w. Look for w, h. Try again."},{"t":"say","who":"wren","text":"The box is here. And look, there is one more word on top.","mood":"happy"},{"t":"ask","who":"kiko","text":"This word is they. Which one says they?","opts":[{"text":"they"},{"text":"the"},{"text":"then"}],"ans":0,"right":"Yes! They. They hid it for us!","wrong":"Close! They has a y at the end. Try again."},{"t":"say","who":"kiko","text":"Let's open it! What is the treasure?","mood":"surprised","anim":"jump"},{"t":"prop","add":[{"p":"📕","x":80,"y":82}],"remove":["📦"]},{"t":"say","who":"wren","text":"A book! The treasure was a book full of words.","mood":"happy"},{"t":"say","who":"kiko","text":"Books are the best treasure. Now we can read all the words.","mood":"proud"},{"t":"yourturn","text":"Where was the book?","reply":"Super reading! Where and was are sight words too."},{"t":"act","kind":"count","n":5,"text":"We found five clue words. Tap a star for each one!"},{"t":"ask","who":"pip","text":"Which clue word was the hardest for you?","opts":[{"text":"said"},{"text":"where"},{"text":"come"},{"text":"they"}],"ans":-1,"right":"Thanks for telling me. Tricky words get easier every time you see them."},{"t":"say","who":"pip","text":"You were a great word finder! Today you found sight words like look, said, come, where and they. You will see them in many books!"},{"t":"mission","ic":"📕","text":"Read a book with a grown-up. Find the word said five times. Point to it each time!"},{"t":"say","who":"kiko","text":"Bye! Happy treasure hunting!","mood":"happy","anim":"wave"}]},{"id":"name-feeling","cat":"feelings","title":"Name That Feeling","ic":"😊","summary":"Kiko has a day full of feelings and the child names each one from face and body clues.","grownup":{"goal":"Builds emotional vocabulary: noticing face, body and situation clues and naming feelings like happy, surprised, sad, scared and nervous (angry, proud and frustrated come in other episodes). Feeling words in Filipino or her home language count too. Naming a feeling helps children calm it and ask for help.","talk":["What does your face do when you feel happy?","Where in your body do you feel scared?","What helped Kiko when she felt sad?"],"tip":"At dinner, each person shares one feeling they had today and what caused it. Grown-ups go first to show how."},"steps":[{"t":"scene","bg":"bedroom","cast":[{"who":"kiko","pos":"center","mood":"happy"}],"props":[{"p":"🎁","x":70,"y":84}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Today is a big feelings day for Kiko. Let's notice her feelings together."},{"t":"say","who":"kiko","text":"Look! A present for me!","mood":"happy","anim":"jump"},{"t":"ask","who":"pip","text":"Look at Kiko's face. Her eyes are bright and she has a big smile. How does she feel?","opts":[{"text":"happy","emoji":"😊"},{"text":"sad","emoji":"😢"},{"text":"angry","emoji":"😠"}],"ans":0,"right":"Yes, happy! A smile and a bouncy body are happy clues.","wrong":"Look again. Kiko is smiling and bouncing. Which feeling has a big smile?"},{"t":"prop","add":[{"p":"🎈","x":62,"y":45}]},{"t":"say","who":"kiko","text":"Oh! A balloon popped out of the box!","mood":"surprised","anim":"jump"},{"t":"ask","who":"pip","text":"Kiko's eyes are wide open and her mouth is round, like the letter o. What feeling is that?","opts":[{"text":"surprised","emoji":"😮"},{"text":"sleepy","emoji":"😴"},{"text":"sad","emoji":"😢"}],"ans":0,"right":"Surprised! Wide eyes and a round mouth are surprised clues.","wrong":"Look again. Her eyes are open wide and her mouth is round. Which feeling looks like that?"},{"t":"prop","remove":["🎈"]},{"t":"say","who":"kiko","text":"Oh no. My balloon floated away. I really liked it.","mood":"sad","anim":"droop"},{"t":"say","who":"pip","text":"Kiko's ears are down and a teardrop rolls down her cheek. Her body feels heavy."},{"t":"ask","who":"pip","text":"How do you think Kiko feels now?","opts":[{"text":"sad","emoji":"😢"},{"text":"happy","emoji":"😊"},{"text":"silly","emoji":"🤪"}],"ans":0,"right":"Yes, sad. It is OK to feel sad when you lose something you like.","wrong":"Look at her teardrop and her droopy ears. Which feeling makes us cry?"},{"t":"say","who":"pip","text":"When we say the name of a feeling, it can feel a little smaller and easier to handle."},{"t":"say","who":"kiko","text":"I feel sad. Saying it helps a little.","mood":"calm"},{"t":"yourturn","text":"I feel sad. I can say it.","reply":"You read it! Naming a feeling is a brave thing to do."},{"t":"scene","bg":"park","cast":[{"who":"kiko","pos":"left","mood":"calm"},{"who":"benny","pos":"right","mood":"happy"}],"props":[{"p":"☁️","x":50,"y":15},{"p":"🪁","x":88,"y":30}]},{"t":"say","who":"benny","text":"Hi, Kiko! Want to fly my kite with me?","mood":"happy","anim":"wave"},{"t":"say","who":"kiko","text":"Yes! That makes me feel better.","mood":"happy","anim":"jump"},{"t":"say","who":"pip","text":"Oh! Dark clouds are rolling in. Boom! Thunder!"},{"t":"prop","add":[{"p":"🌧️","x":28,"y":15}]},{"t":"say","who":"kiko","text":"Eek! That noise was so loud. My heart is beating fast.","mood":"scared","anim":"tremble"},{"t":"ask","who":"pip","text":"Kiko's eyes are big and her body is shaking. What feeling could that be?","opts":[{"text":"scared","emoji":"😨"},{"text":"silly","emoji":"🤪"},{"text":"proud","emoji":"🏆"}],"ans":0,"right":"Yes, scared. A fast heart and a shaky body are scared clues.","wrong":"Look again. Her eyes are big, her heart is fast, and her body shakes. Which feeling is that?"},{"t":"say","who":"benny","text":"It's OK, Kiko. When thunder roars, we go indoors. Inside is safe and cozy.","mood":"calm"},{"t":"say","who":"kiko","text":"Thank you, Benny. I feel safer now.","mood":"calm"},{"t":"ask","who":"pip","text":"When you feel scared, who can help you feel safe?","opts":[{"text":"a grown-up I trust","emoji":"🧑"},{"text":"a friend","emoji":"🧒"},{"text":"my teddy","emoji":"🧸"}],"ans":-1,"right":"Those are all good helpers. When you feel scared or unsafe, tell a grown-up you trust. Keep telling until someone helps."},{"t":"act","kind":"move","secs":15,"text":"Make feeling faces with me! Show happy, then surprised, then sad, then scared."},{"t":"yourturn","text":"I feel safe. I feel happy.","reply":"Great reading! You know so many feeling words."},{"t":"say","who":"kiko","text":"Tomorrow is my first swim class. My tummy feels fluttery, and my paws feel wiggly.","mood":"scared"},{"t":"ask","who":"pip","text":"Kiko's tummy flutters before something new. What feeling could that be?","opts":[{"text":"nervous","emoji":"😬"},{"text":"angry","emoji":"😠"},{"text":"proud","emoji":"🏆"}],"ans":0,"right":"Yes, nervous! Nervous is a wobbly, fluttery feeling before something new. Slow breaths can help.","wrong":"Not quite. A fluttery tummy before something new is a nervous feeling. Kiko feels nervous."},{"t":"say","who":"pip","text":"Great noticing! Today Kiko felt happy, surprised, sad, scared and nervous. All feelings are OK, and naming them helps."},{"t":"mission","ic":"❤️","text":"Tonight, tell a grown-up one feeling you had today and what made you feel that way."},{"t":"say","who":"kiko","text":"Bye, feelings friend!","mood":"happy","anim":"wave"}]},{"id":"calm-tools","cat":"feelings","title":"My Calm-Down Toolbox","ic":"🧰","summary":"Benny gets frustrated with a puzzle and Wren shows him calm-down tools he can use any time.","grownup":{"goal":"Teaches concrete calm-down strategies that work for young children: slow breathing, squeeze and release, counting, a short break in a calm spot near a grown-up, a comfort object and asking for help. Practicing them when calm makes them easier to use when upset.","talk":["Which calm tool did you like best?","How does your body feel when you are frustrated?","When could you use your calm tool this week?"],"tip":"Make a small calm-down corner together with a pillow, a teddy and a picture card of each calm tool. Practice one tool a day when everyone is calm."},"steps":[{"t":"scene","bg":"classroom","cast":[{"who":"benny","pos":"center","mood":"happy"},{"who":"wren","pos":"right","mood":"calm"}],"props":[{"p":"🧩","x":38,"y":86},{"p":"📕","x":86,"y":72}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! It's choice time in Ms. Rosa's class. Benny is doing a big puzzle. Wren is reading nearby."},{"t":"say","who":"benny","text":"This piece won't fit! It won't fit! I keep trying and trying!","mood":"angry","anim":"shake"},{"t":"say","who":"pip","text":"Benny feels frustrated. That means he really wants something to work, and it isn't working yet."},{"t":"ask","who":"pip","text":"Have you ever felt frustrated like Benny?","opts":[{"text":"yes","emoji":"👍","reply":"Thanks for sharing. Everybody feels frustrated sometimes, even grown-ups."},{"text":"no","emoji":"👎","reply":"Thanks for telling me. If you ever feel frustrated, calm tools can help."},{"text":"sometimes","emoji":"🤔","reply":"Thanks for sharing. Everybody feels frustrated sometimes, even grown-ups."}],"ans":-1},{"t":"say","who":"benny","text":"I give up! I'm never doing puzzles again!","mood":"angry"},{"t":"say","who":"wren","text":"It's OK to feel frustrated, Benny. When my body feels hot and tight, I use my calm-down toolbox.","mood":"calm"},{"t":"say","who":"benny","text":"A toolbox? Like a hammer?","mood":"thinking"},{"t":"say","who":"wren","text":"Not that kind of toolbox! Calm tools are things you can do to help your body feel calm.","mood":"happy"},{"t":"ask","who":"wren","text":"Which one is a calm tool?","opts":[{"text":"take slow breaths","emoji":"🌸"},{"text":"give up and quit","emoji":"😩"},{"text":"yell at Wren","emoji":"😠"}],"ans":0,"right":"Yes! Slow breaths tell your body it is safe to calm down.","wrong":"Hmm, giving up or yelling won't help Benny feel calm. Which one helps a body calm down?"},{"t":"say","who":"wren","text":"Let's breathe together. Smell a flower, then blow out a candle."},{"t":"act","kind":"breathe","n":3,"text":"Smell the flower slowly, then blow out the candle slowly."},{"t":"say","who":"benny","text":"Whoa. My tummy feels less tight now.","mood":"calm"},{"t":"say","who":"wren","text":"Another tool is squeeze and let go. Squeeze your hands tight, then let them go floppy."},{"t":"act","kind":"move","secs":8,"text":"Squeeze your hands into tight fists. Now let them go soft and floppy!"},{"t":"say","who":"benny","text":"That feels good! What other tools are there?","mood":"happy"},{"t":"ask","who":"pip","text":"Here are more calm tools. Which one would you like to try?","opts":[{"text":"count to ten","emoji":"🔢"},{"text":"hug a teddy","emoji":"🧸"},{"text":"rest near a grown-up","emoji":"🛋️"},{"text":"ask for help","emoji":"🙋"}],"ans":-1,"right":"Great choice! You can use that tool any time you need it."},{"t":"act","kind":"count","n":10,"text":"Let's try counting. Count slowly to ten with Benny. Tap each star."},{"t":"say","who":"wren","text":"And when something is really hard, asking for help is a calm tool too. You can ask a friend or a grown-up you trust."},{"t":"ask","who":"pip","text":"What could Benny say to ask Wren for help?","opts":[{"text":"Can you help me, please?","emoji":"🙋"},{"text":"Do it for me now!","emoji":"😤"}],"ans":0,"right":"Yes! Kind words make it easy for friends to help.","wrong":"Hmm, that sounds bossy. What is a kind way to ask?"},{"t":"say","who":"benny","text":"Wren, can you help me find where this piece goes, please?","mood":"calm"},{"t":"say","who":"wren","text":"Sure! Let's look at the colors together.","mood":"happy"},{"t":"say","who":"pip","text":"Benny and Wren look at the colors. The piece fits right in the corner!"},{"t":"say","who":"benny","text":"I did it, with help! I feel proud.","mood":"proud","anim":"jump"},{"t":"yourturn","text":"I can stop and slow down.","reply":"Great reading! Stopping to slow down is a calm tool you always have."},{"t":"say","who":"pip","text":"Calm tools work best when you practice them while you feel calm, like practicing a song."},{"t":"yourturn","text":"I can ask for help.","reply":"Yes, you can! Asking for help is smart and brave."},{"t":"say","who":"pip","text":"You helped Benny so much! Today he used slow breaths, squeeze and let go, counting, and asking for help."},{"t":"mission","ic":"🌸","text":"Pick your favorite calm tool. Show a grown-up, and practice it once today while you feel calm."},{"t":"say","who":"benny","text":"Bye! Breathe in, breathe out!","mood":"happy","anim":"wave"}]},{"id":"feelings-choices","cat":"feelings","title":"Mad Is OK, Hurting Is Not","ic":"🧱","summary":"Benny's ball knocks over Kiko's tower by accident; Kiko learns to stop, breathe, use her words and let mad out safely.","grownup":{"goal":"Separates feelings from actions: anger is OK, hurting people or things is not. Practices stop and breathe, an I feel sentence, telling accidents from on-purpose, safe ways to let anger out, and asking a trusted grown-up for help when mad feels too big.","talk":["What makes you feel mad?","What can you do with your body when you feel mad?","How did Kiko and Benny fix things?"],"tip":"When she is calm, practice the I feel ___ when ___ sentence together, and agree on a safe way to let mad out, like squeezing a pillow."},"steps":[{"t":"scene","bg":"bedroom","cast":[{"who":"kiko","pos":"left","mood":"happy"},{"who":"benny","pos":"right","mood":"happy"}],"props":[{"p":"🧱","x":50,"y":82}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Kiko built a tall block tower. Benny is bouncing a ball nearby."},{"t":"say","who":"kiko","text":"Look at my tower! It's the tallest tower ever!","mood":"proud"},{"t":"prop","add":[{"p":"⚽","x":63,"y":86}]},{"t":"say","who":"benny","text":"Oh no! My ball bounced into your tower. Crash!","mood":"surprised","anim":"tremble"},{"t":"prop","add":[{"p":"🧱","x":45,"y":89}],"remove":["🧱"]},{"t":"say","who":"kiko","text":"My tower! You broke it! I'm so mad!","mood":"angry","anim":"shake"},{"t":"ask","who":"pip","text":"How does Kiko feel?","opts":[{"text":"angry","emoji":"😠"},{"text":"happy","emoji":"😊"},{"text":"sleepy","emoji":"😴"}],"ans":0,"right":"Yes, angry. Her face is red and her body is tight.","wrong":"Look at her red face and tight body. Which feeling is that?"},{"t":"say","who":"pip","text":"Feeling angry is OK. Hurting is not. If mad feels too big, tell a grown-up you trust, and keep telling until someone helps."},{"t":"say","who":"kiko","text":"I want to throw a block at Benny!","mood":"angry"},{"t":"ask","who":"pip","text":"Can you help Kiko? What should she do first?","opts":[{"text":"stop and breathe","emoji":"✋"},{"text":"throw a block","emoji":"🧱"},{"text":"yell mean words","emoji":"😡"}],"ans":0,"right":"Yes! Stop and breathe. That gives her thinking brain time to help.","wrong":"Throwing or mean words can hurt. What could Kiko do first to calm her body?"},{"t":"act","kind":"breathe","n":2,"text":"Let's help Kiko. Smell the flower, then blow out the candle."},{"t":"say","who":"kiko","text":"My body is calmer. But I still feel mad.","mood":"calm"},{"t":"say","who":"pip","text":"Now Kiko can use her words. She can say, I feel mad when my tower falls."},{"t":"yourturn","text":"I feel mad when my tower falls.","reply":"Great reading! That is how you say a big feeling with words."},{"t":"say","who":"kiko","text":"Benny, I feel mad when my tower falls. I worked so hard on it.","mood":"calm"},{"t":"say","who":"benny","text":"Kiko, I'm sorry. My ball hit your tower by accident. I didn't mean to.","mood":"sad"},{"t":"ask","who":"pip","text":"Did Benny knock the tower down on purpose?","opts":[{"text":"no, he did not mean to","emoji":"⚽"},{"text":"yes, he did mean to","emoji":"🤔"}],"ans":0,"right":"Right. It was an accident. Accidents still feel bad, but nobody meant to hurt.","wrong":"Listen to Benny. He said his ball hit it by accident. He did not mean to."},{"t":"say","who":"benny","text":"Can I help you build it again?","mood":"calm"},{"t":"ask","who":"pip","text":"Kiko still feels a little mad. What is a safe way to let mad out?","opts":[{"text":"squeeze a pillow","emoji":"✊"},{"text":"throw a block","emoji":"🧱"}],"ans":0,"right":"Yes! Squeezing a pillow or stomping your feet lets mad out, and nobody gets hurt.","wrong":"Throwing can hurt someone. What could Kiko squeeze or stomp instead?"},{"t":"say","who":"kiko","text":"Thanks for saying sorry, Benny. Sorry I yelled. Let's build an even taller tower!","mood":"happy"},{"t":"prop","add":[{"p":"🧱","x":50,"y":82}],"remove":["🧱"]},{"t":"say","who":"benny","text":"Teamwork tower!","mood":"proud","anim":"jump"},{"t":"yourturn","text":"Mad is OK. Hurting is not.","reply":"You read it! You can feel mad and still make kind choices."},{"t":"say","who":"pip","text":"You helped Kiko a lot! Today she felt mad, stopped, breathed, used her words, and let her mad out safely."},{"t":"mission","ic":"🧱","text":"With a grown-up, practice saying: I feel mad when... Then finish the sentence your own way."},{"t":"say","who":"kiko","text":"Bye! Stop, breathe, and use your words!","mood":"happy","anim":"wave"}]},{"id":"kind-inside-voice","cat":"feelings","title":"My Kind Inside Voice","ic":"🌱","summary":"Juno falls off her scooter, hears an unkind inside voice, and learns to change it to I am still learning.","grownup":{"goal":"Teaches positive self-talk and the power of yet. Learning is framed as trying new strategies and asking for help, not just trying harder, which is how a growth mindset really works.","talk":["What does your kind inside voice say?","What is something you can't do yet?","What new way could you try when something is hard?"],"tip":"When she says I can't, gently add the word yet, and ask what new way or what help might make it easier."},"steps":[{"t":"scene","bg":"park","cast":[{"who":"juno","pos":"center","mood":"happy"},{"who":"benny","pos":"right","mood":"happy"}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Juno is learning to ride a scooter at the park. She has her helmet on. Benny is cheering."},{"t":"say","who":"juno","text":"Here I go! Push, push, glide.","mood":"happy"},{"t":"say","who":"pip","text":"Oh! Juno wobbles and tips over. Her helmet kept her safe. She is not hurt, but she feels upset."},{"t":"say","who":"juno","text":"I'm bad at this. I'll never learn. I should just quit.","mood":"sad","anim":"droop"},{"t":"say","who":"pip","text":"Juno's inside voice is being unkind right now. Your inside voice is the words you think to yourself."},{"t":"ask","who":"pip","text":"Juno said, I'm bad at this. Is that a kind inside voice or an unkind one?","opts":[{"text":"unkind","emoji":"😞"},{"text":"kind","emoji":"😊"}],"ans":0,"right":"Yes. Saying I'm bad at this makes Juno feel worse and want to quit.","wrong":"Hmm, does it make Juno feel better or worse? Listen again. I'm bad at this."},{"t":"say","who":"pip","text":"Falling feels bad, and it's OK to feel upset. Everybody hears an unkind inside voice sometimes. We can change the words."},{"t":"say","who":"benny","text":"Are you OK, Juno? Falling is no fun. Try adding a little word at the end. Yet!","mood":"happy"},{"t":"ask","who":"benny","text":"Help Juno change her words. Which is a kind inside voice?","opts":[{"text":"I can't do it yet.","emoji":"🌱"},{"text":"I'll never learn.","emoji":"😞"}],"ans":0,"right":"Yes! Yet means you are still learning. Practice and new ways help your brain get stronger.","wrong":"Hmm, never sounds like giving up. Which words leave room to learn?"},{"t":"yourturn","text":"I can't do it yet.","reply":"Great reading! Yet is a powerful little word."},{"t":"say","who":"juno","text":"I can't ride it yet. I am still learning.","mood":"calm"},{"t":"say","who":"pip","text":"Learning takes more than trying harder. You can try a new way, or ask for help."},{"t":"ask","who":"pip","text":"What new way could help Juno?","opts":[{"text":"ask Benny for tips","emoji":"🙋"},{"text":"go slower","emoji":"🐢"},{"text":"try on flat ground","emoji":"🛴"}],"ans":-1,"right":"Great idea! Trying a new way and asking for help are smart ways to learn."},{"t":"say","who":"juno","text":"Benny, can you give me a tip?","mood":"thinking"},{"t":"say","who":"benny","text":"Look ahead, not at your feet. And go slow at first!","mood":"happy"},{"t":"act","kind":"breathe","n":1,"text":"Juno takes one calm breath before she tries again. Breathe with her."},{"t":"move","who":"juno","pos":"left"},{"t":"say","who":"juno","text":"Eyes ahead. Go slow. Push, glide. Wobble! I'm still learning. Push, glide. I did it! I rode to the bench!","mood":"proud","anim":"jump"},{"t":"say","who":"pip","text":"Juno did not learn it all at once. She kept learning, step by step."},{"t":"ask","who":"pip","text":"When something feels hard for you, what can your kind inside voice say?","opts":[{"text":"I am still learning.","emoji":"🌱"},{"text":"I can try a new way.","emoji":"🔄"},{"text":"I can ask for help.","emoji":"🙋"}],"ans":-1,"right":"Yes! Those kind words can help you keep going."},{"t":"yourturn","text":"I am still learning.","reply":"You read it! You are always learning and growing."},{"t":"say","who":"juno","text":"Thank you for helping me! My inside voice can be my friend, just like Benny.","mood":"happy"},{"t":"say","who":"pip","text":"Today Juno noticed an unkind inside voice and changed it. She added yet, tried a new way, and asked for help."},{"t":"mission","ic":"🌱","text":"When something feels hard today, say out loud: I am still learning. Then try a new way or ask for help."},{"t":"say","who":"juno","text":"Bye! Remember the little word yet!","mood":"happy","anim":"wave"}]},{"id":"all-about-me","cat":"identity","title":"All About Me","ic":"⭐","summary":"In Ms. Rosa's class, Wren, Juno and Kiko share what they like and what they are good at, and the child shares too.","grownup":{"goal":"Builds self-understanding: naming your own likes and strengths, and seeing that everyone is different. Quiet Wren shows that being quiet is a strength too.","talk":["What are three things you love?","What are you good at?","How are you different from a friend, and how are you the same?"],"tip":"Make an All About Me poster together with drawings of her favorite things and strengths. Add to it as she discovers new ones."},"steps":[{"t":"scene","bg":"classroom","cast":[{"who":"wren","pos":"left","mood":"calm"},{"who":"rosa","pos":"center","mood":"happy"},{"who":"juno","pos":"right","mood":"happy"}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! It's All About Me day in Ms. Rosa's class. Everyone gets to share what makes them special."},{"t":"say","who":"rosa","text":"Good morning, friends! Today we will share things we like and things we are good at.","mood":"happy","anim":"wave"},{"t":"say","who":"juno","text":"Me first! I love maps and adventures. I'm good at climbing and asking questions!","mood":"happy","anim":"jump"},{"t":"say","who":"wren","text":"Um, I don't know what to say. I'm quiet.","mood":"scared"},{"t":"say","who":"rosa","text":"It's OK to feel shy, Wren. Being quiet is not a problem. Take your time. Quiet friends notice a lot.","mood":"calm"},{"t":"ask","who":"rosa","text":"What do you think Wren might be good at?","opts":[{"text":"seeing small things","emoji":"🔍"},{"text":"listening","emoji":"👂"},{"text":"drawing","emoji":"🖍️"}],"ans":-1,"right":"Wonderful ideas! But only Wren can tell us for sure. Let's listen to her."},{"t":"say","who":"wren","text":"I am good at listening. And I notice tiny bugs and flowers.","mood":"happy"},{"t":"say","who":"rosa","text":"Everyone is different, and that is what makes our class so interesting."},{"t":"ask","who":"rosa","text":"Now it's your turn! What do you like to do?","opts":[{"text":"read books","emoji":"📚"},{"text":"play outside","emoji":"🌳"},{"text":"draw and make things","emoji":"🎨"},{"text":"sing and dance","emoji":"🎵"}],"ans":-1,"right":"That sounds wonderful! The things you love are part of what makes you special."},{"t":"yourturn","text":"I like me.","reply":"Yes! You can like yourself just the way you are."},{"t":"move","who":"juno","pos":"off"},{"t":"move","who":"kiko","pos":"right"},{"t":"say","who":"kiko","text":"I like cuddles and stars. I'm good at being kind to my friends.","mood":"happy"},{"t":"say","who":"rosa","text":"Being kind is a strength too. Strengths can be things you do, and the way you treat people."},{"t":"ask","who":"rosa","text":"What is something you are good at?","opts":[{"text":"being kind","emoji":"❤️"},{"text":"being brave","emoji":"🦁"},{"text":"being funny","emoji":"😂"},{"text":"helping others","emoji":"🤝"}],"ans":-1,"right":"I agree! And you can be good at more than one thing."},{"t":"say","who":"wren","text":"Juno likes to talk first, and I like to listen. Kiko likes cuddles. We are all different, and we are all good.","mood":"calm"},{"t":"ask","who":"pip","text":"Is it OK to like different things than your friends?","opts":[{"text":"yes","emoji":"👍"},{"text":"no","emoji":"👎"}],"ans":0,"right":"Yes! Friends can like different things and still have fun together.","wrong":"Hmm, think about Juno and Wren. They like different things and are still friends."},{"t":"say","who":"rosa","text":"Some things about you might change as you grow. You will keep discovering new things you love."},{"t":"say","who":"rosa","text":"And everyone is still learning something. I am good at reading stories, and I am still learning to draw horses.","mood":"happy"},{"t":"ask","who":"rosa","text":"What is something you are still learning?","opts":[{"text":"reading new words","emoji":"📖"},{"text":"riding a bike","emoji":"🚲"},{"text":"tying my shoes","emoji":"👟"},{"text":"something else","emoji":"🌱"}],"ans":-1,"right":"Thank you for sharing! You can be good at things and still be learning. Still learning is part of growing."},{"t":"yourturn","text":"I am good at many things.","reply":"Beautiful reading! There is only one you, with lots of strengths."},{"t":"act","kind":"move","secs":10,"text":"Stand up and make a proud pose, like a superhero. Say: I am me!"},{"t":"say","who":"kiko","text":"That felt great! I feel proud of being me.","mood":"proud","anim":"jump"},{"t":"say","who":"pip","text":"Thank you for sharing! Today you, Wren, Juno and Kiko shared likes and strengths. Everyone is different, and that is good."},{"t":"mission","ic":"🖍️","text":"Draw a picture of three things you love. Share it with a grown-up and tell them why you love each one."},{"t":"say","who":"wren","text":"Bye! Thanks for sharing with us.","mood":"happy","anim":"wave"}]},{"id":"mistake-not-me","cat":"identity","title":"Oops! I Am Still Me","ic":"🎨","summary":"Kiko spills paint and thinks she is a bad cat; Ms. Rosa helps her see that a mistake is something she did, not who she is.","grownup":{"goal":"Separates behavior from identity: you made a mistake, you are not a mistake. Models cleaning up, learning a new way and trying again, which builds resilience instead of shame.","talk":["What is a mistake you made that helped you learn?","What can you say when you make a mistake?","How did Kiko fix her spill?"],"tip":"When a mistake happens at home, use the words: You made a mistake, you are not a mistake. How can we fix it? Share one of your own mistakes too."},"steps":[{"t":"scene","bg":"classroom","cast":[{"who":"kiko","pos":"left","mood":"happy"},{"who":"rosa","pos":"cen
