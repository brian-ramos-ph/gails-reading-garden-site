ter","mood":"happy"},{"who":"benny","pos":"right","mood":"happy"}],"props":[{"p":"🎨","x":34,"y":86}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! It's art time in Ms. Rosa's class. Kiko is painting a big rainbow."},{"t":"say","who":"kiko","text":"I'll get more blue paint. Oops!","mood":"surprised","anim":"shake"},{"t":"prop","add":[{"p":"💦","x":40,"y":89}]},{"t":"say","who":"pip","text":"The paint spills all over the floor. Splat!"},{"t":"say","who":"kiko","text":"Oh no. I made a big mess. I always mess everything up.","mood":"sad","anim":"droop"},{"t":"ask","who":"pip","text":"Kiko said she always messes everything up. Is that true?","opts":[{"text":"no, it was one mistake","emoji":"💦"},{"text":"yes, she always does","emoji":"👎"}],"ans":0,"right":"Right. Kiko made one mistake. One spill does not mean she messes everything up.","wrong":"Hmm. Spilling paint is something Kiko did one time. It is not who Kiko is. Try again."},{"t":"say","who":"rosa","text":"Kiko, it's OK to feel upset. You made a mistake. You are not a mistake. Everybody spills sometimes, even teachers.","mood":"calm"},{"t":"say","who":"rosa","text":"What you do is not the same as who you are. And you can fix this."},{"t":"yourturn","text":"I made a mess. I can fix it.","reply":"Wonderful reading! A mistake is something you can fix."},{"t":"ask","who":"rosa","text":"How can Kiko fix this mess?","opts":[{"text":"wipe it up","emoji":"🧻"},{"text":"hide it","emoji":"🙈"},{"text":"blame Benny","emoji":"👉"}],"ans":0,"right":"Yes! Cleaning up is a great way to fix a spill.","wrong":"Hmm, hiding or blaming doesn't fix the spill. What would clean it up?"},{"t":"prop","add":[{"p":"🧻","x":48,"y":82}]},{"t":"say","who":"benny","text":"I can help you, Kiko! Two helpers are faster than one.","mood":"happy"},{"t":"prop","remove":["💦","🧻"]},{"t":"say","who":"kiko","text":"Thank you, Benny. The floor is clean again.","mood":"calm"},{"t":"say","who":"kiko","text":"Next time, I want to carry the paint without a spill. How can I do that?","mood":"thinking"},{"t":"say","who":"rosa","text":"Great question. Mistakes help us learn. What could you do differently next time?"},{"t":"ask","who":"rosa","text":"What could Kiko do so the paint doesn't spill next time?","opts":[{"text":"carry it slowly","emoji":"🐢"},{"text":"use two hands","emoji":"🙌"},{"text":"put the lid on","emoji":"🎨"}],"ans":-1,"right":"Those are smart ideas! Mistakes teach us new ways to do things."},{"t":"say","who":"kiko","text":"I'll use two hands and go slow. Let me try again!","mood":"happy"},{"t":"act","kind":"move","secs":6,"text":"Pretend to carry a paint cup carefully with two hands. Slow and steady!"},{"t":"prop","add":[{"p":"🌈","x":50,"y":30}]},{"t":"say","who":"kiko","text":"I did it! My rainbow is done, and nothing spilled.","mood":"proud","anim":"jump"},{"t":"say","who":"benny","text":"Your rainbow is beautiful, Kiko!","mood":"happy"},{"t":"yourturn","text":"I am still me.","reply":"Yes! Even after a mistake, you are still you."},{"t":"ask","who":"pip","text":"When you make a mistake, what can you say?","opts":[{"text":"Oops, I can fix it.","emoji":"🧹"},{"text":"I mess everything up.","emoji":"😞"}],"ans":0,"right":"Yes! Oops, I can fix it. Those are brave, kind words.","wrong":"Remember, one mistake is just one mistake. What can you say instead?"},{"t":"say","who":"pip","text":"Today Kiko learned that a mistake is something you do, not who you are. She fixed it and tried again."},{"t":"mission","ic":"🧹","text":"Tell a grown-up about a mistake you made and what you learned. Ask them to share one of their mistakes too!"},{"t":"say","who":"kiko","text":"Bye! Oops is just part of learning!","mood":"happy","anim":"wave"}]},{"id":"words-dont-decide","cat":"identity","title":"Unkind Words Do Not Decide Me","ic":"🪞","summary":"Tired Mr. Bruno calls Kiko a bad, noisy cat; Kiko learns that unkind words do not decide who she is, tells someone she trusts, and Mr. Bruno apologizes.","grownup":{"goal":"A gentle first lesson that unkind words, even from a grown-up, do not decide who a child is. It separates helpful words about behavior (please play quietly) from labels (you are bad), shows a grown-up repairing a mistake, and teaches her to tell a trusted grown-up, and keep telling, if anyone's words or actions make her feel scared, hurt or unsafe, even once.","talk":["If someone's words ever hurt your feelings, what could you do?","What is the difference between please play quietly and you are bad?","Who are grown-ups you can tell when something feels wrong?"],"tip":"If you ever speak sharply when tired, model Mr. Bruno: name it, say sorry, and separate the behavior from the child. Remind her she can always tell you, or another trusted grown-up, about words that hurt."},"steps":[{"t":"scene","bg":"town","cast":[{"who":"kiko","pos":"left","mood":"happy"},{"who":"benny","pos":"center","mood":"happy"}],"props":[{"p":"🎵","x":38,"y":40}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Kiko and Benny are playing a singing game outside. They are being very, very loud."},{"t":"say","who":"kiko","text":"La la la! Louder, Benny! Let's sing to the sky!","mood":"happy","anim":"jump"},{"t":"say","who":"benny","text":"La la laaa!","mood":"happy","anim":"spin"},{"t":"move","who":"bruno","pos":"right"},{"t":"say","who":"bruno","text":"Hey! I am so tired. You are such a noisy, bad little cat! Go away!","mood":"angry","anim":"shake"},{"t":"move","who":"bruno","pos":"off"},{"t":"say","who":"kiko","text":"Mr. Bruno called me bad. Am I a bad cat?","mood":"sad","anim":"droop"},{"t":"ask","who":"pip","text":"How do you think Kiko feels right now?","opts":[{"text":"hurt and sad","emoji":"😢"},{"text":"excited","emoji":"🤩"},{"text":"sleepy","emoji":"😴"}],"ans":0,"right":"Yes. Unkind words can hurt our feelings. It is OK to feel hurt.","wrong":"Look at Kiko's droopy ears and sad face. How might she feel after those words? Try again."},{"t":"act","kind":"breathe","n":2,"text":"Hurt feelings can feel heavy. Let's take two slow breaths with Kiko."},{"t":"say","who":"pip","text":"Kiko, grown-ups have big feelings too. Mr. Bruno seemed very tired. But calling you bad was unkind."},{"t":"say","who":"pip","text":"The word bad came from his tired, grumpy feeling. It does not decide who you are."},{"t":"ask","who":"pip","text":"Is Kiko a bad cat?","opts":[{"text":"no, she was being loud","emoji":"🎵"},{"text":"yes, he said so","emoji":"👎"}],"ans":0,"right":"Right! Kiko is a kind, playful cat. She was being loud, and that is something she can change.","wrong":"Even when a grown-up says it, a word like bad does not decide who Kiko is. Try again."},{"t":"say","who":"benny","text":"Kiko, you are fun and kind. You share your toys and you make me laugh.","mood":"calm"},{"t":"ask","who":"pip","text":"Which words are about what Kiko did?","opts":[{"text":"Please play more quietly.","emoji":"🤫"},{"text":"You are a bad cat.","emoji":"👎"}],"ans":0,"right":"Yes! Asking her to play more quietly is about what she did. Kiko can listen to that.","wrong":"Hmm, bad cat is a label about who she is. Which words talk about what she did?"},{"t":"say","who":"pip","text":"Helpful words from grown-ups, like please play more quietly, help us learn. We can listen to those."},{"t":"say","who":"kiko","text":"So I can play more quietly. And I am still me?","mood":"thinking"},{"t":"say","who":"pip","text":"Yes. Caring grown-ups help you learn. And you keep finding out who you are, every day."},{"t":"yourturn","text":"Unkind words do not make me bad.","reply":"Wonderful reading! Unkind words don't change who you are inside."},{"t":"say","who":"pip","text":"When words hurt, tell a grown-up you trust how you feel. Talking about it helps."},{"t":"ask","who":"pip","text":"Who are grown-ups you trust?","opts":[{"text":"someone at home","emoji":"🏠"},{"text":"my teacher","emoji":"🍎"},{"text":"another grown-up I know","emoji":"🧑"}],"ans":-1,"right":"Those are great choices. A grown-up you trust listens and helps you feel safe."},{"t":"say","who":"kiko","text":"Thank you for listening, Pip. I will tell a grown-up I trust at home tonight, too. I feel better already.","mood":"calm"},{"t":"say","who":"pip","text":"If a grown-up's words or actions make you feel scared, hurt, or unsafe, even once, tell another grown-up you trust."},{"t":"say","who":"pip","text":"Keep telling until someone helps. You deserve to feel safe."},{"t":"ask","who":"pip","text":"If someone's words or actions make you feel scared or unsafe, what can you do?","opts":[{"text":"tell a grown-up I trust","emoji":"🗣️"},{"text":"keep it a secret","emoji":"🤐"}],"ans":0,"right":"Yes. Tell a grown-up you trust, and keep telling until someone helps.","wrong":"Secrets that make you feel scared should be told. Who can you tell? Try again."},{"t":"move","who":"bruno","pos":"right"},{"t":"say","who":"bruno","text":"Kiko, Benny, I'm sorry. I was very tired, and I said unkind words. That wasn't fair.","mood":"sad"},{"t":"say","who":"bruno","text":"You are not bad. You are a happy cat who was playing loudly. Could you play softer near my window?","mood":"calm"},{"t":"say","who":"kiko","text":"Thank you for saying sorry, Mr. Bruno. We can sing quietly over here.","mood":"happy"},{"t":"ask","who":"pip","text":"Mr. Bruno said sorry. What does that show?","opts":[{"text":"grown-ups can fix mistakes","emoji":"🤝"},{"text":"only kids say sorry","emoji":"🧒"}],"ans":0,"right":"Yes! Grown-ups make mistakes too. Saying sorry and making it right is how anyone fixes a mistake.","wrong":"Hmm, Mr. Bruno said his words were not fair. What does saying sorry show?"},{"t":"say","who":"kiko","text":"I know who I am. I am kind, I am fun, and I am still growing.","mood":"proud"},{"t":"yourturn","text":"I know who I am.","reply":"Yes, you do! And you keep discovering more about you every day."},{"t":"say","who":"pip","text":"Today Kiko learned that unkind words don't decide who she is. She listened to helpful words and told someone she trusts."},{"t":"mission","ic":"🪞","text":"Look in a mirror and say one true, kind thing about yourself, like: I am kind, or I am brave."},{"t":"say","who":"kiko","text":"Bye, friend! Remember, you are you, and you are still growing.","mood":"happy","anim":"wave"}]},{"id":"still-growing","cat":"identity","title":"I Am Still Growing","ic":"🌻","summary":"Wren plants a seed and learns that people grow on the inside too: who we are is a journey we keep discovering.","grownup":{"goal":"Introduces identity as a journey: likes, strengths and dreams can change, trying new things helps us discover ourselves, and it is OK not to know yet. This builds openness and self-acceptance.","talk":["What is something you used to not like, but like now?","What new thing would you like to try?","What do you think you will love when you are older?"],"tip":"Keep a little Growing Me list on the fridge. Each week, add one new thing she tried and what she learned about herself."},"steps":[{"t":"scene","bg":"garden","cast":[{"who":"wren","pos":"left","mood":"calm"},{"who":"juno","pos":"right","mood":"happy"}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Wren and Juno are in the garden. Wren has a tiny seed in her paw."},{"t":"say","who":"wren","text":"This seed is so small. Will it really grow into a flower?","mood":"thinking"},{"t":"say","who":"juno","text":"Let's plant it and find out! Dig a little hole, put it in, and cover it up.","mood":"happy"},{"t":"ask","who":"juno","text":"What does a seed need to grow?","opts":[{"text":"water and sunshine","emoji":"☀️"},{"text":"candy","emoji":"🍬"},{"text":"a toy car","emoji":"🚗"}],"ans":0,"right":"Yes! Water, sunshine, soil, and time help a seed grow.","wrong":"Hmm, seeds don't need treats or toys. What helps plants grow? Try again."},{"t":"prop","add":[{"p":"💧","x":35,"y":70}]},{"t":"say","who":"pip","text":"Days go by. Wren waters her seed. One morning, a little green sprout pops up!"},{"t":"prop","add":[{"p":"🌱","x":35,"y":86}],"remove":["💧"]},{"t":"say","who":"wren","text":"It's growing! But it doesn't look like a flower yet.","mood":"happy","anim":"jump"},{"t":"say","who":"pip","text":"Growing takes time. You are growing too, on the outside and on the inside."},{"t":"ask","who":"pip","text":"What do you think growing on the inside means?","opts":[{"text":"learning new things","emoji":"🧠"},{"text":"finding what I love","emoji":"❤️"},{"text":"getting braver","emoji":"🦁"}],"ans":-1,"right":"Yes! All of those are ways you grow on the inside."},{"t":"say","who":"juno","text":"When I was little, I was scared of swimming. I took lessons and practiced. Now I love it!","mood":"proud"},{"t":"say","who":"wren","text":"Grown-ups sometimes call me the shy one. Will I always be shy?","mood":"thinking"},{"t":"say","who":"pip","text":"Being shy is one part of you right now, not all of you. Who you are is a journey. You keep growing and discovering."},{"t":"ask","who":"pip","text":"Juno used to be scared of swimming. Now she loves it. What does that show?","opts":[{"text":"we can change and grow","emoji":"🌱"},{"text":"we always stay the same","emoji":"🪨"}],"ans":0,"right":"Yes! What we like and what we're good at can change as we grow.","wrong":"Hmm, Juno changed. She used to be scared, and now she loves it. Try again."},{"t":"yourturn","text":"I am growing every day.","reply":"Beautiful reading! You are growing right now."},{"t":"say","who":"wren","text":"How can I find out what I like?","mood":"thinking"},{"t":"say","who":"juno","text":"Try new things with a grown-up! Foods, games, books. If you like it, great. If not, you still learned about you.","mood":"happy"},{"t":"ask","who":"wren","text":"What new thing would you like to try?","opts":[{"text":"a new food","emoji":"🥕"},{"text":"a new game","emoji":"🎲"},{"text":"a new book","emoji":"📚"},{"text":"a new song","emoji":"🎵"}],"ans":-1,"right":"What a great idea! Trying new things is how you discover yourself."},{"t":"act","kind":"move","secs":10,"text":"Let's grow like a seed! Curl up small on the floor, then slowly stretch up tall, like a flower."},{"t":"prop","add":[{"p":"🌻","x":35,"y":74}],"remove":["🌱"]},{"t":"say","who":"pip","text":"Weeks later, Wren's little sprout has grown into a sunflower!"},{"t":"say","who":"wren","text":"My tiny seed became a sunflower. And I found out I love gardening!","mood":"proud","anim":"jump"},{"t":"say","who":"juno","text":"You are growing too, Wren. Just like your flower.","mood":"happy"},{"t":"yourturn","text":"I can try new things.","reply":"Yes, you can! Each new thing helps you learn about you."},{"t":"say","who":"pip","text":"Great job, gardener! Today Wren learned that we grow, we change, and we keep discovering new things about ourselves."},{"t":"mission","ic":"🌻","text":"Today, try one new thing with a grown-up, like a new food, game, or book. Then share what you learned about yourself."},{"t":"say","who":"wren","text":"Bye! Keep growing!","mood":"happy","anim":"wave"}]},{"id":"brave-voice","cat":"identity","title":"My Brave Voice","ic":"✋","summary":"Wren asks for help in class and Benny uses a calm, strong voice when his snack is taken, then tells Ms. Rosa.","grownup":{"goal":"Teaches self-advocacy: asking for help when you don't understand, using a calm strong voice to say please stop, and one simple tell rule: is someone hurt, unsafe, or won't stop? Tell. Not sure? Tell anyway. She never has to face a bigger kid or an adult alone; moving away and telling is always enough.","talk":["When is it hard to ask for help?","What does a brave voice sound like?","When should you tell a grown-up? What if you're not sure?"],"tip":"Role-play with a pretend toy: she practices saying, Please stop, I don't like that, then stepping away and telling you. Switch roles. With adults she can use respectful words like Ayoko po, then tell another trusted grown-up."},"steps":[{"t":"scene","bg":"classroom","cast":[{"who":"benny","pos":"left","mood":"happy"},{"who":"rosa","pos":"center","mood":"happy"},{"who":"wren","pos":"right","mood":"calm"}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! It's a busy day at school. Benny and Wren are in Ms. Rosa's class."},{"t":"say","who":"rosa","text":"Everyone, please start your number page. Raise your hand if you need help."},{"t":"say","who":"wren","text":"I don't understand this page. But I'm too shy to ask.","mood":"scared"},{"t":"ask","who":"pip","text":"Wren feels shy. Have you ever felt shy about asking for help?","opts":[{"text":"yes","emoji":"🙋"},{"text":"sometimes","emoji":"🤔"},{"text":"no","emoji":"🙂"}],"ans":-1,"right":"Thanks for sharing. Lots of people feel shy. Asking is still brave!"},{"t":"ask","who":"pip","text":"What could Wren do?","opts":[{"text":"raise her hand","emoji":"✋"},{"text":"stay stuck","emoji":"😶"},{"text":"copy a friend","emoji":"👀"}],"ans":0,"right":"Yes! Feeling shy is OK. You can feel shy and still raise your hand. Teachers want to help.","wrong":"Hmm, that won't help Wren learn. What could she do to get help? Try again."},{"t":"say","who":"wren","text":"Ms. Rosa, I need help, please.","mood":"calm"},{"t":"say","who":"rosa","text":"Thank you for asking, Wren. Questions help you learn. Let's look at it together.","mood":"happy"},{"t":"yourturn","text":"I need help, please.","reply":"Great reading! Those words help you learn and stay safe."},{"t":"scene","bg":"park","cast":[{"who":"benny","pos":"left","mood":"happy"},{"who":"wren","pos":"right","mood":"calm"}],"props":[{"p":"🥪","x":32,"y":86}]},{"t":"say","who":"pip","text":"At recess, Benny is eating his snack. A kid from another class runs by."},{"t":"say","who":"pip","text":"The kid grabs Benny's sandwich and says, ha ha, it's mine now!"},{"t":"prop","remove":["🥪"]},{"t":"say","who":"benny","text":"Hey! That's my sandwich. I feel upset.","mood":"angry"},{"t":"ask","who":"pip","text":"How can Benny use a brave voice?","opts":[{"text":"Please stop. Give it back.","emoji":"✋"},{"text":"push the kid","emoji":"👊"},{"text":"say nothing at all","emoji":"😶"}],"ans":0,"right":"Yes! A calm, strong voice says what you need without hurting anyone.","wrong":"Pushing can hurt someone, and if Benny says nothing, the kid won't know. Feeling upset is OK. What could Benny say?"},{"t":"say","who":"benny","text":"Please stop. I do not like that. Give my sandwich back.","mood":"calm"},{"t":"say","who":"pip","text":"A brave voice is calm and strong. If a kid is bigger, or you feel unsafe, just move away and tell a grown-up."},{"t":"act","kind":"move","secs":8,"text":"Stand tall like Benny. Put your hand up like a stop sign. Say: Please stop! Then take two steps away."},{"t":"yourturn","text":"Please stop. I do not like that.","reply":"That was a strong, calm brave voice! Great reading."},{"t":"say","who":"pip","text":"But the kid just laughs and runs away with the sandwich."},{"t":"ask","who":"wren","text":"Benny used his brave voice, but it didn't work. What should he do now?","opts":[{"text":"tell a grown-up","emoji":"🧑‍🏫"},{"text":"chase and grab it","emoji":"🏃"}],"ans":0,"right":"Yes! When someone won't stop, telling a grown-up is the right thing to do.","wrong":"Chasing could start a fight. Who can help when someone won't stop? Try again."},{"t":"scene","bg":"classroom","cast":[{"who":"benny","pos":"left","mood":"thinking"},{"who":"rosa","pos":"center","mood":"calm"},{"who":"wren","pos":"right","mood":"calm"}]},{"t":"say","who":"benny","text":"Ms. Rosa, a kid took my sandwich. I said stop, but he ran off. Is it OK to tell you?","mood":"thinking"},{"t":"say","who":"rosa","text":"Yes. Here is a tell rule. Is someone hurt, unsafe, or won't stop? Tell. Not sure? Tell anyway.","mood":"calm"},{"t":"say","who":"rosa","text":"Telling a grown-up you trust is always OK. If they don't help, keep telling until someone does. Thank you, Benny."},{"t":"ask","who":"pip","text":"A friend falls and hurts her knee. What should you do?","opts":[{"text":"tell a grown-up right away","emoji":"🩹"},{"text":"wait until tomorrow","emoji":"⏰"}],"ans":0,"right":"Yes! Someone is hurt, so tell a grown-up right away.","wrong":"When someone is hurt, a grown-up needs to know now. Try again."},{"t":"say","who":"rosa","text":"I will talk with that kid. Here is a new sandwich for you, Benny. You deserve to be treated kindly.","mood":"happy"},{"t":"prop","add":[{"p":"🥪","x":32,"y":86}]},{"t":"say","who":"benny","text":"Thank you, Ms. Rosa! My brave voice and telling a grown-up both helped.","mood":"proud"},{"t":"say","who":"wren","text":"I used my brave voice today too, when I asked for help!","mood":"happy","anim":"jump"},{"t":"yourturn","text":"I can tell a grown-up.","reply":"Yes! Not sure if you should tell? Tell a grown-up you trust anyway."},{"t":"say","who":"pip","text":"You were a great helper today! Benny and Wren used brave voices to ask for help and tell a grown-up."},{"t":"mission","ic":"✋","text":"Practice your brave voice with a grown-up. Stand tall and say: Please stop, I do not like that. Then step away and tell."},{"t":"say","who":"benny","text":"Bye! Stand tall and use your brave voice!","mood":"happy","anim":"wave"}]},{"id":"magic-words","cat":"respect","title":"Kind Words Everywhere","ic":"🙏","summary":"Benny learns to use please, thank you, excuse me, hello and you're welcome at Mr. Bruno's kitchen and in a shop.","grownup":{"goal":"Practices everyday polite words and greetings, and why they matter: kind words show respect and help people feel cared for. Real places (a neighbor's kitchen, a shop) make it easy to use in real life.","talk":["How do you feel when someone says thank you to you?","When do we say excuse me?","Which kind word can you use at school tomorrow?"],"tip":"Model kind words out loud this week, including saying please and thank you to her. Notice and name it when she uses them."},"steps":[{"t":"scene","bg":"kitchen","cast":[{"who":"juno","pos":"left","mood":"happy"},{"who":"bruno","pos":"center","mood":"happy"},{"who":"benny","pos":"right","mood":"happy"}],"props":[{"p":"🍪","x":92,"y":66},{"p":"🥛","x":86,"y":65}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Juno and Benny are visiting their neighbor, Mr. Bruno. He baked cookies!"},{"t":"say","who":"bruno","text":"Hello, friends! Would you like a cookie?","mood":"happy","anim":"wave"},{"t":"say","who":"benny","text":"Gimme a cookie! Gimme, gimme!","mood":"happy","anim":"jump"},{"t":"say","who":"bruno","text":"Hmm. Is there a kinder way to ask, Benny?","mood":"thinking"},{"t":"ask","who":"juno","text":"Can you help Benny? What is a kind way to ask?","opts":[{"text":"May I have one, please?","emoji":"🙏"},{"text":"Gimme now!","emoji":"😤"}],"ans":0,"right":"Yes! Please is a kind word that shows respect.","wrong":"Hmm, gimme sounds bossy. Which words sound kind? Try again."},{"t":"say","who":"benny","text":"Mr. Bruno, may I have a cookie, please?","mood":"calm"},{"t":"say","who":"bruno","text":"Of course! Here you go.","mood":"happy"},{"t":"prop","remove":["🍪"],"add":[{"p":"🍪","x":68,"y":66}]},{"t":"ask","who":"juno","text":"Mr. Bruno gave Benny a cookie. What should Benny say now?","opts":[{"text":"thank you","emoji":"😊"},{"text":"more!","emoji":"🍪"}],"ans":0,"right":"Yes! Thank you shows we notice when someone is kind to us.","wrong":"When someone gives us something, two little words tell them we are glad. Which ones?"},{"t":"say","who":"benny","text":"Thank you, Mr. Bruno!","mood":"happy"},{"t":"say","who":"bruno","text":"You're welcome, Benny. Kind words make me feel happy inside.","mood":"proud"},{"t":"yourturn","text":"Please and thank you.","reply":"Great reading! Those are kind words."},{"t":"scene","bg":"town","cast":[{"who":"juno","pos":"left","mood":"happy"},{"who":"benny","pos":"center","mood":"happy"},{"who":"bruno","pos":"right","mood":"happy"}]},{"t":"say","who":"pip","text":"Next, Mr. Bruno walks with Juno and Benny to the shop to buy apples."},{"t":"say","who":"juno","text":"Someone is standing in the doorway. How can we get past?","mood":"thinking"},{"t":"ask","who":"juno","text":"What can we say to get past someone kindly?","opts":[{"text":"excuse me, please","emoji":"🙋"},{"text":"move!","emoji":"😠"},{"text":"Out of my way!","emoji":"😠"}],"ans":0,"right":"Yes! Excuse me is a polite way to ask someone to let you by.","wrong":"Those words sound bossy. Which polite words ask someone to let you by?"},{"t":"yourturn","text":"Excuse me, please.","reply":"Wonderful reading! That's how to ask politely."},{"t":"say","who":"pip","text":"Inside the shop, the shopkeeper smiles and says hello."},{"t":"ask","who":"pip","text":"The shopkeeper says hello. What could Juno say?","opts":[{"text":"Hello! How are you?","emoji":"👋"},{"text":"say nothing","emoji":"😶"}],"ans":0,"right":"Yes! Saying hello back is friendly. A smile or a wave is kind too.","wrong":"Hmm, a hello, a wave or a smile helps people feel noticed. How could Juno greet the shopkeeper? Try again."},{"t":"say","who":"juno","text":"Hello! May we have four apples, please?","mood":"happy"},{"t":"prop","add":[{"p":"🍎","x":38,"y":86}]},{"t":"say","who":"benny","text":"Thank you very much!","mood":"happy","anim":"wave"},{"t":"say","who":"pip","text":"Benny remembered all by himself! Kind words don't always get a yes, but they help people feel cared for."},{"t":"ask","who":"pip","text":"Which kind words do you use the most?","opts":[{"text":"please","emoji":"🙏"},{"text":"thank you","emoji":"😊"},{"text":"excuse me","emoji":"🙋"},{"text":"sorry","emoji":"💛"}],"ans":-1,"right":"That's a great one! Using kind words every day makes the world friendlier."},{"t":"act","kind":"count","n":5,"text":"Tap a star for each kind word: please, thank you, excuse me, you're welcome, hello."},{"t":"say","who":"pip","text":"Great job, kind word helper! You helped Benny and Juno say please, thank you, excuse me and hello."},{"t":"mission","ic":"🙏","text":"Use please and thank you five times today. Ask a grown-up to count with you!"},{"t":"say","who":"benny","text":"Bye! Thank you for helping me!","mood":"happy","anim":"wave"}]},{"id":"taking-turns","cat":"respect","title":"Taking Turns at the Park","ic":"🔄","summary":"Benny wants the swing all day; he notices his friends feel left out and they find fair ways to share.","grownup":{"goal":"Practices fairness and empathy: noticing how others feel when left out, asking for a turn, waiting, counting turns, and solving sharing problems together (turns, timers, playing together).","talk":["How does it feel to wait for a turn?","What can you do while you wait?","What is a fair way to share one toy?"],"tip":"Use a kitchen timer or counting for shared toys at home, and praise patient waiting out loud."},"steps":[{"t":"scene","bg":"park","cast":[{"who":"juno","pos":"left","mood":"happy"},{"who":"benny","pos":"center","mood":"happy"},{"who":"wren","pos":"right","mood":"calm"}],"props":[{"p":"🛝","x":92,"y":80}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Juno, Benny and Wren are at the park. There is one swing, and everyone wants a turn."},{"t":"say","who":"benny","text":"Swing time! I'm going first, and I'm staying all day!","mood":"happy","anim":"jump"},{"t":"say","who":"juno","text":"Benny, can I have a turn too, please?","mood":"sad"},{"t":"say","who":"wren","text":"I have been waiting a long time.","mood":"sad"},{"t":"ask","who":"pip","text":"How do you think Juno and Wren feel?","opts":[{"text":"left out","emoji":"😞"},{"text":"happy","emoji":"😊"},{"text":"silly","emoji":"🤪"}],"ans":0,"right":"Yes. When someone doesn't share a turn, others can feel left out and sad.","wrong":"Look at their faces. They are waiting and waiting. How might that feel? Try again."},{"t":"say","who":"pip","text":"Benny notices his friends' faces. They look sad."},{"t":"say","who":"benny","text":"Hmm. I like swinging. But I don't want my friends to feel sad.","mood":"thinking"},{"t":"ask","who":"pip","text":"What is a fair way to share the swing?","opts":[{"text":"take turns","emoji":"🔄"},{"text":"Benny keeps it","emoji":"🐰"},{"text":"everyone grabs it","emoji":"✊"}],"ans":0,"right":"Yes! Taking turns lets everyone play.","wrong":"Hmm, that doesn't seem fair to everyone. Which way lets everyone have a go? Try again."},{"t":"say","who":"juno","text":"Let's take turns! Each person gets ten swings, then it's the next turn.","mood":"happy"},{"t":"say","who":"benny","text":"OK! I'll swing ten times. Count with me!","mood":"happy"},{"t":"act","kind":"count","n":10,"text":"Count Benny's ten swings. Tap a star for each swing!"},{"t":"say","who":"benny","text":"Ten! Your turn, Wren. You were waiting first.","mood":"proud"},{"t":"say","who":"wren","text":"Thank you, Benny!","mood":"happy","anim":"jump"},{"t":"yourturn","text":"Can I have a turn?","reply":"Great reading! That's a kind way to ask."},{"t":"say","who":"pip","text":"Stopping a fun turn can feel hard. Benny did it anyway! Juno and Benny step back, away from the swing."},{"t":"ask","who":"juno","text":"What can we do while we wait?","opts":[{"text":"play on the slide","emoji":"🛝"},{"text":"cheer for Wren","emoji":"📣"},{"text":"play tag","emoji":"🏃"}],"ans":-1,"right":"Great idea! Waiting is easier when you find something fun to do."},{"t":"say","who":"benny","text":"Let's cheer for Wren! Go, Wren, go!","mood":"happy","anim":"jump"},{"t":"say","who":"wren","text":"Your turn next, Juno!","mood":"proud"},{"t":"yourturn","text":"Your turn next!","reply":"You read it! Those words make friends happy."},{"t":"prop","add":[{"p":"⚽","x":62,"y":87}]},{"t":"say","who":"pip","text":"Later, Benny and Juno both want the same ball. Uh oh!"},{"t":"ask","who":"pip","text":"What is a fair way for them to share the ball?","opts":[{"text":"play catch together","emoji":"⚽"},{"text":"use a timer","emoji":"⏰"},{"text":"take turns","emoji":"🔄"}],"ans":-1,"right":"All of those are fair ideas! Friends can take turns, use a timer, or play together."},{"t":"say","who":"juno","text":"Taking turns was fun. Everyone got to swing!","mood":"happy"},{"t":"say","who":"pip","text":"You helped so much! Today the friends took turns, counted swings, and found fun things to do while waiting."},{"t":"mission","ic":"🔄","text":"Take turns in a game or with a toy with someone today. Say: Your turn next!"},{"t":"say","who":"benny","text":"Bye! Ten swings each!","mood":"happy","anim":"wave"}]},{"id":"good-friend","cat":"respect","title":"How to Be a Good Friend","ic":"🤝","summary":"Kiko and Juno notice Wren sitting alone, invite her to play, and learn about her favorite game.","grownup":{"goal":"Practices noticing when someone feels left out, inviting them, listening with ears and body (turning toward, nodding, asking a question), and accepting that friends can like different things. These are core friendship skills at age seven.","talk":["How can you tell when someone feels lonely?","What could you say to invite someone to play?","How do you show someone you are listening?"],"tip":"Ask her after school: Did anyone seem left out today? What could you do tomorrow? Praise any kindness she shows."},"steps":[{"t":"scene","bg":"park","cast":[{"who":"kiko","pos":"left","mood":"happy"},{"who":"juno","pos":"center","mood":"happy"},{"who":"wren","pos":"right","mood":"sad"}],"props":[{"p":"⚽","x":38,"y":86}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Kiko and Juno are playing ball at the park."},{"t":"say","who":"kiko","text":"Throw it to me, Juno!","mood":"happy","anim":"jump"},{"t":"say","who":"juno","text":"Wait, Kiko. Look over there. Wren is sitting all alone.","mood":"thinking"},{"t":"say","who":"wren","text":"Hmm. I wish I had someone to play with.","mood":"sad","anim":"droop"},{"t":"ask","who":"juno","text":"Look at Wren's face and body. How do you think Wren feels?","opts":[{"text":"lonely","emoji":"😔"},{"text":"excited","emoji":"🤩"},{"text":"angry","emoji":"😠"}],"ans":0,"right":"Yes. Wren's head is down and she is by herself. She might feel lonely.","wrong":"Look again. Wren is alone with her head down. What feeling might that be? Try again."},{"t":"say","who":"kiko","text":"What can we do to help Wren?","mood":"thinking"},{"t":"ask","who":"kiko","text":"Can you help us? What could we do?","opts":[{"text":"invite Wren to play","emoji":"🤝"},{"text":"ignore Wren","emoji":"🙈"}],"ans":0,"right":"Yes! Inviting someone can help them feel welcome. They get to choose yes or no.","wrong":"Hmm, ignoring might make Wren feel more alone. What could we do instead? Try again."},{"t":"yourturn","text":"Do you want to play?","reply":"Great reading! Those words can make someone's whole day."},{"t":"say","who":"kiko","text":"Wren, do you want to play with us?","mood":"happy"},{"t":"say","who":"wren","text":"Really? Thank you. But I'm not very good at ball games.","mood":"calm"},{"t":"say","who":"juno","text":"That's OK! What do you like to play?","mood":"happy"},{"t":"say","who":"wren","text":"I like looking for bugs and leaves.","mood":"happy"},{"t":"ask","who":"pip","text":"Wren likes bugs. What could Kiko ask to learn more about Wren?","opts":[{"text":"What bugs do you like?","emoji":"🐞"},{"text":"Bugs are boring.","emoji":"😒"}],"ans":0,"right":"Yes! Asking about what a friend loves shows you care. Friends can like different things.","wrong":"That could hurt Wren's feelings. A question about her bugs would show you care. Try again."},{"t":"say","who":"kiko","text":"Wren, what bugs do you like? A bug hunt sounds fun! Let's play that next.","mood":"happy","anim":"jump"},{"t":"say","who":"pip","text":"Good friends listen. They listen with their ears, and they show it by turning toward their friend."},{"t":"ask","who":"pip","text":"Which one shows good listening?","opts":[{"text":"listen, then ask","emoji":"👂"},{"text":"talk over your friend","emoji":"🙄"}],"ans":0,"right":"Yes! Listening and asking a question shows you care about what your friend says.","wrong":"Hmm, talking over a friend can make them feel you aren't listening. Try again."},{"t":"act","kind":"move","secs":8,"text":"Show me good listening! Turn toward me, ears ready, and give a little nod."},{"t":"say","who":"wren","text":"I found a ladybug! Look, it has seven spots.","mood":"proud"},{"t":"say","who":"kiko","text":"Wow, Wren, you are great at finding bugs! Tell us more.","mood":"surprised"},{"t":"say","who":"juno","text":"Wren, I'm glad you played with us.","mood":"happy"},{"t":"yourturn","text":"I like to play with you.","reply":"Wonderful reading! Kind words help a friend feel welcome."},{"t":"say","who":"wren","text":"Thank you for inviting me. I don't feel lonely anymore.","mood":"happy"},{"t":"ask","who":"pip","text":"What makes you a good friend?","opts":[{"text":"I share","emoji":"🤝"},{"text":"I listen","emoji":"👂"},{"text":"I use kind words","emoji":"💬"},{"text":"I ask others to play","emoji":"🙋"}],"ans":-1,"right":"Yes! You can be that kind of friend every day."},{"t":"say","who":"pip","text":"Today Kiko and Juno noticed Wren was lonely, invited her to play, and listened to what she likes."},{"t":"mission","ic":"🤝","text":"Invite someone to join your play today. If they say no thanks, say OK. Then ask a friend a question and really listen."},{"t":"say","who":"kiko","text":"Bye, friend!","mood":"happy","anim":"wave"}]},{"id":"my-space","cat":"respect","title":"My Space, Your Space","ic":"🙌","summary":"Benny gives surprise hugs, and Ms. Rosa teaches the class about space bubbles, asking first, and stop means stop.","grownup":{"goal":"Everyday body boundaries for a seven-year-old: personal space, asking before hugging, accepting no kindly, other ways to show care (a wave, a high five or mano po), stop means stop in play, private parts are private, no secrets about touching, and telling a trusted grown-up if someone does not stop or makes her uncomfortable.","talk":["How do you like to say hello to friends?","What should you do if a friend says no to a hug?","Who could you tell if someone doesn't stop when you say stop?"],"tip":"Respect her no to hugs and tickles at home too, and offer choices like a high five or a wave with relatives. It shows her that her words about her body matter."},"steps":[{"t":"scene","bg":"classroom","cast":[{"who":"kiko","pos":"left","mood":"happy"},{"who":"benny","pos":"center","mood":"happy"},{"who":"wren","pos":"right","mood":"calm"}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Benny is so happy today. He loves giving hugs!"},{"t":"say","who":"benny","text":"Good morning, Kiko! Big surprise hug!","mood":"happy","anim":"jump"},{"t":"say","who":"kiko","text":"Whoa, Benny! That was a surprise. I didn't want a hug right now.","mood":"surprised"},{"t":"say","who":"benny","text":"Oh. But hugs are nice!","mood":"sad"},{"t":"ask","who":"pip","text":"Kiko didn't want a hug. How do you think she felt?","opts":[{"text":"it felt too close","emoji":"😣"},{"text":"very happy","emoji":"😁"}],"ans":0,"right":"Yes. A surprise hug can feel too close, even from a friend.","wrong":"Kiko said she didn't want a hug. How might that feel? Try again."},{"t":"scene","bg":"classroom","cast":[{"who":"kiko","pos":"left","mood":"calm"},{"who":"benny","pos":"center","mood":"thinking"},{"who":"rosa","pos":"right","mood":"calm"}]},{"t":"say","who":"rosa","text":"Benny, everyone has a space bubble around their body. It's about one arm long.","mood":"calm"},{"t":"act","kind":"move","secs":8,"text":"Stretch your arms out and turn around slowly. That's your space bubble!"},{"t":"say","who":"rosa","text":"Some people like hugs, and some don't. People feel different on different days. A no to a hug doesn't mean they don't like you."},{"t":"ask","who":"rosa","text":"What should Benny do before he gives a hug?","opts":[{"text":"ask first","emoji":"🙋"},{"text":"just grab them","emoji":"🤗"}],"ans":0,"right":"Yes! Asking first lets the other person choose.","wrong":"Hmm, a hug without asking can be a surprise. What could Benny do first? Try again."},{"t":"yourturn","text":"Can I have a hug?","reply":"Great reading! Asking first shows respect."},{"t":"say","who":"benny","text":"Sorry for the surprise hug, Kiko. Can I have a hug?","mood":"calm"},{"t":"say","who":"kiko","text":"No, thank you. But I would like a high five!","mood":"happy"},{"t":"ask","who":"rosa","text":"Kiko said no. What should Benny do?","opts":[{"text":"say OK, high five","emoji":"🙌"},{"text":"hug her anyway","emoji":"🤗"}],"ans":0,"right":"Yes! When someone says no, we listen and choose another way to be kind.","wrong":"When someone says no, we listen. What else could Benny do to show he cares?"},{"t":"say","who":"benny","text":"OK! High five, Kiko!","mood":"happy","anim":"jump"},{"t":"yourturn","text":"No, thank you.","reply":"You read it! It's OK to say that to anyone, even family. Mano po or a wave works too."},{"t":"say","who":"rosa","text":"There are many ways to show you care. A wave, a smile, a high five, or kind words."},{"t":"ask","who":"pip","text":"Which way would you like to say hello to a friend?","opts":[{"text":"a wave","emoji":"👋"},{"text":"a high five","emoji":"🙌"},{"text":"a smile","emoji":"😊"},{"text":"a hug, if they say yes","emoji":"🤗"}],"ans":-1,"right":"Great choice! There are lots of ways to show friends you care."},{"t":"say","who":"rosa","text":"Here is another rule. In games, stop means stop. If someone says stop, we stop right away."},{"t":"ask","who":"pip","text":"Pretend Benny is playing tickle tag with Wren, and she says stop. What should he do?","opts":[{"text":"stop right away","emoji":"✋"},{"text":"keep tickling","emoji":"😆"}],"ans":0,"right":"Yes! Stop means stop, even in a fun game.","wrong":"When someone says stop, we stop right away. Try again."},{"t":"say","who":"rosa","text":"Your body belongs to you. Parts under your swimsuit are private. If a touch feels wrong or confusing, you can say stop and move away.","mood":"calm"},{"t":"say","who":"rosa","text":"If someone won't stop, or a touch feels wrong, tell a grown-up you trust, even about someone you know. Keep telling until someone helps."},{"t":"ask","who":"pip","text":"We never keep secrets about touching. If a grown-up you know asks you to keep one, what should you do?","opts":[{"text":"tell a grown-up I trust","emoji":"🗣️"},{"text":"keep the secret","emoji":"🤐"}],"ans":0,"right":"Yes! Tell a grown-up you trust. You won't be in trouble, and it is never your fault.","wrong":"No one should ask you to keep a touching secret. Tell a grown-up you trust. You won't be in trouble, and it's never your fault."},{"t":"say","who":"benny","text":"I'll ask first from now on. Everyone gets to choose!","mood":"proud"},{"t":"say","who":"pip","text":"Great job, friend! Benny learned about space bubbles. Ask first, listen to no, and stop means stop."},{"t":"mission","ic":"🙌","text":"Today, ask before you hug someone. Try a wave or a high five too!"},{"t":"say","who":"kiko","text":"Bye! High five!","mood":"happy","anim":"wave"}]},{"id":"saying-sorry","cat":"respect","title":"Saying Sorry and Making It Right","ic":"💛","summary":"Juno accidentally rips Wren's drawing and learns the three parts of a real apology.","grownup":{"goal":"Teaches a real apology, once everyone is calm and in private: say what you did and help make it right (at seven these two parts are the goal; doing better next time is the stretch). Also shows accepting an apology kindly, that it is OK to still feel sad for a while, and that she can still tell a grown-up if someone keeps hurting her.","talk":["What are the parts of a real sorry?","How can you make something right after an accident?","How did Wren feel after Juno said sorry?"],"tip":"After a conflict, wait until everyone is calm, then coach in private: What did you do? How can you help make it right? What will you do next time? This three-part sorry is the app's own coaching model. Say sorry to her too when you slip."},"steps":[{"t":"scene","bg":"classroom","cast":[{"who":"juno","pos":"left","mood":"happy"},{"who":"wren","pos":"right","mood":"happy"}],"props":[{"p":"🖍️","x":64,"y":87},{"p":"🌻","x":66,"y":62}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Wren drew a beautiful picture of her garden. She is very proud of it."},{"t":"say","who":"wren","text":"Look, Juno! I drew my sunflower and all the bugs.","mood":"proud"},{"t":"say","who":"juno","text":"Wow! Let me see! Oops!","mood":"surprised","anim":"shake"},{"t":"say","who":"pip","text":"Rip! Juno grabbed it too fast, and the picture tore in half."},{"t":"say","who":"wren","text":"My picture! It's ripped.","mood":"sad","anim":"droop"},{"t":"ask","who":"pip","text":"Why does Wren feel sad?","opts":[{"text":"her picture ripped","emoji":"🌻"},{"text":"she is hungry","emoji":"🍎"}],"ans":0,"right":"Yes. Wren worked hard on her picture, and now it is ripped. That feels sad.","wrong":"Look at Wren's sunflower picture. What happened to it? Try again."},{"t":"say","who":"juno","text":"I didn't mean to! It was an accident. I feel so bad. Maybe I should just walk away.","mood":"thinking"},{"t":"ask","who":"pip","text":"What should Juno do?","opts":[{"text":"say sorry and help fix it","emoji":"💛"},{"text":"just say sorry quickly","emoji":"💨"},{"text":"walk away","emoji":"🚶"},{"text":"say it's no big deal","emoji":"🤷"}],"ans":0,"right":"Yes! Feeling bad is OK. A real sorry says what you did and helps fix it, even after an accident.","wrong":"Hmm, that won't help Wren feel better or fix her picture. What could help the most? Try again."},{"t":"say","who":"pip","text":"A real sorry has three parts. Say what you did. Make it right. Do better next time."},{"t":"say","who":"juno","text":"Wren, I'm sorry I ripped your picture. I grabbed it too fast. I can see you feel sad.","mood":"calm"},{"t":"ask","who":"juno","text":"How can I make it right?","opts":[{"text":"help tape it","emoji":"🩹"},{"text":"laugh about it","emoji":"😂"}],"ans":0,"right":"Yes! Fixing it shows I really care. Let's get the tape.","wrong":"Hmm, laughing might hurt Wren's feelings more. What could fix the picture? Try again."},{"t":"say","who":"juno","text":"Can I help tape it? Or I can help you draw a new one.","mood":"calm"},{"t":"say","who":"wren","text":"Let's tape it together.","mood":"calm"},{"t":"say","who":"pip","text":"Juno and Wren carefully tape the picture. It's back in one piece!"},{"t":"yourturn","text":"I am sorry. Can I help?","reply":"Great reading! Those words help make things right."},{"t":"say","who":"juno","text":"Next time, I'll wait for you to say yes, and hold it gently.","mood":"proud"},{"t":"say","who":"wren","text":"I'm still a little sad about my picture. But I feel better now.","mood":"calm"},{"t":"say","who":"pip","text":"It's OK to still feel sad for a little while. Feelings take time."},{"t":"ask","who":"pip","text":"Juno said sorry. What could Wren say?","opts":[{"text":"Thank you for saying sorry.","emoji":"🤝"},{"text":"I'll never play with you!","emoji":"😠"}],"ans":0,"right":"Yes! Accepting a sorry helps friends feel close again.","wrong":"Hmm, that could make it hard to stay friends. What is a kind answer? Try again."},{"t":"say","who":"wren","text":"Thank you for saying sorry. Want to draw together?","mood":"happy"},{"t":"say","who":"pip","text":"You can say thank you for a sorry and still take time to feel better."},{"t":"yourturn","text":"Thank you for saying sorry.","reply":"Wonderful reading! You know how to be a kind friend."},{"t":"say","who":"pip","text":"If someone keeps hurting you, even after a sorry, you can stop playing. Tell a grown-up you trust, and keep telling until someone helps."},{"t":"act","kind":"count","n":3,"text":"A real sorry has three parts. Tap a star for each: say what you did, make it right, do better."},{"t":"say","who":"pip","text":"Today Juno said a real sorry. She said what she did, made it right, and will do better next time."},{"t":"mission","ic":"💛","text":"Today, practice a real sorry with a grown-up. Say what you did, make it right, and say what you will do next time."},{"t":"say","who":"juno","text":"Bye! A real sorry makes things better!","mood":"happy","anim":"wave"}]},{"id":"clean-hands","cat":"clean","title":"Super Clean Hands","ic":"🧼","summary":"After gardening, Juno learns when to wash her hands and the five steps, scrubbing along with a twenty-second timer.","grownup":{"goal":"Teaches when to wash hands (before eating, after the toilet, after touching pets or trash, after coughing, sneezing or blowing your nose) and how: wet, soap, scrub for at least twenty seconds, rinse, dry. Germs are explained calmly, without fear.","talk":["When should we wash our hands?","What are the hand washing steps?","What song can you sing while you scrub?"],"tip":"Put a small picture of the five steps by the sink, and wash hands together before meals for a week."},"steps":[{"t":"scene","bg":"garden","cast":[{"who":"juno","pos":"center","mood":"happy"}],"props":[{"p":"🌱","x":24,"y":86}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Juno has been digging in the garden all morning."},{"t":"say","who":"juno","text":"I planted five seeds! Now I'm so hungry. Time for a snack!","mood":"happy","anim":"jump"},{"t":"ask","who":"pip","text":"Juno touched dirt and plants. What should she do before her snack?","opts":[{"text":"wash her hands","emoji":"🧼"},{"text":"eat right away","emoji":"🍎"},{"text":"wipe them on her coat","emoji":"🧥"}],"ans":0,"right":"Yes! Washing hands before eating keeps germs out of our tummies.","wrong":"Hmm, dirt and germs could get on her snack. What should she do first? Try again."},{"t":"say","who":"pip","text":"Germs are tiny, too tiny to see. Soap and water wash them right off. No need to worry!"},{"t":"scene","bg":"bathroom","cast":[{"who":"pip","pos":"left","mood":"happy"},{"who":"juno","pos":"right","mood":"happy"}],"props":[{"p":"🧼","x":63,"y":52}]},{"t":"say","who":"juno","text":"I'm at the sink. What do I do first?","mood":"thinking"},{"t":"ask","who":"pip","text":"What is the first step?","opts":[{"text":"wet my hands","emoji":"💧"},{"text":"dry my hands","emoji":"🧻"}],"ans":0,"right":"Yes! First, wet your hands with clean running water, from a tap or poured from a tabo.","wrong":"We dry at the very end. What comes first? Try again."},{"t":"say","who":"juno","text":"Next, I add soap and rub my hands to make lots of bubbles!","mood":"happy"},{"t":"prop","add":[{"p":"🫧","x":72,"y":38}]},{"t":"say","who":"pip","text":"Now scrub for at least twenty seconds. Scrub your palms, the backs, between your fingers, and under your nails."},{"t":"ask","who":"juno","text":"Scrub for at least twenty seconds. What song should we sing while we scrub?","opts":[{"text":"Happy Birthday two times","emoji":"🎂"},{"text":"the alphabet song, slowly","emoji":"🔤"},{"text":"a song I make up","emoji":"🎶"}],"ans":-1,"right":"Great pick! Keep scrubbing until the timer ends. That is at least twenty seconds."},{"t":"act","kind":"timer","secs":20,"text":"Scrub along with Juno until the timer ends! Sing your song while you scrub."},{"t":"say","who":"juno","text":"Bubbles everywhere! Now I rinse them all off.","mood":"happy"},{"t":"prop","add":[{"p":"💧","x":72,"y":44}],"remove":["🫧"]},{"t":"ask","who":"pip","text":"What is the last step?","opts":[{"text":"dry with a clean towel","emoji":"🧻"},{"text":"shake and drip","emoji":"💦"}],"ans":0,"right":"Yes! Dry your hands with a clean towel.","wrong":"Dripping hands make a mess and stay wet. What should Juno use? Try again."},{"t":"prop","remove":["💧"],"add":[{"p":"🧻","x":66,"y":60}]},{"t":"yourturn","text":"Wet, soap, scrub, rinse, dry.","reply":"Great reading! Those are the five hand washing steps."},{"t":"say","who":"pip","text":"There are other important times to wash your hands too."},{"t":"ask","who":"pip","text":"When else should you wash your hands?","opts":[{"text":"after the toilet","emoji":"🚽"},{"text":"after a cartoon","emoji":"📺"},{"text":"after looking at a book","emoji":"📖"}],"ans":0,"right":"Yes! Always wash after using the toilet.","wrong":"Hmm, that one doesn't get your hands dirty. Which one does? Try again."},{"t":"say","who":"pip","text":"Also wash after touching pets or trash, and after you cough, sneeze, or blow your nose."},{"t":"yourturn","text":"I wash my hands before I eat.","reply":"Wonderful reading! Clean hands help you stay healthy."},{"t":"scene","bg":"kitchen","cast":[{"who":"juno","pos":"right","mood":"happy"}],"props":[{"p":"🍎","x":93,"y":64}]},{"t":"say","who":"juno","text":"Clean hands and a crunchy apple. Yum!","mood":"happy","anim":"jump"},{"t":"say","who":"pip","text":"Super scrubbing, friend! Juno learned to wet, soap, scrub for at least twenty seconds, rinse, and dry. And when to wash!"},{"t":"mission","ic":"🧼","text":"Wash your hands before every snack today. Hum Happy Birthday two times while you scrub!"},{"t":"say","who":"juno","text":"Bye! Scrub, scrub, rinse, rinse!","mood":"happy","anim":"wave"}]},{"id":"fresh-me","cat":"clean","title":"Sparkly Teeth and Fresh Me","ic":"🪥","summary":"Benny's morning and bedtime routine: brushing teeth for two minutes, washing his face, clean clothes and a bath.","grownup":{"goal":"Builds daily hygiene routines: brush twice a day for two minutes with a pea-sized dab of fluoride toothpaste and spit, wash your face, wear clean clothes, care for your hair and bathe regularly. Framed as feeling fresh and cared for, never as shame.","talk":["How long should we brush our teeth?","What do you do to get ready in the morning?","How do you feel after a bath?"],"tip":"Make a picture checklist for morning and bedtime, use a two-minute song or timer, and check her brushing, since most kids need help until about eight."},"steps":[{"t":"scene","bg":"bedroom","cast":[{"who":"benny","pos":"center","mood":"calm"}],"props":[{"p":"👕","x":76,"y":86}]},{"t":"say","who":"pip","text":"Hoo hoo! Good morning! Benny just woke up. His fur is fluffy and messy from sleeping."},{"t":"say","who":"benny","text":"Good morning! Time to get fresh and ready for the day.","mood":"happy","anim":"jump"},{"t":"scene","bg":"bathroom","cast":[{"who":"pip","pos":"left","mood":"happy"},{"who":"benny","pos":"right","mood":"happy"}],"props":[{"p":"🪥","x":63,"y":50}]},{"t":"say","who":"benny","text":"First, I'll brush my teeth!","mood":"happy"},{"t":"ask","who":"pip","text":"How much toothpaste should Benny use?","opts":[{"text":"a tiny dab, like a pea","emoji":"🟢"},{"text":"the whole tube","emoji":"🧴"}],"ans":0,"right":"Yes! A pea-sized dab is just right.","wrong":"That would be way too much! A tiny dab is enough. Try again."},{"t":"say","who":"benny","text":"Brush, brush, all done!","mood":"happy","anim":"jump"},{"t":"say","who":"pip","text":"Hmm, that was very quick, Benny! Brush the outside, the inside and the chewing tops of every tooth, for two whole minutes."},{"t":"act","kind":"timer","secs":30,"text":"Let's practice! Pretend to brush with gentle, short strokes: outside, inside, then the chewing tops. Real brushing takes two minutes."},{"t":"say","who":"benny","text":"Spit! My teeth feel sparkly and clean.","mood":"proud"},{"t":"say","who":"pip","text":"A grown-up helps you brush, or checks your teeth after. Ask your grown-up to check, especially at night!"},{"t":"ask","who":"pip","text":"How many times a day should we brush our teeth?","opts":[{"text":"two times","emoji":"✌️"},{"text":"once a week","emoji":"📅"}],"ans":0,"right":"Yes! Brush in the morning and at bedtime.","wrong":"Teeth need brushing more than that! Morning and night. Try again."},{"t":"yourturn","text":"I brush my teeth two times a day.","reply":"Great reading! Morning and night keeps teeth healthy."},{"t":"say","who":"pip","text":"Next, Benny washes his face with warm water and a little soap."},{"t":"prop","add":[{"p":"💧","x":70,"y":46}]},{"t":"say","who":"benny","text":"Splash! Now I'll brush my fur so it's smooth and neat.","mood":"happy"},{"t":"prop","remove":["💧"]},{"t":"scene","bg":"bedroom","cast":[{"who":"benny","pos":"center","mood":"thinking"}],"props":[{"p":"👕","x":76,"y":86},{"p":"🧦","x":83,"y":89}]},{"t":"say","who":"benny","text":"Yesterday's shirt has a sticky jam spot. What should I wear?","mood":"thinking"},{"t":"ask","who":"pip","text":"What should Benny wear today?","opts":[{"text":"a clean shirt","emoji":"👕"},{"text":"the sticky shirt","emoji":"🍓"}],"ans":0,"right":"Yes! Clean clothes and clean socks help you feel fresh.","wrong":"The sticky shirt needs a wash first. Which one is clean? Try again."},{"t":"say","who":"benny","text":"Clean shirt, clean socks. Now I feel fresh and ready for the day!","mood":"happy"},{"t":"ask","who":"pip","text":"Baths and showers keep your body clean. Which do you like best?","opts":[{"text":"a bath","emoji":"🛁"},{"text":"a shower","emoji":"🚿"},{"text":"both","emoji":"🫧"}],"ans":-1,"right":"Both work! Many kids have one in the evening, then feel fresh and cozy."},{"t":"scene","bg":"night","cast":[{"who":"benny","pos":"center","mood":"calm"}]},{"t":"say","who":"pip","text":"Later, at bedtime, Benny is clean from his bath and cozy in his pajamas."},{"t":"ask","who":"benny","text":"What do I need to do before bed?","opts":[{"text":"brush my teeth","emoji":"🪥"},{"text":"eat candy","emoji":"🍬"}],"ans":0,"right":"Yes! Brushing at night cleans away the food from the day.","wrong":"Hmm, candy at bedtime is not good for teeth. What should Benny do? Try again."},{"t":"yourturn","text":"I am all clean for bed.","reply":"Wonderful reading! Being fresh and clean feels so good."},{"t":"say","who":"benny","text":"Brush, brush, spit! Now I feel fresh and cozy. Good night!","mood":"calm"},{"t":"say","who":"pip","text":"Today Benny brushed his teeth for two minutes, washed his face, wore clean clothes, and had a bath."},{"t":"mission","ic":"🪥","text":"Tonight, brush your teeth for two whole minutes. Use a timer or sing a song while you brush."},{"t":"say","who":"benny","text":"Good night, friend! Sparkly teeth!","mood":"happy","anim":"wave"}]},{"id":"tidy-room","cat":"clean","title":"Tidy Room Team","ic":"🧸","summary":"Kiko can't find her teddy in her messy room; Benny helps her give everything a home and make tidying a game.","grownup":{"goal":"Teaches simple organizing: everything has a home, clean up as you go, make tidying a game, and helping at home is teamwork. Small, concrete steps make tidying manageable for a seven-year-old.","talk":["Where do your toys live?","What makes tidying more fun?","How do you help at home?"],"tip":"Label bins or shelves with pictures so every toy has a clear home, and do a five-minute tidy-up together before bed."},"steps":[{"t":"scene","bg":"bedroom","cast":[{"who":"kiko","pos":"left","mood":"sad"}],"props":[{"p":"🧱","x":36,"y":89},{"p":"📕","x":52,"y":90},{"p":"🧦","x":61,"y":87},{"p":"🖍️","x":45,"y":91},{"p":"👕","x":69,"y":90}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Kiko is looking for her teddy bear. But her room is very messy."},{"t":"say","who":"kiko","text":"Where is my teddy? I can't find anything in this mess!","mood":"sad"},{"t":"ask","who":"pip","text":"Kiko can't find her teddy. How do you think she feels?","opts":[{"text":"upset","emoji":"😣"},{"text":"sleepy","emoji":"😴"}],"ans":0,"right":"Yes. Losing a toy can feel upsetting. Big feelings are OK. Let's help Kiko!","wrong":"Look at Kiko's sad face. She can't find her teddy. How might that feel? Try again."},{"t":"move","who":"benny","pos":"right"},{"t":"say","who":"benny","text":"Hi, Kiko! You look frustrated. That's when something feels hard. I can help. Let's be the Tidy Room Team!","mood":"happy","anim":"jump"},{"t":"say","who":"benny","text":"Here's the secret. Everything has a home, so we can always find it. Can you help?"},{"t":"ask","who":"benny","text":"Where do the blocks go?","opts":[{"text":"in the toy box","emoji":"📦"},{"text":"on the bed","emoji":"🛏️"}],"ans":0,"right":"Yes! Blocks live in the toy box.","wrong":"Hmm, the bed is for sleeping. Where do toys live? Try again."},{"t":"prop","remove":["🧱"]},{"t":"ask","who":"kiko","text":"Where does my book go?","opts":[{"text":"on the shelf","emoji":"📚"},{"text":"under the bed","emoji":"🛏️"}],"ans":0,"right":"Yes! Books live on the shelf, so we can find them.","wrong":"Under the bed, we might lose it! Where do books live? Try again."},{"t":"prop","remove":["📕"]},{"t":"say","who":"kiko","text":"What about my socks and shirt?","mood":"thinking"},{"t":"ask","who":"benny","text":"Where do dirty clothes go?","opts":[{"text":"the clothes basket","emoji":"🧺"},{"text":"the toy box","emoji":"📦"}],"ans":0,"right":"Yes! Dirty clothes go in the laundry basket to get washed.","wrong":"Toys and clothes have different homes. Where do dirty clothes go? Try again."},{"t":"prop","add":[{"p":"🧺","x":93,"y":86}],"remove":["🧦","👕"]},{"t":"say","who":"benny","text":"Let's make tidying a game! Can we pick up the crayons before the timer ends?","mood":"happy"},{"t":"act","kind":"timer","secs":15,"text":"Ready, set, tidy! Pretend to pick up crayons as fast as you can before the timer ends."},{"t":"prop","add":[{"p":"🧸","x":42,"y":87}],"remove":["🖍️"]},{"t":"say","who":"kiko","text":"Look! My teddy was under the crayons! Now I can see everything.","mood":"happy","anim":"jump"},{"t":"yourturn","text":"Toys go back home.","reply":"Great reading! Everything has a home."},{"t":"say","who":"benny","text":"Now let's fix the bed. Pull the blanket up and put the pillow on top.","mood":"happy"},{"t":"say","who":"kiko","text":"My room looks so tidy! It was faster with a team.","mood":"proud"},{"t":"say","who":"pip","text":"Tidying is a way to help your family. When everyone helps, home feels nice for everyone."},{"t":"ask","who":"pip","text":"How can you keep your room tidy?","opts":[{"text":"clean up as I go","emoji":"🧹"},{"text":"tidy before bed","emoji":"🌙"},{"text":"ask a grown-up to help","emoji":"🤝"}],"ans":-1,"right":"Great idea! Little tidy-ups each day keep big messes away."},{"t":"yourturn","text":"I can help at home.","reply":"Yes, you can! You are a great helper."},{"t":"say","who":"kiko","text":"Next time, I'll put my toys away when I'm done playing.","mood":"calm"},{"t":"say","who":"pip","text":"Today Kiko and Benny gave everything a home, made tidying a game, and worked as a team."},{"t":"mission","ic":"🧸","text":"Tonight at tidy time, put your toys, books and clothes back in their homes. Then show a grown-up!"},{"t":"say","who":"kiko","text":"Bye! Go, Tidy Room Team!","mood":"happy","anim":"wave"}]},{"id":"neat-school","cat":"clean","title":"Neat and Ready at School","ic":"🎒","summary":"Juno packs her backpack the night before, and at school she and Benny learn neat, healthy classroom habits.","grownup":{"goal":"Builds school routines: packing the night before, a tidy desk, caring for shared supplies, pushing in chairs, sneezing into an elbow or tissue then washing hands, flushing and washing after the toilet, and cleaning up lunch.","talk":["What goes in your backpack?","Where should you sneeze?","How can you keep your desk neat?"],"tip":"Make packing the backpack part of the bedtime routine, with a simple checklist by the door."},"steps":[{"t":"scene","bg":"bedroom","cast":[{"who":"juno","pos":"center","mood":"happy"}],"props":[{"p":"🎒","x":72,"y":86}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! It's the night before school. Juno is getting her backpack ready."},{"t":"say","who":"juno","text":"Getting ready the night before means my morning is calm, not rushed.","mood":"happy"},{"t":"ask","who":"juno","text":"How do you feel when your morning is rushed?","opts":[{"text":"grumpy","emoji":"😣"},{"text":"upset","emoji":"😟"},{"text":"it is OK","emoji":"🙂"}],"ans":-1,"right":"Thanks for telling me. Packing the night before can make mornings feel calm."},{"t":"ask","who":"juno","text":"What should go in my backpack?","opts":[{"text":"my folder and water bottle","emoji":"📁"},{"text":"my whole toy box","emoji":"🧸"}],"ans":0,"right":"Yes! My folder and my water bottle help me learn and stay ready.","wrong":"Hmm, that's too much for school! What do I need for learning? Try again."},{"t":"say","who":"juno","text":"Folder, water bottle, pencil case. All packed!","mood":"proud"},{"t":"scene","bg":"classroom","cast":[{"who":"juno","pos":"left","mood":"happy"},{"who":"rosa","pos":"center","mood":"happy"},{"who":"benny","pos":"right","mood":"happy"}],"props":[{"p":"✏️","x":30,"y":87}]},{"t":"say","who":"rosa","text":"Good morning, class! Let's hang up our coats and put our bags in our cubbies.","mood":"happy","anim":"wave"},{"t":"say","who":"benny","text":"Oh no, my nose tickles. I feel a sneeze coming!","mood":"surprised"},{"t":"ask","who":"rosa","text":"Benny needs to sneeze. Where should he sneeze?","opts":[{"text":"into his elbow","emoji":"💪"},{"text":"into his hand","emoji":"✋"},{"text":"toward a friend","emoji":"😮"}],"ans":0,"right":"Yes! Sneeze or cough into your elbow or a tissue. That keeps germs off your hands.","wrong":"Hands touch toys and doors, and friends don't want germs. Where can Benny cover a sneeze?"},{"t":"say","who":"rosa","text":"Benny sneezed into his elbow. Great! If you use a tissue, throw it away, then wash your hands."},{"t":"yourturn","text":"Sneeze in your elbow.","reply":"Great reading! That keeps everyone healthy."},{"t":"say","who":"juno","text":"My desk is so messy, I can't find my pencil!","mood":"thinking"},{"t":"ask","who":"rosa","text":"How can Juno keep her desk neat?","opts":[{"text":"put things back","emoji":"✏️"},{"text":"push it all off","emoji":"💥"}],"ans":0,"right":"Yes! When everything goes back in its place, it's easy to find.","wrong":"Pushing things off makes a bigger mess. When things go back in their spot, you can find them."},{"t":"prop","remove":["✏️"]},{"t":"say","who":"rosa","text":"Our crayons and markers are shared supplies. Let's take care of them so everyone can use them."},{"t":"say","who":"benny","text":"I'll put the caps back on the markers!","mood":"proud"},{"t":"say","who":"pip","text":"Oops! Juno almost trips on a chair. Benny pushes his chair in. Now nobody will trip."},{"t":"yourturn","text":"Push in my chair.","reply":"You read it! Pushed-in chairs keep our room safe."},{"t":"scene","bg":"classroom","cast":[{"who":"juno","pos":"left","mood":"happy"},{"who":"benny","pos":"right","mood":"happy"}],"props":[{"p":"🥪","x":44,"y":62},{"p":"🍎","x":55,"y":62}]},{"t":"say","who":"pip","text":"Lunch time! Juno and Benny wash their hands, then eat at their desks."},{"t":"say","who":"benny","text":"That was yummy! I'm done!","mood":"happy","anim":"jump"},{"t":"ask","who":"juno","text":"Benny is done, but his lunch mess is still on the desk. What should he do?","opts":[{"text":"clean up his space","emoji":"🧹"},{"text":"leave it for someone","emoji":"🙈"}],"ans":0,"right":"Yes! Throw away trash and wipe up crumbs. Leave your space clean for the next person.","wrong":"Hmm, cleaning up is everyone's job. What should Benny do? Try again."},{"t":"prop","remove":["🥪","🍎"]},{"t":"say","who":"pip","text":"And after using the toilet at school, always flush and wash your hands."},{"t":"act","kind":"count","n":4,"text":"Tap a star for each neat school habit: elbow sneeze, neat desk, pushed-in chair, clean lunch space."},{"t":"say","who":"pip","text":"Great job, friend! Juno and Benny packed the night before, sneezed into elbows, kept desks neat, and cleaned up."},{"t":"mission","ic":"🎒","text":"Tonight, pack your backpack with a grown-up, and add a tissue pack. Cover every cough and sneeze tomorrow!"},{"t":"say","who":"juno","text":"Bye! See you at school!","mood":"happy","anim":"wave"}]},{"id":"out-and-about","cat":"clean","title":"Kind and Tidy Everywhere","ic":"🗑️","summary":"Mr. Bruno takes Juno and Benny to town, the library and the park, where they practice respect in shared places.","grownup":{"goal":"Applies respect and tidiness to shared places: trash in the bin or carried home, quiet voices in the library, waiting in line, putting things back, leaving places clean, and washing hands after touching trash and before eating.","talk":["Where do we put trash when we're out?","Why do we use quiet voices in a library?","How can we leave a place clean?"],"tip":"On your next outing, let her be the Clean Team leader who checks that you leave the table or bench as clean as you found it."},"steps":[{"t":"scene","bg":"town","cast":[{"who":"juno","pos":"left","mood":"happy"},{"who":"bruno","pos":"center","mood":"happy"},{"who":"benny","pos":"right","mood":"happy"}],"props":[{"p":"🍌","x":90,"y":86}]},{"t":"say","who":"pip","text":"Hoo hoo! Hello, friend! Mr. Bruno is taking Juno and Benny to town. They're going to the library and the park."},{"t":"say","who":"benny","text":"I finished my banana! I'll just drop the peel here.","mood":"happy"},{"t":"ask","who":"juno","text":"Benny wants to drop his banana peel on the sidewalk. What should he do?","opts":[{"text":"put it in the bin","emoji":"🗑️"},{"text":"drop it there","emoji":"🍌"}],"ans":0,"right":"Yes! Trash goes in the bin. That keeps our town clean for everyone.","wrong":"Hmm, litter makes places messy, and someone could slip. Where should trash go? Try again."},{"t":"prop","remove":["🍌"]},{"t":"say","who":"bruno","text":"Good thinking! And if there's no bin nearby, we carry our trash home.","mood":"proud"},{"t":"yourturn","text":"Trash goes in the bin.","reply":"Great reading! You help keep the world clean."},{"t":"say","who":"pip","text":"Next stop, the library. Libraries are quiet places where people read and think."},{"t":"prop","add":[{"p":"📕","x":90,"y":62}]},{"t":"say","who":"juno","text":"Wow, so many books! Benny! Look at this one!","mood":"surprised","anim":"jump"},{"t":"ask","who":"bruno","text":"Juno is talking very loudly in the library. What kind of voice should she use?","opts":[{"text":"a quiet voice","emoji":"🤫"},{"text":"a shouting voice","emoji":"📢"}],"ans":0,"right":"Yes! It's great to feel excited. In a library, a quiet voice is respectful to readers.","wrong":"Shouting can bother people who are reading. Which voice fits a library? Try again."},{"t":"say","who":"juno","text":"Oops. I'll use my quiet voice. Benny, look at this book.","mood":"calm"},{"t":"ask","who":"bruno","text":"Juno is done looking at a book. Where should it go?","opts":[{"text":"back where it goes","emoji":"📚"},{"text":"on the floor","emoji":"👇"}],"ans":0,"right":"Yes! Putting things back shows respect, and the next person can find it.","wrong":"Books on the floor can get stepped on. Where does a book belong? Try again."},{"t":"say","who":"juno","text":"Back on the shelf it goes! Now the next reader can find it.","mood":"proud"},{"t":"say","who":"pip","text":"Then they wait in line to borrow their books. There are three people ahead of them."},{"t":"ask","who":"juno","text":"What should we do in a line?","opts":[{"text":"wait for my turn","emoji":"🧍"},{"text":"cut to the front","emoji":"🏃"}],"ans":0,"right":"Yes! Waiting your turn is fair to everyone.","wrong":"Cutting isn't fair to people who were waiting first. What should we do? Try again."},{"t":"yourturn","text":"I can wait in line.","reply":"Wonderful reading! Waiting your turn is kind and fair."},{"t":"scene","bg":"park","cast":[{"who":"juno","pos":"left","mood":"happy"},{"who":"benny","pos":"right","mood":"happy"},{"who":"bruno","pos":"center","mood":"happy"}],"props":[{"p":"🛝","x":12,"y":80},{"p":"🗑️","x":92,"y":84}]},{"t":"say","who":"pip","text":"Last stop, the park! Juno and Benny play on the slide, then wash their hands and have a snack."},{"t":"ask","who":"benny","text":"We left snack wrappers on the bench. What should we do before we leave?","opts":[{"text":"clean up our space","emoji":"🧹"},{"text":"leave them there","emoji":"🙈"}],"ans":0,"right":"Yes! Leave places as clean as you found them, or even cleaner.","wrong":"Hmm, then the park would be messy for the next kids. What should we do? Try again."},{"t":"act","kind":"move","secs":6,"text":"Pretend to pick up three wrappers and toss them in the bin. Toss, toss, toss!"},{"t":"say","who":"pip","text":"After touching trash, wash your hands. And always wash before you eat y function face(cx, cy, s, mood, o){

    if(mood==="proud") return `<path d="M${x-6} -2 Q${x} -9 ${x+6} -2" stroke="${lineCol}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    if(mood==="surprised" || mood==="scared") return `<circle cx="${x}" cy="-4" r="8" fill="#fff" stroke="${ink}" stroke-width="1.5"/><circle cx="${x}" cy="-4" r="${mood==="scared"?2.6:3.6}" fill="${ink}"/>`;
    const dx = mood==="thinking" ? 2 : 0, dy = mood==="thinking" ? -2 : mood==="sad" ? 1.5 : 0;
    return `${o.dark?`<ellipse cx="${x}" cy="-4" rx="7.5" ry="8.5" fill="#fff"/>`:""}<ellipse cx="${x+dx}" cy="${-4+dy}" rx="5" ry="6.2" fill="${ink}"/><circle cx="${x+dx+1.8}" cy="${-6+dy}" r="1.8" fill="#fff"/>`;
  };
  const b = BROWS[mood], l = `M${b[0]} ${b[1]} Q${b[2]} ${b[3]} ${b[4]} ${b[5]}`;
  const r = mood==="thinking" ? "M8 -20 Q14 -25 20 -21" : `M${-b[0]} ${b[1]} Q${-b[2]} ${b[3]} ${-b[4]} ${b[5]}`;
  const brows = `<path d="${l} ${r}" stroke="${brow}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const my = o.my || 14, st = `stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"`;

    happy:`<path d="M-9 ${my-4} Q0 ${my+5} 9 ${my-4}" ${st}/>`,
    proud:`<path d="M-11 ${my-5} Q0 ${my+11} 11 ${my-5} Z" fill="#5A1F2B"/><path d="M-6 ${my+2} Q0 ${my+6} 6 ${my+2} Z" fill="#F08AA0"/>`,
    sad:`<path d="M-8 ${my+2} Q0 ${my-5} 8 ${my+2}" ${st}/>`,
    angry:`<path d="M-8 ${my+1} Q0 ${my-4} 8 ${my+1}" ${st} stroke-width="3.5"/>`,
    scared:`<path d="M-9 ${my} q2.25 -3 4.5 0 t4.5 0 t4.5 0 t4.5 0" ${st} stroke-width="2.5"/>`,
    surprised:`<ellipse cx="0" cy="${my}" rx="4.5" ry="5.5" fill="#5A1F2B"/>`,
    calm:`<path d="M-6 ${my-2} Q0 ${my+2} 6 ${my-2}" ${st}/>`,
    thinking:`<path d="M-5 ${my} Q2 ${my-1.5} 8 ${my-3}" ${st}/>`
  };
  const small = ["sad","angry","scared"].includes(mood);
  const MO = mood==="surprised" ? `<ellipse cx="0" cy="${my}" rx="5" ry="7" fill="#5A1F2B"/>`
    : small ? `<ellipse cx="0" cy="${my}" rx="6" ry="4.5" fill="#5A1F2B"/>`
    : `<ellipse cx="0" cy="${my}" rx="7" ry="6" fill="#5A1F2B"/><ellipse cx="0" cy="${my+3}" rx="4" ry="2.4" fill="#F08AA0"/>`;
  const blush = ["happy","proud","calm"].includes(mood) ? `<circle cx="-21" cy="7" r="5" fill="#FF8FA8" opacity=".45"/><circle cx="21" cy="7" r="5" fill="#FF8FA8" opacity=".45"/>`
    : mood==="angry" ? `<circle cx="-21" cy="7" r="6" fill="#FF5A5A" opacity=".35"/><circle cx="21" cy="7" r="6" fill="#FF5A5A" opacity=".35"/>` : "";

  return `<g transform="translate(${cx} ${cy}) scale(${s})">${blush}${eye(-14)}${eye(14)}${brows}${mouth}${tear}</g>`;
}
function starPath(cx, cy, r){

}
