/* ---------------- Cartoon Club: player ---------------- */
let P = null; // the episode playing now
let TOKC = 0; // global step token so stale async work from an earlier step or episode never advances the current one
const charT = x => `translate(${x}px,400px) scale(${CH_SCALE})`;
function charG(who, c, x){
  return `<g class="ch enter" data-who="${who}" data-pos="${c.pos}" style="transform:${charT(x===undefined?POSX[c.pos]:x)}"><g class="ch-in">${ART[who](c.mood||"happy")}</g></g>`;
}
function drawProps(){
  const g = document.querySelector("#stage #props"); if(!g) return;
  g.innerHTML = P.stage.props.map(p=>`<text class="prop" x="${(p.x*8).toFixed(0)}" y="${(p.y*4.5).toFixed(0)}" font-size="46" text-anchor="middle" dominant-baseline="central">${p.p}</text>`).join("");
}
function drawStage(){
  const st = P.stage, el = $("#stage"); if(!el) return;
  el.innerHTML = (BG[st.bg]||BG.park)() + `<g id="props"></g><g id="chars">${Object.entries(st.cast).map(([w,c])=>charG(w,c)).join("")}</g>`;
  drawProps();
}
function chEl(who){ return document.querySelector(`#stage .ch[data-who="${who}"]`) }
function setMood(who, mood){
  const c = P.stage.cast[who]; if(!c || !ART[who]) return;
  c.mood = mood; const el = chEl(who); if(el) el.querySelector(".ch-in").innerHTML = ART[who](mood);
}
function playAnim(who, anim){
  const el = chEl(who); if(!el || !anim || anim==="none") return;
  const inner = el.querySelector(".ch-in");
  inner.classList.remove("a-jump","a-shake","a-droop","a-wave","a-spin","a-nod","a-tremble");
  void inner.getBoundingClientRect();
  inner.classList.add("a-"+anim);
  inner.addEventListener("animationend", ()=>inner.classList.remove("a-"+anim), {once:true});
}
function moveChar(who, pos){
  const st = P.stage; let el = chEl(who);
  if(pos==="off"){
    if(el && el.dataset.leaving==="1") return;
    const cur = st.cast[who] ? st.cast[who].pos : (el && el.dataset.pos) || "center";
    if(st.cast[who]) st.lastMood = Object.assign(st.lastMood||{}, {[who]: st.cast[who].mood});
    delete st.cast[who];
    if(!el) return;
    el.dataset.leaving = "1"; el.style.transform = charT(cur==="left" ? POSX.offL : POSX.offR);
    setTimeout(()=>{ if(el.dataset.leaving==="1") el.remove() }, 950);
    return;
  }
  if(st.cast[who] && el && el.dataset.leaving!=="1"){ st.cast[who].pos = pos; el.dataset.pos = pos; el.style.transform = charT(POSX[pos]); return }
  st.cast[who] = {pos, mood:(st.lastMood && st.lastMood[who]) || "happy"};
  if(el){ delete el.dataset.leaving; el.dataset.pos = pos; el.style.transform = charT(POSX[pos]); return }
  const chars = document.querySelector("#stage #chars"); if(!chars) return;
  chars.insertAdjacentHTML("beforeend", charG(who, st.cast[who], pos==="left" ? POSX.offL : POSX.offR));
  el = chEl(who); el.dataset.pos = pos; void el.getBoundingClientRect();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.transform = charT(POSX[pos]) }));
}
function capWords(text, act){
  let out = "", idx = 0;
  String(text).split(/(\s+)/).forEach(t=>{
    out += /\S/.test(t) ? `<span class="w" data-act="${act||"tWord"}" data-ci="${idx}" data-arg="${esc(t.replace(/[^A-Za-z']/g,""))}">${esc(t)}</span>` : t;
    idx += t.length;
  });
  return out;
}
function showCaption(who, text){
  const w = $("#capwho"), t = $("#ctext"); if(!w || !t) return;
  w.textContent = who && CAST[who] ? CAST[who].name : ""; w.style.setProperty("--c", who && CAST[who] ? CAST[who].color : "var(--blue)");
  t.innerHTML = text ? capWords(text) : "";
}
function litWord(ci){
  const spans = [...document.querySelectorAll("#ctext .w")]; let hit = null;
  spans.forEach(s=>{ if(+s.dataset.ci <= ci) hit = s });
  spans.forEach(s=>s.classList.toggle("say", s===hit));
}
// Speak a line as a cast member with a moving mouth. Resolves true if the episode is still on the same step.
async function speakLine(who, text, tok){
  if(!P || tok!==P.tok) return false;
  showCaption(who, text);
  const el = chEl(who), cw = $("#capwho"), tag = {}; let iv = null;
  clearInterval(P.mouthIv);
  if(el){ el._talk = tag; el.classList.add("talking"); iv = P.mouthIv = setInterval(()=>el.classList.toggle("mopen"), 140) } else if(cw){ cw._talk = tag; cw.classList.add("talking") }
  const t0 = Date.now();
  await say(text, {kind:"sent", who, onWord:litWord});
  // Even if speech fails or ends at once, leave the caption up long enough to read.
  const floor = Math.max(1200, String(text).split(/\s+/).length*330) - (Date.now()-t0);
  if(floor>0 && P && tok===P.tok) await wait(floor);
  if(iv) clearInterval(iv);
  if(el && el._talk===tag) el.classList.remove("talking","mopen");
  if(cw && cw._talk===tag) cw.classList.remove("talking");
  if(P && tok===P.tok) document.querySelectorAll("#ctext .w.say").forEach(s=>s.classList.remove("say"));
  return !!P && tok===P.tok;
}
function setTurn(t){
  const a = $("#turnCast"), b = $("#turnKid"), y = $("#yt"); if(!a || !b) return;
  a.classList.toggle("on", t==="cast"); b.classList.toggle("on", t==="kid");
  if(y){ y.hidden = t!=="kid"; if(t==="kid"){ clearTimeout(P.ytTimer); P.ytTimer = setTimeout(()=>{ if($("#yt")) $("#yt").hidden = true }, 1800) } }
}
function updPause(){ const b = $("#tPauseBtn"); if(b && P){ b.textContent = P.paused ? "▶ Play" : "⏸ Pause"; b.classList.toggle("glow", P.paused) } }
function addToonStar(){ K.stars++; P.stars++; const s = $("#toonStars"); if(s) s.textContent = K.stars; save() }
function startToon(id){
  const ep = EPISODES.find(e=>e.id===id); if(!ep || !K){ go("toons"); return }
  go("toon"); inRound = true;
  P = {ep, i:-1, tok:++TOKC, stage:{bg:"park", cast:{}, props:[]}, stars:0, right:0, graded:0, read:0, paused:false, t0:Date.now(), done:new Set(), tries:{}};
  const kidAv = `<span class="av sm" style="background:${esc(K.color||"#3B7FD6")}">${esc((K.name||"?")[0].toUpperCase())}</span>`;
  app().innerHTML = `
    <div class="top toontop"><button class="btn ghost sm" data-act="tQuit" aria-label="Stop the cartoon">✕</button>
      <div class="turns" aria-live="polite"><span class="turn" id="turnCast">🦉 Pip and friends</span><span class="turn" id="turnKid">${kidAv} You</span></div>
      <span class="row" style="gap:8px">${speedChip()}<span class="stars"><span class="s">★</span><span id="toonStars">${K.stars}</span></span></span></div>
    <div class="stagebox"><svg class="stage" id="stage" viewBox="0 0 800 450" role="img" aria-label="${esc(ep.title)}"></svg><div class="yt" id="yt" hidden>Your turn!</div></div>
    <div class="cap"><span class="capwho" id="capwho"></span><span class="ctext" id="ctext"></span></div>
    <div class="tpanel" id="tpanel"></div>
    <div class="row tctl"><button class="btn ghost sm" data-act="tPause" id="tPauseBtn">⏸ Pause</button><button class="btn ghost sm" data-act="tRepeat">↺ Repeat</button><button class="btn ghost sm" data-act="tSkip">Skip ⏭</button></div>`;
  nextStep();
}
function nextStep(){ if(!P) return; P.i++; runStep() }
function clearWaits(){ if(P){ P.awaiting = null; P.awaitRead = null; P.actStep = null; P.counting = null; P.awaitMission = null; P.answering = false } }
// First time a step is finished: returns true once, so Repeat or Pause/Play can never pay its stars twice.
function firstFinish(){ if(P.done.has(P.i)) return false; P.done.add(P.i); return true }
// Play (after Pause) or closing the voice menu: continue, without asking a finished question again.
function resumeToon(){ const s = P.ep.steps[P.i]; if(s && P.done.has(P.i) && ["ask","yourturn","act"].includes(s.t)) nextStep(); else runStep() }
function revealPanel(){ const p = $("#tpanel"); if(p && p.getBoundingClientRect().bottom > window.innerHeight) p.scrollIntoView({block:"nearest", behavior:"smooth"}) }
async function runStep(){
  if(!P) return;
  const tok = P.tok = ++TOKC; clearWaits(); P.paused = false; updPause();
  const s = P.ep.steps[P.i];
  if(!s){ endToon(); return }
  const ok = () => !!P && P.tok===tok;
  setTurn(["ask","yourturn","act","mission"].includes(s.t) ? "kid" : "cast");
  const panel = $("#tpanel"); if(panel) panel.innerHTML = "";
  if(s.t==="scene"){
    P.stage = {bg:s.bg, cast:{}, props:(s.props||[]).map(p=>Object.assign({}, p))};
    (s.cast||[]).forEach(c=>{ P.stage.cast[c.who] = {pos:c.pos, mood:c.mood||"happy"} });
    drawStage(); showCaption(null, ""); await wait(700);
  } else if(s.t==="say"){
    if(s.mood) setMood(s.who, s.mood);
    if(s.anim) playAnim(s.who, s.anim);
    if(!await speakLine(s.who, s.text, tok)) return;
    await wait(380);
  } else if(s.t==="move"){ moveChar(s.who, s.pos); await wait(950) }
  else if(s.t==="prop"){
    (s.remove||[]).forEach(p=>{ P.stage.props = P.stage.props.filter(x=>x.p!==p) });
    (s.add||[]).forEach(p=>P.stage.props.push(Object.assign({}, p)));
    drawProps(); await wait(450);
  }
  else if(s.t==="ask"){ runAsk(s, tok); return }
  else if(s.t==="yourturn"){ runYourTurn(s, tok); return }
  else if(s.t==="act"){ runAct(s, tok); return }
  else if(s.t==="mission"){ runMission(s, tok); return }
  if(ok() && !P.paused) nextStep();
}
async function runAsk(s, tok){
  const opts = s.opts.map((o,k)=>Object.assign({k}, o));
  const order = s.ans===-1 ? opts : shuffle(opts);
  $("#tpanel").innerHTML = `<div class="opts toonopts locked${order.length===3?" three":""}">${order.map(o=>`<button class="opt txt" data-act="tAns" data-arg="${o.k}">${o.emoji?`<span class="oe">${o.emoji}</span>`:""}<span>${esc(o.text)}</span></button>`).join("")}</div>`;
  if(!await speakLine(s.who, s.text, tok)) return;
  const box = document.querySelector(".toonopts"); if(box) box.classList.remove("locked");
  P.awaiting = {s, tok, tries:P.tries[P.i]||0}; revealPanel();
}
async function toonAnswer(k){
  const a = P && P.awaiting; if(!a || a.tok!==P.tok || P.answering) return;
  const s = a.s, tok = a.tok, btns = [...document.querySelectorAll(".toonopts .opt")];
  const el = btns.find(b=>+b.dataset.arg===k); if(!el || el.disabled) return;
  P.answering = true;
  let reply, done = true;
  if(s.ans===-1){
    el.classList.add("right"); btns.forEach(b=>{ if(b!==el) b.classList.add("dim") });
    reply = (s.opts[k] && s.opts[k].reply) || s.right; if(firstFinish()) addToonStar(); chime(true); burst();
  } else if(k===s.ans){
    el.classList.add("right"); btns.forEach(b=>{ if(b!==el) b.classList.add("dim") });
    reply = s.right; if(firstFinish()){ if(a.tries===0) P.right++; P.graded++; addToonStar() } chime(true); burst(); playAnim(s.who, "jump");
  } else if(a.tries===0){

// What the screen says while Pip answers (he is the one choosing, not her).
function vsPipPrompt(item){

function vsReveal(el){ if(el && el.getBoundingClientRect().bottom > window.innerHeight) el.scrollIntoView({block:"end", behavior:"smooth"}) }
// Same listen-first lock as the adventure: answers open once the word has been heard or the text had time to be read.
function vsMyTurn(item, tok){
  const unlock = () => { if(V && V.tok===tok && !V.open){ V.open = true; V.openAt = Date.now(); const o = $("#vsOpts"); if(o) o.classList.remove("locked") } };

function vsAnswer(v, el){

  };

async function vsPipTurn(item, tok){
  const ok = () => !!V && V.tok===tok;
  // The child hears the question too, so she can check Pip's answer.
  if(item.kind==="listen"){ await wait(400); if(!ok()) return; await say(item.say, {kind:"sent"}) }
  else await wait(1400);
  if(!ok()) return;
  await say("Hmm, let me think.", {kind:"sent", who:"pip"}); await wait(600);
  if(!ok()) return;
  // Pip is right more often when she is ahead and wrong more often when she is behind, so games stay close.
  // Tuned by simulation: a child answering 70-85% right wins about 2 in 3 to 4 in 5 games and rarely loses big,
  // and careful judging beats tapping "mistake" every time.
  const d = V.me - V.pip, acc = clamp(0.6 + (d>0 ? 0.06 : 0.14)*d, 0.2, 0.85);
  const correct = Math.random() < acc;
  const wrongs = item.opts.filter(o=>o.v!==item.ans);
  const choice = correct || !wrongs.length ? item.ans : pick(wrongs).v;
  V.pipChoice = choice; V.pipCorrect = choice===item.ans;
  const btn = [...document.querySelectorAll("#vsOpts .opt")].find(b=>b.dataset.arg===choice);
  if(btn) btn.classList.add("pippick");
  const box = $("#vsOpts"); if(box) box.classList.remove("locked");   // full color so his pick is easy to read (buttons stay disabled)
  // Pip doesn't say his answer out loud: she has to read his pick to judge it.

  await say("I pick this one!", {kind:"sent", who:"pip"});
  if(!ok()) return;
  $("#vsJudge").innerHTML = `<p class="prompt">Is Pip right?</p><div class="opts judge">
    <button class="opt txt" data-act="vsJudge" data-arg="yes"><span class="oe">👍</span><span>Pip is right</span></button>
    <button class="opt txt" data-act="vsJudge" data-arg="no"><span class="oe">👎</span><span>Pip made a mistake</span></button></div>`;

function vsJudge(v){

  const tok = V.tok, item = V.item, saysWrong = v==="no";
  document.querySelectorAll("#vsJudge .opt").forEach(b=>{ b.disabled = true; if(b.dataset.arg===v) b.classList.add("chosen") });
  const btns = [...document.querySelectorAll("#vsOpts .opt")];
  const ansBtn = btns.find(b=>b.dataset.arg===item.ans), pipBtn = btns.find(b=>b.dataset.arg===V.pipChoice);
  const finish = (msg, good) => { vsScoreUI(); vsCheer(msg, good); chime(good);
    say(msg, {kind:"sent"}).then(()=>setTimeout(()=>{ if(V && V.tok===tok){ V.i++; vsTurn() } }, 700)) };
  if(V.pipCorrect){
    V.pip++; V.pipRight++; if(ansBtn) ansBtn.classList.add("right");
    if(!saysWrong){ vsPip("Thanks for checking!", "happy"); finish("Yes! Pip was right. Point for Pip.", true) }
    else { V.falseAlarms++; vsPip("I got this one!", "proud"); finish("Actually, Pip was right this time. Point for Pip.", false) }
    return;
  }

  if(!saysWrong){ if(ansBtn) ansBtn.classList.add("right"); vsPip("Oh no, I got mixed up!", "sad"); finish("Oops! Pip made a mistake. The green one is right.", false); return }

function vsFix(v, el){

function endVs(){
  inRound = false; V.tok = ++VTOK;
  dayRec().ms += Date.now()-V.t0;
  const win = V.me > V.pip, tie = V.me===V.pip, bonus = win ? 3 : tie ? 2 : 1;
  K.stars += bonus;
  K.vs = K.vs || {n:0, w:0, t:0, c:0, best:0};
  K.vs.n++; if(win) K.vs.w++; if(tie) K.vs.t++; K.vs.c += V.catches; K.vs.fa = (K.vs.fa||0) + V.falseAlarms; K.vs.best = Math.max(K.vs.best||0, V.me); K.vs.last = Date.now();
  const got = awardStickers(); save();
  const title = win ? "You win!" : tie ? "It's a tie!" : "Pip wins this time!";
  const line = win ? "You beat Pip! Great reading and great checking." : tie ? "What a close game! You and Pip are a great team." : "That was close! You read so well. Want a rematch?";
  const ups = V.ups.filter(u=>u.to>u.from);
  app().innerHTML = `<div class="card hero">${win ? owl(120,"happy") : owl(120)}<h1>${title}</h1>
    <div class="vsfinal"><span>${vsAv()} You <b>${V.me}</b></span><span class="vsmid">VS</span><span><b>${V.pip}</b> Pip 🦉</span></div>
    <p class="bubble" style="margin-left:10px">${line}</p>
    ${V.catches ? `<p>You caught Pip's mistakes <b>${V.catches}</b> ${V.catches===1?"time":"times"}!</p>` : ""}
    <p class="stars" style="font-size:1.5rem"><span class="s">★</span> +${bonus} bonus stars</p>
    ${ups.map(u=>`<p class="bubble" style="margin-left:10px">Your <b>${SKILLS[u.skill].name}</b> flower grew! Now: ${SKILLS[u.skill].levels[u.to]}</p>`).join("")}
    ${got.length ? `<div><h3>New sticker!</h3><div style="font-size:3.6rem">${got.join(" ")}</div></div>` : ""}
    <div class="row" style="justify-content:center"><button class="btn big" data-act="vs">Rematch ▶</button><button class="btn ghost" data-act="go" data-arg="home">Home</button></div></div>`;
  chime(win || tie); if(win) burst();
  say(`${title} ${line}`, {kind:"sent", who:"pip"});
}
function vsCard(){
  const s = K.vs;
  if(!K.assessed) return `<div class="card vscard locked-card"><span class="vscard-pip">${PIP_SVG("calm")}</span><span class="vscard-body"><b>Me vs Pip</b><small>Play the warm-up game first to unlock this game.</small></span><span class="lock" aria-hidden="true">🔒</span></div>`;
  return `<button class="card vscard" data-act="vs"><span class="vscard-pip">${PIP_SVG("happy")}</span>
    <span class="vscard-body"><b>Me vs Pip</b><small>Take turns with Pip, and catch his mistakes for bonus points!</small>${s && s.n ? `<small class="muted">Wins: ${s.w} of ${s.n}</small>` : ""}</span><span class="play" aria-hidden="true">▶</span></button>`;
}
function vsDashCard(){
  const s = K.vs;
  return `<div class="card"><h3>Me vs Pip</h3>${s && s.n
    ? `<p>Played <b>${s.n}</b> ${s.n===1?"game":"games"}: won <b>${s.w}</b>, tied <b>${s.t||0}</b>. She caught Pip's mistakes and found the right answer <b>${s.c}</b> ${s.c===1?"time":"times"}, and said Pip was wrong when he was right <b>${s.fa||0}</b> ${(s.fa||0)===1?"time":"times"}. Best score: ${s.best}.</p>
       <p class="muted small">On Pip's turns she has to read Pip's answer and decide if it is right, which practices careful reading and checking. Her own answers count toward her levels, just like adventures.</p>`
    : `<p class="muted small">Not played yet. Pip takes turns with her, sometimes makes mistakes on purpose, and she earns bonus points for catching them.</p>`}</div>`;
}

const OBJECTIVES = /*GOALS-START*/[{"id":"R1","domain":"reading","title":"Letter names","icon":"🔤","ican":"I can find every capital and small letter.","kidWhy":"Letters are the building blocks of every word you read!","weeks":2,"statement":"Within two weeks, [Name] will point to the capital or small letter that matches a letter name she hears, including look-alike small letters such as b, d, p and q, measured by at least 9 of 10 correct on the in-app goal check on two different days.","smart":{"s":"Point to the written capital or small letter that matches a heard letter name, including look-alike small letters (b, d, p, q; m, n, u, w; h, n, r; i, l, t, j). This is a quick placement check of a floor skill.","m":"10-item in-app goal check (4 capital, 3 small and 3 look-alike letters, in turn; the app favours letters she has missed or not seen yet): at least 9 of 10 on two different days. After any look-alike miss, you give a see-only match (capital B to small b) to tell a listening slip from a letter mix-up. If she has not passed by the end of the first week, give the check every other day (about 3 a week), so you have at least 6 scores by the end of week two before changing the plan.","a":"At 7 this is a floor skill (Kindergarten in US standards, Year 1 in England), so most children pass in the first days. If she does, the goal is met and she moves on to letter sounds (R2, R3).","r":"Knowing each letter by sight is a first step in linking letters to their sounds, which the Grade 1 sources stress (WWC Recommendation 2; the DepEd CRLA reader profiles).","t":"Two weeks from her first check. Passing on two days in the first week ends the goal early; a keep-it check follows 2-4 weeks after mastery.","rRefs":["wwc-foundational","crla"]},"lesson":{"minutes":10,"materials":["letter cards or magnetic letters (capital and small)","this app"],"steps":[{"phase":"Warm-up","text":"Quick placement, about 3 minutes: lay out the small letters in mixed order, say each letter name in random order, and she points to it. Do the capitals the same way if the small letters go well. Note any she misses or mixes up. If she misses one or none, go straight to the goal check today and tomorrow.","refs":["rosenshine-2012"]},{"phase":"I do","text":"Take the letters she mixed up, two at a time. Say each name clearly with your own voice as you trace the letter big in the air: b is a bat then a ball (line first, bump on the right); d is a drum then a stick (bump first, line on the right).","refs":["nsw-grr","rosenshine-2012"]},{"phase":"We do","text":"Mix 6 cards, including her tricky ones. You say a letter name; she points to it and says the name back (English or Filipino letter names both count). Then swap: she names a letter and you point, sometimes wrongly, so she can catch your mistake.","refs":["nsw-grr","rosenshine-2012"]},{"phase":"You do","text":"She does the 10-item goal check in the app on her own while you watch. If the device voice blurs a letter name, tap Hear it again or say the name once yourself.","refs":["nsw-grr"]},{"phase":"Real life","text":"On signs, labels or a cereal box, she finds 3 letters you name, once as a capital and once as a small letter. Point out Ñ or NG if you see them, as in Santo Niño or ang.","refs":["matatag-rl-g1"]}],"support":"Work with 3 letters at a time, two she knows and one new, and say the name as she traces it in sand or on her palm.","stretch":"Say a letter name; she points to it and says its most common sound, which leads into letter sounds (R2, R3)."},"assessment":{"method":"The in-app goal check gives 10 items (4 capital letters, 3 small letters and 3 look-alike small letters, in turn) and records the score with the date. The device says each letter name, and Hear it again replays it. Some letter names sound alike (b, d, p, t, v, z, e, g; m and n; f and s), so a miss may be a listening slip rather than a mix-up. After a look-alike miss, show her the two letters, say the name yourself, and ask her to match the capital to its small letter by sight (B to b): a right see-only match means it was a listening slip. The app's score counts for mastery; note see-only results in your observation. When she names letters aloud, accept English names, Filipino names (enye for Ñ, en-ji for NG) or older Abakada names (ba, ka). Combine the score with app practice data and your observation using the rubric below.","rubric":["Scores 0-5 of 10 on the goal check, or points to fewer than half of the letters in the warm-up.","Scores 6-8 of 10; finds most capitals but still mixes up some small look-alikes (b, d, p, q) or letter names that sound alike.","Scores 9 or 10 of 10 on one day; any look-alike slip is fixed on the see-only match.","Scores at least 9 of 10 (90%) on the goal check on two different days; a keep-it check 2-4 weeks later confirms it."],"refs":["iris-pm-reading","bond-1996-nrt-crt","fuller-fienup-2018","ncii-goals-pm"]},"mastery":{"pct":90,"days":2,"text":"Mastered when she scores at least 9 of 10 (90%) on the in-app goal check on two different days. If she does this in the first week, the placement is done and she moves on to letter sounds (R2, R3). There is no real-life log for this goal. A keep-it check 2-4 weeks after mastery confirms it."},"evidence":{"skill":"letters","levels":[0,1,2,2]},"tools":[{"label":"FCRR Student Center Activities (free download): print the K-1 phonics (orange) letter activities for offline practice. The reuse terms are not confirmed, so use them at home and don't share copies.","ref":"fcrr-sca"},{"label":"DepEd MATATAG Reading and Literacy curriculum guide (free PDF, for reference): what Philippine Grade 1 aims for in letters and sounds","ref":"matatag-rl-g1"},{"label":"NSW guide to gradual release (I do, we do, you do), the routine this lesson follows","ref":"nsw-grr"},{"label":"NCII goal-setting guide (free PDF) and NCII's free Excel tool for graphing her goal-check scores over the weeks","ref":"ncii-goals-pm"}],"standards":[{"ref":"eng-nc-english","code":"England NC Year 1: spelling (transcription)","text":"Name the letters of the alphabet in order, and use letter names to tell apart different spellings of the same sound. (Wording checked by web search against school copies of the programme of study. The pool entry for this document does not record this statement.)"},{"ref":"matatag-rl-g1","code":"MATATAG Reading and Literacy Grade 1: performance standard (as reproduced in teacher lesson logs)","text":"Use phonological and alphabetic knowledge to read and write words accurately. Term 1 exemplars stress letter-sound knowledge. The 2023 guide builds this in the child's first language."},{"ref":"matatag-rl-g1","code":"MATATAG Reading and Literacy Grade 1: book and print knowledge (environmental print)","text":"Notice print around her, such as signs and labels. Teacher lesson logs give this the code RL1BPK-1-1, which has not been checked against the official guide."}],"adultNotes":[{"title":"A placement goal, not a label","text":"At 7 most children already know their letters, so passing quickly is the expected result. The goal check is criterion-referenced: it shows which letters to practise, not how she compares with other children.","ref":"bond-1996-nrt-crt"},{"title":"The Filipino alphabet","text":"The Filipino alphabet has 28 letters: the 26 English letters plus Ñ and NG. Letter names follow English except Ñ (enye) and NG (en-ji, also written endyi; its older Abakada name is nga), per web search of Komisyon sa Wikang Filipino materials. The app's check uses the 26 English letters only, so check Ñ and NG yourself if her school teaches Filipino reading. Some grandparents learned the Abakada names (a, ba, ka, da); if she uses them, she knows the letter.","ref":""},{"title":"The device voice and lone sounds","text":"Text-to-speech says whole words well but can blur a single letter name or a lone sound (for example reading the letter a as uh, or adding a vowel to a sound). When you model a letter's name or sound, say it aloud yourself, and use the app's voice mainly for whole words.","ref":""},{"title":"Language of schooling","text":"From school year 2025-2026, DepEd uses Filipino and English as the main languages of instruction in Kindergarten to Grade 3 (RA 12027 and its implementing rules: https://www.deped.gov.ph/2025/05/28/implementing-rules-and-regulations-of-republic-act-no-12027-titled-an-act-discontinuing-the-use-of-the-mother-tongue-as-medium-of-instruction-from-kindergarten-to-grade-3-providing-for-its-optional/). A school may still use the local language as a helper language, or as the main language in a class where all pupils share it. Ask her teacher which language reading is taught in. A child taught mostly in Filipino may know letter sounds better than English letter names, so English letter-name errors may reflect how much English she has had, not her ability.","ref":""}],"statementRefs":["eng-nc-english","matatag-rl-g1"]},{"id":"R2","domain":"reading","title":"Hearing sounds in words","icon":"👂","ican":"I can hear the first, middle and last sounds in words.","kidWhy":"Hearing each sound helps you read and spell new words!","weeks":3,"statement":"Within three weeks, [Name] will identify the first, middle (vowel) and last sound in spoken one-syllable words, measured by at least 9 of 10 correct on the in-app goal check on two different days.","smart":{"s":"Isolate the first, middle (vowel) and last sound in spoken one-syllable words such as sun, bed and map (CCSS RF.1.2c), saying each sound aloud in practice and tapping its letter in the check.","m":"10-item in-app goal check (first-, last- and middle-sound items in turn, about 4, 3 and 3, each with a picture and the spoken word): at least 9 of 10 on two different days. A pass allows only one miss, so she must get at least 2 of the 3 middle-vowel items each time. Check twice a week (6 scores in three weeks). Rhyme is practised in the warm-up but not scored.","a":"Most children her age already hear first sounds, and at 7 this is a floor skill (US Grade 1), so the goal stays short. Picture words are short and familiar.","r":"Teaching children to hear the sounds in spoken words and link them to letters has strong evidence in the US practice guide (WWC Recommendation 2).","t":"Three weeks from her first check, checked twice a week. When she passes, sound swapping (the stretch) becomes the next target, alongside sounding out (R5).","rRefs":["wwc-foundational","dibels8-goals"]},"lesson":{"minutes":10,"materials":["picture cards or small toys (sun, bed, pig, cup, map)","this app"],"steps":[{"phase":"Warm-up","text":"Rhyme warm-up, one minute: say two words and she gives a thumbs up if they rhyme (cat, hat; sun, bed). Then play I Spy with first sounds: I spy something that starts with sss.","refs":["matatag-rl-g1","wwc-foundational"]},{"phase":"I do","text":"Say map slowly with your own voice, stretching each sound: mmm, aaa, p (keep the p short). Tap your shoulder, elbow and wrist for the first, middle and last sound, and say each sound on its own.","refs":["nsw-grr","wwc-foundational"]},{"phase":"We do","text":"With picture cards, say a word together and tap its three sounds, then she says the sound you ask for (say the middle sound in bed). Check hearing alone with picture choices too: which picture starts like sun? Which ends like cup?","refs":["nsw-grr","wwc-foundational"]},{"phase":"You do","text":"She does the 10-item goal check in the app while you watch. If the device word is unclear, say the word once yourself, never the sound.","refs":["nsw-grr"]},{"phase":"Real life","text":"At a meal, ask for the first or last sound of food words: fish, egg, rice, or Filipino words like saging and isda.","refs":["matatag-rl-g1"]}],"support":"Work on first sounds, then last, then middle. Stretch words slowly, use picture choices instead of letters, and start with vowels that are easy to tell apart (bed, pig, dog).","stretch":"Swap one sound to make a new word: cat to bat (first sound), bat to bit (middle sound), bit to bin (last sound)."},"assessment":{"method":"The in-app goal check gives 10 items (4 first-sound, 3 last-sound and 3 middle-sound items, in turn) and records the score with the date. It shows a picture and says the word; she taps the letter for the sound, and Hear it again replays the word. Because the answers are letters, it checks hearing the sound and knowing its letter together; the picture questions in We do check hearing alone. The device voice says whole words well but cannot reliably say a lone sound, so model sounds yourself. Middle-vowel misses among a, o and u (cat, cot, cut), or between e and i, may reflect how much English she has heard rather than her hearing (general language knowledge); accept her own accent when she says sounds aloud. Combine the score with app practice data, her answers in the two cartoons, and your observation using the rubric below.","rubric":["Scores 0-5 of 10, or names first sounds only some of the time.","Scores 6-8 of 10; first and last sounds mostly right, middle vowels often missed.","Scores 9 or 10 of 10 on one day, with at least 2 of the 3 middle-vowel items right.","Scores at least 9 of 10 (90%) on the goal check on two different days; a keep-it check 2-4 weeks later confirms it."],"refs":["iris-pm-reading","dibels8-goals","fuller-fienup-2018","cdc-smart-brief3b"]},"mastery":{"pct":90,"days":2,"text":"Mastered when she scores at least 9 of 10 (90%) on the in-app goal check on two different days. A pass allows only one miss, so this also means at least 2 of the 3 middle-vowel items each time. Rhyme is not part of the rule, and there is no real-life log. A keep-it check 2-4 weeks after mastery confirms it."},"evidence":{"skill":"sounds","levels":[0,1,2],"episodes":["letter-hunt","rhyme-picnic"]},"tools":[{"label":"FCRR Student Center Activities (free download): the K-1 phonological awareness set (purple) runs from easier to harder sound activities. Print for home use only.","ref":"fcrr-sca"},{"label":"IES/WWC practice guide (free): Recommendation 2 (strong evidence) gives steps for teaching the sounds in spoken words and linking them to letters","ref":"wwc-foundational"},{"label":"IRIS free module on progress monitoring in reading: graphing scores and deciding when to change practice","ref":"iris-pm-reading"}],"standards":[{"ref":"ccss-ela","code":"CCSS RF.1.2c","text":"Isolate and pronounce initial, medial vowel, and final sounds (phonemes) in spoken single-syllable words."},{"ref":"matatag-rl-g1","code":"MATATAG Reading and Literacy Grade 1: phonological awareness (codes from teacher lesson logs)","text":"Identify rhyming words in nursery rhymes, poems and chants (RL1PA-I-3), identify initial sounds in spoken words (RL1PA-I-5), chant rhymes and split words into syllables. The codes come from teacher lesson logs, not the official guide."},{"ref":"ac9-english","code":"AC9E1LY10 (Australian Curriculum v9, Year 1)","text":"Orally manipulate phonemes in spoken words by addition, deletion and substitution of initial, medial and final phonemes to generate new words. This matches R2's stretch, not its target. (ACARA, CC BY 4.0. Code and wording checked by web search on the WA SCSA K-10 Outline.)"},{"ref":"melc-english-g1","code":"DepEd Grade 1 English MELCs (Q3-Q4): rhyming words","text":"Recognize rhyming words in English in the second half of Grade 1. This copy is a third-party repost, and MATATAG has replaced the MELCs, so treat it as a supplementary benchmark."}],"adultNotes":[{"title":"Say the sounds yourself","text":"Text-to-speech cannot reliably say a lone sound such as the first sound in cat. Model each sound with your own voice and keep it short: say mmm, not muh. Ask her to say the sound aloud too, since the standard asks children to isolate and pronounce sounds.","ref":"ccss-ela"},{"title":"English vowels and Filipino ears","text":"Filipino has five vowel sounds and English has more, so pairs like cat, cut and cot, or ship and sheep, can sound alike to many Filipino speakers (general language knowledge, not from a cited source). Misses on these usually reflect English exposure rather than a hearing problem. If you have wider concerns about her hearing, ask her doctor.","ref":""},{"title":"A Filipino warm-up (optional)","text":"Most Filipino words have two or more syllables. Clap the syllables of familiar words (sa-ging, pu-sa, ba-ka) and ask for the first and last sound. If she does well here but not in English, the sound skill is there and English words are the new part. DepEd's 2023 MATATAG guide builds these skills in the first language first.","ref":"matatag-rl-g1"},{"title":"Rhyme is the warm-up","text":"Rhyming is a Kindergarten skill in US standards, so it is practised in the warm-up and in Benny's Rhyme Picnic but not scored here. If rhymes are still hard, spend a few days on rhymes before the goal check.","ref":""}],"statementRefs":["ccss-ela","matatag-rl-g1"]},{"id":"R3","domain":"reading","title":"Letter teams","icon":"🧩","ican":"I can read words with letter teams, like ship and chick.","kidWhy":"Two letters can team up to make one sound!","weeks":4,"statement":"Within four weeks, [Name] will read aloud words with the letter teams sh, ch, th and wh at the start or end of words, including made-up words, measured by at least 11 of 12 words read correctly on your read-aloud card on two different days and at least 9 of 10 on the in-app goal check on two different days.","smart":{"s":"Read the consonant teams sh, ch, th and wh as one sound at the start or end of words (CCSS RF.1.3a). Th has two sounds (thin, this), wh says w (when, whale), and wh comes only at the start of words. Words where ch says k (school) are left out.","m":"Read-aloud card (main measure): 12 words, 3 for each team: a real word with the team at the start, a real word with it at the end (two start words for wh), and a made-up word, with both th sounds included. At least 11 of 12 read correctly on two different days (list A one day, list B another), so every team has at least 2 of 3 right. In-app goal check: 10 items where she hears a picture word and taps the team it starts with; at least 9 of 10 on two different days.","a":"Uses short, familiar words and one team at a time. It is a typical US Grade 1 skill, within reach at 7 once she can sound out short-vowel words.","r":"Common letter teams are part of US Grade 1 and England Year 1 phonics, and the US practice guide gives strong evidence for teaching common sound-spelling patterns (WWC Recommendation 3).","t":"Four weeks from her first check, with a goal check and a read-aloud card once or twice a week.","rRefs":["wwc-foundational","ccss-ela","eng-nc-english"]},"lesson":{"minutes":15,"materials":["index cards with sh, ch, th and wh","the 12-word read-aloud card (list A and list B)","this app"],"steps":[{"phase":"Warm-up","text":"Review the single sounds of s, c, t, h and w, then make the team sounds with actions: sh with a finger to your lips, ch like a train, th with your tongue peeking out, wh like the w in wave.","refs":["rosenshine-2012","wwc-foundational"]},{"phase":"I do","text":"Write ship. Cover the h, then uncover it: s and h together make one sound. Read it slowly, then fast. Do the same with fish so she sees a team at the end. Show the two th sounds (thin, this) and that wh says w (when).","refs":["nsw-grr","rosenshine-2012","wwc-foundational"]},{"phase":"We do","text":"Sort word cards into sh, ch, th and wh piles together, reading each one aloud (ship, fish, chin, lunch, thin, bath, this, when). Add one made-up word per team (shom, chab, thip, whid) and read them as silly monster names. Keep the card words for the check.","refs":["nsw-grr"]},{"phase":"You do","text":"She reads you the 12-word card (list A or list B) while you mark each word, then does the 10-item goal check in the app.","refs":["nsw-grr"]},{"phase":"Real life","text":"Hunt for sh, ch, th and wh words in a picture book or on signs (shop, lunch, the, white). Filipino spells the ch sound ts, as in tsinelas: point out that English writes it ch.","refs":["wwc-foundational"]}],"support":"Teach one team for a few days before adding the next (sh first). Use tiles she can push together, and read real words before made-up ones.","stretch":"Add ng at the end (ring, sing, long), a letter she may know from the Filipino alphabet, then ck (duck, sock)."},"assessment":{"method":"Two parts. Read-aloud card (the main measure): she reads 12 words to you, one at a time, and you mark each right or not yet. Sounding out aloud is fine: score the word she says at the end, and a self-correction counts as right. Count a word right if she reads the team as one sound in her own accent (for example th said close to t or d); for made-up th words, either th sound counts. Made-up words show she is reading, not remembering. None of the card words are used in the lesson. List A: shed, dish, shup, chop, much, chig, that, moth, thab, whip, whiz, wheb. List B: shut, rush, shib, chat, rich, chun, them, with, thog, which, wham, whod. In-app goal check: 10 items; it shows a picture, says the word, and she taps sh, ch, th or wh for its first sound. If the voice blurs a word, say the word once yourself. Later, England's free phonics screening check (the measuring-stick card) is a published floor check that includes letter teams in real and made-up words. Combine both parts with app practice data and your observation using the rubric below.","rubric":["Reads the two letters as separate sounds (s, h, ip); 0-5 of 12 card words right.","Reads sh or ch as a team but mixes up the others, or misses end-of-word and made-up words; 6-10 of 12 card words, or 6-8 of 10 on the goal check.","Reads at least 11 of 12 card words and scores at least 9 of 10 on the goal check on one day, or reaches only one of these on two days.","Reads at least 11 of 12 card words and scores at least 9 of 10 on the goal check, each on two different days; a keep-it check 2-4 weeks later confirms it."],"refs":["au-y1-phonics-check","eng-psc","iris-pm-reading","fuller-fienup-2018"]},"mastery":{"pct":90,"days":2,"text":"Mastered when she reads at least 11 of 12 words correctly on your read-aloud card on two different days (list A one day, list B another), and scores at least 9 of 10 (90%) on the in-app goal check on two different days. There is no real-life log. A keep-it check 2-4 weeks after mastery confirms it. The app can't see every part of this rule, so once the goal check and log are met it shows Secure with 'Waiting for your check'. When every part is met, record an observation and choose Mastered (put any card or role-play score in the note).","obs":true},"evidence":{"skill":"sounds","levels":[3]},"tools":[{"label":"FCRR Student Center Activities (free download): phonics (orange) sets for K-1 and Grades 2-3. The Grades 2-3 set includes digraph activities such as Digraph Bingo. Print for home use only.","ref":"fcrr-sca"},{"label":"IES/WWC practice guide (free): Recommendation 3 (strong evidence) explains how to teach decoding and common sound-spelling patterns","ref":"wwc-foundational"},{"label":"England's free past phonics screening check papers: read aloud one to one, and score real and made-up words separately. Use them only after teaching, and never practise the actual words.","ref":"eng-psc"}],"standards":[{"ref":"ccss-ela","code":"CCSS RF.1.3a","text":"Know the spelling-sound correspondences for common consonant digraphs."},{"ref":"ac9-english","code":"AC9E1LY11 (Australian Curriculum v9, Year 1)","text":"Use short vowels, common long vowels, consonant blends and digraphs to write words, and blend these to read one- and two-syllable words. (ACARA, CC BY 4.0. Code and wording checked by web search on the WA SCSA K-10 Outline.)"},{"ref":"eng-nc-english","code":"England NC Year 1: word reading","text":"Respond quickly with the correct sound to graphemes (letters or groups of letters) for all 40+ phonemes, and blend sounds to read unfamiliar words that use taught spellings."},{"ref":"matatag-rl-g1","code":"MATATAG Reading and Literacy Grade 1: performance standard (as reproduced in teacher lesson logs)","text":"Use phonological and alphabetic knowledge to read and write words accurately. The guide builds this first in the child's first language, so it is a general anchor, not an English digraph standard."}],"adultNotes":[{"title":"Model the team sounds yourself","text":"Text-to-speech cannot reliably say a lone sound like sh or th. Say the sounds with your own voice, and use the app's voice for whole words.","ref":""},{"title":"Two th sounds, and wh","text":"Th has a soft sound (thin, bath) and a buzzing sound (this, that). For most English speakers wh sounds like w (when, whale), so it is a spelling team rather than a new sound. Ch can also say k (school), so those words wait for later.","ref":""},{"title":"Accent is not a reading error","text":"Many Filipino speakers say th close to t or d, and Filipino spells the ch sound ts (tsinelas, tsokolate). When she reads aloud, count a word right if she reads the team as one sound in her own accent (general language knowledge, not from a cited source).","ref":""},{"title":"Ahead of school or with school","text":"Letter teams are a US Grade 1 skill. Ask her teacher which language reading is taught in this year. If English reading has not started at school, this goal is English enrichment ahead of school, and a slower pace is fine.","ref":""},{"title":"NG is already hers","text":"NG is a letter of the Filipino alphabet (as in ng and ang), so the ending team ng in ring and sing may feel familiar. The stretch adds it.","ref":""},{"title":"Measuring stick: England's phonics check","text":"After she has worked through R3 and the vowel-team level of R5, England's free past phonics screening check (20 real and 20 made-up words, read aloud one to one) gives a published floor check of decoding: https://www.gov.uk/government/collections/national-curriculum-assessments-practice-materials. Don't practise the actual words first.","ref":"eng-psc"}],"statementRefs":["ccss-ela","eng-nc-english"]},{"id":"R4","domain":"reading","title":"Sight words","icon":"👀","ican":"I can read my everyday words in a snap.","kidWhy":"You see these words all the time. Knowing them makes reading smoother!","weeks":4,"statement":"Within four weeks, [Name] will read aloud the high-frequency words on her current list level, each within 3 seconds and without sounding it out, measured by at least 9 of 10 words read correctly on your read-aloud check on two different days and at least 9 of 10 on the in-app goal check on two different days.","smart":{"s":"Read aloud high-frequency words from her current list level, including irregularly spelled tricky words such as said, was and of (CCSS RF.1.3g; England's common exception words), quickly and without sounding them out.","m":"Read-aloud check (main measure): 10 words from her current list, shown one at a time; a word counts if she reads it correctly within 3 seconds without sounding it out; each set of 10 includes at least 3 tricky words; at least 9 of 10 on two different days. In-app goal check: 10 items where she hears a word and taps it among other list words; at least 9 of 10 on two different days. Use different words each time so every word on her list gets checked.","a":"Words come from her current level, set by the warm-up game, and the practice games move her up a list as she gets its words right. Words she can sound out are practised mainly through sounding out (R5).","r":"England expects Year 2 children to read familiar words quickly and accurately without sounding them out, and the US practice guide recommends teaching common regular and irregular words so they are recognized efficiently (WWC Recommendation 3).","t":"Four weeks from her first check on her current list, with a goal check and a read-aloud once or twice a week. After mastery, her next list becomes the next target (the practice games move her up a list on their own), and words from the finished list come back in the keep-it check 2-4 weeks later.","rRefs":["wwc-foundational","eng-nc-english"]},"lesson":{"minutes":10,"materials":["word cards from her current list","a picture book she likes","this app"],"steps":[{"phase":"Warm-up","text":"Flash three words she already knows, fast, like a game. Count to three in your head: reading a word before you reach three is a snap.","refs":["rosenshine-2012"]},{"phase":"I do","text":"Sort five new list words into sound-it-out words (and, can, big) and tricky words (said, was, of). For a tricky word, say it, sound out the regular parts, and draw a small heart over the tricky part to learn by heart: in said, the letters ai say the e sound in bed.","refs":["nsw-grr","wwc-foundational"]},{"phase":"We do","text":"Play memory or Go Fish with pairs of word cards, mixing new words with known ones; she reads each card aloud as she turns it.","refs":["nsw-grr"]},{"phase":"You do","text":"She reads 10 list words to you from cards while you mark each one (right within 3 seconds, or not yet), then does the in-app goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"In a book you read together, she finds and reads this week's words each time they come up. Use English or Filipino-English storybooks she enjoys.","refs":["matatag-rl-g1"]}],"support":"Use only 3-5 new words at a time, mixed with known ones; for a tricky word, trace the heart part with a finger while saying the word.","stretch":"Read the words in short phrases and sentences (said the cat, was in the box), then on a book page."},"assessment":{"method":"Two parts. Read-aloud check (the main measure): show 10 words from her current list, one at a time, on cards, with at least 3 tricky words in each set. The dashboard's read-aloud check also works, but it gives only 6 list words (mixed with 6 sounding-out words), so count only her list words and add 4 cards of your own. Count a word right if she says it correctly within 3 seconds without sounding it out; a quick self-correction counts. The 3-second limit borrows the DIBELS 8 rule that a 3-second hesitation counts as an error; it is an outer limit, not a definition of instant reading. In-app goal check: 10 items; the device says a word and she taps it among other list words, often one that starts with the same letter. Tapping a word she hears is easier than reading it, so the read-aloud carries more weight. Rotate words so every word on her list gets checked over the weeks. Combine both parts with app practice data and your observation using the rubric below.","rubric":["Reads 0-5 of 10 list words within 3 seconds; sounds out or guesses most.","Reads 6-8 of 10 within 3 seconds; tricky words such as said, was and of are still slow or mixed up.","Reads at least 9 of 10 within 3 seconds and scores at least 9 of 10 on the goal check on one day, or reaches only one of these on two days.","Reads at least 9 of 10 list words aloud correctly within 3 seconds, and scores at least 9 of 10 on the goal check, each on two different days; a keep-it check 2-4 weeks later confirms it."],"refs":["hfw-dolch-fry","iris-pm-reading","fuller-fienup-2018","dibels8-goals"]},"mastery":{"pct":90,"days":2,"text":"Mastered for her current list when she reads at least 9 of 10 words from her list aloud correctly, each within 3 seconds and without sounding it out, on two different days, and scores at least 9 of 10 (90%) on the in-app goal check on two different days. There is no real-life log. A keep-it check 2-4 weeks after mastery, using words from the finished list, confirms it. The app can't see every part of this rule, so once the goal check and log are met it shows Secure with 'Waiting for your check'. When every part is met, record an observation and choose Mastered (put any card or role-play score in the note).","obs":true},"evidence":{"skill":"sight","episodes":["sight-word-map"]},"tools":[{"label":"Free Dolch and Fry word lists hosted by the University of Utah Reading Clinic and Utah Education Network. Link to them only: their public-domain status is not confirmed, so don't copy them into the app.","ref":"hfw-dolch-fry"},{"label":"England National Curriculum English PDF (free): its spelling appendix lists the Year 1 and Year 2 common exception words","ref":"eng-nc-english"},{"label":"IES/WWC practice guide (free): Recommendation 3 includes a step on teaching regular and irregular high-frequency words so children recognize them efficiently","ref":"wwc-foundational"},{"label":"FCRR Student Center Activities (free download): K-1 and Grades 2-3 fluency (red) and phonics (orange) sets for practising word reading offline. Print for home use only.","ref":"fcrr-sca"},{"label":"IRIS free progress-monitoring module: graph word-check scores and decide when to change practice","ref":"iris-pm-reading"}],"standards":[{"ref":"ccss-ela","code":"CCSS RF.1.3g","text":"Recognize and read grade-appropriate irregularly spelled words."},{"ref":"eng-nc-english","code":"England NC Year 2: word reading","text":"Read most words quickly and accurately, without overt sounding and blending, when they have been frequently encountered."},{"ref":"eng-nc-english","code":"England NC Year 1: word reading","text":"Read common exception words, England's term for common words whose spelling does not follow the usual letter-sound patterns (for example said and the). This is the equivalent of the US 'irregularly spelled words'."},{"ref":"matatag-rl-g1","code":"MATATAG Reading and Literacy Grade 1: sight-word recognition","text":"Builds sight-word recognition, first in the child's first language. Later Grade 1 weeks cover reading high-frequency words with understanding."},{"ref":"uis-mpl","code":"UIS Global Minimum Proficiency Level, Grades 2/3 reading (SDG 4.1.1a)","text":"Reads aloud and understands many single written words, especially familiar ones, and pulls explicit information from sentences. (This wording is from the UIS MPL document, checked by web search; the SDG 4.1.1 metadata says 'most' written words.)"}],"adultNotes":[{"title":"Where the words come from","text":"The app's word lists currently follow the Dolch lists from 1936, drawn from US children's books of the 1930s, so a few words (such as shall and upon) are old-fashioned. Favour list words that appear in her own books. An app-made list of common and tricky words is planned, because the Dolch and Fry lists' public-domain status is not confirmed.","ref":"hfw-dolch-fry"},{"title":"Sound it out first, heart the tricky part (the app's own coaching model)","text":"Many list words can be sounded out (and, can, it, big); practise those through sounding out (R5). Keep whole-word practice for the tricky part of irregular words, like the ai in said. This fits the US practice guide's advice to teach common regular and irregular words.","ref":"wwc-foundational"},{"title":"Filipino everyday words (optional)","text":"If she reads Filipino at school, add a short Filipino set: ang, sa, ng and mga. Ng is read nang and mga is read manga, so they are true tricky words in Filipino (general language knowledge). DepEd's 2023 MATATAG guide builds sight words in the first language first.","ref":"matatag-rl-g1"}],"statementRefs":["ccss-ela","eng-nc-english"]},{"id":"R5","domain":"reading","title":"Sounding out words","icon":"🔊","ican":"I can sound out new words, even silly made-up ones!","kidWhy":"Sounding out lets you read words you have never seen!","weeks":4,"statement":"Within four weeks, [Name] will decode aloud words at her current pattern level (short vowels; blends and letter teams; silent e; vowel teams; then two-syllable words and endings), including made-up words, measured by at least 9 of 10 words read correctly on your read-aloud check on two different days and at least 9 of 10 on the in-app goal check on two different days.","smart":{"s":"Decode regularly spelled words at her current pattern level by blending their sounds aloud: short vowels (map), blends and letter teams (frog, ship), silent e (cake), vowel teams (rain), then two-syllable words and endings such as -s, -ed and -ing (CCSS RF.1.3b, RF.1.3c, RF.1.3e and RF.1.3f).","m":"Read-aloud check (main measure): 10 words at her level, 6 real and 4 made-up, shown one at a time; sounding out aloud is fine and the word she blends is scored; at least 9 of 10 on two different days, with real and made-up scores noted separately. In-app goal check: 10 items at her level; at least 9 of 10 on two different days. For two-syllable words and endings, the read-aloud alone counts until the app adds that level.","a":"Starts at the pattern level set by her warm-up and moves up one level at a time, with tiles she can touch.","r":"England's Year 1 curriculum makes phonics the route to decoding, the US practice guide gives strong evidence for teaching decoding (WWC Recommendation 3), and DepEd's CRLA describes Low Emerging readers as struggling with decoding.","t":"Four weeks from her first check at her current pattern level, with a goal check about twice a week and a read-aloud once or twice a week, so you have at least 6 scores before changing the plan. Then the next pattern level becomes the target.","rRefs":["wwc-foundational","eng-nc-english","crla"]},"lesson":{"minutes":15,"materials":["letter tiles or paper squares","a short decodable book at her level","this app"],"steps":[{"phase":"Warm-up","text":"Oral blending: say three sounds with your own voice (mmm, aaa, p for map) and she says the word. Do five words from her level.","refs":["wwc-foundational","ccss-ela"]},{"phase":"I do","text":"Build one word from her level with tiles: map (short vowels), frog (blends), cake (silent e), rain (vowel teams) or jumping (endings). Touch each tile and say its sound, then slide your finger under the word and blend it.","refs":["nsw-grr","rosenshine-2012","wwc-foundational"]},{"phase":"We do","text":"Change one tile at a time to make new words at her level and read each one together: map, mop, top, tip; ship, shop, chop, chip; cake, lake, late, gate; rain, pain, pail, sail; jump, jumps, jumped, jumping. Add one made-up word, such as jop, plim, mave or roat.","refs":["nsw-grr","wwc-foundational"]},{"phase":"You do","text":"She reads you 10 words at her level (6 real, 4 made-up) while you mark each one, then does the in-app goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"Read a short decodable book at her level together every day. Menu or sign words above her level are for shared reading: you read, she points and joins in.","refs":["wwc-foundational","eng-nc-english","ac9-english"]}],"support":"Go back one pattern level, use tiles she can touch, and blend two sounds before three (ma, then map).","stretch":"Read the same words in a short sentence (The frog can hop), then try the next pattern level."},"assessment":{"method":"Two parts. Read-aloud check (the main measure): show 10 words at her current level, one at a time, 6 real and 4 made-up. Use made-up words she has not practised. They show she can decode rather than remember, for example zop and vit (short vowels), blim and shap (blends and teams), vake and mobe (silent e), zoat and feep (vowel teams), blims and zopping (endings). She may sound out aloud; score the word she says at the end, and accept her own accent. Note real-word and made-up-word scores separately. The dashboard's read-aloud check gives 6 real words at her level (its 6 sight words don't count here), so you can use it and add 4 made-up words on cards. In-app goal check: 10 items; about half show a word for her to read and match to its picture, and half say a word for her to find, which is easier because it is recognition. A score under the rule means this pattern is not yet secure, not that she has a reading problem. Measuring sticks (cards on the dashboard): England's free phonics screening check (20 real and 20 made-up words) once she has worked through the vowel-team level; oral reading fluency (words correct per minute on an unpracticed passage, compared with US norms); and her DepEd CRLA reader profile from school. Combine all of these with app practice data and your observation using the rubric below.","rubric":["Says the first sound and guesses the rest; 0-5 of 10 read-aloud words right.","Blends slowly and needs help on some words; 6-8 of 10 read-aloud words, usually fewer made-up words than real ones.","Reads at least 9 of 10 read-aloud words (real and made-up) and scores at least 9 of 10 on the goal check on one day, or reaches only one of these on two days.","Reads at least 9 of 10 words at her level aloud correctly, including the made-up words, and scores at least 9 of 10 on the goal check, each on two different days; a keep-it check 2-4 weeks later confirms it."],"refs":["eng-psc","au-y1-phonics-check","dibels8-goals","duff-2015","fuller-fienup-2018"]},"mastery":{"pct":90,"days":2,"text":"Mastered for her current pattern level when she reads at least 9 of 10 words at that level aloud correctly (6 real, 4 made-up) on two different days, and scores at least 9 of 10 (90%) on the in-app goal check on two different days. For two-syllable words and endings, the read-aloud alone counts until the app adds that level. There is no real-life log. A keep-it check 2-4 weeks after mastery confirms it. The app can't see every part of this rule, so once the goal check and log are met it shows Secure with 'Waiting for your check'. When every part is met, record an observation and choose Mastered (put any card or role-play score in the note).","obs":true},"evidence":{"skill":"decode"},"tools":[{"label":"England's free past phonics screening check papers: 20 real and 20 made-up words, read aloud one to one. Score the two halves separately. England's pass mark (32 of 40; 31 in 2026) is set for 6-year-olds, so treat it as a floor, not an age norm.","ref":"eng-psc"},{"label":"IES/WWC practice guide (free): Recommendation 3 (strong evidence) covers decoding, and Recommendation 4 (moderate evidence) covers reading connected text every day","ref":"wwc-foundational"},{"label":"FCRR Student Center Activities (free download): K-1 and Grades 2-3 phonics (orange) activities, sequenced from simple to complex patterns. Print for home use only.","ref":"fcrr-sca"},{"label":"NCII guide to setting goals from a median-of-three baseline, with a free Excel graphing tool","ref":"ncii-goals-pm"}],"standards":[{"ref":"ccss-ela","code":"CCSS RF.1.3b","text":"Decode regularly spelled one-syllable words."},{"ref":"ccss-ela","code":"CCSS RF.1.3c","text":"Know final -e and common vowel team conventions for representing long vowel sounds."},{"ref":"ac9-english","code":"AC9E1LY11 (Australian Curriculum v9, Year 1)","text":"Use short vowels, common long vowels, consonant blends and digraphs to write words, and blend these to read one- and two-syllable words. (ACARA, CC BY 4.0. Code and wording checked by web search on the WA SCSA K-10 Outline.)"},{"ref":"matatag-rl-g1","code":"MATATAG Reading and Literacy Grade 1: content and performance standards (as reproduced in teacher lesson logs)","text":"Develop phonological awareness for decoding age- and grade-appropriate words, and use phonological and alphabetic knowledge to read and write words accurately. The 2023 guide teaches this first in the child's first language."},{"ref":"unicef-mics-fls","code":"UNICEF MICS Foundational Learning Skills: reading benchmark","text":"Reads aloud a short Grade 2-level story with at least 90% of words correct and also answers its comprehension questions (literal and inferential). Single-word decoding is the step before this benchmark."}],"adultNotes":[{"title":"Model sounds yourself, and watch the vowels","text":"Text-to-speech says whole words well but can blur lone sounds, so say sounds with your own voice when you blend. The app's short-vowel items include look-alike words such as cat, cot and cut, which many Filipino speakers hear as alike (general language knowledge); misses there may be about English vowels rather than decoding.","ref":""},{"title":"English spelling is less regular","text":"Filipino spelling is much more regular than English (general language knowledge, not from a cited source), so a low English score may reflect how much English reading she has had, not her ability. If she reads Filipino at school, ask her to read a few Filipino words (baka, pusa, saging) to see whether the decoding skill is already there.","ref":""},{"title":"Reading a 'not yet'","text":"In a study of 6-year-olds in England, a 'not yet' on the phonics check matched a low score on a reading test taken at the same time only about 3 times in 10, but matched teachers' phonics judgements more than 8 times in 10. Read a 'not yet' as 'this pattern is not yet secure', and keep combining checks with what you see.","ref":"duff-2015"},{"title":"Measuring stick: England's phonics check","text":"Free past papers: https://www.gov.uk/government/collections/national-curriculum-assessments-practice-materials. She reads 40 words to you, one to one. The pass mark (32 of 40; 31 on the 2026 paper) is set for 6-year-olds, so at 7 it is a floor check, not an age norm. Don't practise the actual words first.","ref":"eng-psc"},{"title":"Measuring stick: oral reading fluency","text":"Once she reads short passages, time one minute of her reading an unpracticed English passage at her grade level and count the words read correctly (average two passages). The US medians (Hasbrouck and Tindal, 2017) are 29 words per minute in the middle of Grade 1, 60 at the end of Grade 1 and 50 at the start of Grade 2. These are US norms for English, not Filipino norms, so use them as a rough guide.","ref":"hasbrouck-tindal-2017"},{"title":"Measuring stick: her CRLA profile","text":"Philippine public schools place Grade 1-3 learners in CRLA reader profiles (Low Emerging, High Emerging, Developing, Transitioning, Grade Ready). Ask her teacher for her latest profile and which language it was given in. It is a teacher's grouping for support, not a diagnosis, and it is designed for teachers to give, not parents.","ref":"crla"}],"statementRefs":["ccss-ela","ac9-english"]},{"id":"R6","domain":"reading","title":"Understanding what I read","icon":"💡","ican":"I can answer questions about stories I read.","kidWhy":"Be a story detective: who, what, where and why!","weeks":4,"statement":"Within four weeks, [Name] will read a short text at her level herself and answer who, what, where, when and simple why questions about it, measured by at least 9 of 10 correct on the in-app goal check on two different days and at least 9 of 10 on your two-story check (including at least 3 of the 4 why questions, with at least 97% of the words in each story read correctly) on two different days.","smart":{"s":"Read a short text at her level herself, then answer questions about key details (who, what, where, when) and simple why questions that need one small step of thinking (CCSS RL.1.1, RL.2.1).","m":"In-app goal check: 10 questions, each about a short text she reads on screen; at least 9 of 10 on two different days. Story check you run: two short stories at her level, 5 questions each (3 key-detail, 2 why); at least 9 of 10 with at least 3 of the 4 why questions right, on two different days. She reads each story aloud while you count words read correctly; at least 97% on each story shows the text is easy enough that word reading is not holding back her answers. Record key-detail and why scores separately, and note when she heard a text instead of reading it.","a":"Story-check texts move from a few sentences to longer short stories as she succeeds. Move up a level when she meets the rule at this level, judged by her actual reading accuracy rather than book labels.","r":"Answering who, what, where and when questions about a text she reads herself matches the UN minimum proficiency level for Grades 2/3 (SDG 4.1.1a); simple why questions match UNICEF's MICS reading benchmark and the UN expectation for longer texts read aloud to her.","t":"Four weeks per story-check text level, with a goal check twice a week and a story check about once a week.","rRefs":["uis-gpf-reading","sdg-411-metadata","uis-mpl","unicef-mics-fls"]},"lesson":{"minutes":15,"materials":["two short stories at her level (Story time, a school reader or a Philippine storybook)","paper to tally words and answers","this app"],"steps":[{"phase":"Warm-up","text":"Look at the cover and pictures together and guess what the story is about and who might be in it.","refs":["eng-nc-english"]},{"phase":"I do","text":"Read a page aloud, then think aloud: Who is this about? Where are they? Why did she do that? Show how you find the answer in the words, or put two clues together for a why answer.","refs":["nsw-grr","rosenshine-2012"]},{"phase":"We do","text":"Take turns asking each other who, what, where, when and why questions about a page. A text she reads with 93-97% of words right suits this shared practice; help with the words she misses.","refs":["nsw-grr","eng-nc-english","rosenshine-2012"]},{"phase":"You do","text":"She reads a Story time story or a short book page on her own while you tally misread words, answers your 3 key-detail and 2 why questions, then does the in-app goal check.","refs":["nsw-grr","wwc-foundational"]},{"phase":"Real life","text":"After any story, show or family story from lola or tita, ask her to tell it in three parts (first, next, last) and answer one why question.","refs":["ccss-ela","eng-nc-english"]}],"support":"For practice, read the text to her first and then let her reread it. For the story check, use a story she has not heard or read, or step down to a text she reads with at least 97% of words right.","stretch":"Ask how a character feels and how she knows from the words or pictures, then let her make up a why question for you."},"assessment":{"method":"Two parts. In-app goal check: 10 questions, each with a short text and a question on screen for her to read herself; tapping Hear it reads the question aloud, not the text. Each check mixes one-sentence, two-sentence and short-story texts (4, 3 and 3). You may read the answer choices aloud so a word-reading slip is not counted as a comprehension miss. Story check you run: pick two short stories at her level that she has not heard or read (Story time, a school reader, or a DepEd Phil-IRI passage in English or Filipino). She reads each aloud while you count words read correctly: skipped or wrong words are errors, and a self-correction counts as right. At least 97% means the text is easy enough for her to read on her own; 93-97% suits practice with you; under 93%, choose an easier text. Then ask 3 key-detail and 2 why questions per story and mark each. If she heard the story instead of reading it, write that down: the score then shows listening comprehension, which is useful but separate. Measuring sticks (cards on the dashboard): UNICEF's MICS reading benchmark, oral reading fluency compared with US norms, and her DepEd CRLA reader profile from school. Combine all of these with app practice data and your observation using the rubric below.","rubric":["Scores 0-5 of 10 even with the text in front of her, or reads fewer than 93% of the story words correctly.","Scores 6-8 of 10; answers who and what questions but misses most where, when or why questions.","Scores at least 9 of 10 on the goal check and on the story check (with at least 3 of 4 why questions and at least 97% of words read) on one day, or meets only one of the two on two different days.","Scores at least 9 of 10 on the goal check on two different days, and at least 9 of 10 on the two-story check (at least 3 of 4 why questions right, at least 97% of the words in each story read correctly) on two different days; a keep-it check 2-4 weeks later confirms it."],"refs":["unicef-mics-fls","phil-iri-2018","uis-gpf-reading","parker-burns-2014","bond-1996-nrt-crt"]},"mastery":{"pct":90,"days":2,"text":"Mastered for this story-check level when she scores at least 9 of 10 (90%) on the in-app goal check on two different days, and on two different days scores at least 9 of 10 on your two-story check, with at least 3 of the 4 why questions right and at least 97% of the words in each story read correctly by herself. Then move her up a story-check level. There is no real-life log. A keep-it check 2-4 weeks after mastery confirms it. The app can't see every part of this rule, so once the goal check and log are met it shows Secure with 'Waiting for your check'. When every part is met, record an observation and choose Mastered (put any card or role-play score in the note).","obs":true},"evidence":{"skill":"comp"},"tools":[{"label":"DepEd Phil-IRI 2018 manual and graded passages in English and Filipino (free on DepEd LRMDS). It is built for teachers and routinely used from Grade 3, so use it informally at home as a rough guide, and do not copy passages into the app.","ref":"phil-iri-2018"},{"label":"FCRR Student Center Activities (free download): comprehension (blue) sets for K-1 and Grades 2-3, sequenced simple to complex. Print for home use only.","ref":"fcrr-sca"},{"label":"NSW guide to modelling and gradual release, for thinking aloud before she answers alone","ref":"nsw-grr"},{"label":"IES/WWC practice guide (free): Recommendation 1 covers inferential and narrative language (evidence rated minimal, meaning a small research base), and Recommendation 4 covers reading connected text every day (moderate)","ref":"wwc-foundational"}],"standards":[{"ref":"ccss-ela","code":"CCSS RL.1.1","text":"Ask and answer questions about key details in a text."},{"ref":"ccss-ela","code":"CCSS RL.2.1","text":"Ask and answer such questions as who, what, where, when, why, and how to demonstrate understanding of key details in a text. (The pool flags this one to check; the wording was confirmed by web search.)"},{"ref":"eng-nc-english","code":"England NC Year 2: comprehension","text":"Answer and ask questions, make simple inferences and predictions, and discuss the order of events, both in books she reads and in books read to her."},{"ref":"uis-gpf-reading","code":"UIS Global Proficiency Framework for Reading, Grade 2: Meets Global Minimum Proficiency","text":"Example task: retrieve a single piece of explicit information from a Grade 2-level text, usually a who, what, when or where question. Simple inferences, usually why or how questions, are a separate, higher-order item type."},{"ref":"uis-mpl","code":"UIS Global Minimum Proficiency Level, Grades 2/3 reading (SDG 4.1.1a)","text":"Pulls explicit information from sentences, and makes simple inferences when longer texts are read aloud to her. (The pool marks the inference wording 'verify'; web search found it in the UIS MPL document.)"},{"ref":"unicef-mics-fls","code":"UNICEF MICS Foundational Learning Skills: reading benchmark","text":"Reads a short Grade 2-level story aloud with at least 90% of words correct and answers both the literal and the inferential questions correctly."},{"ref":"phil-iri-2018","code":"Phil-IRI (DepEd Order 14, s. 2018): independent reading level","text":"Word reading 97-100% and comprehension 80-100% on graded passages whose questions span literal, inferential and critical levels. The criteria are adapted from Johnson, Kress and Pikulski (1987). That this exact table appears in the 2018 manual is not confirmed, and schools routinely give Phil-IRI from Grade 3."}],"adultNotes":[{"title":"Stories that fit her world","text":"Understanding depends on what she already knows. Some app stories mention snow or names like Jack and Ann. Add stories with Filipino names, foods and places (lola's house, the palengke, sinigang, a jeepney ride), and try a Filipino passage too, so English vocabulary does not cap her score. Phil-IRI's graded passages are Philippine texts in English and Filipino.","ref":"phil-iri-2018"},{"title":"Phil-IRI as a reference point","text":"Phil-IRI's independent level is 97-100% of words read correctly and 80-100% of questions right. Schools routinely give it from Grade 3, and no reliability figures are published, so at 7 treat it as a borrowed yardstick, not her level.","ref":"phil-iri-2018"},{"title":"Measuring stick: UNICEF's MICS benchmark","text":"She reads a short Grade 2-level story aloud and meets the benchmark only with at least 90% of words read correctly and all 3 literal and both inferential questions right. Use your own Grade 2 story with 5 questions, or see the module at https://data.unicef.org/resources/the-foundational-learning-skills-module/.","ref":"unicef-mics-fls"},{"title":"Measuring stick: oral reading fluency","text":"Once she reads short passages, time one minute of her reading an unpracticed English passage at her grade level and count the words read correctly (average two passages). The US medians (Hasbrouck and Tindal, 2017) are 29 words per minute in the middle of Grade 1, 60 at the end of Grade 1 and 50 at the start of Grade 2. These are US norms for English, not Filipino norms, so use them as a rough guide.","ref":"hasbrouck-tindal-2017"},{"title":"Philippine context","text":"In the 2019 national Early Grade Reading Assessment, Filipino Grade 3 public-school pupils averaged 57 words correct per minute in English and 61 in Filipino on a short story. Grade 3 is older than she is, so use this as context, not a target.","ref":"ph-egra-2019"},{"title":"Measuring stick: her CRLA profile","text":"Philippine public schools place Grade 1-3 learners in CRLA reader profiles (Low Emerging, High Emerging, Developing, Transitioning, Grade Ready). Ask her teacher for her latest profile and which language it was given in. It is a teacher's grouping for support, not a diagnosis, and it is designed for teachers to give, not parents.","ref":"crla"}],"statementRefs":["ccss-ela","uis-gpf-reading","eng-nc-english"]},{"id":"F1","domain":"feelings","title":"Naming feelings","icon":"😊","ican":"I can name my feelings and notice how others feel.","kidWhy":"When you name a feeling, others can understand and help.","weeks":5,"statement":"Within five weeks (one baseline week, then four weeks of lessons), [Name] will name eight feelings (happy, sad, angry, scared, surprised, proud, frustrated, nervous) from face, body and situation clues, and name one of her own feelings, in English, Filipino or her home language, on most days, measured by at least 90% on the 10-item goal check on two different days and a real-life log showing her own feeling named on at least 5 of the 7 days of lesson week 4.","smart":{"s":"Name eight feelings (happy, sad, angry, scared, surprised, proud, frustrated, nervous) from face, body and situation clues in others, and name one of her own feelings each day. The check-in frame is I feel ___ because ___; a cause is welcome but not needed for the log. Filipino or home-language words count (masaya, malungkot, galit, takot, gulat, kinakabahan, naiinis).","m":"Two measures, scored separately. Recognition: at least 9 of 10 on the goal check on two different days; its items mix face, body and situation clues. Naming her own feelings: a dated real-life log of the days she names her own feeling (at the check-in or in a real moment), with a target of 5 of 7 days in lesson week 4, compared with the baseline week.","a":"Five of the words (happy, sad, angry, scared, surprised) are basic emotions of the kind K-2 benchmarks ask for; England's RSHE list names the same five plus nervousness. Proud, frustrated and nervous are examples of the 'increasingly complex emotions' that Wisconsin's Grades 1-3 band expects words for. New words come one at a time, with pictures and cartoons, and grown-ups name their own feelings first.","r":"CASEL places identifying one's emotions under self-awareness. K-2 standards ask children to identify basic emotions (Ohio A1.1.a) and the situations that cause them (Illinois 1A.1.1-1A.1.2), and Wisconsin Grades 1-3 adds words for more complex emotions and, with adult guidance, telling how others feel from verbal and nonverbal cues. WHO lists self-awareness and empathy among its core life skills.","t":"Five weeks: a baseline week (one goal check and the dinner check-in with no teaching, logging the days she names a feeling), then four lesson weeks. The log target applies to week 4. A keep-it check 2-4 weeks after mastery.","rRefs":["casel-framework","who-life-skills-1997"]},"lesson":{"minutes":10,"materials":["feelings faces for the eight words (draw or print)","a mirror","a picture book","this app"],"steps":[{"phase":"Warm-up","text":"Make happy, sad and angry faces in a mirror together. She can say the words in English or Filipino (masaya, malungkot, galit).","refs":[]},{"phase":"I do","text":"Name your own feeling, its clue and its cause: I felt nervous before my meeting. My tummy was fluttery. Grown-ups go first, so she sees that naming a feeling is OK.","refs":["nsw-grr","rosenshine-2012"]},{"phase":"We do","text":"Pause a picture book or a cartoon. Together, name the feeling and the clue that told you: the face, the body, or what happened. Add one new word every few days: proud, frustrated, nervous.","refs":["nsw-grr"]},{"phase":"You do","text":"She names the feeling in four new pictures or cartoon pauses on her own while you watch, and says which clue she used. Then she watches Name That Feeling and does the goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"Do a feelings check-in at dinner every day: each person says I feel ___ because ___, grown-ups first. Log each day she names her own feeling, in any language.","refs":["unesco-mgiep-sel-guidelines"]}],"support":"Start with happy, sad and angry; offer two choices (Are you sad or angry?) and add one new word a week.","stretch":"Add disappointed, calm and worried, and talk about having two feelings at once."},"assessment":{"method":"Two parts, scored separately. The goal check covers other people's feelings: 10 items from a 12-item bank that mixes face clues (items 1-3), body and b
