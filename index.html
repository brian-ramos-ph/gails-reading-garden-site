        <path d="${starPath(0,-123.5,6.8,.48)}" fill="#FFD23F" stroke="#F0A400" stroke-width="1" stroke-linejoin="round"/><circle cx="0" cy="-138.5" r="2.6" fill="#2B5FA8"/>` },
    { id: "explorer-hat", covers: true, name: "Explorer Hat", ic: "🧭", lvl: 10,
      draw: () => `<ellipse cx="0" cy="-111" rx="37" ry="6.5" fill="#C9A160"/>
        <path d="M-24 -111C-25 -134 -13 -143 0 -143C13 -143 25 -134 24 -111Z" fill="#E2C285"/>
        <path d="M-24.4 -117Q0 -121 24.4 -117L24 -111Q0 -115 -24 -111Z" fill="#8A5A35"/>
        <ellipse cx="15" cy="-118.5" rx="5" ry="2.4" fill="#5DBB63" transform="rotate(-25 15 -118.5)"/>
        <path d="M-12 -134Q-6 -139 2 -139" stroke="#F2DCAE" stroke-width="2.4" fill="none" stroke-linecap="round"/>` },
    { id: "sun-hat", covers: true, name: "Salakot Sun Hat", ic: "👒", lvl: 12,
      draw: () => { const B = x => n(-108 + 4*(1 - (x/44)*(x/44))); return `<path d="M-44 -108Q-20 -124 0 -143Q20 -124 44 -108Q0 -100 -44 -108Z" fill="#E2B65E"/>
        <g stroke="#B8862F" stroke-width="1" fill="none" opacity=".75">${[-33,-22,-11,0,11,22,33].map(x => `<path d="M0 -141L${x} ${B(x)}"/>`).join("")}
        <path d="M-31 -116.5Q0 -111.5 31 -116.5"/><path d="M-17 -126.5Q0 -122.5 17 -126.5"/></g>
        <path d="M-44 -108Q0 -100 44 -108" stroke="#B8862F" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        <circle cx="0" cy="-142" r="3" fill="#9A6A2E"/>`; } }
  ];

  /* ---------- capes (back hangs behind the body; front = collar and clasp) ---------- */
  const capeShape = hem => `M-12 -70C-22 -62 -30 -40 -34 -12${hem}C30 -40 22 -62 12 -70Z`;
  const fold = (c) => `<path d="M-9 -67C-15 -57 -19 -38 -21 -16L21 -16C19 -38 15 -57 9 -67Z" fill="${c}"/>`;
  const collar = (c, d) => `<path d="M-5 -69.5Q-14 -72 -20 -64.5Q-13 -61.5 -4 -66Z M5 -69.5Q14 -72 20 -64.5Q13 -61.5 4 -66Z" fill="${c}"/>
    <path d="M-4.5 -67.5Q0 -65.5 4.5 -67.5" stroke="${d}" stroke-width="1" fill="none"/><circle cx="0" cy="-66.6" r="2.7" fill="#FFC93C" stroke="#E0A400" stroke-width=".8"/>`;
  const HEM = {
    wave:  "Q-25.5 -6 -17 -12Q-8.5 -6 0 -12Q8.5 -6 17 -12Q25.5 -6 34 -12",
    leaf:  "Q-29 -6 -25.5 -3Q-21 -7 -17 -11Q-12 -5 -8.5 -2Q-4 -6 0 -10Q4 -6 8.5 -2Q12 -5 17 -11Q21 -7 25.5 -3Q29 -6 34 -12",
    round: "Q-17 -5 0 -10Q17 -5 34 -12"
  };
  const capeItem = (id, name, ic, lvl, back, main, dark) => ({ id, name, ic, lvl,
    draw: part => (part==="front" ? "" : back()) + (part==="back" ? "" : collar(main, dark)) });
  const RAINBOW = ["#F26B6B","#FFA94D","#FFD23F","#6CC46B","#4DA3E8","#9B7BE0"];
  const cape = [
    capeItem("leaf-cape", "Leaf Cape", "🍃", 4, () => `<path d="${capeShape(HEM.leaf)}" fill="#5DBB63"/>${fold("#45A04F")}
      <g stroke="#3F8F47" stroke-width="1.3" fill="none" stroke-linecap="round"><path d="M-25.5 -4L-28 -40M-27 -14L-31 -19M-27 -24L-30.5 -29M25.5 -4L28 -40M27 -14L31 -19M27 -24L30.5 -29"/></g>`, "#5DBB63", "#3F8F47"),
    capeItem("wave-cape", "Ocean Wave Cape", "🌊", 7, () => `<path d="${capeShape(HEM.wave)}" fill="#3D8FE0"/>${fold("#2F76C4")}
      <g stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".9"><path d="M-32 -20Q-29 -24 -26 -21Q-24 -18 -21 -21"/><path d="M21 -21Q24 -18 26 -21Q29 -24 32 -20"/><path d="M-29 -34Q-27 -37 -24.5 -35"/><path d="M24.5 -35Q27 -37 29 -34"/></g>`, "#3D8FE0", "#2A68AE"),
    capeItem("starry-cape", "Starry Night Cape", "🌌", 10, () => `<path d="${capeShape(HEM.round)}" fill="#3D418F"/>${fold("#2E3175")}
      <g fill="#FFD95A">${[[-27,-22,3.4],[28,-28,3.4],[-24.5,-42,2.6],[24,-48,2.4],[13,-15,2.4],[-13,-14,2.2]].map(([x,y,r]) => `<path d="${starPath(x,y,r,.5)}"/>`).join("")}
      <circle cx="-30" cy="-31" r=".9"/><circle cx="30" cy="-38" r=".9"/><circle cx="31" cy="-17" r=".9"/><circle cx="-21" cy="-30" r=".8"/></g>`, "#3D418F", "#272A66"),
    capeItem("rainbow-cape", "Rainbow Cape", "🌈", 12, () => RAINBOW.map((c,i) => { const sx = 1 - i*.045, sy = 1 - i*.13; return `<path d="${capeShape(HEM.wave)}" fill="${c}"${i ? ` transform="translate(0 ${n(-70*(1-sy))}) scale(${n(sx)} ${n(sy)})"` : ""}/>`; }).join(""), "#9B7BE0", "#7457C2")
  ];

  /* ---------- wands and lanterns (held in the hand at -29,-44; the jar is held further out, see hand) ---------- */
  const HAND = [-29, -44];
  function crescent(cx, cy, r, ox, oy, r2){
    /* outer circle (cx,cy,r) minus inner circle (cx+ox, cy+oy, r2) */
    const d = Math.hypot(ox, oy), a = (d*d + r*r - r2*r2) / (2*d), h = Math.sqrt(Math.max(0, r*r - a*a));
    const ux = ox/d, uy = oy/d, px = cx + a*ux, py = cy + a*uy;
    const p1 = [n(px - h*uy), n(py + h*ux)], p2 = [n(px + h*uy), n(py - h*ux)];
    return `M${p1[0]} ${p1[1]}A${r} ${r} 0 1 1 ${p2[0]} ${p2[1]}A${r2} ${r2} 0 0 0 ${p1[0]} ${p1[1]}Z`;
  }
  const wand = [
    /* id kept as "firefly-jar" so saved wardrobes still work. It is an OPEN glass lantern (no lid): the fireflies visit
       and fly in and out freely, which fits a story where a firefly is her friend. Held out to the side so the cape still shows. */
    { id: "firefly-jar", name: "Firefly Lantern", ic: "✨", lvl: 3, hand: [-37, -50],
      draw: () => `<g transform="translate(-8 -6)"><path d="M-36.5 -35Q-37 -47 -29 -47Q-21 -47 -21.5 -35" stroke="#6B5A4A" stroke-width="1.5" fill="none"/>
        <g class="qav-glow">${glow(-29,-23,17,"#FFE45C")}</g>
        <rect x="-37.5" y="-34.5" width="17" height="22" rx="6" fill="#EAF8FF" fill-opacity=".75" stroke="#9EC9DE" stroke-width="1.2"/>
        <circle cx="-29" cy="-23" r="7.5" fill="#FFF3A0" opacity=".6"/>
        <ellipse cx="-29" cy="-34.5" rx="7.6" ry="2.1" fill="#FFF7C2" stroke="#9EC9DE" stroke-width="1.2"/>
        <g fill="#FFFFFF" opacity=".85">${[[-43.5,-30],[-14,-6]].map(([x,y]) => `<ellipse cx="${n(x-1.4)}" cy="${n(y-2)}" rx="1.1" ry="1.8" transform="rotate(-30 ${n(x-1.4)} ${n(y-2)})"/><ellipse cx="${n(x+1.4)}" cy="${n(y-2)}" rx="1.1" ry="1.8" transform="rotate(30 ${n(x+1.4)} ${n(y-2)})"/>`).join("")}</g>
        <g fill="#FFE45C">${[[-33,-27],[-25.5,-20.5],[-31,-17.5],[-23,-39.5],[-43.5,-30],[-14,-6]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="3.2" opacity=".45"/><circle cx="${x}" cy="${y}" r="1.6"/>`).join("")}</g>
        <path d="M-34.5 -30V-17" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".8"/></g>` },
    { id: "star-wand", name: "Star Wand", ic: "🪄", lvl: 6,
      draw: () => `<path d="M-27.5 -38L-39 -76" stroke="#8A5CD0" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M-30.5 -48L-33 -56M-34 -60L-36 -66" stroke="#C7B2F0" stroke-width="1.3" stroke-linecap="round"/>
        <g class="qav-glow">${glow(-41,-84,17,"#FFE45C")}</g>
        <path d="${starPath(-41,-84,11.5,.48)}" fill="#FFD23F" stroke="#F0A400" stroke-width="1.4" stroke-linejoin="round"/>
        <ellipse cx="-44" cy="-87" rx="2.4" ry="1.6" fill="#FFF6C8" transform="rotate(-30 -44 -87)"/>
        <g fill="#FFE45C"><path d="${sparkle(-53,-100,3.6)}"/><path d="${sparkle(-28,-98,2.8)}"/><path d="${sparkle(-55,-75,2.4)}"/></g>` },
    { id: "moon-wand", name: "Moon Wand", ic: "🌙", lvl: 9,
      draw: () => `<path d="M-27.5 -38L-38 -77" stroke="#3E9BD6" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M-27.5 -38L-38 -77" stroke="#FFFFFF" stroke-width="3.4" stroke-dasharray="2 5" stroke-linecap="round" opacity=".55"/>
        <g class="qav-glow">${glow(-40,-87,17,"#CFE6FF")}</g>
        <path d="${crescent(-40,-87,11,5.5,-4.5,9)}" fill="#FFF0A6" stroke="#E8C64E" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="${starPath(-33.5,-93.5,3.6,.5)}" fill="#FFE45C"/>
        <g fill="#FFFFFF"><path d="${sparkle(-54,-98,3)}"/><path d="${sparkle(-26,-80,2.4)}"/></g>` },
    { id: "parol-lantern", name: "Parol Lantern", ic: "🌟", lvl: 11,   /* 🌟 not 🏮: a parol is a star-shaped lantern */
      draw: () => { const p = (r, a) => [n(-42 + r*Math.cos(a)), n(-92 + r*Math.sin(a))]; const L = p(14, Math.PI*.7), R = p(14, Math.PI*.3);
        return `<path d="M-27.5 -38L-40 -82" stroke="#C9A15A" stroke-width="3" stroke-linecap="round"/><path d="M-30 -48.5h-3.5M-33 -61h-3.5M-36 -73.5h-3.5" stroke="#A47E3E" stroke-width="1.2"/>
        <path d="M${L[0]} ${L[1]}q-3 5 0 9q3 4 0 9" stroke="#FFD23F" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M${R[0]} ${R[1]}q3 5 0 9q-3 4 0 9" stroke="#5DBB63" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <g class="qav-glow">${glow(-42,-92,18,"#FFE45C")}</g>
        <path d="${starPath(-42,-92,14,.5)}" fill="#E5484D" stroke="#B8323A" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="${starPath(-42,-92,9,.5)}" fill="#FFD23F"/><circle cx="-42" cy="-92" r="3.8" fill="#FFF7C2"/>
        <g fill="#FFFFFF"><path d="${sparkle(-26,-104,2.8)}"/><path d="${sparkle(-56,-72,2.4)}"/></g>`; } }
  ];

  const items = { hat, cape, wand };

  /* ---------- body ---------- */
  const TEE = "#FF7E6B", TEE_D = "#E4604F", SHORTS = "#3E6FC2", SHORTS_D = "#2F5AA6", SHOE = "#8A5CD0";
  const arm = (d, sk) => `<path d="${d}" stroke="${sk}" stroke-width="7.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  const sleeve = d => `<path d="${d}" stroke="${TEE}" stroke-width="11" fill="none" stroke-linecap="round"/>`;
  const holdArm = ([x, y]) => `M-15 -63Q${n(x + 2)} ${n(-63 + (y + 63)*.3)} ${x} ${y}`;
  function body(sk, hand){
    const sd = mix(sk, "#7A3B22", .2);
    const shoe = x => `<rect x="${x}" y="-8.5" width="12" height="8.5" rx="4.2" fill="${SHOE}"/><rect x="${x}" y="-2.6" width="12" height="2.6" rx="1.3" fill="#FFFFFF"/>`;
    const armL = hand ? holdArm(hand) : "M-15 -63Q-24 -53 -24.5 -38";
    const handL = hand ? "" : `<circle cx="-24.5" cy="-38" r="5" fill="${sk}"/>`;
    return `<g fill="${sk}"><rect x="-10.5" y="-32" width="7.2" height="26" rx="3"/><rect x="3.3" y="-32" width="7.2" height="26" rx="3"/></g>
      <g fill="#FFFFFF"><rect x="-10.8" y="-13" width="7.8" height="6" rx="1.5"/><rect x="3" y="-13" width="7.8" height="6" rx="1.5"/></g>
      ${shoe(-13.4)}${shoe(1.4)}
      <path d="M-18.5 -45L18.5 -45L20.5 -28Q12 -25.5 2 -27.5L0 -33L-2 -27.5Q-12 -25.5 -20.5 -28Z" fill="${SHORTS}"/>
      <path d="M0 -44V-34" stroke="${SHORTS_D}" stroke-width="1.2"/>
      <rect x="-5" y="-76" width="10" height="9" fill="${sd}"/>
      ${arm(armL, sk)}${handL}${sleeve("M-15.5 -63Q-19 -61 -20.5 -58.5")}
      <path d="M-6.5 -69.5Q0 -65 6.5 -69.5L14 -67.5Q19.5 -65.5 19.5 -58L18.5 -42Q0 -39.5 -18.5 -42L-19.5 -58Q-19.5 -65.5 -14 -67.5Z" fill="${TEE}"/>
      <path d="M-6.5 -69.5Q0 -65 6.5 -69.5" stroke="${TEE_D}" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-18.5 -43Q0 -40.5 18.5 -43" stroke="${TEE_D}" stroke-width="1.6" fill="none"/>
      <path d="${starPath(0,-55,5.6,.48)}" fill="#FFD23F" stroke="#F0A400" stroke-width=".9" stroke-linejoin="round"/>`;
  }
  const rightArm = sk => `${arm("M15 -63Q30 -61 35 -80", sk)}${sleeve("M15.5 -63Q20 -63.5 22.5 -63")}<circle cx="35.5" cy="-81" r="5.2" fill="${sk}"/>
    <ellipse cx="30.8" cy="-84.5" rx="2.1" ry="3.3" fill="${sk}" transform="rotate(-25 30.8 -84.5)"/>
    <g stroke="#FFC93C" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M42 -92Q45 -88 44.5 -83"/><path d="M45.5 -97Q50 -91 49.5 -84"/></g>`;
  function head(sk, hc){
    /* Keep the face readable on every skin: brows always clearly darker than the skin (light hair on deep skin
       gets dark-brown brows), the mouth deepens on darker skins, and blush stays a rosy glow instead of a dark patch. */
    const L = lum(sk), sd = mix(sk, "#7A3B22", .22);
    let brow = mix(hc, INK, .35);
    for(let i = 0; i < 12 && lum(brow) > L - .24; i++) brow = mix(brow, "#140D10", .3);
    const blush = mix(mix(sk, "#FFFFFF", clamp((.6 - L)*.8, 0, .3)), "#FF4F86", .42);
    const mouth = mix("#7A2E3B", "#3A1020", clamp((.6 - L)*2, 0, 1));
    return `<g fill="${sk}"><circle cx="-24.5" cy="-92" r="5.5"/><circle cx="24.5" cy="-92" r="5.5"/></g>
      <g fill="${sd}"><circle cx="-25" cy="-92" r="2.5"/><circle cx="25" cy="-92" r="2.5"/></g>
      <ellipse cx="0" cy="-95" rx="25.5" ry="25" fill="${sk}"/>
      <g fill="${blush}" opacity=".6"><ellipse cx="-15.5" cy="-83.5" rx="4.6" ry="2.9"/><ellipse cx="15.5" cy="-83.5" rx="4.6" ry="2.9"/></g>
      <g fill="${INK}"><ellipse cx="-9.5" cy="-91" rx="3.7" ry="4.7"/><ellipse cx="9.5" cy="-91" rx="3.7" ry="4.7"/></g>
      <g fill="#FFFFFF"><circle cx="-8.1" cy="-92.9" r="1.5"/><circle cx="10.9" cy="-92.9" r="1.5"/></g>
      <path d="M-13 -99.5Q-9.5 -102 -6 -99.5M6 -99.5Q9.5 -102 13 -99.5" stroke="${brow}" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M-1.8 -86.5Q0 -85.2 1.8 -86.5" stroke="${sd}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M-5.8 -81.2Q0 -73.2 5.8 -81.2Z" fill="${mouth}" stroke="${mouth}" stroke-width="1" stroke-linejoin="round"/><ellipse cx="0" cy="-77.6" rx="2.6" ry="1.3" fill="#F08AA0"/>`;
  }

  /* ---------- composition ---------- */
  function find(list, v, fallback){
    if(v && typeof v === "object") v = v.id;
    if(v === null || v === undefined || v === "") return fallback;
    return list.find(x => x.id === v) || (typeof v === "number" && list[v]) || fallback;
  }
  const colorOf = (list, v, def) => (typeof v === "string" && /^#[0-9a-f]{3,8}$/i.test(v)) ? v : find(list, v, list[def]).color;
  const DEFAULT_LOOK = { skin: "warm-brown", hair: "long", hairColor: "black" };

  function draw(look, wear){
    look = look || {}; wear = wear || {};
    const sk = colorOf(skins, look.skin, 3), hc = colorOf(hairColors, look.hairColor, 0);
    const hr = find(hairs, look.hair, hairs[1]);
    const h = find(hat, wear.hat, null), c = find(cape, wear.cape, null), w = find(wand, wear.wand, null), hw = w && (w.hand || HAND);
    const fit = (h && !h.covers && hr.crown) || hr.hat || [0, 1], hatT = fit[1] === 1 && !fit[0] ? "" : ` transform="translate(0 ${n(95*(fit[1]-1) + fit[0])}) scale(${fit[1]})"`;
    return `<g class="qav">` +
      (c ? c.draw("back") : "") +
      hr.draw(hc, "back", { hat: !!(h && h.covers) }) +
      body(sk, hw) +
      (c ? c.draw("front") : "") +
      head(sk, hc) +
      hr.draw(hc, "front", { hat: !!(h && h.covers) }) +
      rightArm(sk) +
      (h ? `<g${hatT}>${h.draw()}</g>` : "") +
      (w ? w.draw() + `<circle cx="${hw[0]}" cy="${hw[1]}" r="5.2" fill="${sk}"/><path d="M${hw[0]-4} ${hw[1]-2}Q${hw[0]} ${hw[1]+2} ${hw[0]+4} ${hw[1]-2}" stroke="${mix(sk, "#7A3B22", .25)}" stroke-width="1.2" fill="none" stroke-linecap="round"/>` : "") +
      `</g>`;
  }

  return { skins, hairs, hairColors, items, draw, defaults: { look: DEFAULT_LOOK, wear: { hat: null, cape: null, wand: null } } };
})();

/*QART-END*/
const QREADY = () => !!(QSTORY && QWORDS && typeof QART!=="undefined" && typeof QAV!=="undefined");
const Q_XP_LEVEL = 120;        // XP for each new level
const Q_TURNS = {small:8, big:11}, Q_FOG = {small:12, big:20};
let Q = null;                  // the encounter being played
let QDICT = null, QLOOK = null;   // QLOOK: the look being edited (not saved until Done)
const qd = () => { const q = K.quest = K.quest || {}; q.step = q.step||0; q.xp = q.xp||0; q.pets = q.pets||[]; q.items = q.items||[]; q.wear = q.wear||{}; q.freed = q.freed||{};
  q.stats = q.stats||{turns:0, right:0, fast:0, words:0, longest:""}; return q };
const qLevel = () => 1 + Math.floor(qd().xp / Q_XP_LEVEL);
const qCreature = id => QSTORY.creatures.find(c=>c.id===id);
// The island path: each chapter has three stops and a big friendly fog creature at the end (20 places in all).
function qNodes(){
  const out = [];
  QSTORY.chapters.forEach((ch, ci)=>{ ch.stops.forEach((s, si)=>out.push({ci, si, ch, stop:s, big:false})); out.push({ci, si:3, ch, stop:ch.big, big:true}) });
  return out;
}
// Voices: small creatures borrow the cast's lighter voices; the big fog friends use the deep one.
function qWho(id){
  if(!id || id==="pip" || id==="narrator") return "pip";
  const c = qCreature(id); if(c && c.pet===false) return "bruno";
  let h = 0; for(const ch of id) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  return ["juno","kiko","benny","wren"][h % 4];
}
function qAvatar(){ const q = qd(); return QAV.draw(q.look || {skin:QAV.skins[2].id, hair:QAV.hairs[0].id, hairColor:QAV.hairColors[0].id}, q.wear) }
function qItem(kind, id){ return ((QAV.items[kind])||[]).find(x=>x.id===id) }
function qAllItems(){ return ["hat","cape","wand"].flatMap(k=>(QAV.items[k]||[]).map(x=>({...x, kind:k}))).sort((a,b)=>a.lvl-b.lvl) }

/* ---- stage: map background, avatar with her Word Light, pet, creature and fog ---- */
function qStage(place, opt){
  opt = opt || {};
  const q = qd(), pet = q.pet && qCreature(q.pet);
  const cr = opt.creature ? qCreature(opt.creature) : null, big = cr && cr.pet===false;
  const cs = big ? 2.3 : 1.55, cx = big ? 560 : 575;
  return `<svg class="qstage" viewBox="0 0 800 450"${opt.slice?' preserveAspectRatio="xMidYMid slice"':""} role="img" aria-label="${esc(opt.label||"Quest scene")}">
    ${(QART.map[place] || QART.map[Object.keys(QART.map)[0]])()}
    ${opt.pip ? `<g transform="translate(110,430) scale(1.05)">${ART.pip(opt.pipMood||"happy")}</g>` : ""}
    <g class="qavatar" transform="translate(${opt.pip?245:215},432) scale(1.35)">${qAvatar()}</g>
    ${pet && !opt.noPet ? `<g class="qpet" transform="translate(${opt.pip?340:325},432) scale(.62)">${QART.creature[pet.id]("awake")}</g>` : ""}
    ${cr ? `<g id="qcr" class="qcr" transform="translate(${cx},432) scale(${cs})"><g id="qcrIn">${QART.creature[cr.id](opt.state||"sleep")}</g><g id="qfog" class="qfog">${QART.fog(opt.fog===undefined?1:opt.fog)}</g></g>` : ""}
    <g id="qfx"></g>
  </svg>`;
}
// A story scene: lines are read aloud one by one with captions she can tap; Next moves on, Skip ends the scene.
// Resolves true when the scene ends, false when she leaves with the X.
function qScene(lines, place, opt){
  opt = opt || {};
  return new Promise(resolve=>{
    const tok = ++VTOK; let i = 0;
    Q = {scene:true, tok, done:()=>{ if(Q && Q.tok===tok){ Q = null; resolve(true) } },
      exit:()=>{ if(Q && Q.tok===tok){ hush(); Q = null; resolve(false) } }};
    app().innerHTML = `<div class="top"><button class="btn ghost sm" data-act="questMap" aria-label="Back to the map">✕</button><b class="qtitle">${esc(opt.title||QSTORY.title)}</b>${speedChip()}</div>
      <div class="qscene">${qStage(place, {...opt, pip:true})}</div>
      <div class="card qcap"><p id="qline" class="qline" aria-live="polite"></p>
        <div class="row" style="justify-content:space-between"><button class="link small" data-act="qSkip">Skip</button><button class="btn" data-act="qNext" id="qNextBtn">Next ▶</button></div></div>`;
    let shownAt = 0;
    const show = () => {
      if(!Q || Q.tok!==tok) return;
      if(i >= lines.length){ Q.done(); return }
      const l = lines[i], who = l.who==="narrator" ? "" : (l.who==="pip" ? "Pip" : ((qCreature(l.who)||{}).name || ""));
      $("#qline").innerHTML = `${who?`<b>${esc(who)}:</b> `:""}${words(l.text)}`;
      const at = i, t0 = shownAt = Date.now(), floor = Math.max(2500, l.text.split(/\s+/).length*400);
      const p = say(l.text, {kind:"sent", who:qWho(l.who)}), n = SAYN;
      // Move on by itself only if nothing else was spoken meanwhile (a tapped word holds the line until Next).
      p.then(()=>{ const left = Math.max(0, floor-(Date.now()-t0)) + 900;
        setTimeout(()=>{ if(Q && Q.tok===tok && i===at && SAYN===n){ i++; show() } }, left) });
    };
    const tooSoon = () => Date.now()-shownAt < 400;   // a double tap must not skip the next line or scene
    Q.next = () => { if(tooSoon()) return; hush(); i++; show() };
    Q.skip = () => { if(tooSoon()) return; hush(); i = lines.length; show() };
    show();
  });
}

/* ---- map ---- */
function questCard(){
  if(!K.assessed) return `<div class="card questcard locked-card"><span class="qc-ic">🏝️</span><span class="vscard-body"><b>Reading Quest</b><small>Play the warm-up game first to unlock the island.</small></span><span class="lock" aria-hidden="true">🔒</span></div>`;
  if(!QREADY()) return "";
  const q = qd(), n = qNodes().length;
  return `<button class="card questcard" data-act="quest"><span class="qc-ic">🏝️</span><span class="vscard-body"><b>Reading Quest</b><small>Clear the Jumble Fog with your Word Light and free the island's creatures!</small>
    ${q.step ? `<small class="muted">Level ${qLevel()} · ${Math.min(q.step, n)} of ${n} places · ${q.pets.length} pets</small>` : ""}</span><span class="play" aria-hidden="true">▶</span></button>`;
}

  if(!QREADY()){ go("home"); return }
  const q = qd();
  if(!q.look){ renderQuestLook(true); return }
  if(!q.introSeen){ qScene(QSTORY.intro, QSTORY.chapters[0].place, {title:QSTORY.subtitle}).then(()=>{ qd().introSeen = true; save(); go("quest") }); return }   // seen even if she skips
  const nodes = qNodes(), lv = qLevel(), into = q.xp % Q_XP_LEVEL;

    <div class="card qhead"><span class="qhead-av"><svg viewBox="-60 -150 120 160" aria-hidden="true">${qAvatar()}</svg></span>
      <span class="qhead-body"><b>${esc(K.name)}, Word Light explorer</b><span class="small">Level ${lv}</span>
        <span class="xpbar" aria-label="${into} of ${Q_XP_LEVEL} points to the next level"><i style="width:${Math.round(into/Q_XP_LEVEL*100)}%"></i></span>
        <span class="row" style="gap:8px"><button class="btn ghost sm" data-act="go" data-arg="questCloset">👕 Wardrobe</button><button class="btn ghost sm" data-act="go" data-arg="questPets">🐾 Pets (${q.pets.length})</button></span></span></div>
    ${QSTORY.chapters.map((ch, ci)=>{ const ns = nodes.map((n,k)=>({...n, k})).filter(n=>n.ci===ci), open = ns[0].k <= q.step;
      return `<div class="card qchap${open?"":" locked"}" style="--qc:${esc(ch.color||"#3B7FD6")}">
        <div class="qchap-art"><svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${(QART.map[ch.place]||(()=>""))()}</svg></div>
        <h3>${esc(ch.ic||"")} ${esc(ch.name)}</h3>
        <div class="qnodes">${ns.map(n=>{ const done = n.k < q.step, now = n.k===q.step, can = n.k <= q.step, c = qCreature(n.stop.creature);
          return `<button class="qnode${done?" done":""}${now?" now":""}${n.big?" big":""}" ${can?`data-act="qGo" data-arg="${n.k}"`:"disabled"} aria-label="${esc(n.stop.name)}${done?", freed":now?", next":""}">
            <svg viewBox="-70 -140 140 150" aria-hidden="true">${can ? QART.creature[c.id](done?"awake":"sleep") + (done?"":QART.fog(.55)) : QART.fog(1)}</svg>
            <small>${can ? esc(n.stop.name) : "🔒"}</small>${now?`<span class="qgo">Go!</span>`:""}</button>` }).join("")}</div></div>` }).join("")}
    ${q.step >= nodes.length ? `<div class="card hero"><h2>🏆 The whole island is free!</h2><p>Play any place again to practice and earn more points.</p></div>` : ""}`;
}

/* ---- encounter ---- */
function qPlan(big, chSkill){
  const n = big ? Q_TURNS.big : Q_TURNS.small, focus = focusGoals().filter(o=>o.domain==="reading" && o.evidence && o.evidence.skill).map(o=>o.evidence.skill);
  const ch = ORDER.includes(chSkill) ? chSkill : null, plan = []; let skills = 0;
  for(let i=0;i<n;i++){
    if(i===3 || (big && i===8)) plan.push("free");          // a Word Light Burst early enough that she always reaches it
    else if(i%2===0) plan.push("spell");
    else { plan.push(ch && (skills===0 || Math.random()<0.5) ? ch : (focus.length && Math.random()<0.6 ? pick(focus) : planAdventure(1)[0])); skills++ }
  }
  return plan;
}
async function questStart(k){
  if(!QREADY()) return;
  const nodes = qNodes(), node = nodes[+k]; if(!node || +k > qd().step) return;
  const cr = qCreature(node.stop.creature), place = node.ch.place, again = !!qd().freed[cr.id], hidePet = qd().pet===cr.id;
  const before = again ? [{who:"pip", text:`The fog drifted back to ${node.stop.name}! Let's clear it again.`}] : node.stop.before;
  if(node.si===0 && !qd()["ch"+node.ci]){ const ok = await qScene(node.ch.intro, place, {title:node.ch.name}); qd()["ch"+node.ci] = true; save(); if(!ok){ go("quest"); return } }
  if(!await qScene(before, place, {title:node.stop.name, creature:cr.id, state:"sleep", fog:1, noPet:hidePet})){ go("quest"); return }
  go("questPlay"); inRound = true;
  const big = node.big;
  Q = {k:+k, node, cr, place, big, again, hidePet, fog:Q_FOG[big?"big":"small"], fogMax:Q_FOG[big?"big":"small"], plan:qPlan(big, node.ch.focus), i:0, tok:++VTOK, used:new Set(),
    xp:0, right:0, turns:0, fast:0, hint:true, words:[], t0:Date.now()};
  app().innerHTML = `<div class="top"><button class="btn ghost sm" data-act="questMap" aria-label="Back to the map">✕</button><span class="qturns" id="qTurns"></span>
      <span class="row" style="gap:8px">${speedChip()}<span class="stars"><span class="s">★</span><span id="qStars">${K.stars}</span></span></span></div>
    <div class="qscene qplay" id="qScene">${qStage(place, {creature:cr.id, state:"sleep", fog:1, noPet:hidePet, slice:true, label:`${cr.name} is asleep in the fog`})}</div>
    <div class="qmeter" id="qMeter" aria-label="Fog left"></div>
    <div class="bubble qsay" id="qSay"></div>
    <div id="qArena" class="task"></div>`;
  qMeter(); qTurn();
}
function qMeter(){ const m = $("#qMeter"); if(!m || !Q) return; const left = Math.max(0, Q.fog);
  m.innerHTML = `<span class="small">Fog</span>${Array.from({length:Q.fogMax}, (_,i)=>`<i class="${i<left?"on":""}"></i>`).join("")}`; m.setAttribute("aria-label", `${left} puffs of fog left`) }
function qSay(text, who){ const b = $("#qSay"); if(b) b.textContent = text; return say(text, {kind:"sent", who:who||"pip"}) }
function qTurn(){
  if(!Q || Q.scene) return;
  if(Q.fog<=0 || Q.i >= Q.plan.length){ qFreed(); return }
  const tok = Q.tok = ++VTOK, kind = Q.plan[Q.i];
  $("#qTurns").textContent = `Turn ${Q.i+1} of ${Q.plan.length}`;
  Q.open = false; Q.locked = false; Q.tries = 0; Q.kind = kind;
  if(kind==="spell") qSpell(tok); else if(kind==="free") qFree(tok); else qSkill(kind, tok);
}
// Clear fog with the Word Light: a beam from her lantern, then the puffs thin out.
function qClear(n){
  if(!Q) return;
  Q.fog = Math.max(0, Q.fog - n); qMeter();
  const fx = $("#qfx"), f = $("#qfog");
  if(fx){ fx.innerHTML = `<line class="qbeam" x1="${Q.big?300:290}" y1="330" x2="${Q.big?560:575}" y2="${Q.big?300:350}"/>`; setTimeout(()=>{ if(fx) fx.innerHTML = "" }, 900) }
  if(f){ f.innerHTML = QART.fog(Q.fog/Q.fogMax); f.classList.remove("puff"); void f.getBoundingClientRect(); f.classList.add("puff") }
}
function qResult(ok, fast, gain, extra){
  if(!Q) return;
  Q.turns++; if(fast) Q.fast++;
  if(ok && !fast){ Q.right++; Q.xp += 10 + (extra||0); qClear(gain); chime(true) }
  else if(!ok) chime(false);
  const st = qd().stats; st.turns++; if(ok && !fast) st.right++; if(fast) st.fast++;
  $("#qStars") && ($("#qStars").textContent = K.stars);
}
function qNext(delay, tok){ if(tok===undefined) tok = Q && Q.tok; setTimeout(()=>{ if(Q && Q.tok===tok){ Q.i++; qTurn() } }, delay||900) }
// Say a line, then go to the next turn when it ends (or after a safety cap if speech stalls).
function qSayThenNext(line, who){ const tk = Q.tok; Promise.race([line ? qSay(line, who) : Promise.resolve(), wait(6000)]).then(()=>{ if(Q && Q.tok===tk) qNext(350, tk) }) }

// Build the word you hear: her letters go into the slots in order; Check tests the whole word.
function qSpell(tok){
  const lv = Math.min((K.levels && K.levels.decode) || 0, QWORDS.spell.length-1), list = QWORDS.spell[lv];
  let w = pick(list); for(let t=0; t<8 && Q.used.has(w.w); t++) w = pick(list); Q.used.add(w.w);
  const letters = w.w.split(""), pool = "aeioubcdfghklmnprstw".split("").filter(c=>!letters.includes(c));
  const extra = shuffle(pool).slice(0, letters.length<=3 ? 2 : 3);
  Q.word = w.w; Q.tiles = shuffle([...letters, ...extra]).map((c,i)=>({c, i, used:false})); Q.slots = letters.map(()=>null);
  $("#qArena").innerHTML = `<p class="prompt">Build the word you hear ${w.e?`<span class="qpic">${w.e}</span>`:""}</p>
    <button class="hear" data-act="qHear">🔊 Hear it again</button>
    <div class="qslots" id="qSlots"></div><div class="qtiles locked" id="qTiles"></div>
    <div class="row" style="justify-content:center"><button class="btn sun" data-act="qCheck" id="qCheckBtn" disabled>Check ✓</button>${qHintBtn()}</div><p id="qCheer" class="cheer"></p>`;
  qDrawTiles(); Q.ok = null;
  const unlock = () => setTimeout(()=>{ if(Q && Q.tok===tok){ Q.open = true; Q.openAt = Date.now(); const t = $("#qTiles"); if(t) t.classList.remove("locked") } }, 150);
  (Q.i===0 ? Promise.race([qSay(pick(QSTORY.pip.start||["Shine your Word Light!"])), wait(6000)]) : Promise.resolve())
    .then(()=>{ if(Q && Q.tok===tok) return say(`Build the word, ${w.w}.`).then(unlock) });
}
function qDrawTiles(){
  const s = $("#qSlots"), t = $("#qTiles"); if(!s || !t) return;
  s.innerHTML = Q.slots.map((x,i)=>`<button class="qslot${x!==null?" full":""}${x!==null && Q.ok && Q.ok.has(i)?" right":""}" data-act="qSlot" data-arg="${i}" aria-label="${x!==null?Q.tiles[x].c:"empty"}">${x!==null?esc(Q.tiles[x].c):""}</button>`).join("");
  t.innerHTML = Q.tiles.map(x=>`<button class="qtile${x.used?" used":""}" data-act="qTile" data-arg="${x.i}" ${x.used?"disabled":""}>${esc(x.c)}</button>`).join("");
  const b = $("#qCheckBtn"); if(b) b.disabled = Q.slots.some(x=>x===null);
}
function qTileTap(i){
  if(!Q || Q.locked) return;
  if(!Q.open){ qCheer(pick(QSTORY.pip.fast||["Let's listen first."]), false); return }
  const t = Q.tiles[+i]; if(!t || t.used) return;
  if(Q.kind==="free"){ if(Q.slots.length >= 9) return; Q.slots.push(t.i) }
  else { const at = Q.slots.indexOf(null); if(at<0) return; Q.slots[at] = t.i }
  t.used = true; say(t.c, {kind:"word"}); qDrawTiles();
}
function qSlotTap(i){
  if(!Q || Q.locked) return;
  const x = Q.slots[+i]; if(x===null || x===undefined) return;
  Q.tiles[x].used = false;
  if(Q.kind==="free") Q.slots.splice(+i, 1); else { Q.slots[+i] = null; if(Q.ok) Q.ok.delete(+i) }
  qDrawTiles();
}
function qCheer(t, good){ const c = $("#qCheer"); if(c){ c.textContent = t; c.className = "cheer " + (good?"good":"try") } }
function qHintBtn(){ return Q && Q.hint && qd().pet && !Q.hidePet ? `<button class="btn ghost" data-act="qHint">🐾 Hint</button>` : (Q && Q.hint ? `<button class="btn ghost" data-act="qHint">🦉 Hint</button>` : "") }
function qHint(){
  if(!Q || !Q.hint || Q.locked) return;
  if(!Q.open){ qCheer(pick(QSTORY.pip.fast||["Let's listen first."]), false); return }
  Q.hint = false; Q.hinted = Q.i;
  const pet = !Q.hidePet && qd().pet && qCreature(qd().pet), line = pet ? pet.hint : pick(QSTORY.pip.hint||["Here is a little help."]);
  if(Q.kind==="spell"){   // the pet shows the next letter in its place
    const at = Q.slots.findIndex((x,i)=>x===null || Q.tiles[x].c!==Q.word[i]);
    if(at>=0){ if(Q.slots[at]!==null) Q.tiles[Q.slots[at]].used = false;
      const t = Q.tiles.find(x=>!x.used && x.c===Q.word[at]) || Q.tiles.find(x=>x.c===Q.word[at]);
      Q.slots = Q.slots.map(x=>x===t.i?null:x); Q.slots[at] = t.i; t.used = true; qDrawTiles() }
  } else if(Q.kind==="free"){ const w = Q.can && Q.can[0]; if(w) qCheer(`Try a word that starts with ${w[0].toUpperCase()}.`, true) }
  else { const wrong = [...document.querySelectorAll("#qArena .opt")].filter(o=>o.dataset.arg!==Q.item.ans); if(wrong[0]){ wrong[0].disabled = true; wrong[0].classList.add("hinted") } }
  qSay(line, pet ? qWho(pet.id) : "pip");
  document.querySelectorAll("[data-act=qHint]").forEach(b=>b.remove());
}
function qCheck(){
  if(!Q || Q.locked || !Q.open) return;
  const built = Q.slots.map(x=>x===null?"":Q.tiles[x].c).join("");
  if(Q.kind==="free"){ qFreeCheck(built); return }
  if(built.length < Q.word.length) return;
  Q.locked = true; Q.tries++;
  const ok = built===Q.word, fast = Date.now()-Q.openAt < 300*Q.word.length;
  const helped = Q.tries>1 || Q.hinted===Q.i;
  record({skill:"spell", level:(K.levels&&K.levels.decode)||0, key:"QS:"+Q.word}, ok, {review:true, fast: fast || (ok && helped)});
  if(ok){
    qResult(true, fast, Math.min(5, Q.word.length), Q.word.length*2);
    qCheer(fast ? pick(QSTORY.pip.fast||["Whoa, speedy!"]) : pick(CHEERS), !fast);
    qd().stats.words++; qSayThenNext(fast ? "" : pick(QSTORY.pip.light||["Your Word Light shines!"])); return }
  if(Q.tries < 2){   // keep the right letters (shown green), send the others back, try once more
    Q.slots = Q.slots.map((x,i)=> x!==null && Q.tiles[x].c===Q.word[i] ? x : (x!==null ? (Q.tiles[x].used = false, null) : null));
    Q.ok = new Set(Q.slots.map((x,i)=>x!==null?i:-1).filter(i=>i>=0));
    qDrawTiles(); qCheer("Almost! The green letters are right. Listen again.", false);
    const tk = Q.tok; Promise.race([qSay(pick(QSTORY.pip.almost||["Almost! Try again."])), wait(5000)]).then(()=>{ if(Q && Q.tok===tk){ Q.locked = false; say(Q.word) } }); return }
  qResult(false, false, 0); qCheer(`This word is ${Q.word}.`, false);
  $("#qSlots").innerHTML = Q.word.split("").map(c=>`<span class="qslot full show">${esc(c)}</span>`).join("");
  const tk = Q.tok; say(`This word is ${Q.word}. ${Q.word.split("").join(", ")}. ${Q.word}.`).then(()=>{ if(Q && Q.tok===tk) qNext(600, tk) });
}
// Word Light Burst: build any real word from nine tiles; longer words clear more fog.
function qFree(tok){
  const lv = Math.min((K.levels && K.levels.decode) || 0, QWORDS.spell.length-1);
  if(!QDICT) QDICT = new Set(QWORDS.dict);
  let tiles = null, can = [];
  for(let t=0; t<40; t++){
    const seed = pick(QWORDS.spell[Math.max(0, lv)]).w, vow = "aeiou", fill = [];
    while(seed.length + fill.length < 9) fill.push(Math.random()<0.38 ? pick(vow.split("")) : pick("bcdfghklmnprstw".split("")));
    const set = shuffle([...seed.split(""), ...fill]);
    can = qWordsFrom(set); if(can.length >= 6){ tiles = set; break }
  }
  if(!tiles){ tiles = shuffle("catsdogin".split("")); can = qWordsFrom(tiles) }   // a safe set with many small words
  Q.tiles = tiles.map((c,i)=>({c, i, used:false})); Q.slots = []; Q.can = can.sort((a,b)=>b.length-a.length || (a<b?-1:1)); Q.freeTries = 0;
  $("#qArena").innerHTML = `<p class="prompt">✨ Word Light Burst! Make any word. Longer words shine brighter!</p>
    <div class="qslots free" id="qSlots"></div><div class="qtiles grid locked" id="qTiles"></div>
    <div class="row" style="justify-content:center"><button class="btn sun" data-act="qCheck" id="qCheckBtn" disabled>Shine ✓</button><button class="btn ghost" data-act="qClearSlots">Clear</button>${qHintBtn()}</div><p id="qCheer" class="cheer"></p>`;
  qDrawTiles();
  qSay("Word Light Burst! Make any word you can. Longer words shine brighter!").then(()=>{ if(Q && Q.tok===tok){ Q.open = true; Q.openAt = Date.now(); const t = $("#qTiles"); if(t) t.classList.remove("locked") } });
}
function qWordsFrom(letters){
  const have = {}; letters.forEach(c=>have[c]=(have[c]||0)+1);
  return QWORDS.dict.filter(w=>{ if(w.length<2 || w.length>letters.length) return false; const n = {}; for(const c of w){ n[c]=(n[c]||0)+1; if(n[c]>(have[c]||0)) return false } return true });
}
function qFreeCheck(built){
  if(built.length < 2){ qCheer("Make a word with two or more letters.", false); return }
  Q.locked = true; Q.freeTries++;
  if(QDICT.has(built) && !Q.words.includes(built)){
    Q.words.push(built); const st = qd().stats; st.words++; if(built.length > (st.longest||"").length) st.longest = built;
    qResult(true, false, Math.min(6, Math.max(1, built.length-1)), built.length*3); K.stars++;
    qCheer(`${built.toUpperCase()}! ${built.length>=5?"A big, bright word!":"Nice word!"}`, true);
    const tk = Q.tok; say(built, {kind:"word"}).then(()=>{ if(Q && Q.tok===tk) qSayThenNext(pick(QSTORY.pip.light||["Your Word Light shines!"])) }); return }
  if(Q.freeTries < 3){ qCheer(Q.words.includes(built) ? "You used that word already. Try a new one!" : "Hmm, I don't know that word. Try another!", false);
    Q.tiles.forEach(t=>t.used=false); Q.slots = []; qDrawTiles(); setTimeout(()=>{ if(Q) Q.locked = false }, 400); return }
  qResult(false, false, 0); qCheer(`Some words you could make: ${Q.can.slice(0,3).join(", ")}.`, false);
  const tk = Q.tok; qSay(`Some words you could make: ${Q.can.slice(0,3).join(", ")}.`).then(()=>{ if(Q && Q.tok===tk) qNext(500, tk) });
}
// Her regular skill questions, at her level (same listen-first rule as the adventure).
function qSkill(skill, tok){
  const item = buildItem(skill, (K.levels && K.levels[skill]) || 0, Q.used); Q.used.add(item.key); Q.item = item;
  let stage = "";
  if(item.kind==="listen") stage = `${item.pic?`<div class="pic">${item.pic}</div>`:""}<button class="hear" data-act="qHearItem">🔊 Hear it again</button>`;
  if(item.kind==="read") stage = `<div class="bigword">${esc(item.word)}</div>`;
  if(item.kind==="comp") stage = `${item.text?`<div class="passage">${item.text.map(words).join(" ")}</div>`:""}<button class="hear" data-act="qHearQ">🔊 Hear the question</button>`;
  $("#qArena").innerHTML = `${stage}<p class="prompt">${esc(item.prompt)}</p>
    <div class="${item.five?"opts five":"opts"} locked" id="qOpts">${item.opts.map(o=>`<button class="opt${o.txt?" txt":""}${o.pic?" pic2":""}" data-act="qAns" data-arg="${esc(o.v)}">${o.html}</button>`).join("")}</div>
    <div class="row" style="justify-content:center">${qHintBtn()}</div><p id="qCheer" class="cheer"></p>`;
  const unlock = () => { if(Q && Q.tok===tok && !Q.open){ Q.open = true; Q.openAt = Date.now(); const o = $("#qOpts"); if(o) o.classList.remove("locked") } };
  if(item.kind==="listen"){ Q.minMs = 600; setTimeout(()=>{ if(Q && Q.tok===tok) say(item.say).then(()=>setTimeout(unlock,150)) }, 350) }
  else if(item.kind==="read"){ Q.minMs = 900; setTimeout(unlock, 1500) }
  else { const wc = ((item.text||[]).join(" ")+" "+(item.q||"")).split(/\s+/).length; Q.minMs = 1000; setTimeout(()=>{ if(Q && Q.tok===tok) say(item.q||item.prompt) }, 350); setTimeout(unlock, Math.min(6000, 1200+wc*120)) }
}
function qAnswer(v, el){
  if(!Q || Q.locked) return;
  if(!Q.open){ qCheer(pick(QSTORY.pip.fast||["Let's listen first."]), false); return }
  Q.locked = true;
  const it = Q.item, ok = v===it.ans, fast = Date.now()-Q.openAt < Q.minMs;
  const change = record(it, ok, {fast});
  qResult(ok, fast, it.kind==="comp" ? 3 : 2);
  const opts = [...document.querySelectorAll("#qArena .opt")];
  if(ok){ el.classList.add("right"); qCheer(fast ? pick(QSTORY.pip.fast||["Whoa, speedy!"]) : pick(CHEERS), !fast); qSayThenNext(fast ? "" : pick(QSTORY.pip.light||["Your Word Light shines!"])) }
  else { el.classList.add("wrong"); opts.forEach(o=>{ if(o.dataset.arg===it.ans) o.classList.add("right") }); qCheer("Good try! The green one is right.", false);
    const tk = Q.tok; say(it.reveal).then(()=>{ if(Q && Q.tok===tk) qNext(500, tk) }) }
  if(change) Q.levelNote = change;
}
// The fog lifts: the creature wakes, thanks her, maybe joins as a pet; points, level-ups and the story continue.
async function qFreed(){
  if(!Q || Q.ending) return; Q.ending = true;
  const cr = Q.cr, node = Q.node, place = Q.place, big = Q.big, k = Q.k, tok = Q.tok = ++VTOK, hadFog = Q.fog > 0;
  // 1) commit: points, freed count, pet, next place, stars, unlocks, time and stickers, saved right away
  const q = qd(), before = qLevel(), bonus = big ? 50 : 20, first = !q.freed[cr.id];
  Q.xp += bonus; q.xp += Q.xp; q.freed[cr.id] = (q.freed[cr.id]||0)+1; q.played = (q.played||0)+1;
  const newPet = first && cr.pet!==false && !q.pets.includes(cr.id); if(newPet){ q.pets.push(cr.id); if(!q.pet) q.pet = cr.id }
  if(k===q.step) q.step++;
  K.stars += big ? 5 : 2;
  const lvNow = qLevel(), unlocked = qAllItems().filter(x=>x.lvl>before && x.lvl<=lvNow && !q.items.includes(x.id));
  unlocked.forEach(x=>q.items.push(x.id));
  dayRec().ms += Date.now()-Q.t0; const got = awardStickers(); save(); inRound = false;
  const res = {xp:Q.xp, right:Q.right, turns:Q.turns, words:Q.words.slice()};
  // 2) celebrate (leaving now only skips this)
  if(hadFog){ await Promise.race([qSay("Look! The fog is so thin now. Let's blow the last puffs away together. Whoosh!"), wait(9000)]); if(!Q || Q.tok!==tok) return; Q.fog = 0; qClear(0); await wait(300) }
  const g = $("#qcrIn"); if(g){ g.innerHTML = QART.creature[cr.id]("awake"); $("#qcr").classList.add("qwake") }
  burst(); chime(true);
  await Promise.race([say(cr.freed, {kind:"sent", who:qWho(cr.id)}), wait(9000)]); if(!Q || Q.tok!==tok) return;
  app().innerHTML = `<div class="card hero qend">${qStage(place, {creature:cr.id, state:"awake", fog:0, noPet:newPet || Q.hidePet})}
    <h1>${esc(cr.name)} is free! ✨</h1>
    <p class="stars" style="font-size:1.3rem">+${res.xp} points · ${res.right} of ${res.turns} turns shone bright</p>
    ${res.words.length ? `<p>Your Word Light words: <b>${res.words.map(esc).join(", ")}</b></p>` : ""}
    ${newPet ? `<p class="bubble" style="margin-left:10px">${esc(cr.name)} wants to come with you as a pet! 🐾</p>` : ""}
    ${lvNow>before ? `<p class="qlevel">⭐ Level ${lvNow}! ${unlocked.length ? `You unlocked: ${unlocked.map(x=>`${x.ic} ${esc(x.name)}`).join(", ")}` : ""}</p>` : ""}
    ${got.length ? `<div style="font-size:3rem">${got.join(" ")}</div>` : ""}
    <div class="row" style="justify-content:center"><button class="btn big" data-act="qAfter">Next ▶</button>${unlocked.length?`<button class="btn ghost" data-act="qAfter" data-arg="questCloset">Try it on</button>`:""}</div></div>`;
  if(lvNow>before) say(pick(QSTORY.pip.levelUp||["You reached a new level!"]), {kind:"sent", who:"pip"});
  // 3) the story continues (also before the wardrobe), then the map or wherever she chose
  const after = Q.again ? [{who:"pip", text:"You cleared the fog again. Great job!"}] : node.stop.after;
  Q.after = async (dest) => {
    if(await qScene(after, place, {title:node.stop.name, creature:cr.id, state:"awake", fog:0}) && big && node.ch.outro && !qOutroSeen(k)) await qScene(node.ch.outro, place, {title:node.ch.name});
    go(dest || "quest");
  };
}

  vsHear:()=>{ if(V && V.item) say(V.item.say) },
  vsHearQ:()=>{ if(V && V.item) say(V.item.q) },
  vsQuit:()=>{ if(V){ V.tok = ++VTOK; dayRec().ms += Date.now()-V.t0 } const got = awardStickers(); save(); go("home"); if(got.length) toast("New sticker: " + got.join(" ")) },
  tAns:(k)=>toonAnswer(+k),
  tRead:()=>toonRead(),
  tHearLine:()=>{ const st = P && P.ep.steps[P.i]; if(st && st.t==="yourturn") say(st.text, {kind:"sent"}) },
  tActGo:()=>actGo(),
  tCount:(k,el)=>toonCount(k,el),
  tMission:()=>toonMission(),
  tWord:(w)=>{ if(!w || !P) return; const live = x => x && x.tok===P.tok;
    const waiting = live(P.awaiting) || live(P.awaitRead) || live(P.actStep) || live(P.counting) || live(P.awaitMission);
    if(!waiting && !P.paused) pauseToon(); say(w, {kind:"word"}) },
  tPause:()=>{ if(!P) return; P.pausedBySheet = false; if(P.paused) resumeToon(); else pauseToon() },
  tRepeat:()=>{ if(!P) return; P.i = lastSpeakIdx(); runStep() },
  tSkip:()=>{ if(!P) return; P.tok = ++TOKC; clearWaits(); hush(); nextStep() },
  tQuit:()=>{ if(!P){ go("home"); return } const cat = P.ep.cat; dayRec().ms += Date.now()-P.t0; const got = awardStickers(); save(); go("toons", cat); if(got.length) toast("New sticker: " + got.join(" ")) },
  missionDone:(id)=>{ const m = K.missions && K.missions[id]; if(!m || m.done) return; m.done = Date.now(); K.stars += 3; awardStickers(); save(); toast("Mission done! 3 bonus stars added."); renderGrown() },
  speed:()=>openSheet(),
  closeSheet:()=>closeSheetUser(),
  setSpd:(a)=>{ const [k,v] = a.split(":"); setRef()[k] = +v; if(K) save(); document.querySelectorAll(`.spd[data-act="setSpd"][data-arg^="${k}:"]`).forEach(b=>b.classList.toggle("on", b.dataset.arg===a)); refreshSpeedUI();
    if(k==="word") say("cat", {kind:"word"}); else say("I like to read with you.", {kind:"sent"}) },
  setPitch:(v)=>{ setRef().pitch = +v; if(K) save(); document.querySelectorAll('.spd[data-act="setPitch"]').forEach(b=>b.classList.toggle("on", b.dataset.arg===v)); say("Hi! I'm Pip. Let's read together.", {kind:"sent", who:"pip"}) },
  tryVoice:()=>say("Hi! I'm Pip. Let's read a story together.", {kind:"sent"}),
  pickKid:(id)=>{ flushNow(); kidId = id; K = clone(Store.kids[id]); ORDER.forEach(s=>{ K.levels[s] = K.levels[s]||0; K.win = K.win||{}; K.win[s] = K.win[s]||[] });
    K.settings = Object.assign({word:1, sent:1, pitch:1.25, cast:true}, Object.keys(TMPSET).length ? TMPSET : {}, K.settings||{}); K.lessons = K.lessons||{}; K.missions = K.missions||{};
    lsSet("prg_kid", id); go("home") },
  assess:()=>{ screen="play"; startAssess() },
  adventure:()=>{ if(!K.assessed){ go("home"); return } screen="play"; startAdventure() },
  hear:()=>say(R.item.say),
  resume:()=>nextQ(),
  hearq:()=>say(R.item.q),
  sayw:(w)=>say(w, {kind:"word"}),
  ans:(v,el)=>answer(v,el),
  quit:()=>{ inRound = false; if(R && R.t0) dayRec().ms += Date.now()-R.t0; R = null; awardStickers(); save(); go("home") },
  story:(id)=>go("story", id),
  readAll:async(id)=>{ const st = STORIES.find(s=>s.id===id); const sents = [...document.querySelectorAll(".sent")];
    for(let i=0;i<st.text.length;i++){ if(screen!=="story") return; sents.forEach(s=>s.classList.remove("lit")); sents[i] && sents[i].classList.add("lit");
      const p = say(st.text[i], {kind:"sent"}), mine = SAYN; await p; if(SAYN!==mine) break }   // a tapped word stops the read-aloud
    sents.forEach(s=>s.classList.remove("lit")) },
  storyQs:(id)=>{ screen="play"; startStoryQs(STORIES.find(s=>s.id===id)) },
  nextCard:()=>{ R.i++; renderCard() },
  chunk:(i)=>{ const x = R.chunks[+i]; document.querySelectorAll(".chunk").forEach((b,j)=>b.classList.toggle("lit", j===+i));
    if(x.quiet) say("This e is quiet."); else if(x.long) say(`${x.c.toUpperCase()} says its name.`); else say(`${x.c.length>1?x.c.split("").join(" "):x.c.toUpperCase()}, as in ${KEYWORD[x.c]||x.c}.`) },
  blend:async()=>{ const w = R.words[R.i]; $("#chunks").classList.add("blend"); await say(w, {kind:"word", factor:0.7}); await say(w, {kind:"word"}); if(!R.counted){ R.counted = true } $("#nextSound").hidden = false },
  nextSound:()=>{ R.i++; R.counted = false; renderSound() },
  chk:(v)=>{ const it = R.list[R.i]; if(v!=="skip"){ const ok = v==="1"; record({skill:it.skill, level:it.level, key:it.key}, ok); if(ok) R.right++; else R.missed.push(it.w) } R.i++; renderCheck() },
  reassess:()=>{ screen="play"; startAssess() },
  askDel:()=>{ $("#delrow").innerHTML = `<span>Remove ${esc(K.name)} and all of her progress? This can't be undone.</span><button class="btn berry sm" data-act="doDel">Yes, remove</button><button class="btn ghost sm" data-act="go" data-arg="grown">Cancel</button>` },
  doDel:async()=>{ const id = kidId; clearTimeout(saveTimer); pending = false; dirtyK = null; try{ await delKid(id); delete Store.kids[id]; K = null; kidId = null; lsSet("prg_kid",""); go("who") }catch(e){ toast("Couldn't remove this reader. You may not have permission on this link.") } }
};
// The voice and speed menu (like a video player's playback-speed menu) opens from the speed button, a long-press
// on a speaker button, or a right-click on a speaker button or any word. Touch long-press on words is left alone,
// because beginning readers rest a finger on the word they are reading.
const HOLD_TOUCH = ".hear,.speedchip,[data-act=tHearLine]", HOLD_MOUSE = HOLD_TOUCH + ",.w,[data-act=sayw]";
let holdTimer = null, suppressClick = false, holdXY = null, speechUnlocked = false, lastPtr = "mouse";
document.addEventListener("contextmenu", e=>{
  if(e.target.closest(lastPtr==="mouse" ? HOLD_MOUSE : HOLD_TOUCH)){ e.preventDefault(); clearTimeout(holdTimer); openSheet() }
  else if(e.target.closest(".w")) e.preventDefault();
});
document.addEventListener("pointerdown", e=>{
  suppressClick = false; clearTimeout(holdTimer); lastPtr = e.pointerType || "mouse";
  if(e.button>0 || lastPtr==="mouse" || !e.target.closest(HOLD_TOUCH)) return;
  holdXY = [e.clientX, e.clientY];
  holdTimer = setTimeout(()=>{ suppressClick = true; openSheet() }, 550);
});
document.addEventListener("pointermove", e=>{ if(holdXY && Math.hypot(e.clientX-holdXY[0], e.clientY-holdXY[1])>12) clearTimeout(holdTimer) });
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t, ()=>{ clearTimeout(holdTimer); holdXY = null }));
// iPad and iPhone only allow speech after a tap, so the first touch "wakes up" the voice and the sound effects.
function unlockSound(){
  if(speechUnlocked) return; speechUnlocked = true;
  try{ if(navigator.audioSession) navigator.audioSession.type = "playback" }catch(err){}
  if(hasSpeech){ try{ pickVoice(); const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u) }catch(err){} }
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume().catch(()=>{}) }catch(err){}
}
document.addEventListener("touchend", unlockSound, {passive:true});
document.addEventListener("click", e=>{
  unlockSound();
  if(suppressClick){ suppressClick = false; e.preventDefault(); return }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const fn = ACT[el.dataset.act]; if(fn){ e.preventDefault(); fn(el.dataset.arg, el) }
});

function boot(){
  const saved = lsGet("prg_kid");
  if(saved && Store.kids[saved]){ ACT.pickKid(saved); return }
  go("who");
}
initStore();
</script>
