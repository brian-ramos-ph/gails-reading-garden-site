ls in WinS build hygiene habits through daily group handwashing with soap. This detail comes from the DepEd WinS Fit for School session guide, not from the order's own text. A home routine can copy it."}],"log":{"label":"Days in week 4 with a seen 5-of-5 wash (at least twenty seconds, no reminder) before eating or after the toilet","kidLabel":"I washed my hands!","per":"day","target":5,"windowDays":7},"adultNotes":[{"title":"Tabo or tap","text":"CDC says to wet and rinse with clean running water and to turn off the tap while you lather. With no tap, a grown-up or older child pours clean water from a tabo or dipper over her hands, or she pours over one hand and then the other, stopping while she soaps and scrubs. Avoid dipping hands into a shared basin of standing water. The tabo wording is the app's own adaptation.","ref":"cdc-handwashing"},{"title":"Match her school (WinS)","text":"Schools in DepEd's WinS programme are meant to do daily group handwashing with soap. Ask her teacher whether her class does it and which steps and song they use, so home and school match.","ref":"deped-wins-do10-2016"},{"title":"Five steps for her, the WHO poster for you","text":"Her checklist stays at the app's five steps, based on CDC's. The WHO 'How to Handwash?' poster (about 11 steps, written for health workers) is only your guide to the rubbing motions. In a study cited in the Rutter review, no child completed every WHO step, and simplifying the steps raised completion.","ref":"rutter-handwashing-review"},{"title":"Curriculum check","text":"In SY 2026-2027, Grades 1 and 2 follow MATATAG, where health sits in Makabansa; no handwashing competency there has been confirmed. The older K to 12 Health guide had a Grade 1 'demonstrates proper handwashing' competency. Ask her teacher before treating this goal as a curriculum match.","ref":"matatag-cg-page"},{"title":"A measuring stick, not a test score","text":"These counts compare her with a fixed standard set by the app (criterion-referenced). They do not compare her with other 7-year-olds and are not a diagnosis.","ref":"bond-1996-nrt-crt"}],"statementRefs":["cdc-handwashing","who-hand-hygiene-2009","deped-health-cg"]},{"id":"C2","domain":"clean","title":"Sparkly teeth and fresh me","icon":"🪥","ican":"I can brush my teeth for two minutes, morning and night.","kidWhy":"Brushing morning and night keeps your teeth strong and sparkly.","weeks":4,"statement":"Within four weeks, [Name] will brush her teeth for two minutes every morning and night with a pea-sized amount of fluoride toothpaste, with a grown-up helping or checking, measured by a week-4 brushing log (at least 13 of the 14 morning and night brushings) and at least 90% on the 10-item goal check on two different days.","smart":{"s":"Brush for two minutes in the morning and at night with a soft brush and a pea-sized amount of fluoride toothpaste. Use gentle short strokes on the outer, inner and chewing surfaces of every tooth, then spit out the extra (no need to rinse). A grown-up helps or checks every time, looking at or finishing the outside, inside and chewing tops.","m":"Week 4 brushing log, with morning and night logged separately. A brushing counts when it lasts the full two minutes on a timer, uses a pea-sized amount, and a grown-up helps finish or checks the outside, inside and chewing tops. Target: at least 13 of 14 brushings (at most one missed). Plus at least 90% on the 10-item goal check on two different days. A 6-point solo checklist in the 'You do' step (pea-sized amount, outer, inner and chewing surfaces, two minutes, spits) shows where to help; it is progress information, not part of mastery.","a":"AAP HealthyChildren says parents need to help children brush until they are 7 or 8, so she is not expected to brush alone. A two-minute timer or song and a morning and night chart (like the ADA brushing calendar) make it doable. If her school does a WinS group brush, it is a bonus and not part of the count.","r":"The ADA recommends brushing twice a day for two minutes, and AAP HealthyChildren advises a pea-sized amount of fluoride toothpaste twice a day from age 3. In the Philippines, the Fit for School routine used in DepEd's WinS programme includes daily group toothbrushing with fluoride toothpaste at school.","t":"Four weeks: in weeks 1-3 she practises while a grown-up brushes alongside or finishes, and week 4 is the scored week. A keep-it check follows 2-4 weeks after mastery.","rRefs":["ada-mouthhealthy","aap-fluoride-faq","deped-wins-do10-2016"]},"lesson":{"minutes":10,"materials":["soft toothbrush","fluoride toothpaste","a two-minute timer or song","a mirror","a morning and night picture chart","this app"],"steps":[{"phase":"Warm-up","text":"In the mirror, find the three sides to clean: the outside of the teeth, the inside by the tongue, and the chewing tops of the back teeth.","refs":[]},{"phase":"I do","text":"Show a pea-sized dab of fluoride toothpaste. Brush your own teeth with the brush tilted toward the gums (about a 45-degree angle) using gentle short strokes about one tooth wide: outside, inside, then the chewing tops, top teeth and bottom, for two minutes. For the inside of the front teeth, hold the brush up and down. Spit out the extra; there is no need to rinse.","refs":["nsw-grr","aap-fluoride-faq","ada-mouthhealthy"]},{"phase":"We do","text":"Brush side by side with a two-minute timer or song. Call out each part as you both move: outside, inside, tops.","refs":["nsw-grr","ada-mouthhealthy"]},{"phase":"You do","text":"She brushes on her own for two minutes while you score the 6-point checklist (pea-sized amount, outer, inner and chewing surfaces, two minutes, spits). Then help finish any spots she missed. Later she watches Sparkly Teeth and Fresh Me and does the goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"Every morning and bedtime, use the picture chart and log each brushing. Help finish or check every time, especially at night. If her school does WinS group toothbrushing, ask her teacher about it, and keep the home morning and night brushes as the measure.","refs":["ada-mouthhealthy","aap-fluoride-faq"]}],"support":"Guide her hand for the inside surfaces, or count ten gentle strokes per part out loud.","stretch":"She ticks her own morning and night chart. The cartoon's other fresh-me routines (washing her face, clean clothes) can be added as unscored extras."},"assessment":{"method":"A criterion-referenced standard set by the app, not a normed test. Brushing log: tick each morning and night brushing only if it lasted two minutes on the timer, used a pea-sized amount, and you helped finish or checked the outside, inside and chewing tops. Solo checklist in 'You do': steps done out of 6, used to plan your help, not for mastery. The goal check gives 10 questions on how, when and how long to brush; it tests brushing only. If two grown-ups score, compare them with Cohen's kappa.","rubric":["0-6 of 14 brushings in a week meet the log rule (two minutes, pea-sized amount, a grown-up helped or checked).","7-10 of 14 brushings in a week meet the log rule; the night brush is often missed or brushing often stops before two minutes.","11-12 of 14 brushings in a week meet the log rule; or at least 13 of 14 do, but the goal check is not yet at 90% on two different days.","In week 4, at least 13 of 14 brushings logged (two minutes, pea-sized amount, a grown-up helped or checked), and at least 90% on the 10-item goal check on two different days."],"refs":["ada-mouthhealthy","child-routines-inventory","bond-1996-nrt-crt","fuller-fienup-2018"]},"mastery":{"pct":90,"days":2,"text":"Mastered when both are true: (1) at least 90% (9 of 10) on the goal check on two different days, and (2) the week-4 log shows at least 13 of the 14 morning and night brushings, each two minutes with a pea-sized amount and a grown-up helping or checking. Mastery does not mean brushing alone; a grown-up keeps helping or checking. A keep-it check 2-4 weeks later (one goal check and a week of the log) confirms it."},"evidence":{"episodes":["fresh-me"]},"checks":[{"q":"How many times a day do you brush at home?","opts":[["two: morning and night","✌️"],["one: just in the morning","☀️"],["only when my teeth feel dirty","🤔"]]},{"q":"How long should you brush?","opts":[["two minutes","⏰"],["one minute","⏱️"],["as fast as I can","⚡"]]},{"q":"How much toothpaste do you use?","opts":[["a pea-sized dab","🟢"],["a long line on the brush","🪥"],["no toothpaste, just water","💧"]]},{"q":"Grown-ups pick toothpaste with something that helps make teeth strong. What is it?","opts":[["fluoride","🦷"],["mint flavor","🌿"],["sugar","🍬"]]},{"q":"Which parts of your teeth do you brush?","opts":[["outside, inside and chewing tops","🦷"],["just the front, where people see","😁"],["just the outside","🪞"]]},{"q":"How should you move the brush?","opts":[["gentle, short strokes","🪥"],["hard and fast scrubbing","💪"],["one big swipe","➡️"]]},{"q":"You finished brushing. What do you do with the extra toothpaste?","opts":[["spit it out","💦"],["swallow it","😮"],["keep it in my mouth","😶"]]},{"q":"When is the night brush?","opts":[["right before bed","🌙"],["right after school","🎒"],["before dinner","🍽️"]]},{"q":"Who helps or checks your brushing?","opts":[["a grown-up at home","🧑"],["no one, big kids brush alone","🙅"],["only the dentist","🏥"]]},{"q":"Your teeth feel clean, but the timer is not done. What do you do?","opts":[["keep brushing until it ends","⏰"],["stop, they feel clean","✋"],["spit and go to bed","🛏️"]]},{"q":"It is morning. What do you do before school?","opts":[["brush my teeth","🪥"],["skip it, I brush at night","🌙"],["just rinse with water","💧"]]}],"tools":[{"label":"ADA free 12-month Brushing Calendar: a morning and night tracking chart to link to (not embed) for her checklist; its licence terms were not confirmed","ref":"ada-mouthhealthy"},{"label":"ADA 'Fun Ways to Encourage Kids to Brush': play music, and brush side by side at breakfast and bedtime","ref":"ada-mouthhealthy"},{"label":"AAP HealthyChildren 'Let the Brushing Games Begin': games that make two minutes of brushing fun","ref":"aap-fluoride-faq"},{"label":"AAP 'Brush, Book, Bed': a bedtime routine template written for children from birth to 6, so adapt it for age 7","ref":"aap-fluoride-faq"},{"label":"DepEd WinS 'Fit Hygiene Behaviour' session PDF: a free training guide for school staff that shows the daily group toothbrushing routine used in Philippine schools","ref":"deped-wins-do10-2016"}],"standards":[{"ref":"ada-mouthhealthy","code":"ADA MouthHealthy: Brushing Your Teeth","text":"Brush twice a day (morning and evening) for 2 minutes with a soft-bristled brush, cleaning the outer, inner and chewing surfaces with gentle short strokes (the surfaces were confirmed by web search of the same page). Use a pea-sized amount of fluoride toothpaste, with an adult supervising so she spits it out. The ADA gives the pea-size and supervision advice for ages 3-6."},{"ref":"aap-fluoride-faq","code":"AAP HealthyChildren: Fluoride for Children (Parent FAQs) and the 'Ask the Pediatrician' brushing page","text":"Use fluoride toothpaste twice a day, a pea-sized amount from age 3; she spits out the extra rather than swallowing it and does not need to rinse. A separate HealthyChildren page says parents need to help children brush until they are 7 or 8."},{"ref":"deped-health-cg","code":"DepEd K to 12 Health Grade 1 (2016 guide, pre-MATATAG), Personal Health: care of the mouth and teeth","text":"Grade 1 Personal Health includes care of the mouth and teeth as part of practising good health habits and hygiene every day. For Grades 1-2 this guide has been replaced by MATATAG."},{"ref":"matatag-cg-page","code":"MATATAG Makabansa Grade 1 (health and hygiene competency not confirmed)","text":"Under MATATAG, Grade 1 health sits in Makabansa (which merges Araling Panlipunan and MAPEH). No oral-hygiene competency was confirmed there, so this entry shows where to check. It is not a confirmed match."},{"ref":"deped-wins-do10-2016","code":"DepEd WinS (DO 10, s. 2016) and its Fit for School routine: daily group toothbrushing with fluoride toothpaste","text":"The Fit for School routine used under WinS includes daily group toothbrushing with fluoride toothpaste. This detail comes from the DepEd WinS session guide; the order's own text was not checked."},{"ref":"nhes-2024","code":"NHES (2024) Standard 1, PreK-2 indicator 1.2.4","text":"Describe health-promoting behaviors (wording from a search snippet of the SHAPE America page). The goal check asks her to describe how and when to brush. This is a knowledge indicator, not a behaviour standard."}],"log":{"label":"Morning and night brushings (each counts): two minutes, pea-sized amount, a grown-up helped or checked","kidLabel":"I brushed my teeth!","per":"time","target":13,"windowDays":7},"adultNotes":[{"title":"How long to help","text":"Sources differ on when children can brush without help: about 6 in an ADA handout (once she can spit), 7 or 8 on AAP HealthyChildren, and later in some other sources. The app uses 'a grown-up helps or checks until at least 7-8, longer if needed'. AAP says parents help, not only watch, so finishing her brush is expected and still counts.","ref":"aap-fluoride-faq"},{"title":"Who can help","text":"Any trusted caregiver who is usually there at brushing time, such as lola, tita or a yaya, can do the help or check and tick the log. Agree on the same two-minute timer and pea-sized dab so every helper scores the same way.","ref":""},{"title":"School toothbrushing (WinS)","text":"Schools in DepEd's WinS programme may do daily group toothbrushing with fluoride toothpaste. Ask her teacher whether her class does it. A school brush is a bonus; the measure stays the home morning and night brushes.","ref":"deped-wins-do10-2016"},{"title":"Bath time and body safety (not scored here)","text":"The cartoon also shows face-washing, clean clothes and a bath, which this goal does not score. If you practise bath time, she washes her own body, you use the correct names for body parts, and only the trusted caregivers you have chosen help her. AAP and NSPCC both name bath time as a natural moment to go over body-safety rules again.","ref":"aap-healthychildren-csa"},{"title":"Curriculum and UN check","text":"The older K to 12 Health guide covered care of the mouth and teeth in Grade 1. Under MATATAG, Grade 1-2 health sits in Makabansa, and no oral-hygiene competency there was confirmed. The app's source list has no WHO oral-health document yet, so no UN alignment is claimed.","ref":"matatag-cg-page"}],"statementRefs":["ada-mouthhealthy","aap-fluoride-faq"]},{"id":"C3","domain":"clean","title":"Tidy room","icon":"🧸","ican":"I can put my things back where they live.","kidWhy":"Everything has a home. Then you can always find it!","weeks":4,"statement":"Within four weeks, [Name] will put her toys, books and clothes back in their homes in her own space at bedtime tidy time, measured by a nightly 3-item checklist in week 4 (all 3 in their homes with no reminder after the first 'tidy time' cue on at least 5 of 7 nights) and at least 90% on the 10-item goal check on two different days.","smart":{"s":"At a set bedtime tidy time, after one 'tidy time' cue, she puts her own things back in their labeled homes in her own space: toys in the toy box or bins, books on her shelf, dirty clothes in the basket, and clean clothes in her drawer, closet or cabinet. Every home is low enough for her to reach without climbing.","m":"Nightly 3-item checklist in week 4: toys, books and clothes, each in its home (yes or no). An item counts only if she put it away herself. A night counts only at 3 of 3 with no reminder after the first cue. A reminder is any spoken or pointing prompt after that cue. Target: at least 5 of 7 nights. Plus at least 90% on the 10-item goal check on two different days. If two grown-ups score, report their agreement as Cohen's kappa.","a":"There are only three kinds of things, with picture labels on her own bins and shelf and a five-minute song or timer. Help and reminders are allowed in weeks 1-2 and faded in week 3. Household helpers leave the nightly tidy to her for these four weeks.","r":"Tidying is a daily family routine with a few steps she plans and remembers herself. CASEL's framework lists planning and organizational skills as an example of self-management, UNICEF's transferable-skills framework includes self-management, and the Child Routines Inventory counts household chores such as tidying as one routine domain. This is a family-routine goal, not a curriculum benchmark.","t":"Four weeks: weeks 1-2 tidy together with reminders, week 3 fade reminders, week 4 is the scored week. A keep-it check follows 2-4 weeks after mastery.","rRefs":["casel-framework","child-routines-inventory","unicef-transferable-skills"]},"lesson":{"minutes":10,"materials":["her own bins, shelf and clothes basket with picture labels, all within her reach","a 3-picture tidy checklist (toys, books, clothes)","a five-minute song or timer","this app"],"steps":[{"phase":"Warm-up","text":"Walk through her space together and name each home: toys in the toy box, books on her shelf, dirty clothes in the basket, clean clothes in her drawer. Play 'Where does it live?' with five of her own things.","refs":[]},{"phase":"I do","text":"Tidy her space while thinking aloud: 'Toys first, then books, then clothes. Now I check my pictures: are all three in their homes?'","refs":["nsw-grr","rosenshine-2012"]},{"phase":"We do","text":"Tidy together to a five-minute song, one kind of thing at a time, then tick the 3-picture checklist together.","refs":["nsw-grr","rosenshine-2012"]},{"phase":"You do","text":"Put a few of her things back out. She tidies her space alone while you score the checklist (toys, books, clothes: yes or no) without hints. Then she watches Tidy Room Team and does the goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"Say 'Tidy time!' once at the same time each night. Weeks 1-2: help and remind as needed. Week 3: after the cue, point to the picture checklist instead of speaking. Week 4: give only the cue, and log the nights at 3 of 3 with no reminder.","refs":["child-routines-inventory"]}],"support":"Tidy one kind of thing at a time (just books first). In week 1 you can score toys only, then add books and clothes in week 2.","stretch":"She makes picture labels for new homes, or adds a fourth item to her checklist, such as shoes by the door or making her bed."},"assessment":{"method":"A criterion-referenced standard set by the app, not a normed test; no standard found sets a tidying expectation for age 7. Nightly checklist: three yes-or-no items (toys, books and clothes in their homes in her space, put there by her); a night counts only at 3 of 3 with no reminder after the first cue. The goal check gives 10 questions on where things go and how tidy time works; her own homes are checked in the warm-up and 'You do' with her real things. The Child Routines Inventory serves only as a model for which routines to track and for a before-and-after comparison of the same child; its items are not copied. If two grown-ups score, compare them with Cohen's kappa.","rubric":["0-1 nights in a week at 3 of 3 with at most one reminder after the cue; she needs step-by-step help for each item.","2-4 nights in a week at 3 of 3 with at most one reminder after the cue.","At least 5 of 7 nights at 3 of 3 with at most one reminder after the cue, but fewer than 5 with no reminder; or the week-4 log is met but the goal check is not yet at 90% on two different days.","In week 4, at least 5 of 7 nights at 3 of 3 with no reminder after the first 'tidy time' cue, and at least 90% on the 10-item goal check on two different days."],"refs":["child-routines-inventory","casel-sel-assessment-guide","bond-1996-nrt-crt","fuller-fienup-2018"]},"mastery":{"pct":90,"days":2,"text":"Mastered when both are true: (1) at least 90% (9 of 10) on the goal check on two different days, and (2) the week-4 log shows at least 5 of 7 nights when she put her toys, books and clothes all in their homes with no reminder after the first 'tidy time' cue. A keep-it check 2-4 weeks later (one goal check and a week of the nightly checklist) confirms it."},"evidence":{"episodes":["tidy-room"]},"checks":[{"q":"You finish playing with blocks. Where do they go?","opts":[["back in their toy box","📦"],["in a pile by the door","🚪"],["on my bed for later","🛏️"]]},{"q":"Your book is on the floor. Where does it go?","opts":[["back on my book shelf","📚"],["in the toy box","🧸"],["leave it by my bed","🛏️"]]},{"q":"Your socks are dirty. Where do they go?","opts":[["in the clothes basket","🧺"],["back in my drawer","🗄️"],["under the bed","🛏️"]]},{"q":"Your clean shirt is folded. Where does it go?","opts":[["in my drawer or cabinet","👕"],["in the clothes basket","🧺"],["on the chair","🪑"]]},{"q":"What three things go back home at tidy time?","opts":[["toys, books and clothes","✅"],["just my toys","🧸"],["just my clothes","👕"]]},{"q":"When is tidy time?","opts":[["every night before bed","🌙"],["only when it is very messy","😵"],["only when visitors come","👋"]]},{"q":"Your grown-up says, 'Tidy time!' What do you do?","opts":[["start putting things away now","▶️"],["finish my game first","🎮"],["wait until they say it again","⏳"]]},{"q":"The mess looks too big. What can help?","opts":[["one kind of thing at a time","☝️"],["hide it all under the bed","🙈"],["stop and leave it all","🛑"]]},{"q":"You think you are done. How can you check?","opts":[["look at my checklist pictures","👀"],["just say I am done","🗣️"],["check only the floor","⬇️"]]},{"q":"You share a room with your cousin. What is your tidy job?","opts":[["put my own things in their homes","🙋"],["nothing, the room is not only mine","🤷"],["wait for a grown-up to do it","🧑"]]},{"q":"Tidy time is almost over, but one book is still on the floor. What do you do?","opts":[["put it on my shelf too","📚"],["leave it, I did most of it","👍"],["push it under the bed","🙈"]]}],"tools":[{"label":"Harvard EF activities guide: free age 5-7 and 7-12 chapters of games for working memory, self-control and flexible thinking; these are not tidying activities","ref":"harvard-ef-guide"},{"label":"NSW 'Gradual release of responsibility' page: how to model a task, guide it, then hand it over","ref":"nsw-grr"},{"label":"Rosenshine's 'Principles of Instruction' (free article): small steps, modelling and guided practice","ref":"rosenshine-2012"}],"standards":[{"ref":"casel-framework","code":"CASEL Framework: Self-management","text":"The ability to manage one's emotions, thoughts and behaviours to reach goals. CASEL's examples include using planning and organizational skills; this example was confirmed by web search of CASEL's SEL 101 slides and is not in the pool entry. CASEL is a PreK-12 framework with no age-7 descriptor."},{"ref":"unicef-transferable-skills","code":"UNICEF Global Framework on Transferable Skills (2019): self-management, individual dimension","text":"Self-management is one of the transferable skills in the individual ('learning to be') dimension of a life-course framework that runs from early childhood through adolescence. The framework is not split by age, so the age-7 wording is the app's own."},{"ref":"unicef-mena-lsce-2017","code":"UNICEF MENA LSCE (2017), 12 core life skills: self-management","text":"Lists self-management among 12 core life skills. It is the same 12-skill, four-dimension list as the UNICEF Global Framework, so it adds no independent support. It has no grade-level descriptors, so the age-7 wording is the app's own."},{"ref":"matatag-gmrc","code":"MATATAG GMRC and Values Education Grade 1 (specific competency not confirmed)","text":"The official Grade 1 Philippine subject for conduct and values. No tidying or responsibility-at-home competency was confirmed in the Filipino-language guide, and the Grade 2 GMRC guide was not confirmed. A teacher-site Grade 1 lesson log mentions GMRC lessons on kalinisan (cleanliness); this is a lead to check, not a confirmed competency."}],"log":{"label":"Nights at 3 of 3 (toys, books, clothes in their homes, put there by her) with no reminder after the tidy-time cue","kidLabel":"I tidied my things!","per":"day","target":5,"windowDays":7},"adultNotes":[{"title":"Her own space","text":"If she shares a room or bed with siblings or cousins, mark her own space with picture labels: her shelf, her toy box or bin, her clothes basket and drawer. Put every home low enough to reach without climbing. She is scored only on her own things; shared toys can be tidied together and do not count against her.","ref":""},{"title":"Helpers at home","text":"If a kasambahay or yaya, lola or tita usually tidies up, thank them and ask them to leave the nightly tidy to her for these four weeks and to give only the one 'tidy time' cue. Praise from them still helps.","ref":""},{"title":"About the Child Routines Inventory","text":"A copyrighted, paywalled parent-report scale for ages 6-12 with no cut scores, validated with US, Portuguese and Turkish samples, not Philippine ones. Use it only as a model for which routines to track and as a before-and-after comparison of the same child; do not copy its items without the authors' permission.","ref":"child-routines-inventory"},{"title":"Not a curriculum benchmark","text":"No standard found sets a tidying expectation for age 7. MATATAG GMRC Grade 1 may include lessons on kalinisan (cleanliness), but no competency has been confirmed; check the GMRC Grade 1 guide or ask her teacher before naming one.","ref":"matatag-gmrc"}],"statementRefs":["casel-framework","child-routines-inventory"]},{"id":"C4","domain":"clean","title":"Neat at school and out","icon":"🎒","ican":"I can put trash in the bin and cover my sneezes.","kidWhy":"Covered sneezes and clean places keep everyone healthy.","weeks":4,"statement":"Within four weeks, [Name] will put her snack trash in a bin (or in her bag to carry home) and cover her coughs and sneezes (tissue, then bin, then clean hands, or her elbow if there is no tissue), measured by a week-4 trash log (at least 5 of 7 days with no reminder), a cough-and-sneeze tally (at least 4 of the last 5 seen in weeks 3-4 covered) and at least 90% on the 10-item goal check on two different days.","smart":{"s":"Two habits for shared places (home, school, the park, the mall, jeepney, tricycle or school-service rides), each scored separately. (1) Snack or merienda trash such as wrappers, peels, cups and straws goes into a bin, or into her bag to carry home when there is no bin. (2) Coughs and sneezes are covered with a tissue, which then goes in the bin before she cleans her hands, or with her elbow when there is no tissue.","m":"Only what a grown-up sees counts; school-only habits are not scored unless her teacher offers to report them. Trash log, week 4: a day counts when every snack you saw her finish had its trash binned or bagged with no reminder; days with no snack seen do not count. Target: at least 5 of 7 days. Cough-and-sneeze tally: of the last 5 coughs or sneezes seen in weeks 3-4, at least 4 are covered as in S. If fewer than 5 happen, calm 'Achoo practice' role-plays can fill up to 2 of the 5. If fewer than 3 real ones are seen by the end of week 4, keep the tally open until 3 are seen; the cough count is not met until then. Plus at least 90% on the 10-item goal check on two different days.","a":"Both habits come up every day. A tissue pack and a small carry-home bag in her backpack make them doable. Reminders are given in weeks 1-2 and faded in week 3.","r":"CDC advises covering coughs and sneezes with a tissue or the elbow, putting the tissue in the trash and then cleaning hands. DepEd's WinS programme includes keeping schools clean through solid-waste management. These are family routines backed by health guidance and a school programme standard, not Grade 1-2 curriculum benchmarks.","t":"Four weeks: weeks 1-2 practise with reminders; week 3 fades reminders and starts the cough tally; week 4 is the scored week for the trash log. If too few real coughs or sneezes are seen, the cough tally alone runs on past week 4 until 3 are seen. A keep-it check follows 2-4 weeks after mastery.","rRefs":["cdc-cough-hygiene","deped-wins-do10-2016","unesco-gced-tlo-2015"]},"lesson":{"minutes":10,"materials":["tissues","a small bin","a small carry-home trash bag for her backpack","a snack with a wrapper and a peel","soap and water or hand sanitizer","this app"],"steps":[{"phase":"Warm-up","text":"Practise a pretend sneeze together: elbow up and 'achoo' into it. Then do a pretend tissue sneeze: tissue, into the bin, wash hands.","refs":["cdc-cough-hygiene"]},{"phase":"I do","text":"Show the tissue routine slowly: cover, throw the tissue in the bin, then wash your hands or use hand sanitizer. Then show snack trash: the wrapper goes in the bin, or in the carry-home bag when there is no bin.","refs":["nsw-grr","rosenshine-2012"]},{"phase":"We do","text":"Have a snack together and put the trash away together. If her school or barangay sorts waste, for example biodegradable and non-biodegradable, sort it the same way together.","refs":["nsw-grr"]},{"phase":"You do","text":"She has a snack with a wrapper and a peel and handles the trash alone while you score it (binned or bagged: yes or no). Then say 'Achoo time!' and she shows a tissue cover (tissue, bin, clean hands: 3 points) and an elbow cover on her own. Then she watches Neat and Ready at School and Kind and Tidy Everywhere and does the goal check.","refs":["nsw-grr"]},{"phase":"Real life","text":"Keep tissues and a carry-home bag in her backpack. Weeks 1-2: remind her after snacks and sneezes. Week 3: wait, then point instead of speaking, and start the cough tally. Week 4: log the trash days. Ask her teacher whether the class sorts waste, so home matches school.","refs":[]}],"support":"Practise one habit at a time: trash in weeks 1-2, then add covering coughs and sneezes in week 3.","stretch":"She packs her school bag the night before from a picture checklist (folder, water bottle, pencil case) and checks it with a grown-up before leaving for school. She also pushes in her chair after meals."},"assessment":{"method":"A criterion-referenced standard set by the app, not a normed test. Trash: each snack you see her finish is one chance, scored yes if all its trash went into a bin or her bag with no reminder. A day goes in the log only if you saw at least one chance and every chance was a yes. Coughs and sneezes: each one you see is one chance, scored yes for tissue, then bin, then clean hands, or for her elbow when there is no tissue. Never score what you did not see. 'Achoo practice' is a calm pretend role-play on your cue. The goal check gives 10 questions on trash and cough scenarios. If two grown-ups score, compare them with Cohen's kappa.","rubric":["Fewer than 2 trash days in a week, and fewer than 2 of the last 5 seen coughs or sneezes covered, even with reminders.","Neither count is met yet, but she has 2-4 trash days in a week or covers 2-3 of the last 5 seen coughs or sneezes, often after a reminder.","Meets one count (at least 5 of 7 trash days with no reminder, or at least 4 of the last 5 seen coughs or sneezes covered) but not yet the other; or meets both, but the goal check is not yet at 90% on two different days.","In week 4, at least 5 of 7 trash days with no reminder; at least 4 of the last 5 coughs or sneezes seen in weeks 3-4 covered (tissue, bin, clean hands, or elbow; up to 2 of the 5 may be 'Achoo practice'); and at least 90% on the 10-item goal check on two different days."],"refs":["cdc-cough-hygiene","casel-sel-assessment-guide","bond-1996-nrt-crt","fuller-fienup-2018"]},"mastery":{"pct":90,"days":2,"text":"Mastered when all three are true: (1) at least 90% (9 of 10) on the goal check on two different days; (2) the week-4 log shows at least 5 of 7 days when all the snack trash you saw went into a bin or her bag with no reminder; (3) at least 4 of the last 5 coughs or sneezes you saw in weeks 3-4 were covered (tissue, bin, clean hands, or elbow). If real coughs are few, up to 2 of the 5 can come from calm 'Achoo practice' role-plays; if fewer than 3 real ones are seen by the end of week 4, the tally stays open until 3 are seen. A keep-it check 2-4 weeks later (one goal check and a week of the trash log) confirms it. The app can't see every part of this rule, so once the goal check and log are met it shows Secure with 'Waiting for your check'. When every part is met, record an observation and choose Mastered (put any card or role-play score in the note).","obs":true},"evidence":{"episodes":["neat-school","out-and-about"]},"checks":[{"q":"You need to sneeze. What is the best way?","opts":[["into a tissue or my elbow","🤧"],["into my hands","✋"],["turn my head, no cover","↪️"]]},{"q":"You need to cough, and there is no tissue. What do you do?","opts":[["cough into my elbow","💪"],["cough into my hand","✋"],["cough into the air","💨"]]},{"q":"You sneezed into your hand by mistake. What now?","opts":[["wash my hands","🧼"],["wipe it on my clothes","👕"],["keep playing","⚽"]]},{"q":"You used a tissue for your runny nose. Where does it go?","opts":[["in the bin","🗑️"],["back in the tissue pack","📦"],["in my pocket for later","👖"]]},{"q":"You put your tissue in the bin. What do you do next?","opts":[["clean my hands","🧼"],["nothing, I am done","🤷"],["eat my snack","🍪"]]},{"q":"You finished a banana at the park. What about the peel?","opts":[["put it in a bin","🗑️"],["toss it in the grass","🍌"],["leave it on the bench","🪑"]]},{"q":"There is no bin anywhere. What do you do with your wrapper?","opts":[["put it in my bag for later","🎒"],["leave it where no one sees","🙈"],["drop it, someone will clean","🧹"]]},{"q":"The bin is full to the top. What do you do?","opts":[["find another bin, or take it home","🎒"],["push it on top anyway","🗑️"],["put it next to the bin","⬇️"]]},{"q":"One bin is for food scraps and one is for wrappers. Where does a candy wrapper go?","opts":[["the wrapper bin","🍬"],["the food scraps bin","🍌"],["either bin is fine","🤷"]]},{"q":"You finished lunch at school. What do you do before you play?","opts":[["put my trash in the bin","🗑️"],["leave it for someone to clean","🧹"],["push it under my desk","⬇️"]]},{"q":"You see a broken bottle on the ground. What do you do?","opts":[["tell a grown-up, and don't touch it","🙋"],["pick it up and bin it","🗑️"],["kick it out of the way","🦶"]]},{"q":"You touched trash while cleaning up. What do you do next?","opts":[["wash my hands","🧼"],["eat my snack","🍪"],["wipe my hands on my shorts","🩳"]]}],"tools":[{"label":"CDC respiratory hygiene page: cough and sneeze steps (tissue, bin, clean hands, elbow if no tissue) to turn into a picture card; US government text, generally public domain, but no page licence was seen","ref":"cdc-cough-hygiene"},{"label":"CDC Health Promotion Materials: free printable handwashing posters to go with the hand-cleaning step after a tissue","ref":"cdc-handwashing"},{"label":"NSW gradual release guide: model the packing, pack together, then let her pack alone","ref":"nsw-grr"},{"label":"Harvard EF activities guide: free age-band games for working memory, self-control and flexible thinking (not packing or tidying activities)","ref":"harvard-ef-guide"}],"standards":[{"ref":"cdc-cough-hygiene","code":"CDC Hygiene and Respiratory Viruses Prevention: cover coughs and sneezes","text":"Cover coughs and sneezes with a tissue, throw the tissue in the trash, then clean your hands (soap and water, or hand sanitizer with at least 60% alcohol). With no tissue, use the elbow, not the hands."},{"ref":"nhes-2024","code":"NHES (2024) Standard 1, PreK-2 indicator 1.2.3","text":"Identify ways to prevent or reduce risks for illnesses and injuries (wording from search snippets). Treating cough-covering as one such way is our own mapping. This is a knowledge indicator, so it fits the goal check better than the observed habit."},{"ref":"deped-health-cg","code":"DepEd K to 12 Health (2016 guide, pre-MATATAG): Community and Environmental Health strand","text":"The closest Philippine curriculum anchor for not littering. No Grade 1-2 indicator was confirmed, and the pool lists Grade 1 Health topics as nutrition, personal health, injury prevention, and safety and first aid, so this strand may not be taught until a later grade."},{"ref":"deped-wins-do10-2016","code":"DepEd WinS (DO 10, s. 2016): keeping schools clean through solid-waste management","text":"One WinS goal is clean schools (solid waste, drainage, mosquito control, food sanitation). It is a programme standard for schools, not a measure of a child, but it backs putting trash in the bin at school."},{"ref":"matatag-gmrc","code":"MATATAG GMRC and Values Education Grade 1 (specific competency not confirmed)","text":"The official Grade 1 Philippine anchor for manners and respect. It would fit pushing in chairs and quiet voices, but those are not in the statement. A teacher-site lesson log mentions GMRC lessons on kalinisan (cleanliness) and caring for the environment, a lead for the trash habit that is not confirmed."},{"ref":"unesco-gced-tlo-2015","code":"UNESCO GCED topic B.8, Ethically responsible behaviour, ages 5-9 (objective wording recalled, not confirmed)","text":"Recalled, not confirmed: talk about how your own choices and actions can make the world better, such as caring for others and the environment. Web search found the topic title in the guide's table of contents."}],"log":{"label":"Days all seen snack trash went in a bin or her bag, with no reminder","kidLabel":"I put my trash away!","per":"day","target":5,"windowDays":7},"adultNotes":[{"title":"Tissue, bin, clean hands","text":"CDC: cover with a tissue, put it in the trash, then clean hands with soap and water, or hand sanitizer with at least 60% alcohol when soap and water are not available. With no tissue, use the elbow, not the hands. Hand her the sanitizer yourself and let her rub until her hands are dry.","ref":"cdc-cough-hygiene"},{"title":"Sort like her school","text":"WinS includes keeping schools clean through solid-waste management. If her school or barangay sorts waste, for example nabubulok (biodegradable) and di-nabubulok (non-biodegradable), teach the same sort and the same words at home.","ref":"deped-wins-do10-2016"},{"title":"Carrying it home counts","text":"Putting trash in her bag to carry home is a full 'yes', not second best. It fits rides in a school service, tricycle or jeepney, and places with few public bins.","ref":""},{"title":"Score only what you see","text":"Coughs, sneezes and lunch trash at school happen where you are not, so leave them out of the count unless her teacher offers to tell you. 'Achoo practice' is a calm pretend game on your cue, never a surprise test that could embarrass her. Never ask her to pick up broken glass or sharp trash; she tells a grown-up instead.","ref":""}],"statementRefs":["cdc-cough-hygiene","nhes-2024","deped-health-cg"]}]/*GOALS-END*/;
// Measuring sticks: published, free tools with reliability and validity evidence that a grown-up gives offline.
const BENCH = /*BENCH-START*/[{"id":"psc","name":"Phonics screening check (England)","short":"40 real and made-up words read aloud; checks decoding.","goals":["R5","R3"],"what":"She reads 40 words aloud to you, one at a time: 20 real words and 20 made-up words. The made-up words show whether she can decode a word rather than recognize one she already knows. It measures decoding only, not understanding.","how":"Download one year's free past check from GOV.UK (practice sheet, pupil words, answer sheet and scoring guidance). Read the scoring guidance first, do the practice sheet together, then score her one to one in a quiet place (about 10 minutes). Don't practice the actual words with her beforehand. Score each paper against that year's threshold.","get":{"label":"GOV.UK: national curriculum assessments past materials (phonics screening check)","url":"https://www.gov.uk/government/collections/national-curriculum-assessments-practice-materials","ref":"eng-psc"},"psych":"The Standards and Testing Agency's pilot and live-year technical reports evaluate the check's validity, reliability and bias. An independent study of 6-year-olds in England found it correlated strongly with other literacy measures and was sensitive in identifying children at risk. A follow-up analysis found that how often a 'not yet' result marks a real reading difficulty depends on what it is compared with: about 3 in 10 against a standardised reading test, but more than 8 in 10 against teachers' phonics judgements. How well it predicts later reading has not been established, so read it alongside your observations.","psychRefs":["eng-psc","duff-2015"],"norms":"A criterion threshold, not a norm, applied each June since 2012 to Year 1 pupils (age 5 to 6) in state-funded schools in England; 82% of Year 1 pupils met the expected standard in 2026 (80% in 2025). She is about a year older than the target age, so read it as a floor check of decoding.","unit":"words correct out of 40","max":40,"tables":[{"grade":"Papers from 2012 to 2025","cuts":[{"min":32,"label":"Met the expected standard","level":4},{"min":0,"label":"Not yet","level":2}]},{"grade":"2026 paper","cuts":[{"min":31,"label":"Met the expected standard","level":4},{"min":0,"label":"Not yet","level":2}]}],"refs":["eng-psc"],"ph":false},{"id":"orf","name":"Oral reading fluency (words correct per minute)","short":"One-minute read-aloud of an unpracticed grade-level passage, compared with compiled US norms.","goals":["R5","R6"],"what":"She reads a passage she hasn't seen before, at her school grade level, aloud for one minute. You count the words she reads correctly. Fluent, accurate reading frees her attention for understanding.","how":"Pick two short English passages at her grade level that she hasn't read (from her school reader, or an English DepEd Phil-IRI passage). The norms are for English, so don't compare a Filipino passage with them. Time each for exactly one minute. Count words read correctly: self-corrections count as correct; skipped, wrong or long-hesitation words don't. Enter the average of the two, and pick the point in her school year (beginning, middle or end; Grade 1 has no beginning-of-year norm).","get":{"label":"Hasbrouck and Tindal (2017) oral reading fluency norms","url":"https://www.brtprojects.org/wp-content/uploads/2019/05/TechRpt_1702ORFNorms.pdf","ref":"hasbrouck-tindal-2017"},"psych":"These are compiled norms rather than a test: they pool scores from widely used US measures (DIBELS 6th Edition, DIBELS Next and easyCBM), whose technical manuals report reliability and validity. Decades of research link words correct per minute with reading comprehension.","psychRefs":["hasbrouck-tindal-2017"],"norms":"US students reading in English. For Philippine context: in the 2019 national early grade reading assessment, Grade 3 public-school pupils averaged 57 words correct per minute in English and 61 in Filipino.","unit":"words correct per minute","max":250,"tables":[{"grade":"Grade 1","season" function refAMA(r){

  const who = r.authors ? endDot(esc(r.authors)) + " " : "";
  if(r.type==="journal"){
    const vol = r.volume ? `;${esc(r.volume)}${r.issue?`(${esc(r.issue)})`:""}` : "", pg = r.pages ? `:${esc(r.pages)}` : "";
    return `${who}${endDot(esc(r.title))} <i>${esc(r.journal)}</i>. ${esc(r.year)}${vol}${pg}. ${r.doi ? `doi:<a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">${esc(r.doi)}</a>` : acc}`;
  }
  if(r.type==="report") return `${who}<i>${endDot(esc(r.title))}</i> ${esc(r.site)}${r.year?`; ${esc(r.year)}`:""}. ${acc}`;
  return `${who}${endDot(esc(r.title))} ${r.site?endDot(esc(r.site))+" ":""}${r.published?endDot(esc(r.published))+" ":""}${acc}`;

// Superscript citation: numbers sorted, consecutive runs joined with a hyphen (AMA convention), each linking to its entry.
function cite(ids){
  const nums = [...new Set((ids||[]).map(id=>REF_NUM[id]).filter(Boolean))].sort((a,b)=>a-b);
  if(!nums.length) return "";
  const parts = []; let i = 0;
  while(i<nums.length){ let j = i; while(j+1<nums.length && nums[j+1]===nums[j]+1) j++;
    parts.push(j-i>=2 ? `<a href="#ref-${nums[i]}">${nums[i]}</a>-<a href="#ref-${nums[j]}">${nums[j]}</a>` : nums.slice(i,j+1).map(n=>`<a href="#ref-${n}">${n}</a>`).join(","));
    i = j+1 }
  return `<sup class="cite">${parts.join(",")}</sup>`;
}

/* ---- checkpoint (child and grown-up) ---- */
let GC = null;
function startCheckpoint(id){
  const o = OBJECTIVES.find(x=>x.id===id); if(!o) return;
  const items = [];
  if(o.evidence && o.evidence.skill){
    const used = new Set(), lvls = o.evidence.levels && o.evidence.levels.length ? o.evidence.levels : [((K.levels||{})[o.evidence.skill]||0)];
    for(let i=0;i<10;i++){ const it = buildItem(o.evidence.skill, lvls[i % lvls.length], used); used.add(it.key); items.push(it) }
  } else {
    shuffle(o.checks||[]).slice(0,10).forEach((c,k)=>items.push({skill:null, key:`G:${o.id}:${k}`, kind:"comp", q:c.q, prompt:c.q, say:c.q,
      opts:shuffle(c.opts.map(t=>({v:t[0], html:`${t[1]?`<span class="oe">${t[1]}</span>`:""}<span>${esc(t[0])}</span>`, txt:true}))), ans:c.opts[0][0], reveal:`The best answer is: ${c.opts[0][0]}`}));
  }
  go("checkpoint"); inRound = true;
  GC = {o, items, i:0, score:0, t0:Date.now(), tok:++VTOK};
  renderCheckpointQ();
}
function renderCheckpointQ(){
  const it = GC.items[GC.i];
  if(!it){ renderCheckpointSelf(); return }
  let stage = "";
  if(it.kind==="listen") stage = `${it.pic?`<div class="pic">${it.pic}</div>`:""}<button class="hear" data-act="gcHear">🔊 Hear it again</button>`;
  if(it.kind==="read") stage = `<div class="bigword">${esc(it.word)}</div>`;
  if(it.kind==="comp") stage = `${it.text?`<div class="passage">${it.text.map(words).join(" ")}</div>`:""}<button class="hear" data-act="gcHearQ">🔊 Hear it</button>`;
  app().innerHTML = `<div class="top"><button class="btn ghost sm" data-act="go" data-arg="goals">✕</button><div class="progress">${GC.items.map((_,k)=>`<i class="${k<GC.i?"done":k===GC.i?"now":""}"></i>`).join("")}</div>${speedChip()}</div>
    <p class="muted small" style="text-align:center">Goal check · ${GC.o.icon} ${esc(GC.o.ican)}</p>
    <div class="task">${stage}<p class="prompt">${esc(it.prompt)}</p>
      <div class="${it.five?"opts five":"opts"} locked">${it.opts.map(o=>`<button class="opt${o.txt?" txt":""}${o.pic?" pic2":""}" data-act="gcAns" data-arg="${esc(o.v)}">${o.html}</button>`).join("")}</div>
      <p id="cheer" class="cheer"></p></div>`;
  const tok = GC.tok; GC.open = false;
  const unlock = () => { if(GC && GC.tok===tok && GC.items[GC.i]===it && !GC.open){ GC.open = true; GC.openAt = Date.now(); const el = document.querySelector(".opts"); if(el) el.classList.remove("locked") } };
  const live = () => GC && GC.tok===tok && GC.items[GC.i]===it;
  if(!it.skill){   // life-skills checks read the question and every choice, so reading skill doesn't decide the score
    GC.minMs = 800; const shown = [...document.querySelectorAll(".opt")].map(b=>b.dataset.arg);
    setTimeout(()=>{ if(live()) say(`${it.q} ${shown.join(", or, ")}?`, {kind:"sent"}).then(()=>setTimeout(unlock,150)) }, 350);
  } else if(it.kind==="listen"){ GC.minMs = 600; setTimeout(()=>{ if(live()) say(it.say).then(()=>setTimeout(unlock,150)) }, 350) }
  else if(it.kind==="read"){ GC.minMs = 900; setTimeout(unlock, 1500) }
  else { const wc = ((it.text||[]).join(" ")+" "+(it.q||"")).split(/\s+/).length; GC.minMs = 1000;
    setTimeout(()=>{ if(live()) say(it.q || it.prompt) }, 350); setTimeout(unlock, Math.min(6000, 1200+wc*120)) }
}
function gcAnswer(v, el){
  if(!GC || GC.locked || !GC.open) return; GC.locked = true;
  const it = GC.items[GC.i], ok = v===it.ans, fast = Date.now()-GC.openAt < GC.minMs;
  if(it.skill) record(it, ok, {review:true, fast, gc:true});
  if(ok && !fast) GC.score++;
  if(fast) GC.fast = (GC.fast||0)+1;
  const opts = [...document.querySelectorAll(".opt")];
  if(ok){ el.classList.add("right"); chime(true) } else { el.classList.add("wrong"); opts.forEach(o=>{ if(o.dataset.arg===it.ans) o.classList.add("right") }); chime(false) }
  $("#cheer").textContent = ok ? (fast ? "Whoa, speedy! Next time listen and look first." : pick(CHEERS)) : "Good try! The green one is right."; $("#cheer").className = "cheer " + (ok&&!fast?"good":"try");
  const tok = GC.tok, next = () => { if(GC && GC.tok===tok){ GC.i++; GC.locked = false; renderCheckpointQ() } };
  if(ok) setTimeout(next, 1000); else say(it.reveal).then(()=>setTimeout(next, 600));
}
function renderCheckpointSelf(){
  app().innerHTML = `<div class="card hero">${owl(100)}<h2>How do you feel about this goal?</h2><p class="prompt">${esc(GC.o.ican)}</p>

function gcSelf(v){
  if(!GC) return;
  const o = GC.o, of = GC.items.length;
  K.goals = K.goals || {}; const g = K.goals[o.id] = K.goals[o.id] || {cp:[], obs:[]};
  if(!g.start) g.start = Date.now();
  const pre = goalState(o), before = pre.level, wasDue = pre.keepDue;
  g.cp.push({t:Date.now(), d:today(), score:GC.score, of, self:+v, ...(GC.fast ? {fast:GC.fast} : {})}); if(g.cp.length>30) g.cp.shift();
  inRound = false; dayRec().ms += Date.now()-GC.t0;

  app().innerHTML = `<div class="card hero">${owl(120, passed?"happy":undefined)}<h1>${mastered ? "Goal reached! 🏆" : kept ? "You still got it! 🏆" : passed ? "Great check!" : "Good practice!"}</h1>

    <p class="bubble" style="margin-left:10px">${mastered ? "You got it! A new goal is waiting for you." : kept ? "You kept your goal. Amazing!" : passed ? (st.passDays<st.needDays ? "Check again on another day to reach this goal!" : !st.logMet ? "Keep filling your real-life star chart to reach this goal!" : "Wonderful!") : "Keep practicing. You are getting closer every day."}</p>
    ${passed ? `<p class="stars"><span class="s">★</span> +${2+(mastered?5:0)+(kept?3:0)} stars</p>` : ""}
    ${got.length ? `<div style="font-size:3rem">${got.join(" ")}</div>` : ""}
    ${nextGoal ? `<p>Next goal: <b>${nextGoal.icon} ${esc(nextGoal.ican)}</b></p>` : ""}

  if(passed){ chime(true); burst() }
  GC = null;
}

/* ---- measuring sticks (grown-up gives the published tool offline, then enters the score) ---- */
function benchFor(goalId){ return BENCH.filter(b=>(b.goals||[]).includes(goalId)) }
function benchCut(tab, v){ return (tab.cuts||[]).slice().sort((x,y)=>y.min-x.min).find(c=>v>=c.min) || null }
function benchTabLabel(t){ return [t.grade, t.season].filter(Boolean).join(" · ") }
function benchRanges(tab, unit){
  const cuts = (tab.cuts||[]).slice().sort((x,y)=>y.min-x.min);
  if(!cuts.length) return "no published cut points; compare her scores over time";
  return cuts.map((c,i)=>{ const hi = i ? cuts[i-1].min - (tab.step||1) : null;
    const r = i===0 ? `${c.min}+` : c.min<=0 ? `${hi} or less` : `${c.min}–${hi}`;
    return `${esc(c.label)}: ${r}` }).join("; ");
}
function benchLast(b){ const r = (K.bench||{})[b.id]||[]; return r[r.length-1] || null }
function benchResult(b, r){
  if(!r) return "";
  if(b.choices){ const c = b.choices[r.v]; return c ? `${new Date(r.t).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}: <span class="pill lv${c.level||2}">${esc(c.label)}</span>` : "" }
  const tab = (b.tables||[])[r.tab], c = tab ? benchCut(tab, r.v) : null;
  return `${new Date(r.t).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}: <b>${r.v}</b> ${esc(b.unit||"")}${tab?` (${esc(benchTabLabel(tab))})`:""}${c?` <span class="pill lv${c.level||2}">${esc(c.label)}</span>`:""}`;
}
function benchCard(b, goalId){

      <p class="muted small">The goal check is written for this objective and aligned to the standards above. It has not been tested for reliability or validity, so use it to track progress, together with the measuring stick below where one exists.</p>
      <p class="small"><b>Mastery rule:</b> ${fill(o.mastery && o.mastery.text || `At least ${Math.round(st.need*100)}% on the goal check on ${st.needDays} different days.`)}</p>
      <div class="scroll"><table class="tbl"><thead><tr><th>Level</th><th>What it looks like</th></tr></thead><tbody>
        ${(A.rubric||[]).map((r,i)=>`<tr${st.level===i+1?' class="hl"':""}><td><b>${i+1} · ${LEVEL_ADULT[i+1]}</b></td><td>${fill(r)}</td></tr>`).join("")}</tbody></table></div></div>
    ${benchFor(o.id).map(b=>benchCard(b, o.id)).join("")}
    <div class="card"><h3>How ${kidName()} is doing</h3>
      <ul class="small">
        <li><b>Goal checks:</b> ${st.cps.length ? st.cps.slice(-6).map(c=>`${fmt(c.t)}: ${c.score}/${c.of}${c.fast?` (${c.fast} too-fast ${c.fast===1?"tap":"taps"} not counted)`:""} (self: ${["","still learning","getting there","I can do it"][c.self]||"–"})`).join("; ") : "none yet"}. Passed on ${st.passDays} of ${st.needDays} needed days.</li>
        ${hasLog(o) ? `<li><b>Real-life log:</b> ${st.logN} of ${o.log.target} in the last ${o.log.windowDays} days (${esc(o.log.label)}) ${logStrip(o)}
          <span class="row" style="margin-top:6px"><button class="btn ghost sm" data-act="goalLog" data-arg="${o.id}">+ Log one for today</button><button class="btn ghost sm" data-act="goalLogUndo" data-arg="${o.id}">Undo today's last entry</button></span>
          ${kidTaps(o).length ? `<br><span class="small"><b>She tapped “${esc(o.log.kidLabel)}”</b> (☆ on the chart). Confirm the ones you saw or heard about from a teacher:</span>
            ${kidTaps(o).slice(-7).reverse().map(k=>{ const e = logEntries(o).find(x=>x.d===k.d); return `<span class="row" style="margin-top:4px"><span class="small">${new Date(k.d+"T12:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}${k.n>1?` (${k.n} taps)`:""}${e && o.log.per==="time" ? `; ${e.n} already logged, Confirm adds one` : ""}</span>
              <button class="btn sm" data-act="goalLogOk" data-arg="${o.id}|${k.d}">Confirm</button><button class="btn ghost sm" data-act="goalLogNo" data-arg="${o.id}|${k.d}">Not this time</button></span>` }).join("")}` : ""}</li>` : ""}
        ${st.waitObs ? `<li><b>Waiting for your check:</b> her goal checks are passed. When she also meets the grown-up part of the mastery rule, record an observation and choose Mastered.</li>` : ""}
        ${st.masteredAt ? `<li><b>Mastered:</b> ${fmt(st.masteredAt)}. ${st.review ? `Keep-it check missed on ${fmt(st.fail.t)}, so it is back in review until she passes again on a later day.` : st.recovered ? `Keep-it check missed on ${fmt(st.fail.t)}; passed again on ${fmt(st.recovered.t)}.` : st.kept ? "Keep-it check passed." : st.keepDue ? "A keep-it check is due now." : `Keep-it check due from ${fmt(st.masteredAt + KEEP_DAYS*864e5)}.`}</li>` : ""}
        <li><b>Practice in the app:</b> ${p.n ? `${Math.round(p.acc*100)}% correct over ${p.n} answers` : "no answers yet"}${p.eps.length ? `; cartoons watched ${p.watched} of ${p.eps.length}; real-life missions done ${p.missions}` : ""}.</li>
        ${benchFor(o.id).map(b=>`<li><b>${esc(b.name)}:</b> ${benchResult(b, benchLast(b)) || "not given yet"}</li>`).join("")}
        <li><b>Your observations:</b> ${st.obs.length ? st.obs.slice(-4).map(x=>`${fmt(x.t)}: ${LEVEL_ADULT[x.r]}${x.note?` (“${esc(x.note)}”)`:""}`).join("; ") : "none yet"}.</li></ul>
      <p class="small"><b>Record what you saw</b> (use the rubric above):</p>
      <div class="row">${[1,2,3,4].map(r=>`<button class="btn ghost sm" data-act="goalObs" data-arg="${o.id}:${r}">${r} · ${LEVEL_ADULT[r]}</button>`).join("")}</div>
      <input type="text" id="obsnote" maxlength="120" placeholder="Optional note, e.g. washed hands without a reminder">
      <div class="row"><button class="btn" data-act="goalCheck" data-arg="${o.id}">Start the goal check with her</button></div></div>
    ${aboutMeasures(true)}
    ${refList()}</div>`;
}

w."},{"who":"narrator","text":"Ulap smiles, and a rainbow shines over Salita Island."},{"who":"narrator","text":"All the creatures can talk and sing again."},{"who":"pip","text":"You kept reading and kept trying. You helped the whole island!"},{"who":"pip","text":"Salamat, my friend! I am so proud of you."}],"stops":[{"creature":"tuko","name":"Warm Rocks","before":[{"who":"narrator","text":"A spotted gecko is curled up on a warm, flat rock."},{"who":"pip","text":"That's Tuko. He likes to say his own name. Let's wake him!"}],"after":[{"who":"tuko","text":"Can I climb along with you? I am a good climber!"},{"who":"pip","text":"Tuko is your new pet. He can climb anywhere!"}]},{"creature":"agi","name":"Eagle Tree","before":[{"who":"narrator","text":"High in a big tree, a fluffy baby eagle is sleeping."},{"who":"pip","text":"That's Agi. She wants to learn to fly. Let's help her wake!"}],"after":[{"who":"agi","text":"Salamat! Can I come with you? I will practice flying!"},{"who":"pip","text":"Agi joined your friends. Flap, flap, hooray!"}]},{"creature":"waling","name":"Orchid Spring","before":[{"who":"narrator","text":"Near the warm spring, a purple orchid friend is sleeping."},{"who":"pip","text":"That's Waling. Let's read a story to wake her up."}],"after":[{"who":"waling","text":"Thank you! May I come with you to the top?"},{"who":"pip","text":"Waling is your new pet. Look at all your pet friends!"}]}],"big":{"creature":"ulap","name":"Ulap at the Top","before":[{"who":"narrator","text":"At the very top, a big soft cloud is sighing and sighing."},{"who":"pip","text":"Each sigh puffs out more Jumble Fog. Let's be gentle."},{"who":"pip","text":"Let's read a happy story for this cloud."}],"after":[{"who":"ulap","text":"I was so lonely up here. No one came to visit."},{"who":"ulap","text":"My sad sighs made the Jumble Fog. I'm sorry, everyone."},{"who":"ulap","text":"Your reading made me happy! May I visit you all now?"}]}}],"creatures":[{"id":"bibo","name":"Bibo","kind":"a /* Reading Quest art: flat SVG creatures, fog, chapter maps and icons.
   Plain JavaScript, no imports. Everything is wrapped in one function so the only global is QART.
   Creatures: viewBox "-70 -140 140 150", feet at y=0.  Maps: viewBox "0 0 800 450".  Icons: viewBox "-20 -20 40 40". */
const QART = (function(){
  "use strict";
  const INK = "#1E2A47";

  /* ---------- colour helpers ---------- */
  const rgb = h => { h = String(h).replace("#",""); if(h.length===3) h = h.replace(/./g, c=>c+c); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)||0); };
  const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return "#" + A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join(""); };
  /* sleep = foggy and muted: colours pulled toward a soft grey-lilac */
  const tone = st => st==="sleep" ? (h => mix(h, "#B3ACC6", .55)) : (h => h);

  function starPath(cx, cy, r, k){
    let d = "";
    for(let i=0;i<10;i++){ const a = -Math.PI/2 + i*Math.PI/5, rr = i%2 ? r*(k||.45) : r; d += (i?"L":"M") + (cx+Math.cos(a)*rr).toFixed(1) + " " + (cy+Math.sin(a)*rr).toFixed(1); }
    return d + "Z";
  }

  /* ---------- face parts (shared by all creatures) ---------- */
  const n = v => +(+v).toFixed(1);
  /* two eyes at x = cx +- dx, height y, size r.  awake: big shiny eyes; sleep: closed lids.
     o.x = centre x, o.white = white around the pupil (for dark faces), o.lid = lid colour when asleep */
  function eyes(st, dx, y, r, o){
    o = o || {};
    const x = o.x || 0, L = n(x-dx), R = n(x+dx);
    if(st==="sleep"){
      const w = n(r*.95), d = n(r*.75);
      return `<path d="M${n(L-w)} ${y}q${w} ${d} ${n(w*2)} 0M${n(R-w)} ${y}q${w} ${d} ${n(w*2)} 0" stroke="${o.lid||"#5E587A"}" stroke-width="${r>6?3:2.4}" fill="none" stroke-linecap="round"/>`;
    }
    const ry = n(r*1.15), hr = n(r*.38), hx = r*.35, hy = n(y-r*.45);
    const white = o.white ? `<g fill="#fff"><ellipse cx="${L}" cy="${y}" rx="${n(r*1.45)}" ry="${n(r*1.55)}"/><ellipse cx="${R}" cy="${y}" rx="${n(r*1.45)}" ry="${n(r*1.55)}"/></g>` : "";
    return `${white}<g fill="${INK}"><ellipse cx="${L}" cy="${y}" rx="${r}" ry="${ry}"/><ellipse cx="${R}" cy="${y}" rx="${r}" ry="${ry}"/></g><g fill="#fff"><circle cx="${n(L+hx)}" cy="${hy}" r="${hr}"/><circle cx="${n(R+hx)}" cy="${hy}" r="${hr}"/></g>`;
  }
  /* mouth at (x,y), width w.  awake: open happy smile; sleep: small calm curve */
  function mouth(st, x, y, w, lid){
    if(st==="sleep") return `<path d="M${n(x-w*.45)} ${y}q${n(w*.45)} ${n(w*.3)} ${n(w*.9)} 0" stroke="${lid||"#6E6788"}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
    return `<path d="M${n(x-w)} ${y-1}Q${x} ${n(y+w*1.3)} ${n(x+w)} ${y-1}Z" fill="#7A2E3B"/><ellipse cx="${x}" cy="${n(y+w*.55)}" rx="${n(w*.5)}" ry="${n(w*.25)}" fill="#F08AA0"/>`;
  }
  const blush = (st, dx, y, r, x) => { x = x || 0; return st==="sleep" ? "" : `<g fill="#FF86A6" opacity=".65"><ellipse cx="${n(x-dx)}" cy="${y}" rx="${r}" ry="${n(r*.7)}"/><ellipse cx="${n(x+dx)}" cy="${y}" rx="${r}" ry="${n(r*.7)}"/></g>`; };
  /* little sleepy z marks, drawn as paths (no text) */
  const zz = (st, x, y) => st==="sleep" ? `<path d="M${x} ${y}h7l-7 8h7M${x+10} ${y-12}h5l-5 6h5" stroke="#8C84AC" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : "";
  /* small twinkles around a happy, awake creature */

  /* ---------- fog ---------- */
  /* One soft cloud made of fixed puffs (no randomness, so it never flickers). At 1 the puffs join into a
     single fluffy cloud that hides every creature: its scalloped edge just touches the box sides and its
     corners stay round, so it reads as a cloud and not a square even when the box clips it.
     As the amount drops the middle clears first, so the creature's face peeks out early, then the fog
     thins outward and the last of it lingers as low mist around the feet. Shrinking puffs flatten into wisps. */
  const PUFFS = (function(){
    const ring = [                                           // [x, y, r]: the scalloped outline
      [-47,-115,21],[-24,-118,19],[0,-118,20],[24,-118,19],[47,-115,21],          // top, round corners
      [-51,-92,18],[51,-92,18],[-51,-66,18],[51,-66,18],[-51,-40,18],[51,-40,18], // sides
      [-46,-12,19],[-23,-8,18],[0,-8,18],[23,-8,18],[46,-12,19]                   // bottom
    ];
    const mid = [                                            // the full middle of the cloud
      [-26,-96,22],[0,-98,22],[26,-96,22],[-28,-70,22],[0,-72,24],[28,-70,22],
      [-28,-44,22],[0,-46,23],[28,-44,22],[-22,-24,20],[22,-24,20],[0,-26,20],[-40,-28,13],[40,-28,13]
    ];
    /* clearing order: the top bumps first (small creatures sit below them), then the middle (where every
       creature's face is), then the upper half, then the lower half, and the puffs along the ground last. Each puff disappears when the
       amount drops to its threshold t (the first at .94, the last at 0). */
    const out = ring.concat(mid).map(([x,y,r])=>({x, y, r, k: y < -110 ? Math.abs(x)/250 - 1 : y < -60 ? Math.abs(x)/200 + (-60-y)/120 : Math.abs(x)/100 + (y+60)/50}));
    out.sort((p,q)=>p.k-q.k).forEach((p,i,all)=>p.t = +(.94*(all.length-1-i)/(all.length-1)).toFixed(3));
    return out.reverse();                                    // bottom puffs first in the markup, top ones over them
  })();
  function fog(amount){
    let a = +amount; if(!(a > 0)) return "<g></g>"; if(a > 1) a = 1;
    const f = v => +v.toFixed(1);
    /* every puff is full size at 1; as the amount passes its threshold it shrinks, flattens and fades, then is gone */
    const shown = PUFFS.filter(p=>a > p.t).map(p=>{ const q = Math.min(1,(a-p.t)/Math.min(.1,1-p.t)), s = .4 + .6*q;
      return {x:p.x, y:p.y, rx:p.r*s, ry:p.r*s*(.55+.45*s), q}; });
    if(!shown.length) return "<g></g>";
    /* flat cloud shading: a lilac base, and a lighter top on every puff that merges with its neighbours,
       so only soft crescents of the base show along the bottoms (no shiny bubble glints) */
    const base = p => `<ellipse cx="${p.x}" cy="${p.y}" rx="${f(p.rx)}" ry="${f(p.ry)}"/>`;
    const lite = p => `<ellipse cx="${f(p.x-p.rx*.1)}" cy="${f(p.y-p.ry*.16)}" rx="${f(p.rx*.86)}" ry="${f(p.ry*.86)}"/>`;
    const solid = shown.filter(p=>p.q>=1), fading = shown.filter(p=>p.q<1);
    return `<g opacity="${a >= 1 ? 1 : (.84 + .12*a).toFixed(2)}">` +
      fading.map(p=>`<g opacity="${(.3+.7*p.q).toFixed(2)}"><g fill="#CBC2E0">${base(p)}</g><g fill="#E4DFF0">${lite(p)}</g></g>`).join("") +
      `<g fill="#CBC2E0">${solid.map(base).join("")}</g><g fill="#E4DFF0">${solid.map(lite).join("")}</g></g>`;
  }

  /* ---------- the five chapter maps ---------- */

      `<path d="M0 252 Q60 186 130 220 Q190 160 270 214 Q340 168 420 216 Q500 150 590 210 Q660 172 730 214 Q770 196 800 206 L800 300 L0 300Z" fill="#A7D7C4"/>` +

  /* ---------- hats (drawn on the head; QAV.draw nudges them to fit big hair) ---------- */

        ${[.04,.28,.5,.72,.96].map((t,i) => { const [x,y] = crownPt(t); return flower(x, y, i===1||i===3 ? "#F7A8C8" : "#FFFFFF"); }).join("")}` },
    { id: "star-cap", covers: true, name: "Star Cap", ic: "🧢", lvl: 8,
